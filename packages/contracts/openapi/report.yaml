openapi: 3.1.0
info:
  title: ANESOP 工作量统计、多维报表与导出契约（report）
  summary: 工作量口径（台次/麻醉时长/权重/术式分布）、多维组合报表与脱敏 CSV 导出
  description: |
    ANESOP 管理域报表契约（第 9 域），对应方案书 §2.4.7（M6 工作量统计）、§2.7.2（报表清单：
    工作量月报=例数/台次/麻醉时长/难度系数）、§3.8.1（月度工作量报表 < 10s）与 E-M16；
    决策 D-21（系统出数、绩效规则院方另定）。契约版本 0.1.0 为首个版本（additive）。
    口径版本 **report-1.0.0**，时区固定 **Asia/Shanghai**。

    硬规则：
    1) **只读统计，不从报表写任何业务数据**：工作量与多维报表都是对既有台次/麻醉记录单的
       只读聚合；本域不新增报表结果表，不落库缓存。权限 `m4:report:read` 查询、
       `m4:report:export` 导出（导出另写审计 `REPORT_EXPORT`）。
    2) **统计边界（自然日归属）**：`from`/`to` 为 Asia/Shanghai 本地日期闭区间，
       `from`/`to` 必填，跨度（含首尾）**≤ 366 天**，超过返回 400；
       统计单元是 M1 排程台次 `m1_sched.schedule`：`deleted=false` 且 `status ≠ CANCELLED`，
       按**计划开始时间 `start_at` 的本地日期**归集；跨日台次只计入首日、不按跨越拆分；
       已取消台次不计入台次与时长（取消率口径见排程分析 analytics-1.0.0，本契约不重复）。
    3) **麻醉时长口径**：`anesthesiaMinutes` = 麻醉记录单 `started_at` 与 `ended_at`
       之差**向下取整到分钟**之和（实际记录时间，非 M1 计划时长）；台次无记录单、
       记录单未结束（`ended_at` 为空）或时间缺失时该台次时长计 0，并单列
       `unrecordedCaseCount`（有台次无可用时长）供数据质量复核。
       时长是否以设备/事件时间为准、是否扣除麻醉准备与复苏时间 **【待确认】**。
    4) **权重口径**：`weightedCaseCount` = Σ 台次权重；权重默认 **1.0**，可按术式编码配置
       （`anesop.m4.report.surgery-weights.<术式编码>`，未配置的术式取默认值）。
       绩效权重、难度系数、二次分配规则由院方另行制定（D-21）——本契约只提供**可配置的
       权重系数与系统出数**，不内置任何绩效公式或金额 **【待确认】**。
    5) **维度白名单**：`DEPT`（申请科室，取 `surgery_application.dept_id/dept_name`）、
       `STAFF`（麻醉医师，取麻醉记录单创建人 `created_by` → `m4_staff.staff_profile`）、
       `SURGERY`（术式编码 `surgery_code`）、`ROOM`（术间 `room_no`）。非法维度返回 400。
       未匹配维度的台次进入固定兜底桶（`UNASSIGNED`/`UNSPECIFIED`），排序固定最后，
       保证各维度台次之和与总计守恒。`STAFF` 口径（记录单创建人 vs 麻醉排班/实际执行人）与
       `DEPT` 口径（申请科室 vs 手术科室）**【待确认】**。
    6) **指标白名单**：`caseCount`（台次）、`anesthesiaMinutes`（麻醉时长，分钟）、
       `weightedCaseCount`（加权台次）；非法指标返回 400。多维报表的维度可组合
       （`DEPT,STAFF,SURGERY` 等，白名单全集 4 个、去重后 1–4 个），结果按维度值稳定排序后分页。
    7) **数据范围**（fail-closed，与 M1 排程分析一致）：`ALL` 全院；`SITE`/`DEPT` 按台次
       申请科室（或院区）过滤；`ROOM` 按术间过滤；`SELF` 只含**本人创建麻醉记录单**的台次。
       无任何可用范围、`deptId` 超出范围或对象范围为空时返回 403；不返回空页掩盖越权。
       科室下拉由调用方从 `deptId` 维度结果派生，不需要 `m1:schedule:read`。
    8) **导出脱敏与防注入**：CSV 为 UTF-8 **BOM**、首行列头、`text/csv` 流式输出；
       单元格命中公式起始字符（`=`/`+`/`-`/`@`/制表符/回车）时以**前导单引号中和**
       （如 `'=SUM(1,2)`），必要时按 **RFC 4180** 加双引号并转义内部引号（防公式注入）；
       只含科室/术间/术式/院内在册人员工号与姓名与聚合值，**不含**患者姓名、住院号、
       院内患者号、身份证号、手机号、术前诊断、HIS 申请号等患者标识；导出写审计
       `REPORT_EXPORT`（detail 仅 report/日期/维度/指标/行数，无 PHI）。
    9) **空数据 0**：区间内无台次时计数与时长返回 0，`buckets`/`rows` 为空数组，
       `total=0`，不做除零、不返回 404。
    10) **0.2.0 新增（M8-M4-02，additive）报表数据锁定/快照**：`POST /v1/reports/locks`
       （权限 `m4:report:lock`，另写审计 `REPORT_LOCK`）把「报表类型 + 期间 + 归一化参数
       （含数据范围指纹）」对应的聚合结果写入 append-only 快照
       `m4_report.report_snapshot`；**锁定后同参数查询/导出默认读快照**，响应
       `source=SNAPSHOT`（未锁定参数为 `LIVE`），源数据变化不影响已锁定值；
       同一 (report, period, params_hash) 重新锁定返回 409。快照保留期、解锁/重出数流程
       与“是否需要强制实时”口径 **【待确认】**（本期只提供默认读快照，不提供解锁端点）。
       导出快照时审计 `REPORT_EXPORT` 附 `source=SNAPSHOT`，并在响应头
       `X-Report-Source` 标明来源。
    所有示例均为 SYNTHETIC 合成数据（无真实患者与真实人员）。
  version: 0.2.0
  contact:
    name: ANESOP 项目组
  license:
    name: 内部交付（非开源）
servers:
  - url: https://anesop.local/api
    description: 院内单院部署统一入口（生产网无互联网出口）
security:
  - bearerAuth: []
tags:
  - name: 工作量统计
    description: 按科室/医师/术式/术间维度统计台次、麻醉时长、加权台次与术式分布。
  - name: 多维报表
    description: 组合维度与指标的多维交叉报表（稳定排序 + 分页 + 合计）。
  - name: 报表导出
    description: 工作量与多维报表的脱敏 CSV 导出（UTF-8 BOM、防公式注入、留痕）。
  - name: 报表锁定
    description: 报表数据锁定与快照（生成快照、查询锁定列表/详情、同参数读快照）。
paths:
  /v1/reports/workload:
    get:
      operationId: getWorkloadReport
      tags:
        - 工作量统计
      summary: 工作量统计（台次/麻醉时长/加权台次/术式分布）
      description: |
        只读聚合，权限 `m4:report:read`。口径版本 **report-1.0.0**，时区 **Asia/Shanghai**。

        公式：
        - `caseCount = Σ 统计边界内非取消台次`（按 `start_at` 本地日期归集，跨日只计首日）；
        - `anesthesiaMinutes = Σ floor((ended_at − started_at) / 60s)`，无记录/未结束计 0；
        - `weightedCaseCount = Σ 台次权重`（默认 1.0，可按术式编码配置，绩效口径【待确认】）；
        - `unrecordedCaseCount = 台次中无可用麻醉时长（无记录单/未结束）的数量`；
        - `surgeryDistribution = 该维度桶内按术式编码分组的台次与时长`（按台次倒序、
          编码升序，最多返回前 50 个术式，其余不返回）。
        - 排序：桶按台次倒序、键升序；未匹配兜底桶（`UNASSIGNED`/`UNSPECIFIED`）**固定最后**，
          保证各桶台次之和与总计守恒。

        数据范围 fail-closed：`ALL` 全院；`SITE`/`DEPT` 按台次申请科室（或院区）；
        `ROOM` 按术间；`SELF` 只含本人创建麻醉记录单的台次；无可用范围 403。
        空数据返回 0 与空数组。查询写审计 `REPORT_QUERY`（detail 无 PHI）。
      parameters:
        - name: from
          in: query
          required: true
          description: 起始本地日期（含），格式 YYYY-MM-DD，按 Asia/Shanghai 解释。
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: 结束本地日期（含），格式 YYYY-MM-DD；与 from 跨度（含首尾）≤ 366 天，超过 400。
          schema:
            type: string
            format: date
        - name: dimension
          in: query
          required: true
          description: |
            统计维度（白名单）：`DEPT`=申请科室、`STAFF`=麻醉医师（记录单创建人）、
            `SURGERY`=术式编码、`ROOM`=术间；非法值 400。
          schema:
            type: string
            enum:
              - DEPT
              - STAFF
              - SURGERY
              - ROOM
        - name: deptId
          in: query
          required: false
          description: 科室标识（UUID）；仅统计该申请科室的台次，必须在当前用户数据范围内（越界 403）。
          schema:
            type: string
      responses:
        '200':
          description: 工作量汇总、维度桶与术式分布（仅聚合值，不含患者标识）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkloadReport'
              example:
                from: '2026-12-01'
                to: '2026-12-31'
                timezone: Asia/Shanghai
                dimension: DEPT
                formula: 台次 = 统计边界内非取消台次；麻醉时长 = floor((ended_at - started_at) / 60s)
                weightFormula: 加权台次 = Σ 台次权重（默认 1.0，可按术式编码配置）
                caseCount: 3
                anesthesiaMinutes: 180
                weightedCaseCount: 3.5
                unrecordedCaseCount: 1
                buckets:
                  - key: 'f1000000-0000-4000-8000-000000000002'
                    label: 麻醉科（合成）
                    caseCount: 2
                    anesthesiaMinutes: 180
                    weightedCaseCount: 2.5
                    unrecordedCaseCount: 0
                    surgeryDistribution:
                      - surgeryCode: SYNTH-ART-001
                        surgeryName: 演示关节置换术（合成）
                        caseCount: 1
                        anesthesiaMinutes: 120
                      - surgeryCode: SYNTH-GAS-002
                        surgeryName: 演示胃肠手术（合成）
                        caseCount: 1
                        anesthesiaMinutes: 60
                  - key: UNASSIGNED
                    label: 未匹配科室
                    caseCount: 1
                    anesthesiaMinutes: 0
                    weightedCaseCount: 1
                    unrecordedCaseCount: 1
                    surgeryDistribution:
                      - surgeryCode: SYNTH-UNSPEC
                        surgeryName: 未登记术式
                        caseCount: 1
                        anesthesiaMinutes: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/reports/multi:
    get:
      operationId: getMultiDimensionalReport
      tags:
        - 多维报表
      summary: 多维报表（组合维度 × 指标，稳定排序 + 分页 + 合计）
      description: |
        只读聚合，权限 `m4:report:read`。口径版本 **report-1.0.0**，时区 **Asia/Shanghai**。

        维度 `dimensions` 为逗号分隔白名单（`DEPT`/`STAFF`/`SURGERY`/`ROOM`），白名单全集 4 个、
        去重后 1–4 个；指标 `metrics` 为逗号分隔白名单（`caseCount`/`anesthesiaMinutes`/
        `weightedCaseCount`），白名单全集 3 个、去重后 1–3 个。任一非白名单值或空值返回 400
        （不回显原始输入）。

        - 分组：按请求维度组合分组，每组一行；响应 `rows[]` 中未请求维度的字段省略（null）；
        - 排序：按维度声明顺序、维度值升序稳定排序（`UNASSIGNED`/`UNSPECIFIED` 排最后）；
        - 分页：`page` 从 1 开始，`size` 1–200（默认 20）；`total` 为**全部分组数**，
          `totalPages = ceil(total / size)`；
        - 合计：`totals` 始终覆盖**全部分组**（不是当前页），空数据时各计数为 0、`groupCount=0`；
        - 统计边界/麻醉时长/权重/数据范围口径与 `/v1/reports/workload` 完全一致；
          查询写审计 `REPORT_QUERY`。
      parameters:
        - name: from
          in: query
          required: true
          description: 起始本地日期（含），格式 YYYY-MM-DD，按 Asia/Shanghai 解释。
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: 结束本地日期（含）；与 from 跨度（含首尾）≤ 366 天，超过 400。
          schema:
            type: string
            format: date
        - name: dimensions
          in: query
          required: true
          description: |
            逗号分隔维度（白名单 DEPT/STAFF/SURGERY/ROOM，去重后 1–4 个），
            如 `DEPT,STAFF`；非法或空值 400。
          schema:
            type: string
            pattern: '^(DEPT|STAFF|SURGERY|ROOM)(,(DEPT|STAFF|SURGERY|ROOM))*$'
        - name: metrics
          in: query
          required: true
          description: |
            逗号分隔指标（白名单 caseCount/anesthesiaMinutes/weightedCaseCount，
            去重后 1–3 个），如 `caseCount,anesthesiaMinutes`；非法或空值 400。
          schema:
            type: string
            pattern: '^(caseCount|anesthesiaMinutes|weightedCaseCount)(,(caseCount|anesthesiaMinutes|weightedCaseCount))*$'
        - name: deptId
          in: query
          required: false
          description: 科室标识（UUID）；仅统计该申请科室的台次，越界 403。
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: 页码，从 1 开始。
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          description: 每页条数（1–200）。
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        '200':
          description: 多维分组行、分页元数据与全量合计（仅聚合值，不含患者标识）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiReport'
              example:
                from: '2026-12-01'
                to: '2026-12-31'
                timezone: Asia/Shanghai
                dimensions:
                  - DEPT
                  - SURGERY
                metrics:
                  - caseCount
                  - anesthesiaMinutes
                formula: 台次 = 统计边界内非取消台次；麻醉时长 = floor((ended_at - started_at) / 60s)
                weightFormula: 加权台次 = Σ 台次权重（默认 1.0，可按术式编码配置）
                rows:
                  - deptId: 'f1000000-0000-4000-8000-000000000002'
                    deptName: 麻醉科（合成）
                    surgeryCode: SYNTH-ART-001
                    surgeryName: 演示关节置换术（合成）
                    caseCount: 1
                    anesthesiaMinutes: 120
                    weightedCaseCount: 1.5
                    unrecordedCaseCount: 0
                  - deptId: 'f1000000-0000-4000-8000-000000000002'
                    deptName: 麻醉科（合成）
                    surgeryCode: SYNTH-GAS-002
                    surgeryName: 演示胃肠手术（合成）
                    caseCount: 1
                    anesthesiaMinutes: 60
                    weightedCaseCount: 1
                    unrecordedCaseCount: 0
                totals:
                  caseCount: 2
                  anesthesiaMinutes: 180
                  weightedCaseCount: 2.5
                  unrecordedCaseCount: 0
                  groupCount: 2
                page: 1
                size: 20
                total: 2
                totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/reports/export:
    get:
      operationId: exportReport
      tags:
        - 报表导出
      summary: 导出工作量/多维报表 CSV（UTF-8 BOM、脱敏、防公式注入）
      description: |
        权限 `m4:report:export`。CSV 为 UTF-8 **BOM**、首行列头、`text/csv` 流式输出。

        - `report=workload` 需 `dimension`（同 `/v1/reports/workload`）；
          `report=multi` 需 `dimensions` 与 `metrics`（同 `/v1/reports/multi`，忽略逐页导出，
          导出**全部分组**且行数上限 50000，超过 400）；
        - 列头：`report,level,dimension,key,label,caseCount,anesthesiaMinutes,weightedCaseCount,
          unrecordedCaseCount,surgeryCode,surgeryName,from,to,timezone`；
        - `level`：`TOTAL`（汇总，仅 workload）/`BUCKET`（维度桶）/`SURGERY`（术式分布行）/
          `ROW`（多维分组行）；`dimension=SURGERY` 时桶本身即术式，不再重复输出 `SURGERY` 行；
        - 防公式注入：单元格以 `=`/`+`/`-`/`@`/制表符/回车开头时以**前导单引号中和**，
          必要时按 **RFC 4180** 加双引号并转义内部引号；
        - 脱敏：只含科室/术间/术式/院内在册人员工号与姓名与聚合值，**不含**任何患者标识
          （姓名、住院号、院内患者号、身份证号、手机号、术前诊断、HIS 申请号）；
        - **锁定优先**：若该报表类型与参数（含数据范围）已锁定，导出**默认使用快照**
          （`source=SNAPSHOT`，与当前源数据变化无关），否则实时聚合（`source=LIVE`）；
          来源同时写入响应头 `X-Report-Source` 与审计 `REPORT_EXPORT.source`；
        - 导出写审计 `REPORT_EXPORT`（detail 仅 report/格式/日期/维度/指标/数据行数/source）；
        - 参数校验与数据范围解析在任何字节写出前完成，非法参数仍返回 JSON 400/403。
      parameters:
        - name: report
          in: query
          required: true
          description: 报表类型：`workload`（工作量）或 `multi`（多维报表）。
          schema:
            type: string
            enum:
              - workload
              - multi
        - name: format
          in: query
          required: true
          description: 导出格式；当前仅支持 csv（UTF-8 BOM）。
          schema:
            type: string
            enum:
              - csv
        - name: from
          in: query
          required: true
          description: 起始本地日期（含），格式 YYYY-MM-DD。
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: 结束本地日期（含）；与 from 跨度（含首尾）≤ 366 天，超过 400。
          schema:
            type: string
            format: date
        - name: dimension
          in: query
          required: false
          description: 工作量维度（`report=workload` 必填，白名单 DEPT/STAFF/SURGERY/ROOM）。
          schema:
            type: string
            enum:
              - DEPT
              - STAFF
              - SURGERY
              - ROOM
        - name: dimensions
          in: query
          required: false
          description: 多维维度（`report=multi` 必填，逗号分隔白名单，1–4 个）。
          schema:
            type: string
            pattern: '^(DEPT|STAFF|SURGERY|ROOM)(,(DEPT|STAFF|SURGERY|ROOM))*$'
        - name: metrics
          in: query
          required: false
          description: 多维指标（`report=multi` 必填，逗号分隔白名单，1–3 个）。
          schema:
            type: string
            pattern: '^(caseCount|anesthesiaMinutes|weightedCaseCount)(,(caseCount|anesthesiaMinutes|weightedCaseCount))*$'
        - name: deptId
          in: query
          required: false
          description: 科室标识（UUID）；仅导出该申请科室的台次，越界 403。
          schema:
            type: string
      responses:
        '200':
          description: 脱敏 CSV 文件（UTF-8 BOM），仅聚合值、维度标签与院内在册人员工号/姓名。
          headers:
            Content-Disposition:
              description: 附件文件名，形如 attachment; filename="workload-DEPT-2026-12-01-2026-12-31.csv"。
              schema:
                type: string
            X-Report-Source:
              description: 数据来源：SNAPSHOT=命中报表锁定快照，LIVE=实时聚合（0.2.0 新增）。
              schema:
                type: string
                enum:
                  - LIVE
                  - SNAPSHOT
          content:
            text/csv:
              schema:
                type: string
              example: |
                report,level,dimension,key,label,caseCount,anesthesiaMinutes,weightedCaseCount,unrecordedCaseCount,surgeryCode,surgeryName,from,to,timezone
                workload,TOTAL,DEPT,ALL,全部,3,180,3.5,1,,,,2026-12-01,2026-12-31,Asia/Shanghai
                workload,BUCKET,DEPT,f1000000-0000-4000-8000-000000000002,麻醉科（合成）,2,180,2.5,0,,,,2026-12-01,2026-12-31,Asia/Shanghai
                workload,SURGERY,DEPT,f1000000-0000-4000-8000-000000000002,麻醉科（合成）,1,120,1.5,0,SYNTH-ART-001,演示关节置换术（合成）,2026-12-01,2026-12-31,Asia/Shanghai
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/reports/locks:
    post:
      operationId: lockReport
      tags:
        - 报表锁定
      summary: 锁定报表并生成快照（0.2.0）
      description: |
        权限 `m4:report:lock`（V28 授予 SYS_ADMIN/SYS_OR_MANAGER/SYS_QC_MANAGER）。
        把「报表类型 + 期间 + 归一化参数（deptId/维度/指标 + 数据范围指纹）」对应的聚合结果
        写入 append-only 快照 `m4_report.report_snapshot`，之后**同参数查询/导出默认读快照**
        （`source=SNAPSHOT`），源数据变化不影响已锁定值。

        期间：`period` 支持 `YYYY-MM`（整月，含首尾）或 `YYYY-MM-DD~YYYY-MM-DD`（自定义闭区间）；
        也可用 `from`+`to` 给出。`period` 与 `from`+`to` 只能二选一（都给或都不给 400），
        跨度（含首尾）≤ 366 天，日期/白名单/报表类型非法 400；数据范围不足 403。
        同一 (report, period, params_hash) 重复锁定 **409**（快照不可覆盖；解锁/新版本流程待院方确认）。
        快照 payload 只含聚合值与维度标签，不含患者标识；审计 `REPORT_LOCK`
        （detail: report/period/from/to/paramsHash/payloadHash/rowCount/dataScope）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportLockRequest'
            example:
              report: workload
              period: '2026-11'
              dimension: DEPT
      responses:
        '201':
          description: 锁定成功，返回快照元数据。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportLock'
              example:
                lockId: '5a000000-0000-4000-8000-000000000001'
                report: workload
                period: '2026-11'
                from: '2026-11-01'
                to: '2026-11-30'
                params:
                  report: workload
                  from: '2026-11-01'
                  to: '2026-11-30'
                  dimension: DEPT
                paramsHash: '3f1c5f4f8f0d4e6c8a9b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f'
                payloadHash: '9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f3f1c5f4f8f0d4e6c'
                dataScope: ALL
                rowCount: 2
                lockedBy: '10000000-0000-4000-8000-000000000001'
                lockedByName: 演示管理员（合成）
                lockedAt: '2026-12-01T09:30:00+08:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      operationId: listReportLocks
      tags:
        - 报表锁定
      summary: 查询报表锁定列表（0.2.0）
      description: |
        权限 `m4:report:read`。按锁定时间倒序返回快照元数据（不含 payload，快照数据通过
        同参数查询/导出获取）；`report` 可选过滤 `workload`/`multi`；`limit` 1–200 默认 50。
      parameters:
        - name: report
          in: query
          required: false
          description: 报表类型过滤。
          schema:
            type: string
            enum:
              - workload
              - multi
        - name: limit
          in: query
          required: false
          description: 返回条数（1–200）。
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: 锁定列表（按 lockedAt 倒序）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportLockList'
              example:
                items:
                  - lockId: '5a000000-0000-4000-8000-000000000001'
                    report: workload
                    period: '2026-11'
                    from: '2026-11-01'
                    to: '2026-11-30'
                    params:
                      report: workload
                      from: '2026-11-01'
                      to: '2026-11-30'
                      dimension: DEPT
                    paramsHash: '3f1c5f4f8f0d4e6c8a9b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f'
                    payloadHash: '9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f3f1c5f4f8f0d4e6c'
                    dataScope: ALL
                    rowCount: 2
                    lockedBy: '10000000-0000-4000-8000-000000000001'
                    lockedByName: 演示管理员（合成）
                    lockedAt: '2026-12-01T09:30:00+08:00'
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/reports/locks/{lockId}:
    get:
      operationId: getReportLock
      tags:
        - 报表锁定
      summary: 查询报表锁定详情（0.2.0）
      description: |
        权限 `m4:report:read`。返回单个快照元数据（不含 payload）；不存在 404。
      parameters:
        - name: lockId
          in: path
          required: true
          description: 快照标识（UUID）。
          schema:
            type: string
      responses:
        '200':
          description: 锁定详情。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportLock'
              example:
                lockId: '5a000000-0000-4000-8000-000000000001'
                report: workload
                period: '2026-11'
                from: '2026-11-01'
                to: '2026-11-30'
                params:
                  report: workload
                  from: '2026-11-01'
                  to: '2026-11-30'
                  dimension: DEPT
                paramsHash: '3f1c5f4f8f0d4e6c8a9b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f'
                payloadHash: '9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f3f1c5f4f8f0d4e6c'
                dataScope: ALL
                rowCount: 2
                lockedBy: '10000000-0000-4000-8000-000000000001'
                lockedByName: 演示管理员（合成）
                lockedAt: '2026-12-01T09:30:00+08:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 统一 OAuth2/JWT 访问令牌，放在 Authorization 请求头中（Bearer 方案）。
  responses:
    BadRequest:
      description: 请求参数校验失败（日期缺失/格式非法、跨度 > 366 天、维度或指标不在白名单、导出类型/格式非法）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: PARAM_INVALID
            message: 请求参数校验失败
            traceId: SYNTH-TRACE-0901
            details:
              - field: dimension
                reason: dimension 必须为 DEPT/STAFF/SURGERY/ROOM
    Unauthorized:
      description: 未认证或令牌已失效（fail-closed）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: AUTH_UNAUTHORIZED
            message: 未认证或令牌已失效
            traceId: SYNTH-TRACE-0902
            details: []
    Forbidden:
      description: 已认证但缺权限（m4:report:read|export|lock）或数据范围不足（无可用范围/科室越界）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: AUTH_FORBIDDEN
            message: 无权访问该资源或数据范围不足
            traceId: SYNTH-TRACE-0903
            details:
              - field: dataScope
                reason: 当前用户无可用报表数据范围
    Conflict:
      description: 同一报表类型 + 期间 + 参数组合已锁定（快照 append-only，不可覆盖）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: STATE_CONFLICT
            message: 该报表参数组合已锁定，请勿重复锁定
            traceId: SYNTH-TRACE-0904
            details:
              - field: period
                reason: 同一 (report, period, params_hash) 已存在锁定快照
    NotFound:
      description: 报表锁定快照不存在（不泄露其他数据范围的快照存在性）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RESOURCE_NOT_FOUND
            message: 资源不存在或不可见
            traceId: SYNTH-TRACE-0905
            details: []
  schemas:
    WorkloadReport:
      type: object
      description: 工作量报表（口径 report-1.0.0）；计数与时长均为区间聚合值，不含患者标识。
      required:
        - from
        - to
        - timezone
        - dimension
        - formula
        - weightFormula
        - caseCount
        - anesthesiaMinutes
        - weightedCaseCount
        - unrecordedCaseCount
        - buckets
      properties:
        from:
          type: string
          format: date
          description: 起始本地日期（含）。
        to:
          type: string
          format: date
          description: 结束本地日期（含）。
        timezone:
          type: string
          description: 统计时区，固定 Asia/Shanghai。
        dimension:
          type: string
          description: 统计维度（DEPT/STAFF/SURGERY/ROOM）。
          enum:
            - DEPT
            - STAFF
            - SURGERY
            - ROOM
        formula:
          type: string
          description: 台次与麻醉时长口径说明（供报表随附展示，口径可追溯）。
        weightFormula:
          type: string
          description: 权重口径说明（默认 1.0，可按术式编码配置；绩效规则院方另定）。
        caseCount:
          type: integer
          description: 统计边界内非取消台次数。
          minimum: 0
        anesthesiaMinutes:
          type: integer
          description: 麻醉时长合计（分钟，记录单实际起止差向下取整）。
          minimum: 0
        weightedCaseCount:
          type: number
          description: 加权台次合计（Σ 台次权重，默认 1.0）。
          minimum: 0
        unrecordedCaseCount:
          type: integer
          description: 无可用麻醉时长的台次数（无记录单/未结束），用于数据质量复核。
          minimum: 0
        buckets:
          type: array
          description: 维度桶（按台次倒序、键升序，未匹配兜底桶固定最后；空数据为空数组）。
          items:
            $ref: '#/components/schemas/WorkloadBucket'
        source:
          type: string
          description: |
            数据来源（0.2.0 新增）：SNAPSHOT=命中报表锁定快照（锁定后同参数查询默认读快照）；
            LIVE=实时聚合。服务端始终返回该字段。
          enum:
            - LIVE
            - SNAPSHOT
        lockId:
          type: string
          description: 命中的快照标识（source=SNAPSHOT 时返回；LIVE 时省略）。
        lockedAt:
          type: string
          format: date-time
          description: 快照锁定时间（source=SNAPSHOT 时返回）。
    WorkloadBucket:
      type: object
      description: 单个维度桶的聚合值与术式分布。
      required:
        - key
        - label
        - caseCount
        - anesthesiaMinutes
        - weightedCaseCount
        - unrecordedCaseCount
        - surgeryDistribution
      properties:
        key:
          type: string
          description: 维度值（科室/人员/术式标识；未匹配为 UNASSIGNED 或 UNSPECIFIED）。
        label:
          type: string
          description: 维度展示名（科室名/人员工号+姓名/术式名/术间号；未匹配为中文兜底文案）。
        caseCount:
          type: integer
          description: 该桶台次数。
          minimum: 0
        anesthesiaMinutes:
          type: integer
          description: 该桶麻醉时长（分钟）。
          minimum: 0
        weightedCaseCount:
          type: number
          description: 该桶加权台次。
          minimum: 0
        unrecordedCaseCount:
          type: integer
          description: 该桶无可用麻醉时长的台次数。
          minimum: 0
        surgeryDistribution:
          type: array
          description: 该桶按术式编码分组的分布（台次倒序、编码升序，最多 50 项）。
          items:
            $ref: '#/components/schemas/SurgeryDistribution'
    SurgeryDistribution:
      type: object
      description: 术式分布项。
      required:
        - surgeryCode
        - surgeryName
        - caseCount
        - anesthesiaMinutes
      properties:
        surgeryCode:
          type: string
          description: 术式编码（缺失归 UNSPECIFIED）。
        surgeryName:
          type: string
          description: 术式名称（仅术式主数据文本，不含患者诊断）。
        caseCount:
          type: integer
          description: 该术式台次数。
          minimum: 0
        anesthesiaMinutes:
          type: integer
          description: 该术式麻醉时长（分钟）。
          minimum: 0
    MultiReport:
      type: object
      description: 多维报表（口径 report-1.0.0）；分页行与全量合计。
      required:
        - from
        - to
        - timezone
        - dimensions
        - metrics
        - formula
        - weightFormula
        - rows
        - totals
        - page
        - size
        - total
        - totalPages
      properties:
        from:
          type: string
          format: date
          description: 起始本地日期（含）。
        to:
          type: string
          format: date
          description: 结束本地日期（含）。
        timezone:
          type: string
          description: 统计时区，固定 Asia/Shanghai。
        dimensions:
          type: array
          description: 生效维度（按请求声明顺序、已去重）。
          items:
            type: string
        metrics:
          type: array
          description: 生效指标（按请求声明顺序、已去重）。
          items:
            type: string
        formula:
          type: string
          description: 台次与麻醉时长口径说明。
        weightFormula:
          type: string
          description: 权重口径说明（默认 1.0，绩效规则院方另定）。
        rows:
          type: array
          description: 当前页分组行（稳定排序；空数据为空数组）。
          items:
            $ref: '#/components/schemas/MultiRow'
        totals:
          $ref: '#/components/schemas/ReportTotals'
        page:
          type: integer
          description: 当前页码，从 1 开始。
          minimum: 1
        size:
          type: integer
          description: 每页条数（1–200）。
          minimum: 1
        total:
          type: integer
          description: 全部分组数（不是当前页行数）。
          minimum: 0
        totalPages:
          type: integer
          description: 总页数 = ceil(total / size)；空数据为 0。
          minimum: 0
        source:
          type: string
          description: |
            数据来源（0.2.0 新增）：SNAPSHOT=命中报表锁定快照（分页对快照全量行重放）；
            LIVE=实时聚合。服务端始终返回该字段。
          enum:
            - LIVE
            - SNAPSHOT
        lockId:
          type: string
          description: 命中的快照标识（source=SNAPSHOT 时返回；LIVE 时省略）。
        lockedAt:
          type: string
          format: date-time
          description: 快照锁定时间（source=SNAPSHOT 时返回）。
    MultiRow:
      type: object
      description: 多维分组行；未请求维度的字段省略（null），计数类字段始终返回。
      required:
        - caseCount
        - anesthesiaMinutes
        - weightedCaseCount
        - unrecordedCaseCount
      properties:
        deptId:
          type: string
          description: 申请科室标识（请求 DEPT 维度时返回）。
        deptName:
          type: string
          description: 申请科室名称（请求 DEPT 维度时返回）。
        staffId:
          type: string
          description: 人员档案标识（请求 STAFF 维度时返回）。
        staffNo:
          type: string
          description: 院内在册人员工号（请求 STAFF 维度时返回；非患者标识）。
        staffName:
          type: string
          description: 院内在册人员姓名（请求 STAFF 维度时返回；非患者标识）。
        surgeryCode:
          type: string
          description: 术式编码（请求 SURGERY 维度时返回）。
        surgeryName:
          type: string
          description: 术式名称（请求 SURGERY 维度时返回；未匹配为中文兜底名“未登记术式”）。
        roomId:
          type: string
          description: 术间标识（请求 ROOM 维度时返回）。
        roomNo:
          type: string
          description: 术间号（请求 ROOM 维度时返回）。
        caseCount:
          type: integer
          description: 该分组台次数。
          minimum: 0
        anesthesiaMinutes:
          type: integer
          description: 该分组麻醉时长（分钟）。
          minimum: 0
        weightedCaseCount:
          type: number
          description: 该分组加权台次。
          minimum: 0
        unrecordedCaseCount:
          type: integer
          description: 该分组无可用麻醉时长的台次数。
          minimum: 0
    ReportTotals:
      type: object
      description: 全量合计（覆盖全部分组，不受分页影响）。
      required:
        - caseCount
        - anesthesiaMinutes
        - weightedCaseCount
        - unrecordedCaseCount
        - groupCount
      properties:
        caseCount:
          type: integer
          description: 全部分组台次合计。
          minimum: 0
        anesthesiaMinutes:
          type: integer
          description: 全部分组麻醉时长合计（分钟）。
          minimum: 0
        weightedCaseCount:
          type: number
          description: 全部分组加权台次合计。
          minimum: 0
        unrecordedCaseCount:
          type: integer
          description: 全部分组无可用麻醉时长的台次合计。
          minimum: 0
        groupCount:
          type: integer
          description: 全部分组数。
          minimum: 0
    ReportLockRequest:
      type: object
      description: |
        报表锁定请求（0.2.0）；期间用 `period` 或 `from`+`to` 之一给出（二选一）。
        锁定参数即“同参数查询/导出命中快照”的判据；分页（page/size）不参与锁定参数。
      required:
        - report
      properties:
        report:
          type: string
          description: 报表类型：workload=工作量、multi=多维报表。
          enum:
            - workload
            - multi
        period:
          type: string
          description: 期间：`YYYY-MM`（整月）或 `YYYY-MM-DD~YYYY-MM-DD`（闭区间）。
          pattern: '^(\d{4}-\d{2}|\d{4}-\d{2}-\d{2}~\d{4}-\d{2}-\d{2})$'
        from:
          type: string
          format: date
          description: 起始本地日期（含）；与 to 成对使用，不能与 period 同时给出。
        to:
          type: string
          format: date
          description: 结束本地日期（含）；跨度（含首尾）≤ 366 天。
        deptId:
          type: string
          description: 申请科室标识（可选收窄条件；越界 403）。
        dimension:
          type: string
          description: 工作量维度（report=workload 必填，白名单）。
          enum:
            - DEPT
            - STAFF
            - SURGERY
            - ROOM
        dimensions:
          type: array
          description: 多维维度（report=multi 必填，1–4 个，按声明顺序生效）。
          items:
            type: string
            enum:
              - DEPT
              - STAFF
              - SURGERY
              - ROOM
        metrics:
          type: array
          description: 多维指标（report=multi 必填，1–3 个）。
          items:
            type: string
            enum:
              - caseCount
              - anesthesiaMinutes
              - weightedCaseCount
    ReportLock:
      type: object
      description: |
        报表锁定快照元数据（0.2.0）；payload 不在此返回（快照数据通过同参数查询/导出获取），
        只含期间、参数指纹与锁定留痕，不含患者信息。
      required:
        - lockId
        - report
        - period
        - from
        - to
        - params
        - paramsHash
        - payloadHash
        - dataScope
        - rowCount
        - lockedBy
        - lockedByName
        - lockedAt
      properties:
        lockId:
          type: string
          description: 快照标识（UUID）。
        report:
          type: string
          description: 报表类型。
          enum:
            - workload
            - multi
        period:
          type: string
          description: 归一化期间（`YYYY-MM` 或 `YYYY-MM-DD~YYYY-MM-DD`）。
        from:
          type: string
          format: date
          description: 起始本地日期（含）。
        to:
          type: string
          format: date
          description: 结束本地日期（含）。
        params:
          type: object
          description: 归一化锁定参数（含数据范围摘要，不含患者信息）。
          additionalProperties: true
        paramsHash:
          type: string
          description: params 的 sha256（十六进制 64 位），与 report+period 组成唯一键。
          pattern: '^[0-9a-f]{64}$'
        payloadHash:
          type: string
          description: 快照 payload 的 sha256，用于完整性核对。
          pattern: '^[0-9a-f]{64}$'
        dataScope:
          type: string
          description: 锁定人数据范围摘要（ALL/SITE/DEPT/ROOM/SELF+对象数）。
        rowCount:
          type: integer
          description: 快照数据行数（workload=维度桶数，multi=分组数）。
          minimum: 0
        lockedBy:
          type: string
          description: 锁定人用户标识。
        lockedByName:
          type: string
          maxLength: 64
          description: 锁定人姓名摘要（院内在册人员，非患者信息）。
        lockedAt:
          type: string
          format: date-time
          description: 锁定时间。
    ReportLockList:
      type: object
      description: 报表锁定列表（按锁定时间倒序）。
      required:
        - items
        - total
      properties:
        items:
          type: array
          description: 快照元数据。
          items:
            $ref: '#/components/schemas/ReportLock'
        total:
          type: integer
          description: 本次返回条数。
          minimum: 0
    ErrorDetail:
      type: object
      description: 字段级或范围级错误明细；不含用户输入原文与患者标识。
      required:
        - field
        - reason
      properties:
        field:
          type: string
          description: 出错字段名（查询参数名或固定语义字段）。
        reason:
          type: string
          description: 固定安全中文说明。
    Error:
      type: object
      description: 统一错误响应；不暴露堆栈、SQL 实参与患者标识。
      required:
        - code
        - message
        - traceId
        - details
      properties:
        code:
          type: string
          description: 稳定错误码，供前端分支与告警规则使用。
        message:
          type: string
          description: 面向用户的中文提示，可安全展示。
        traceId:
          type: string
          description: 链路追踪标识，与日志、审计记录关联。
        details:
          type: array
          description: 字段级或范围级错误明细；无明细时为空数组。
          items:
            $ref: '#/components/schemas/ErrorDetail'
