openapi: 3.1.0
info:
  title: ANESOP 药品目录与麻精五专契约（drug）
  summary: 药品主数据、麻精专册/专柜交接/基数/日结、药房适配器状态
  description: |
    ANESOP 药品域契约，对应方案书 §2.5（药品与耗材管理、麻精五专）、§3.4（领域模型）、
    §3.9.2（RBAC 与数据权限）、§3.9.3（脱敏）与 E-M15。契约版本 0.1.0 为首个版本（additive）。
    硬规则：
    1) 药品目录为全院可读主数据（`m4:drug:read`）；维护（创建/更新）需要 `m4:drug:write`。
       编码、名称、通用名（非空）按 trim + 忽略大小写院内唯一；别名全局唯一，且名称/通用名
       不得与其他药品别名冲突、别名不得与其他药品名称/通用名冲突（冲突 409）。归一化唯一
       是麻醉记录按名称解析麻精属性只有一个候选的语义前提。
    2) 麻精五专（专人/专柜/专册/专账/专处方）记录需要 `m4:narcotic:manage`：
       专册登记、专柜交接、基数维护与日结/班结；科室必须显式选择且为启用 `org_type=DEPT`
       组织（不存在/停用/非科室 422），SELF 范围按本人所属科室推导。专册与交接为
       **append-only**，更正只能新增记录；
       每笔记录必须有 **两名不同的签字人**（firstSignerId ≠ secondSignerId，服务端 400，
       数据库 CHECK 兜底）；日结必须满足 **期初 + 入库 − 使用 − 退回 = 期末**，
       不平时服务端返回 409，`details[]` 给出期望值与实盘值（数据库 CHECK 兜底）。
    3) 药品字典是麻精判定的唯一权威：麻醉记录用药的 `narcotic` 由服务端按本域字典判定
       （客户端声明只做一致性校验），字典未收录 → 400；名称/通用名/别名归一化后命中多个
       药品 → 422 `DRUG_AMBIGUOUS`（fail-closed）。本契约不接收“客户端自定义麻精标志”。
    4) 药房系统对接属 EXT-02（外部适配器，当前 **SIMULATED**）：不直连药房生产库，
       只读状态与最近一次模拟同步结果；适配器不可用时降级为“本地字典继续可用 + 状态可见”，
       不阻塞临床记录。
    5) 脱敏：专册登记只保存 **使用人姓名摘要**（`usedBy`，≤64）与处方号（`prescriptionNo`），
       不保存患者姓名/院内患者号/身份证号/手机号；审计与日志不含处方原文与人员姓名。
       专册/交接/日结的 `departmentId` 用于科室数据范围过滤（五专按科室/角色限制）。
    所有示例均为 SYNTHETIC 合成数据。
  version: 0.1.0
  contact:
    name: ANESOP 项目组
  license:
    name: 内部交付（非开源）
servers:
  - url: https://anesop.local/api
    description: 院内单院部署统一入口（生产网无互联网出口）
security:
  - bearerAuth: []
tags:
  - name: 药品目录
    description: 药品主数据（编码/名称/通用名/规格/单位/剂型/分类/麻精/高危/别名）维护与检索。
  - name: 麻精五专
    description: 专册登记、专柜交接、基数维护、日结/班结（双人签字、平账校验、append-only）。
  - name: 药房适配器
    description: 药房系统适配器（EXT-02）状态与最近一次模拟同步结果，不承载药品主数据写入。
paths:
  /v1/drugs:
    get:
      operationId: listDrugs
      tags:
        - 药品目录
      summary: 查询药品目录
      description: 按关键字（名称/通用名/别名/编码）与状态过滤，分页返回；全院可读。
      parameters:
        - name: keyword
          in: query
          required: false
          description: 关键字（编码/名称/通用名/别名，模糊匹配，忽略大小写）。
          schema:
            type: string
            maxLength: 64
        - name: status
          in: query
          required: false
          description: 状态过滤；缺省返回全部状态。
          schema:
            type: string
            enum:
              - ACTIVE
              - INACTIVE
        - name: page
          in: query
          required: false
          description: 页码，从 1 开始。
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          description: 每页条数（1–200）。
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        '200':
          description: 药品目录分页结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrugList'
              example:
                items:
                  - drugId: '2a000000-0000-4000-8000-000000000001'
                    code: DRUG-SUF-001
                    name: 舒芬太尼（演示）
                    genericName: 枸橼酸舒芬太尼注射液（演示）
                    specification: 50ug/1ml
                    unit: 支
                    dosageForm: INJECTION
                    category: OPIOID
                    narcotic: true
                    highRisk: true
                    aliases:
                      - 舒芬（演示）
                    status: ACTIVE
                    remark: SYNTHETIC 演示药品
                    createdAt: '2026-11-14T08:00:00+08:00'
                    createdBy: '10000000-0000-4000-8000-000000000001'
                    updatedAt: '2026-11-14T08:00:00+08:00'
                    updatedBy: '10000000-0000-4000-8000-000000000001'
                    version: 1
                page: 1
                size: 20
                total: 1
                totalPages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createDrug
      tags:
        - 药品目录
      summary: 创建药品
      description: |
        创建药品主数据。编码/名称/通用名按 trim + 忽略大小写唯一，别名全局唯一且与既有
        药品名称/通用名双向互斥（冲突 409）。麻精标志（narcotic）是高危字段，仅药师/管理员维护。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDrugRequest'
            example:
              code: DRUG-SUF-001
              name: 舒芬太尼（演示）
              genericName: 枸橼酸舒芬太尼注射液（演示）
              specification: 50ug/1ml
              unit: 支
              dosageForm: INJECTION
              category: OPIOID
              narcotic: true
              highRisk: true
              aliases:
                - 舒芬（演示）
              remark: SYNTHETIC 演示药品
      responses:
        '201':
          description: 创建成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Drug'
              example:
                drugId: '2a000000-0000-4000-8000-000000000001'
                code: DRUG-SUF-001
                name: 舒芬太尼（演示）
                genericName: 枸橼酸舒芬太尼注射液（演示）
                specification: 50ug/1ml
                unit: 支
                dosageForm: INJECTION
                category: OPIOID
                narcotic: true
                highRisk: true
                aliases:
                  - 舒芬（演示）
                status: ACTIVE
                remark: SYNTHETIC 演示药品
                createdAt: '2026-11-14T08:00:00+08:00'
                createdBy: '10000000-0000-4000-8000-000000000001'
                updatedAt: '2026-11-14T08:00:00+08:00'
                updatedBy: '10000000-0000-4000-8000-000000000001'
                version: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/drugs/search:
    get:
      operationId: searchDrugs
      tags:
        - 药品目录
      summary: 按名称/别名检索药品（用药录入联想）
      description: |
        精确/前缀检索药品名称、通用名与别名，供麻醉记录用药录入联想；只返回启用（ACTIVE）药品。
        q 为空或全空白时返回空列表（不报错），避免联想接口在输入框清空时刷错误提示。
      parameters:
        - name: q
          in: query
          required: true
          description: 检索词（名称/通用名/别名，忽略大小写，最长 64）。
          schema:
            type: string
            maxLength: 64
        - name: limit
          in: query
          required: false
          description: 返回条数上限（1–50，默认 20）。
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: 命中药品（按名称排序）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrugList'
              example:
                items:
                  - drugId: '2a000000-0000-4000-8000-000000000001'
                    code: DRUG-SUF-001
                    name: 舒芬太尼（演示）
                    genericName: 枸橼酸舒芬太尼注射液（演示）
                    specification: 50ug/1ml
                    unit: 支
                    dosageForm: INJECTION
                    category: OPIOID
                    narcotic: true
                    highRisk: true
                    aliases:
                      - 舒芬（演示）
                    status: ACTIVE
                    createdAt: '2026-11-14T08:00:00+08:00'
                    createdBy: '10000000-0000-4000-8000-000000000001'
                    updatedAt: '2026-11-14T08:00:00+08:00'
                    updatedBy: '10000000-0000-4000-8000-000000000001'
                    version: 1
                page: 1
                size: 20
                total: 1
                totalPages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/drugs/{drugId}:
    get:
      operationId: getDrug
      tags:
        - 药品目录
      summary: 查询药品详情
      description: 返回药品主数据与别名；不存在或不可见统一 404。
      parameters:
        - $ref: '#/components/parameters/DrugId'
      responses:
        '200':
          description: 药品详情。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Drug'
              example:
                drugId: '2a000000-0000-4000-8000-000000000001'
                code: DRUG-SUF-001
                name: 舒芬太尼（演示）
                genericName: 枸橼酸舒芬太尼注射液（演示）
                specification: 50ug/1ml
                unit: 支
                dosageForm: INJECTION
                category: OPIOID
                narcotic: true
                highRisk: true
                aliases:
                  - 舒芬（演示）
                status: ACTIVE
                createdAt: '2026-11-14T08:00:00+08:00'
                createdBy: '10000000-0000-4000-8000-000000000001'
                updatedAt: '2026-11-14T08:00:00+08:00'
                updatedBy: '10000000-0000-4000-8000-000000000001'
                version: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateDrug
      tags:
        - 药品目录
      summary: 更新药品
      description: |
        全量保存药品（编码不可改）。必须回传 version 做乐观锁，冲突 409；名称/通用名/别名
        交叉冲突同样 409。麻精标志变更属高危操作：审计记录 before/after 的
        narcotic/highRisk 摘要（不含患者信息）。
      parameters:
        - $ref: '#/components/parameters/DrugId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDrugRequest'
            example:
              name: 舒芬太尼（演示）
              genericName: 枸橼酸舒芬太尼注射液（演示）
              specification: 50ug/1ml
              unit: 支
              dosageForm: INJECTION
              category: OPIOID
              narcotic: true
              highRisk: true
              aliases:
                - 舒芬（演示）
                - 舒芬太尼（演示别名）
              remark: SYNTHETIC 演示药品（改名）
              version: 1
      responses:
        '200':
          description: 更新成功，返回更新后的药品。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Drug'
              example:
                drugId: '2a000000-0000-4000-8000-000000000001'
                code: DRUG-SUF-001
                name: 舒芬太尼（演示）
                genericName: 枸橼酸舒芬太尼注射液（演示）
                specification: 50ug/1ml
                unit: 支
                dosageForm: INJECTION
                category: OPIOID
                narcotic: true
                highRisk: true
                aliases:
                  - 舒芬（演示）
                  - 舒芬太尼（演示别名）
                status: ACTIVE
                remark: SYNTHETIC 演示药品（改名）
                createdAt: '2026-11-14T08:00:00+08:00'
                createdBy: '10000000-0000-4000-8000-000000000001'
                updatedAt: '2026-11-14T09:30:00+08:00'
                updatedBy: '10000000-0000-4000-8000-000000000001'
                version: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/drugs/pharmacy-adapter/status:
    get:
      operationId: getPharmacyAdapterStatus
      tags:
        - 药房适配器
      summary: 查询药房适配器状态（EXT-02）
      description: |
        返回 EXT-02 药房适配器状态：当前为 SIMULATED（未接入真实药房系统），
        `available=false` 表示模拟同步失败，`degraded=true` 表示已降级为本地字典可用；
        最近一次同步时间与待同步条数用于运维排障。该端点不返回任何患者或处方明细。
      responses:
        '200':
          description: 适配器状态。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PharmacyAdapterStatus'
              example:
                adapterCode: EXT-02
                name: 药房系统适配器（模拟）
                mode: SIMULATED
                available: true
                degraded: false
                lastSyncedAt: '2026-11-14T08:00:00+08:00'
                pendingSyncCount: 0
                message: 未接入真实药房系统（EXT-02），当前为模拟同步
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/narcotic/departments:
    get:
      operationId: listNarcoticDepartments
      tags:
        - 麻精五专
      summary: 查询调用者可访问的科室（五专科室选择）
      description: |
        返回当前调用者数据范围内可见的启用科室（org_type=DEPT），用于五专页面显式选择科室，
        禁止前端用当前用户标识冒充科室。ALL 返回全部启用科室；SITE 返回授予院区子树；
        DEPT 返回授权科室；SELF 返回本人绑定科室；ROOM/无数据范围 403。
        返回项只含科室标识/编码/名称，不含人员与患者信息。
      responses:
        '200':
          description: 可见科室列表（按编码排序）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentList'
              example:
                items:
                  - departmentId: 'f1000000-0000-4000-8000-000000000002'
                    code: DEPT-ANES
                    name: 麻醉科（合成）
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/narcotic/registers:
    get:
      operationId: listNarcoticRegisters
      tags:
        - 麻精五专
      summary: 查询麻精专册登记
      description: |
        按科室、药品与时间范围查询专册（append-only）。数据范围：`m4:narcotic:manage` +
        科室数据范围（ALL 全院；DEPT/SITE 只返回授权科室；SELF/ROOM 不适用五专 → 403）。
      parameters:
        - name: departmentId
          in: query
          required: false
          description: 科室标识过滤；超出数据范围 403。
          schema:
            type: string
        - name: drugId
          in: query
          required: false
          description: 药品标识过滤。
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: 使用时间下界（含）。
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: 使用时间上界（含）。
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: 返回条数上限（1–200，默认 100）。
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        '200':
          description: 专册登记列表（按使用时间倒序）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NarcoticRegisterList'
              example:
                items:
                  - registerId: '2b000000-0000-4000-8000-000000000001'
                    drugId: '2a000000-0000-4000-8000-000000000001'
                    drugName: 舒芬太尼（演示）
                    batchNo: BATCH-SYNTH-0001
                    quantity: 1
                    unit: 支
                    prescriptionNo: RX-SYNTH-0001
                    usedBy: 演示使用人（合成）
                    departmentId: 'f1000000-0000-4000-8000-000000000002'
                    usageAt: '2026-11-14T09:10:00+08:00'
                    destination: 术中镇痛（演示）
                    firstSignerId: '10000000-0000-4000-8000-000000000003'
                    firstSignerName: 演示给药人（合成）
                    secondSignerId: '10000000-0000-4000-8000-000000000004'
                    secondSignerName: 演示核对人（合成）
                    createdAt: '2026-11-14T09:12:00+08:00'
                    createdBy: '10000000-0000-4000-8000-000000000003'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createNarcoticRegister
      tags:
        - 麻精五专
      summary: 登记麻精专册（append-only）
      description: |
        登记一笔麻精药品使用：药品必须已收录于字典（否则 422），批号/数量/处方号/使用人/
        去向必填；两名签字人必须不同（否则 400，`details[0].field=secondSignerId`）。
        写成功后审计 `NARCOTIC_REGISTER`（不含处方号原文与人员姓名）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNarcoticRegisterRequest'
            example:
              drugId: '2a000000-0000-4000-8000-000000000001'
              batchNo: BATCH-SYNTH-0001
              quantity: 1
              unit: 支
              prescriptionNo: RX-SYNTH-0001
              usedBy: 演示使用人（合成）
              departmentId: 'f1000000-0000-4000-8000-000000000002'
              usageAt: '2026-11-14T09:10:00+08:00'
              destination: 术中镇痛（演示）
              firstSignerId: '10000000-0000-4000-8000-000000000003'
              firstSignerName: 演示给药人（合成）
              secondSignerId: '10000000-0000-4000-8000-000000000004'
              secondSignerName: 演示核对人（合成）
      responses:
        '201':
          description: 登记成功，返回登记记录。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NarcoticRegister'
              example:
                registerId: '2b000000-0000-4000-8000-000000000001'
                drugId: '2a000000-0000-4000-8000-000000000001'
                drugName: 舒芬太尼（演示）
                batchNo: BATCH-SYNTH-0001
                quantity: 1
                unit: 支
                prescriptionNo: RX-SYNTH-0001
                usedBy: 演示使用人（合成）
                departmentId: 'f1000000-0000-4000-8000-000000000002'
                usageAt: '2026-11-14T09:10:00+08:00'
                destination: 术中镇痛（演示）
                firstSignerId: '10000000-0000-4000-8000-000000000003'
                firstSignerName: 演示给药人（合成）
                secondSignerId: '10000000-0000-4000-8000-000000000004'
                secondSignerName: 演示核对人（合成）
                createdAt: '2026-11-14T09:12:00+08:00'
                createdBy: '10000000-0000-4000-8000-000000000003'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/narcotic/cabinet-handovers:
    get:
      operationId: listCabinetHandovers
