          minimum: 0
    PharmacyAdapterStatus:
      type: object
      description: 药房适配器（EXT-02）状态；SIMULATED 表示未接入真实药房系统。
      required:
        - adapterCode
        - name
        - mode
        - available
        - degraded
        - pendingSyncCount
        - message
      properties:
        adapterCode:
          type: string
          description: 适配器编号（EXT-02）。
        name:
          type: string
          description: 适配器名称。
        mode:
          type: string
          description: 运行模式：SIMULATED=模拟（未接入真实系统），LIVE=真实对接（本期未启用）。
          enum:
            - SIMULATED
            - LIVE
        available:
          type: boolean
          description: 最近一次同步是否成功（false 表示适配器不可用）。
        degraded:
          type: boolean
          description: 是否降级（true 表示本地字典继续可用，仅外部同步失败）。
        lastSyncedAt:
          type: string
          format: date-time
          description: 最近一次同步时间；从未同步时为 null。
        pendingSyncCount:
          type: integer
          description: 待同步条数（模拟）。
          minimum: 0
        message:
          type: string
          description: 状态说明（固定文案，不含外部系统凭据）。
