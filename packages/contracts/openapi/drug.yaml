                    handoverFromId: '10000000-0000-4000-8000-000000000003'
                    handoverFromName: 演示交班人（合成）
                    handoverToId: '10000000-0000-4000-8000-000000000004'
                    handoverToName: 演示接班人（合成）
                    items:
                      - drugId: '2a000000-0000-4000-8000-000000000001'
                        drugName: 舒芬太尼（演示）
