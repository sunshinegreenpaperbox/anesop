        - 麻精五专
      summary: 查询专柜交接记录
      description: 按柜号/科室查询专柜交接（append-only，按交接时间倒序）。
      parameters:
        - name: cabinetCode
          in: query
          required: false
          description: 专柜编码。
          schema:
            type: string
            maxLength: 32
        - name: departmentId
          in: query
          required: false
          description: 科室标识；超出数据范围 403。
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 返回条数上限（1–200，默认 100）。
          schema:
