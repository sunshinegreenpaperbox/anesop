    DailyClose:
      type: object
      description: 麻精日结/班结（append-only，平账后落库）。
      required:
        - closeId
        - closeDate
        - shift
        - cabinetCode
        - departmentId
        - openingQuantity
        - inboundQuantity
        - usedQuantity
        - returnedQuantity
        - closingQuantity
        - balanced
        - createdAt
        - createdBy
      properties:
        closeId:
          type: string
          description: 日结记录标识。
        closeDate:
          type: string
          format: date
          description: 日结日期（业务日，Asia/Shanghai）。
        shift:
          type: string
          description: 班次。
          enum:
            - DAY
            - NIGHT
        cabinetCode:
          type: string
          maxLength: 32
          description: 专柜编码。
        departmentId:
          type: string
          description: 科室标识。
        openingQuantity:
          type: number
          description: 期初数量。
          minimum: 0
        inboundQuantity:
          type: number
          description: 入库数量。
          minimum: 0
        usedQuantity:
          type: number
          description: 使用数量。
          minimum: 0
        returnedQuantity:
          type: number
          description: 退回数量。
          minimum: 0
        closingQuantity:
          type: number
          description: 期末（实盘）数量；必须等于期初 + 入库 − 使用 − 退回。
          minimum: 0
        balanced:
          type: boolean
          description: 是否平账（成功落库的记录恒为 true；不平不落库）。
        createdAt:
          type: string
          format: date-time
          description: 创建时间。
        createdBy:
          type: string
          description: 创建人用户标识。
