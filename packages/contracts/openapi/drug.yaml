              secondSignerName: 演示接班人（合成）
      responses:
        '201':
          description: 交接登记成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CabinetHandover'
              example:
                handoverId: '2c000000-0000-4000-8000-000000000001'
                cabinetCode: CAB-ANES-01
                departmentId: 'f1000000-0000-4000-8000-000000000002'
                shift: DAY
                handedOverAt: '2026-11-14T16:00:00+08:00'
                handoverFromId: '10000000-0000-4000-8000-000000000003'
                handoverFromName: 演示交班人（合成）
                handoverToId: '10000000-0000-4000-8000-000000000004'
                handoverToName: 演示接班人（合成）
                items:
                  - drugId: '2a000000-0000-4000-8000-000000000001'
                    drugName: 舒芬太尼（演示）
                    quantity: 4
                    unit: 支
                firstSignerId: '10000000-0000-4000-8000-000000000003'
                firstSignerName: 演示交班人（合成）
                secondSignerId: '10000000-0000-4000-8000-000000000004'
                secondSignerName: 演示接班人（合成）
                createdAt: '2026-11-14T16:02:00+08:00'
                createdBy: '10000000-0000-4000-8000-000000000003'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/narcotic/baselines:
    get:
      operationId: listDrugBaselines
      tags:
        - 麻精五专
      summary: 查询麻精基数
      description: 按柜号/科室查询基数（品种 + 数量）。数据范围同专册（科室过滤）。
      parameters:
        - name: cabinetCode
          in: query
          required: false
          description: 专柜编码。
          schema:
            type: string
            maxLength: 32
        - name: departmentId
          in: query
          required: false
          description: 科室标识；超出数据范围 403。
          schema:
            type: string
      responses:
        '200':
          description: 基数列表（按柜号 + 药品名排序）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrugBaselineList'
              example:
                items:
                  - baselineId: '2d000000-0000-4000-8000-000000000001'
                    drugId: '2a000000-0000-4000-8000-000000000001'
                    drugName: 舒芬太尼（演示）
                    cabinetCode: CAB-ANES-01
                    departmentId: 'f1000000-0000-4000-8000-000000000002'
                    quantity: 10
                    unit: 支
                    updatedAt: '2026-11-14T08:00:00+08:00'
                    updatedBy: '10000000-0000-4000-8000-000000000001'
                    version: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: updateDrugBaselines
      tags:
        - 麻精五专
      summary: 维护麻精基数（按品种 + 柜幂等 upsert）
      description: |
        批量维护基数：一条记录由 `drugId + cabinetCode` 唯一确定；新建时 `version` 可省略，
        更新时必须回传当前 `version`，过期 409。数量 ≥ 0。审计 `NARCOTIC_BASELINE`
        （逐条记录品种与数量变更，不含患者信息）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDrugBaselinesRequest'
            example:
              items:
                - drugId: '2a000000-0000-4000-8000-000000000001'
                  cabinetCode: CAB-ANES-01
                  departmentId: 'f1000000-0000-4000-8000-000000000002'
                  quantity: 12
                  version: 1
      responses:
        '200':
          description: 维护成功，返回该柜号的完整基数列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrugBaselineList'
              example:
                items:
                  - baselineId: '2d000000-0000-4000-8000-000000000001'
                    drugId: '2a000000-0000-4000-8000-000000000001'
                    drugName: 舒芬太尼（演示）
                    cabinetCode: CAB-ANES-01
                    departmentId: 'f1000000-0000-4000-8000-000000000002'
                    quantity: 12
                    unit: 支
                    updatedAt: '2026-11-14T10:00:00+08:00'
                    updatedBy: '10000000-0000-4000-8000-000000000001'
                    version: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/narcotic/daily-closes:
    post:
      operationId: createDailyClose
      tags:
        - 麻精五专
      summary: 日结/班结（平账校验，append-only）
      description: |
        提交日结/班结：服务端校验 **期初 + 入库 − 使用 − 退回 = 期末**；不平返回 409，
        `details[]` 给出 `openingQuantity/inboundQuantity/usedQuantity/returnedQuantity/
        closingQuantity` 与期望值。平账后写入 append-only 日结记录并审计 `NARCOTIC_DAILY_CLOSE`。
        科室数据范围不满足 403；同一柜号 + 日期 + 班次重复日结 409。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDailyCloseRequest'
            example:
              closeDate: '2026-11-14'
              shift: DAY
              cabinetCode: CAB-ANES-01
              departmentId: 'f1000000-0000-4000-8000-000000000002'
              openingQuantity: 10
              inboundQuantity: 4
              usedQuantity: 3
              returnedQuantity: 1
              closingQuantity: 10
      responses:
        '201':
          description: 日结成功，返回平账结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyClose'
              example:
                closeId: '2e000000-0000-4000-8000-000000000001'
                closeDate: '2026-11-14'
                shift: DAY
                cabinetCode: CAB-ANES-01
                departmentId: 'f1000000-0000-4000-8000-000000000002'
                openingQuantity: 10
                inboundQuantity: 4
                usedQuantity: 3
                returnedQuantity: 1
                closingQuantity: 10
                balanced: true
                createdAt: '2026-11-14T16:10:00+08:00'
                createdBy: '10000000-0000-4000-8000-000000000003'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/narcotic/daily-closes/{closeId}:
    get:
      operationId: getDailyClose
      tags:
        - 麻精五专
      summary: 查询日结/班结详情
      description: 返回指定日结记录；不存在或超出科室数据范围统一 404。
      parameters:
        - $ref: '#/components/parameters/CloseId'
      responses:
        '200':
          description: 日结详情。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyClose'
              example:
                closeId: '2e000000-0000-4000-8000-000000000001'
                closeDate: '2026-11-14'
                shift: DAY
                cabinetCode: CAB-ANES-01
                departmentId: 'f1000000-0000-4000-8000-000000000002'
                openingQuantity: 10
                inboundQuantity: 4
                usedQuantity: 3
                returnedQuantity: 1
                closingQuantity: 10
                balanced: true
                createdAt: '2026-11-14T16:10:00+08:00'
                createdBy: '10000000-0000-4000-8000-000000000003'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 统一 OAuth2/JWT 访问令牌，放在 Authorization 请求头中（Bearer 方案）。
  parameters:
    DrugId:
      name: drugId
      in: path
      required: true
      description: 药品标识（UUID 字符串）。
      schema:
        type: string
    CloseId:
      name: closeId
      in: path
      required: true
      description: 日结/班结记录标识（UUID 字符串）。
      schema:
        type: string
  responses:
    BadRequest:
      description: 请求参数校验失败（字段缺失/越界/双人签字为同一人/科室格式非法）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: PARAM_INVALID
            message: 请求参数校验失败
            traceId: SYNTH-TRACE-0201
            details:
              - field: secondSignerId
                reason: 第二签字人不得与第一签字人为同一人
    Unauthorized:
      description: 未认证或令牌已失效（fail-closed）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: AUTH_UNAUTHORIZED
            message: 未认证或令牌已失效
            traceId: SYNTH-TRACE-0202
            details: []
    Forbidden:
      description: 已认证但缺权限（m4:drug:read|write、m4:narcotic:manage）或科室数据范围不足。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: AUTH_FORBIDDEN
            message: 无权访问该资源或数据范围不足
            traceId: SYNTH-TRACE-0203
            details:
              - field: permission
                reason: 需要 m4:narcotic:manage 权限与对应科室数据范围
    NotFound:
      description: 药品/日结记录不存在或不可见（不泄露其他科室数据的存在性）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RESOURCE_NOT_FOUND
            message: 资源不存在或不可见
            traceId: SYNTH-TRACE-0204
            details: []
    Conflict:
      description: 编码/名称/通用名/别名归一化重复或交叉冲突、基数跨科改写、乐观锁版本过期、日结不平或重复日结。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: STATE_CONFLICT
            message: 状态或版本冲突，操作未生效
            traceId: SYNTH-TRACE-0205
            details:
              - field: closingQuantity
                reason: 平账校验未通过：期望 10，实盘 9（期初 10 + 入库 4 − 使用 3 − 退回 1）
    UnprocessableEntity:
      description: 业务规则拒绝：药品未收录于字典（不能用于专册/交接登记）等。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: BUSINESS_RULE_VIOLATION
            message: 药品或科室不在可用范围内
            traceId: SYNTH-TRACE-0206
            details:
              - field: drugId
                reason: 药品未收录于药品字典
  schemas:
    ErrorDetail:
      type: object
      description: 错误明细项，用于字段级校验失败或数据范围说明。
      required:
        - field
        - reason
      properties:
        field:
          type: string
          description: 相关字段名或资源标识。
        reason:
          type: string
          description: 可读的失败原因，不包含堆栈、SQL 实参与患者标识。
    Error:
      type: object
      description: 统一错误响应；不暴露堆栈、SQL 实参、令牌与患者标识。
      required:
        - code
        - message
        - traceId
        - details
      properties:
        code:
          type: string
          description: 稳定错误码，供前端分支与告警规则使用。
        message:
          type: string
          description: 面向用户的中文提示，可安全展示。
        traceId:
          type: string
          description: 链路追踪标识，与日志、审计记录关联。
        details:
          type: array
          description: 字段级或范围级错误明细；无明细时为空数组。
          items:
            $ref: '#/components/schemas/ErrorDetail'
    Drug:
      type: object
      description: 药品主数据（SYNTHETIC 示例）；narcotic 为麻精判定权威字段。
      required:
        - drugId
        - code
        - name
        - specification
        - unit
        - dosageForm
        - category
        - narcotic
        - highRisk
        - aliases
        - status
        - createdAt
        - createdBy
        - updatedAt
        - updatedBy
        - version
      properties:
        drugId:
          type: string
          description: 药品标识。
        code:
          type: string
          maxLength: 64
          description: 院内药品编码（唯一，创建后不可改）。
        name:
          type: string
          maxLength: 200
          description: 药品名称（院内字典名，唯一；麻醉记录按此名解析麻精属性）。
        genericName:
          type: string
          maxLength: 200
          description: 通用名（可选；参与名称解析）。
        specification:
          type: string
          maxLength: 100
          description: 规格（如 50ug/1ml）。
        unit:
          type: string
          maxLength: 16
          description: 单位（支/瓶/片/袋等）。
        dosageForm:
          type: string
          maxLength: 32
          description: 剂型编码（INJECTION/TABLET 等，院内字典）。
        category:
          type: string
          maxLength: 32
          description: 分类编码（院内药典分类；具体取值由院方确认【待确认】）。
        narcotic:
          type: boolean
          description: 是否麻精药品（麻醉、精神类）；由本字典判定，客户端不得自行声明。
        highRisk:
          type: boolean
          description: 是否高危药品（高警示）；用于提醒，不替代医师判断。
        aliases:
          type: array
          description: 别名（全局唯一；用于用药录入联想与麻精解析）。
          maxItems: 20
          items:
            type: string
            maxLength: 64
        status:
          type: string
          description: 状态：ACTIVE=启用（可录入），INACTIVE=停用（只读历史）。
          enum:
            - ACTIVE
            - INACTIVE
        remark:
          type: string
          maxLength: 500
          description: 备注（可选，不含患者信息）。
        createdAt:
          type: string
          format: date-time
          description: 创建时间。
        createdBy:
          type: string
          description: 创建人用户标识。
        updatedAt:
          type: string
          format: date-time
          description: 最后更新时间。
        updatedBy:
          type: string
          description: 最后修改人用户标识。
        version:
          type: integer
          description: 乐观锁版本号（从 1 起）。
          minimum: 1
    DrugList:
      type: object
      description: 药品分页结果。
      required:
        - items
        - page
        - size
        - total
        - totalPages
      properties:
        items:
          type: array
          description: 药品列表。
          items:
            $ref: '#/components/schemas/Drug'
        page:
          type: integer
          description: 当前页码，从 1 开始。
          minimum: 1
        size:
          type: integer
          description: 每页条数。
          minimum: 1
          maximum: 200
        total:
          type: integer
          description: 符合条件的总数。
          minimum: 0
        totalPages:
          type: integer
          description: 总页数；total 为 0 时为 0。
          minimum: 0
    CreateDrugRequest:
      type: object
      description: 创建药品请求；code/name 唯一，aliases 全局唯一。
      required:
        - code
        - name
        - specification
        - unit
        - dosageForm
        - category
        - narcotic
        - highRisk
      properties:
        code:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z0-9._-]{1,64}$'
          description: 院内药品编码（唯一）。
        name:
          type: string
          maxLength: 200
          description: 药品名称（唯一）。
        genericName:
          type: string
          maxLength: 200
          description: 通用名（可选）。
        specification:
          type: string
          maxLength: 100
          description: 规格。
        unit:
          type: string
          maxLength: 16
          description: 单位。
        dosageForm:
          type: string
          maxLength: 32
          description: 剂型编码。
        category:
          type: string
          maxLength: 32
          description: 分类编码。
        narcotic:
          type: boolean
          description: 是否麻精药品。
        highRisk:
          type: boolean
          description: 是否高危药品。
        aliases:
          type: array
          description: 别名（可选，全局唯一）。
          maxItems: 20
          items:
            type: string
            maxLength: 64
        remark:
          type: string
          maxLength: 500
          description: 备注（可选）。
    UpdateDrugRequest:
      type: object
      description: 更新药品请求（编码不可改；必须回传 version）。
      required:
        - name
        - specification
        - unit
        - dosageForm
        - category
        - narcotic
        - highRisk
        - version
      properties:
        name:
          type: string
          maxLength: 200
          description: 药品名称（唯一）。
        genericName:
          type: string
          maxLength: 200
          description: 通用名（可选）。
        specification:
          type: string
          maxLength: 100
          description: 规格。
        unit:
          type: string
          maxLength: 16
          description: 单位。
        dosageForm:
          type: string
          maxLength: 32
          description: 剂型编码。
        category:
          type: string
          maxLength: 32
          description: 分类编码。
        narcotic:
          type: boolean
          description: 是否麻精药品（变更属高危操作，记审计）。
        highRisk:
          type: boolean
          description: 是否高危药品。
        aliases:
          type: array
          description: 别名（全量替换；省略表示清空）。
          maxItems: 20
          items:
            type: string
            maxLength: 64
        remark:
          type: string
          maxLength: 500
          description: 备注（可选）。
        version:
          type: integer
          description: 乐观锁版本号（必须等于当前版本）。
          minimum: 1
    NarcoticRegister:
      type: object
      description: 麻精专册登记（append-only）。
      required:
        - registerId
