openapi: 3.1.0
info:
  title: ANESOP 质控指标、不良事件 RCA、病历质量抽查与上报导出契约（qc）
  summary: 质控指标定义与结果（结构/过程/结果）、不良事件登记与 RCA 闭环、病历质量抽查与整改、脱敏上报导出
  description: |
    ANESOP 管理域质控契约（第 10 域），对应方案书 §2.9（M7 质量控制）、§2.9.2（指标体系与
    自动计算/钻取、不良事件与 RCA/PDCA、质控看板与报告、病历质量抽查、规则版本管理）、
    §2.5.3（I-10 国家/省级麻醉质控平台上报表 2-6）、E-M17。

    契约版本 **0.1.0** 为首个版本（additive）。口径版本 **qc-1.0.0**，时区固定
    **Asia/Shanghai**。本域只做「指标出数 + 不良事件闭环 + 病历抽查整改 + 脱敏导出」，
    不做绩效/计费，不直连外部上报平台。

    硬规则：
    1) **指标可追溯**：指标定义按 `code + version` 版本化，跨期结果按**当期版本**计算并留存
       （`qc_indicator_result` 唯一键含版本与周期）；每条结果必须能给出分子/分母，
       分母为 0 时 `value=0` 且 `targetMet=false`（不判达标、不做除零），并保留
       `denominator=0` 供数据质量复核。
    2) **数据来源明确**：每个指标在 `dataSource` 字段声明其计算来源（M3 麻醉记录单/时间轴、
       M4 药品/耗材、M2 排程台次、本域不良事件与病历抽查）；计算在服务端完成，不接受
       客户端传入分子分母。**指标清单、阈值与国家/省级口径【待确认】**（ADR-0022）：
       本期随迁移落地 7 条**合成参考指标**（`QC-SYN-*`，`provisional=true`），
       院方指标目录确认后按新版本替换，不覆盖历史版本。
    3) **不良事件状态机**：`REPORTED → RCA → RECTIFYING → CLOSED`，**只允许逐级前进**；
       越级、跳级、重复闭环一律 409（不回显数据库约束名）。`REPORTED` 阶段才有 RCA 可提交
       （`POST /adverse-events/{id}/rca`），RCA 复核通过后事件转 `RECTIFYING`，
       整改完成确认后转 `CLOSED`；两次复核均须**复核人**，且复核人不得为上报人/责任人
       （独立复核，口径【待确认】）。不良事件主体与 RCA 记录 **append-only**：
       业务内容不可改删，只有状态机字段可一次性前移（数据库触发器兜底 55000）。
    4) **病历质量抽查**：评分项白名单 `COMPLETENESS`/`TIMELINESS`/`SIGNATURE`/`CONSISTENCY`，
       每项 0–100 分且 `score ≤ maxScore`；`totalScore`/`maxScore` 由服务端求和，不接受
       客户端传总分；`totalScore / maxScore ≥ 90%` 为合格（**合格线【待确认】**）；
       存在缺陷项（`score < maxScore`）时必须给出责任整改；整改闭环须复核人。
    5) **脱敏与上报占位**：本域任何接口与导出**不含患者标识**（姓名、住院号、院内患者号、
       身份证号、手机号、术前诊断、HIS 申请号）；不良事件 `description` 为**已脱敏描述**
       （服务端拒绝疑似患者标识的入参，见 400 规则），导出**不输出**描述与根因自由文本，
       只输出类型/等级/状态/时间/科室/计数；上报给国家/省级平台（I-10）的**格式与字段
       映射【待确认】**，本期 `GET /v1/qc/export` 的 CSV 为占位模板（EXT，不直连外部系统）。
    6) **导出防注入**：CSV 为 UTF-8 **BOM**、首行列头、`text/csv` 流式输出；
       命中公式起始字符（`=`/`+`/`-`/`@`/制表符/回车）的单元格以**前导单引号中和**，
       必要时按 **RFC 4180** 加双引号并转义内部引号；导出写审计 `QC_EXPORT`。
    7) **数据范围（fail-closed）**：`ALL` 全院；`SITE`/`DEPT` 按科室（或院区）过滤；
       `ROOM`/`SELF` 或无任何可用范围 → 403（质控为科室/全院聚合口径，不做个人视图）；
       `deptId` 越界 → 403；单对象越界与不存在统一 404（不泄露存在性）。
    8) **权限**：`m4:qc:read`（指标/结果/列表）、`m4:qc:write`（登记不良事件、提交 RCA、
       创建抽查、提交整改）、`m4:qc:review`（RCA 复核与闭环、抽查整改闭环）、
       `m4:qc:export`（上报导出）。最小授予见 V25 与 docs/db/README.md。
    9) **审计无 PHI**：`QC_INDICATOR_QUERY`/`QC_INDICATOR_COMPUTE`/`ADVERSE_EVENT_CREATE`/
       `ADVERSE_EVENT_QUERY`/`ADVERSE_EVENT_STATUS`/`RCA_CREATE`/`RCA_REVIEW`/`RCA_CLOSE`/
       `CHART_REVIEW_CREATE`/`CHART_REVIEW_QUERY`/`RECTIFICATION_CREATE`/
       `RECTIFICATION_CLOSE`/`QC_EXPORT`，detail 只含标识/类型/状态/周期/计数。
    所有示例均为 SYNTHETIC 合成数据（演示科室/工号/事件号，无真实患者与真实人员）。
  version: 0.1.0
  contact:
    name: ANESOP 项目组
  license:
    name: 内部交付（非开源）
servers:
  - url: https://anesop.local/api
    description: 院内单院部署统一入口（生产网无互联网出口）
security:
  - bearerAuth: []
tags:
  - name: 质控指标
    description: 指标定义（结构/过程/结果，版本化口径与阈值）与周期结果（分子/分母/值/达标）。
  - name: 不良事件
    description: 不良事件登记、分级、状态机与 RCA（时间线/根因/整改/责任人/期限/闭环）。
  - name: 病历质量抽查
    description: 病历质量抽查评分（完整性/时效性/签名/逻辑一致性）、缺陷项与整改闭环。
  - name: 上报导出
    description: 质控指标、不良事件与抽查结果的脱敏 CSV 导出（UTF-8 BOM、防注入、无 PHI）。
paths:
  /v1/qc/indicators:
    get:
      operationId: getQcIndicators
      tags:
        - 质控指标
      summary: 质控指标定义列表（版本化口径、阈值、数据来源）
      description: |
        权限 `m4:qc:read`。返回全部 **ACTIVE 版本**的指标定义（目录展示，含未来生效版本；
        按类别、编码稳定排序）。计算/导出按查询周期选择生效版本（见 `/indicator-results`）。

        - `code` 院内唯一标识指标，`version` 为口径版本（语义变更必须升版本，不得原地改口径）；
        - `category`：`STRUCTURE`（结构）/`PROCESS`（过程）/`OUTCOME`（结果）；
        - `unit`：`PERCENT`（百分比）或 `PER_1000_CASES`（每千台次）；
        - `thresholdOperator`：`GTE`（≥ 阈值达标）/`LTE`（≤ 阈值达标）；
        - `dataSource` 声明计算来源（M3 记录单/时间轴、M4 药品/耗材、M2 排程台次、本域数据），
          保证指标可追溯到原始记录条目；
        - `provisional=true` 表示该条为**合成参考指标**，阈值/口径【待确认】（ADR-0022）；
        - `inTargetStatistics=false` 表示该条**不计入达标统计**（如结构合规口径），
          `targetMet` 固定 `false`，待 Q-1 确认后升版本开启。
        查询写审计 `QC_INDICATOR_QUERY`（detail 仅指标数与版本）。
      responses:
        '200':
          description: 指标定义列表（生效版本）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QcIndicatorList'
              example:
                items:
                  - id: '7c000000-0000-4000-8000-000000000001'
                    code: QC-SYN-STRUCT-001
                    name: 麻醉记录单完成率
                    category: STRUCTURE
                    definition: 区间内已完成（有结束时间）的麻醉记录单台次 / 同期非取消台次 × 100%
                    dataSource: M3 麻醉记录单（m2_anes.anesthesia_record）+ M2 排程台次（m1_sched.schedule）
                    numeratorLabel: 已完成麻醉记录单的台次数
                    denominatorLabel: 同期非取消台次数
                    unit: PERCENT
                    thresholdOperator: GTE
                    thresholdValue: 95
                    version: 1.0.0
                    effectiveFrom: '2026-01-01'
                    effectiveTo: null
                    status: ACTIVE
                    provisional: true
                    inTargetStatistics: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/qc/indicator-results:
    get:
      operationId: getQcIndicatorResults
      tags:
        - 质控指标
      summary: 周期指标结果（分子/分母/值/达标状态，按当期版本留存）
      x-allow-query-conflict: true
      description: |
        权限 `m4:qc:read`。按 `from`/`to` 本地日期闭区间（Asia/Shanghai）计算全部生效指标，
        并**按当期版本留存**结果快照（同一指标 + 版本 + 周期 + 科室唯一，重算覆盖该快照的
        数值与计算时间，不产生多行）。查询写审计 `QC_INDICATOR_COMPUTE`
        （detail 仅周期/指标数/是否带科室过滤）。

        计算规则（口径 qc-1.0.0）：
        - `value = round(numerator / denominator × 100, 2)`（`PERCENT`）或
          `round(numerator / denominator × 1000, 2)`（`PER_1000_CASES`）；
        - `denominator = 0` 时 `value = 0`、`targetMet = false`（不判达标、不做除零）；
        - `targetMet = (thresholdOperator = GTE 且 value ≥ thresholdValue) 或
          (thresholdOperator = LTE 且 value ≤ thresholdValue)`；
        - 分子/分母均由服务端从声明的数据源计算，**不接受客户端传入**；`deptId` 只收窄科室，
          不扩大数据范围（越界 403）；
        - 版本选择：按有效期取生效版本，`effective_from <= to` 且
          （`effective_to` 为空或 `effective_to >= from`）；同一 `code` 在查询周期内
          **只允许一个生效版本**，版本区间重叠 → **409**（fail-closed，先修复版本数据）；
        - 跨期指标按**当期版本**计算：指标升版本后历史结果仍保留旧版本行，不回溯重写；
          查询区间跨版本时按有效期切分为多段，同一 `code` 可返回多行（每段一个版本，
          `periodFrom`/`periodTo` 为切分后的真实统计区间）；
        - `inTargetStatistics=false` 的指标 `targetMet` 固定 `false`，不计入达标统计。
        `from`/`to` 必填、跨度（含首尾）≤ **366 天**（超过 400）；非法日期/标识 400。
      parameters:
        - name: from
          in: query
          required: true
          description: 起始本地日期（含），格式 YYYY-MM-DD，按 Asia/Shanghai 解释。
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: 结束本地日期（含）；与 from 跨度（含首尾）≤ 366 天，超过 400。
          schema:
            type: string
            format: date
        - name: deptId
          in: query
          required: false
          description: 科室标识（UUID）；只统计该科室，必须在当前用户数据范围内（越界 403）。
          schema:
            type: string
      responses:
        '200':
          description: 指标结果列表（仅聚合计数与达标状态，不含患者标识）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QcIndicatorResultList'
              example:
                from: '2031-03-01'
                to: '2031-03-31'
                timezone: Asia/Shanghai
                formula: value = round(numerator / denominator × 100, 2)；分母为 0 时 value = 0 且 targetMet = false
                items:
                  - indicatorId: '7c000000-0000-4000-8000-000000000001'
                    code: QC-SYN-STRUCT-001
                    name: 麻醉记录单完成率
                    category: STRUCTURE
                    indicatorVersion: 1.0.0
                    definition: 区间内已完成（有结束时间）的麻醉记录单台次 / 同期非取消台次 × 100%
                    unit: PERCENT
                    periodFrom: '2031-03-01'
                    periodTo: '2031-03-31'
                    deptId: null
                    numerator: 3
                    denominator: 4
                    value: 75
                    thresholdOperator: GTE
                    thresholdValue: 95
                    targetMet: false
                    computedAt: '2031-03-31T03:00:00Z'
                    provisional: true
                    inTargetStatistics: true
                  - indicatorId: '7c000000-0000-4000-8000-000000000002'
                    code: QC-SYN-PROC-002
                    name: 术前访视完成率
                    category: PROCESS
                    indicatorVersion: 1.0.0
                    definition: 区间内已完成术前访视的台次 / 同期非取消台次 × 100%
                    unit: PERCENT
                    periodFrom: '2031-03-01'
                    periodTo: '2031-03-31'
                    deptId: null
                    numerator: 4
                    denominator: 4
                    value: 100
                    thresholdOperator: GTE
                    thresholdValue: 95
                    targetMet: true
                    computedAt: '2031-03-31T03:00:00Z'
                    provisional: true
                    inTargetStatistics: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/qc/adverse-events:
    post:
      operationId: createAdverseEvent
      tags:
        - 不良事件
      summary: 登记不良事件（脱敏描述、分级、状态机起点 REPORTED）
      description: |
        权限 `m4:qc:write`。创建后事件状态为 `REPORTED`，`eventNo` 由服务端生成
        （`AE-<yyyyMMdd>-<8 位十六进制>`），`reporterName` 取当前登录账号显示名，
        请求体不接受上报人字段（防止冒名）。

        - `description` 必须是**已脱敏描述**（≤500 字），不得含患者姓名/住院号/身份证号/
          手机号/HIS 申请号等直接标识；服务端按固定规则拒绝疑似标识（400，`details.field=description`），
          不回合用户输入原文；
        - `anonymous=true` 时对外只显示"匿名上报"，**不返回**上报人姓名；内部审计仍记录
          上报人标识（可追溯性与匿名口径【待确认】，ADR-0022 Q-3）；
        - `deptId` 必须是当前用户数据范围内科室（越界 403）；`scheduleId` 可选，
          逻辑关联台次（跨模块不建外键）：台次不存在/已删除 → 422，台次属他科 → 403；
          不校验患者归属；
        - 写审计 `ADVERSE_EVENT_CREATE`（detail 仅事件号/类型/等级/科室，无描述原文）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdverseEventRequest'
            example:
              eventType: MEDICATION
              severity: LEVEL_II
              occurredAt: '2031-03-02T10:30:00+08:00'
              deptId: 'f1000000-0000-4000-8000-000000000002'
              scheduleId: null
              description: 术中诱导后出现一过性血压下降（合成事件描述，已脱敏）
              anonymous: false
      responses:
        '201':
          description: 已登记的不良事件（状态 REPORTED，无患者标识）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdverseEvent'
              example:
                id: '7d000000-0000-4000-8000-000000000001'
                eventNo: AE-20310302-1a2b3c4d
                eventType: MEDICATION
                severity: LEVEL_II
                occurredAt: '2031-03-02T10:30:00+08:00'
                deptId: 'f1000000-0000-4000-8000-000000000002'
                deptName: 麻醉科（合成）
                scheduleId: null
                description: 术中诱导后出现一过性血压下降（合成事件描述，已脱敏）
                reporterName: 演示质控专员（合成）
                anonymous: false
                status: REPORTED
                rcaId: null
                version: 1
                createdAt: '2031-03-02T03:05:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      operationId: listAdverseEvents
      tags:
        - 不良事件
      summary: 不良事件台账（按状态/日期/科室过滤，分页）
      description: |
        权限 `m4:qc:read`。按 `occurredAt` 本地日期过滤（`from`/`to` 可选，闭区间），
        按发生时间倒序、事件号倒序稳定排序；`page` 从 1 起、`size` 1–200（默认 20）。
        返回 `meta` 为全量条数与页数。列表写审计 `ADVERSE_EVENT_QUERY`
        （detail 仅过滤条件与条数，无描述原文）。
      parameters:
        - name: status
          in: query
          required: false
          description: 事件状态过滤（REPORTED/RCA/RECTIFYING/CLOSED）。
          schema:
            type: string
            enum:
              - REPORTED
              - RCA
              - RECTIFYING
              - CLOSED
        - name: from
          in: query
          required: false
          description: 发生时间起始本地日期（含），格式 YYYY-MM-DD。
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: 发生时间结束本地日期（含）；与 from 跨度（含首尾）≤ 366 天。
          schema:
            type: string
            format: date
        - name: deptId
          in: query
          required: false
          description: 科室标识（UUID）；越界 403。
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: 页码，从 1 开始。
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          description: 每页条数（1–200）。
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        '200':
          description: 不良事件台账（分页，仅聚合状态与标识，不含患者标识）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdverseEventList'
              example:
                items:
                  - id: '7d000000-0000-4000-8000-000000000001'
                    eventNo: AE-20310302-1a2b3c4d
                    eventType: MEDICATION
                    severity: LEVEL_II
                    occurredAt: '2031-03-02T10:30:00+08:00'
                    deptId: 'f1000000-0000-4000-8000-000000000002'
                    deptName: 麻醉科（合成）
                    scheduleId: null
                    description: 术中诱导后出现一过性血压下降（合成事件描述，已脱敏）
                    reporterName: 演示质控专员（合成）
                    anonymous: false
                    status: RCA
                    rcaId: '7e000000-0000-4000-8000-000000000001'
                    version: 2
                    createdAt: '2031-03-02T03:05:00Z'
                meta:
                  page: 1
                  size: 20
                  total: 1
                  totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/qc/adverse-events/{id}/rca:
    post:
      operationId: createAdverseRca
      tags:
        - 不良事件
      summary: 提交 RCA（时间线/根因/整改/责任人/期限），事件 REPORTED → RCA
      description: |
        权限 `m4:qc:write`。RCA **append-only**：提交后内容不可改删（更正只能新建事件或
        由管理员按数据修复流程处理，本期不提供修改端点）。

        - 仅 `REPORTED` 状态可提交；已有 RCA、`RCA`/`RECTIFYING`/`CLOSED` 状态提交 → **409**
          （越级/重复，不跳过状态机）；
        - `timeline` 1–20 条，按 `occurredAt` 升序由服务端稳定排序后保存；时间不得晚于当前时间；
        - `rootCause`/`correctiveAction` ≤500 字、`responsibleName` ≤64 字、`dueDate` 不早于
          事件发生本地日期（422）；
        - 提交成功后事件状态转 `RCA`；写审计 `RCA_CREATE`（detail 仅事件号/RCA 标识/时间线条数，
          不含根因与整改原文）。
      parameters:
        - name: id
          in: path
          required: true
          description: 不良事件标识（UUID）。
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdverseRcaRequest'
            example:
              timeline:
                - occurredAt: '2031-03-02T10:30:00+08:00'
                  description: 诱导后 3 分钟血压下降（合成）
                - occurredAt: '2031-03-02T10:33:00+08:00'
                  description: 加快补液并给予升压药后回升（合成）
              rootCause: 诱导期容量评估不足（合成根因）
              correctiveAction: 修订诱导期容量评估清单并纳入科内培训（合成整改）
              responsibleName: 演示责任人（合成）
              dueDate: '2031-04-15'
      responses:
        '201':
          description: 已提交的 RCA（事件状态 RCA）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdverseRca'
              example:
                id: '7e000000-0000-4000-8000-000000000001'
                eventId: '7d000000-0000-4000-8000-000000000001'
                eventNo: AE-20310302-1a2b3c4d
                timeline:
                  - occurredAt: '2031-03-02T10:30:00+08:00'
                    description: 诱导后 3 分钟血压下降（合成）
                  - occurredAt: '2031-03-02T10:33:00+08:00'
                    description: 加快补液并给予升压药后回升（合成）
                rootCause: 诱导期容量评估不足（合成根因）
                correctiveAction: 修订诱导期容量评估清单并纳入科内培训（合成整改）
                responsibleName: 演示责任人（合成）
                dueDate: '2031-04-15'
                status: OPEN
                reviewerName: null
                reviewedAt: null
                closedAt: null
                createdAt: '2031-03-03T02:00:00Z'
                eventStatus: RCA
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
