  /v1/qc/export:
    get:
      operationId: exportQcReport
      tags:
        - 上报导出
      summary: 导出质控指标/不良事件/病历抽查 CSV（脱敏、防注入、无 PHI）
      x-allow-query-conflict: true
      description: |
        权限 `m4:qc:export`。CSV 为 UTF-8 **BOM** + 首行列头 + `text/csv` 流式输出；
        参数校验与数据范围解析在写任何字节前完成，非法参数仍返回 JSON 400/403。

        - `type=indicator`：导出区间内全部指标结果（**先按 qc-1.0.0 计算并留存快照**，
          与 `GET /v1/qc/indicator-results` 同源）；列头
          `type,code,name,category,indicatorVersion,periodFrom,periodTo,deptId,deptName,
          numerator,denominator,value,unit,thresholdOperator,thresholdValue,targetMet,
          inTargetStatistics,provisional,timezone`；
        - `type=adverse`：导出区间内不良事件台账，**不输出 `description`/根因/整改等自由文本**，
          只输出事件号/类型/等级/发生时间/科室/状态/RCA 状态/责任人/期限/上报时间；列头
          `type,eventNo,eventType,severity,occurredAt,deptId,deptName,status,rcaStatus,
          responsibleName,dueDate,reviewerName,closedAt,anonymous,timezone`；
        - `type=review`：导出区间内病历抽查，**不输出缺陷描述原文**，只输出抽查号/时间/科室/
          总分/满分/等级/缺陷数/状态/整改进度/期限；列头
          `type,reviewNo,reviewedAt,deptId,deptName,totalScore,maxScore,grade,defectCount,status,
          rectificationStatus,responsibleName,dueDate,closedAt,timezone`；
        - 防公式注入：见本契约 info 第 6 条；脱敏：只含科室/工号姓名/聚合值，**不含**患者姓名、
          住院号、院内患者号、身份证号、手机号、术前诊断、HIS 申请号；
        - 上报国家/省级平台（I-10）的**字段映射与文件格式【待确认】**：本期 CSV 为 **EXT 占位模板**，
          不直连外部平台、不写外部系统；导出写审计 `QC_EXPORT`（detail 仅类型/日期/数据行数）。
        - 行数上限 **50000**：服务端以 `LIMIT 50000+1` 探测，超限 **不截断**，返回 **422**；
          失败审计仍写 `QC_EXPORT`（result=0，detail 含真实 `dataRows` 与 `truncated=true`）。
        `from`/`to` 必填、跨度（含首尾）≤ 366 天（超过 400）；`format` 当前仅 `csv`。
      parameters:
        - name: type
          in: query
          required: true
          description: 导出类型：`indicator`（指标结果）/`adverse`（不良事件）/`review`（病历抽查）。
          schema:
            type: string
            enum:
              - indicator
              - adverse
              - review
        - name: format
          in: query
          required: true
          description: 导出格式；当前仅支持 csv（UTF-8 BOM）。
          schema:
            type: string
            enum:
              - csv
        - name: from
          in: query
          required: true
          description: 起始本地日期（含），格式 YYYY-MM-DD。
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: 结束本地日期（含）；与 from 跨度（含首尾）≤ 366 天，超过 400。
          schema:
            type: string
            format: date
        - name: deptId
          in: query
          required: false
          description: 科室标识（UUID）；仅导出该科室，越界 403。
          schema:
            type: string
      responses:
        '200':
          description: 脱敏 CSV 文件（UTF-8 BOM），仅标识/聚合值/状态，无患者标识与自由文本原文。
          headers:
            Content-Disposition:
              description: 附件文件名，形如 attachment; filename="qc-indicator-2031-03-01-2031-03-31.csv"。
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
              example: |
                type,code,name,category,indicatorVersion,periodFrom,periodTo,deptId,deptName,numerator,denominator,value,unit,thresholdOperator,thresholdValue,targetMet,inTargetStatistics,provisional,timezone
                qc-indicator,QC-SYN-STRUCT-001,麻醉记录单完成率,STRUCTURE,1.0.0,2031-03-01,2031-03-31,,,3,4,75.00,PERCENT,GTE,95,false,true,true,Asia/Shanghai
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 统一 OAuth2/JWT 访问令牌，放在 Authorization 请求头中（Bearer 方案）。
  responses:
    BadRequest:
      description: 请求参数校验失败（必填缺失、日期格式非法、跨度 > 366 天、枚举/评分项/分值越界、描述含疑似患者标识、导出类型或格式非法）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: PARAM_INVALID
            message: 请求参数校验失败
            traceId: SYNTH-TRACE-1001
            details:
              - field: items
                reason: 评分项 itemCode 不得重复
    Unauthorized:
      description: 未认证或令牌已失效（fail-closed）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: AUTH_UNAUTHORIZED
            message: 未认证或令牌已失效
            traceId: SYNTH-TRACE-1002
            details: []
    Forbidden:
      description: 已认证但缺权限（m4:qc:read|write|review|export）或数据范围不足（无可用范围/科室越界）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: AUTH_FORBIDDEN
            message: 无权访问该资源或数据范围不足
            traceId: SYNTH-TRACE-1003
            details:
              - field: dataScope
                reason: 质控仅按科室或全院数据范围开放
    NotFound:
      description: 资源不存在或不可见（不良事件/RCA/抽查/整改；不泄露其他科室数据的存在性）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RESOURCE_NOT_FOUND
            message: 资源不存在或不可见
            traceId: SYNTH-TRACE-1004
            details: []
    Conflict:
      description: 状态机/唯一性/版本冲突（不良事件/RCA 越级或重复闭环、整改进度不符、重复提交、并发版本冲突、指标版本有效期重叠）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: STATE_CONFLICT
            message: 状态或版本冲突，操作未生效
            traceId: SYNTH-TRACE-1005
            details:
              - field: status
                reason: 不良事件当前状态不允许提交 RCA
    UnprocessableEntity:
      description: 业务规则拒绝（复核人非独立、整改完成未确认、期限早于事件/抽查日期、科室不可用、关联台次/记录单不存在、导出超过行数上限）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: BUSINESS_RULE_VIOLATION
            message: 业务规则拒绝，操作未生效
            traceId: SYNTH-TRACE-1006
            details:
              - field: reviewerName
                reason: 复核人不得为上报人或责任人
  schemas:
    PageMeta:
      type: object
      description: 分页元数据；`total` 为全量条数。
      required:
        - page
        - size
        - total
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
          description: 当前页码。
        size:
          type: integer
          minimum: 1
          description: 每页条数。
        total:
          type: integer
          minimum: 0
          description: 全量条数。
        totalPages:
          type: integer
          minimum: 0
          description: 总页数 = ceil(total / size)；空数据为 0。
    QcIndicator:
      type: object
      description: 质控指标定义（按 code + version 版本化；provisional=true 为合成参考口径【待确认】）。
      required:
        - id
        - code
        - name
        - category
        - definition
        - dataSource
        - numeratorLabel
        - denominatorLabel
        - unit
        - thresholdOperator
        - thresholdValue
        - version
        - effectiveFrom
        - status
        - provisional
        - inTargetStatistics
      properties:
        id:
          type: string
          description: 指标标识（UUID）。
        code:
          type: string
          description: 指标编码（院内唯一，如 QC-SYN-STRUCT-001）。
        name:
          type: string
          description: 指标名称（中文）。
        category:
          type: string
          description: 类别：STRUCTURE=结构、PROCESS=过程、OUTCOME=结果。
          enum:
            - STRUCTURE
            - PROCESS
            - OUTCOME
        definition:
          type: string
          description: 口径说明（分子/分母定义，可追溯）。
        dataSource:
          type: string
          description: 数据来源声明（M3 记录单/时间轴、M4 药品/耗材、M2 排程、本域数据）。
        numeratorLabel:
          type: string
          description: 分子含义。
        denominatorLabel:
          type: string
          description: 分母含义。
        unit:
          type: string
          description: 单位：PERCENT=百分比、PER_1000_CASES=每千台次。
          enum:
            - PERCENT
            - PER_1000_CASES
        thresholdOperator:
          type: string
          description: 达标判定：GTE=值 ≥ 阈值为达标、LTE=值 ≤ 阈值为达标。
          enum:
            - GTE
            - LTE
        thresholdValue:
          type: number
          description: 阈值（与 unit 同单位）。
        version:
          type: string
          description: 口径版本（语义变更必须升版本）。
        effectiveFrom:
          type: string
          format: date
          description: 生效起始本地日期（含）。
        effectiveTo:
          type: string
          format: date
          nullable: true
          description: 生效结束本地日期（含）；null 表示长期有效。
        status:
          type: string
          description: 状态：ACTIVE=生效、RETIRED=停用（停用后不再参与计算，历史结果保留）。
          enum:
            - ACTIVE
            - RETIRED
        provisional:
          type: boolean
          description: 是否为合成参考指标（口径/阈值待院方确认，ADR-0022）。
        inTargetStatistics:
          type: boolean
          description: 是否计入达标统计；false 时 targetMet 固定 false（结构合规口径，Q-1 确认前）。
    QcIndicatorList:
      type: object
      description: 指标定义列表（按类别、编码稳定排序）。
      required:
        - items
      properties:
        items:
          type: array
          description: 生效指标定义（空数据为空数组）。
          items:
            $ref: '#/components/schemas/QcIndicator'
    QcIndicatorResult:
      type: object
      description: 单个指标在周期内的结果快照（分子/分母/值/达标；不含患者标识）。
      required:
        - indicatorId
        - code
        - name
        - category
        - indicatorVersion
        - definition
        - unit
        - periodFrom
        - periodTo
        - numerator
        - denominator
        - value
        - thresholdOperator
        - thresholdValue
        - targetMet
        - computedAt
        - provisional
        - inTargetStatistics
      properties:
        indicatorId:
          type: string
          description: 指标标识（UUID）。
        code:
          type: string
          description: 指标编码。
        name:
          type: string
          description: 指标名称。
        category:
          type: string
          description: 类别（STRUCTURE/PROCESS/OUTCOME）。
          enum:
            - STRUCTURE
            - PROCESS
            - OUTCOME
        indicatorVersion:
          type: string
          description: 计算所用口径版本（跨期按当期版本）。
        definition:
          type: string
          description: 口径说明。
        unit:
          type: string
          description: 单位（PERCENT/PER_1000_CASES）。
          enum:
            - PERCENT
            - PER_1000_CASES
        periodFrom:
          type: string
          format: date
          description: 周期起始本地日期（含）。
        periodTo:
          type: string
          format: date
          description: 周期结束本地日期（含）。
        deptId:
          type: string
          nullable: true
          description: 科室标识；null 表示全院口径。
        numerator:
          type: integer
          minimum: 0
          description: 分子（整数计数）。
        denominator:
          type: integer
          minimum: 0
          description: 分母（整数计数）；0 表示无基数（不判达标）。
        value:
          type: number
          description: 指标值（按 unit 换算，保留 2 位小数）；分母为 0 时为 0。
        thresholdOperator:
          type: string
          description: 达标判定方向（GTE/LTE）。
          enum:
            - GTE
            - LTE
        thresholdValue:
          type: number
          description: 阈值。
        targetMet:
          type: boolean
          description: 是否达标（分母为 0 或 inTargetStatistics=false 时固定 false）。
        computedAt:
          type: string
          format: date-time
          description: 计算时间（服务端 UTC）。
        provisional:
          type: boolean
          description: 是否为合成参考指标（口径/阈值待确认）。
        inTargetStatistics:
          type: boolean
          description: 是否计入达标统计；false 时 targetMet 固定 false，不计入达标率。
    QcIndicatorResultList:
      type: object
      description: 周期指标结果列表。
      required:
        - from
        - to
        - timezone
        - formula
        - items
      properties:
        from:
          type: string
          format: date
          description: 周期起始本地日期（含）。
        to:
          type: string
          format: date
          description: 周期结束本地日期（含）。
        timezone:
          type: string
          description: 统计时区，固定 Asia/Shanghai。
        formula:
          type: string
          description: 指标值换算口径说明（可追溯）。
        items:
          type: array
          description: 指标结果（按类别、编码稳定排序；空数据为空数组）。
          items:
            $ref: '#/components/schemas/QcIndicatorResult'
    AdverseEvent:
      type: object
      description: 不良事件（主体 append-only；状态机 REPORTED→RCA→RECTIFYING→CLOSED）。
      required:
        - id
        - eventNo
        - eventType
        - severity
        - occurredAt
        - deptId
        - description
        - reporterName
        - anonymous
        - status
        - version
        - createdAt
      properties:
        id:
          type: string
          description: 事件标识（UUID）。
        eventNo:
          type: string
          description: 事件号（AE-<yyyyMMdd>-<8 位十六进制>，服务端生成）。
        eventType:
          type: string
          description: 事件类型（麻醉相关不良事件类型；院内字典【待确认】）。
          enum:
            - RESPIRATORY
            - CIRCULATORY
            - MEDICATION
            - TRANSFUSION
            - EQUIPMENT
            - NERVE_INJURY
            - AWARENESS
            - FALL
            - OTHER
        severity:
          type: string
          description: 事件分级（I 级最重；分级定义与映射【待确认】）。
          enum:
            - LEVEL_I
            - LEVEL_II
            - LEVEL_III
            - LEVEL_IV
        occurredAt:
          type: string
          format: date-time
          description: 发生时间（RFC 3339，含时区）。
        deptId:
          type: string
          description: 科室标识。
        deptName:
          type: string
          nullable: true
          description: 科室名称（组织主数据；不含患者信息）。
        scheduleId:
          type: string
          nullable: true
          description: 关联台次标识（逻辑关联，跨模块不建外键）。
        description:
          type: string
          description: 已脱敏事件描述（≤500 字；导出不输出）。
        reporterName:
          type: string
          description: 上报人显示名；`anonymous=true` 时为“匿名上报”。
        anonymous:
          type: boolean
          description: 是否匿名上报（匿名时对外不返回上报人姓名）。
        status:
          type: string
          description: 状态：REPORTED=已上报、RCA=根因分析中、RECTIFYING=整改中、CLOSED=已闭环。
          enum:
            - REPORTED
            - RCA
            - RECTIFYING
            - CLOSED
        rcaId:
          type: string
          nullable: true
          description: 当前 RCA 标识；无 RCA 时为 null。
        version:
          type: integer
          minimum: 1
          description: 状态机版本号（每次状态前移递增）。
        createdAt:
          type: string
          format: date-time
          description: 登记时间（服务端 UTC）。
    AdverseEventList:
      type: object
      description: 不良事件台账（分页）。
      required:
        - items
        - meta
      properties:
        items:
          type: array
          description: 当前页事件（发生时间倒序、事件号倒序）。
          items:
            $ref: '#/components/schemas/AdverseEvent'
        meta:
          $ref: '#/components/schemas/PageMeta'
    CreateAdverseEventRequest:
      type: object
      description: 不良事件登记请求（不含上报人与患者标识；描述必须已脱敏）。
      required:
        - eventType
        - severity
        - occurredAt
        - deptId
        - description
      properties:
        eventType:
          type: string
          description: 事件类型。
          enum:
            - RESPIRATORY
            - CIRCULATORY
            - MEDICATION
            - TRANSFUSION
            - EQUIPMENT
            - NERVE_INJURY
            - AWARENESS
            - FALL
            - OTHER
        severity:
          type: string
          description: 事件分级。
          enum:
            - LEVEL_I
            - LEVEL_II
            - LEVEL_III
            - LEVEL_IV
        occurredAt:
          type: string
          format: date-time
          description: 发生时间（RFC 3339，含时区；不得晚于当前时间）。
        deptId:
          type: string
          description: 科室标识（UUID，须在数据范围内）。
        scheduleId:
          type: string
          nullable: true
          description: 关联台次标识（可选，逻辑关联）。
        description:
          type: string
          maxLength: 500
          description: 已脱敏事件描述（≤500 字；不得含患者直接标识）。
        anonymous:
          type: boolean
          default: false
          description: 是否匿名上报（默认 false）。
    AdverseRca:
      type: object
      description: RCA 记录（append-only；复核与闭环字段一次性写入）。
      required:
        - id
        - eventId
        - eventNo
        - timeline
        - rootCause
        - correctiveAction
        - responsibleName
        - dueDate
        - status
        - createdAt
        - eventStatus
      properties:
        id:
          type: string
          description: RCA 标识（UUID）。
        eventId:
          type: string
          description: 关联不良事件标识。
        eventNo:
          type: string
          description: 关联事件号。
        timeline:
          type: array
          description: 事件时间线（按发生时间升序，1–20 条）。
          items:
            $ref: '#/components/schemas/RcaTimelineItem'
        rootCause:
          type: string
          description: 根因分析（≤500 字；导出不输出）。
        correctiveAction:
          type: string
          description: 整改措施（≤500 字；导出不输出）。
        responsibleName:
          type: string
          description: 整改责任人显示名（≤64 字）。
        dueDate:
          type: string
          format: date
          description: 整改期限（本地日期，不早于事件发生日）。
        status:
          type: string
          description: RCA 状态：OPEN=未闭环、CLOSED=已闭环。
          enum:
            - OPEN
            - CLOSED
        reviewerName:
          type: string
          nullable: true
          description: 复核人显示名（阶段 1 写入后不可改）。
        reviewedAt:
          type: string
          format: date-time
          nullable: true
          description: 复核时间（阶段 1）。
        closedAt:
          type: string
          format: date-time
          nullable: true
          description: 闭环时间（阶段 2）。
        createdAt:
          type: string
          format: date-time
          description: RCA 提交时间。
        eventStatus:
          type: string
          description: 关联事件当前状态。
          enum:
            - REPORTED
            - RCA
            - RECTIFYING
            - CLOSED
    RcaTimelineItem:
      type: object
      description: RCA 时间线条目（只含时间与脱敏描述）。
      required:
        - occurredAt
        - description
      properties:
        occurredAt:
          type: string
          format: date-time
          description: 该节点时间（含时区，不晚于当前时间）。
        description:
          type: string
          maxLength: 200
          description: 该节点脱敏描述（≤200 字，不含患者标识）。
    CreateAdverseRcaRequest:
      type: object
      description: RCA 提交请求（时间线/根因/整改/责任人/期限）。
      required:
        - timeline
        - rootCause
        - correctiveAction
        - responsibleName
        - dueDate
      properties:
        timeline:
          type: array
          minItems: 1
          maxItems: 20
          description: 事件时间线（服务端按发生时间升序稳定排序）。
          items:
            $ref: '#/components/schemas/RcaTimelineItem'
        rootCause:
          type: string
          maxLength: 500
          description: 根因分析（≤500 字）。
        correctiveAction:
          type: string
          maxLength: 500
          description: 整改措施（≤500 字）。
        responsibleName:
          type: string
          maxLength: 64
          description: 整改责任人显示名（≤64 字）。
        dueDate:
          type: string
          format: date
          description: 整改期限（本地日期，不早于事件发生日）。
    CloseAdverseRcaRequest:
      type: object
      description: RCA 复核/闭环请求（分阶段；复核人须独立）。
      required:
        - reviewerName
        - conclusion
      properties:
        reviewerName:
          type: string
          maxLength: 64
          description: 复核人显示名（不得为上报人或责任人）。
        conclusion:
          type: string
          maxLength: 300
          description: 复核/闭环结论（≤300 字；导出不输出）。
        rectificationCompleted:
          type: boolean
          default: false
          description: 是否确认整改完成（阶段 2 必须为 true；阶段 1 必须缺省或 false）。
    ChartReview:
      type: object
      description: 病历质量抽查（评分项 1–12；总分/等级/缺陷由服务端计算）。
      required:
        - id
        - reviewNo
        - deptId
        - reviewerName
        - reviewedAt
        - items
        - totalScore
        - maxScore
        - grade
        - defectCount
        - status
        - createdAt
      properties:
        id:
          type: string
          description: 抽查标识（UUID）。
        reviewNo:
          type: string
          description: 抽查号（CR-<yyyyMMdd>-<8 位十六进制>，服务端生成）。
        scheduleId:
          type: string
          nullable: true
          description: 关联台次标识（逻辑关联）。
        recordId:
          type: string
          nullable: true
          description: 关联麻醉记录单标识（逻辑关联）。
        rectificationId:
          type: string
          nullable: true
          description: 当前整改标识；未提交整改时为 null（供前端直接闭环，避免二次查询）。
        deptId:
          type: string
          description: 科室标识。
        deptName:
          type: string
          nullable: true
          description: 科室名称（组织主数据）。
        reviewerName:
          type: string
          description: 抽查人显示名（取当前登录账号）。
        reviewedAt:
          type: string
          format: date-time
          description: 抽查时间。
        items:
          type: array
          description: 评分项明细（按白名单顺序、去重后 1–12 项）。
          items:
            $ref: '#/components/schemas/ChartReviewItem'
        totalScore:
          type: integer
          minimum: 0
          description: 总分（Σ score，服务端计算）。
        maxScore:
          type: integer
          minimum: 1
          description: 满分（Σ maxScore，服务端计算）。
        grade:
          type: string
          description: 等级：A ≥95%、B ≥90%、C ≥80%、D <80%（合格线 90%【待确认】）。
          enum:
            - A
            - B
            - C
            - D
        defectCount:
          type: integer
          minimum: 0
          description: 缺陷项数（score < maxScore 的项数）。
        status:
          type: string
          description: 状态：OPEN=待整改、RECTIFYING=整改中、CLOSED=已闭环。
          enum:
            - OPEN
            - RECTIFYING
            - CLOSED
        createdAt:
          type: string
          format: date-time
          description: 创建时间。
    ChartReviewItem:
      type: object
      description: 抽查评分项。
      required:
        - itemCode
        - itemName
        - score
        - maxScore
      properties:
        itemCode:
          type: string
          description: 评分项编码：COMPLETENESS=完整性、TIMELINESS=时效性、SIGNATURE=签名、CONSISTENCY=逻辑一致性。
          enum:
            - COMPLETENESS
            - TIMELINESS
            - SIGNATURE
            - CONSISTENCY
        itemName:
          type: string
          description: 评分项名称（中文；缺省由服务端按编码补全）。
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: 得分（≤ maxScore）。
        maxScore:
          type: integer
          minimum: 1
          maximum: 100
          description: 满分。
        defectNote:
          type: string
          nullable: true
          maxLength: 200
          description: 缺陷说明（得分 < 满分时必填，已脱敏，≤200 字）。
    ChartReviewList:
      type: object
      description: 病历抽查列表（分页）。
      required:
        - items
        - meta
      properties:
        items:
          type: array
          description: 当前页抽查（抽查时间倒序、抽查号倒序）。
          items:
            $ref: '#/components/schemas/ChartReview'
        meta:
          $ref: '#/components/schemas/PageMeta'
    CreateChartReviewRequest:
      type: object
      description: 创建病历抽查请求（总分由服务端计算，不接受客户端传总分）。
      required:
        - deptId
        - reviewedAt
        - items
      properties:
        scheduleId:
          type: string
          nullable: true
          description: 关联台次标识（可选）。
        recordId:
          type: string
          nullable: true
          description: 关联麻醉记录单标识（可选）。
        deptId:
          type: string
          description: 科室标识（UUID，须在数据范围内）。
        reviewedAt:
          type: string
          format: date-time
          description: 抽查时间（不得晚于当前时间）。
        items:
          type: array
          minItems: 1
          maxItems: 12
          description: 评分项（itemCode 不得重复）。
          items:
            $ref: '#/components/schemas/ChartReviewItem'
    Rectification:
      type: object
      description: 整改变更记录（append-only 内容；复核与闭环字段一次性写入）。
      required:
        - id
        - reviewId
        - reviewNo
        - correctiveAction
        - responsibleName
        - dueDate
        - status
        - createdAt
        - reviewStatus
      properties:
        id:
          type: string
          description: 整改标识（UUID）。
        reviewId:
          type: string
          description: 关联抽查标识。
        reviewNo:
          type: string
          description: 关联抽查号。
        correctiveAction:
          type: string
          description: 整改措施（≤500 字；导出不输出）。
        responsibleName:
          type: string
          description: 整改责任人显示名（≤64 字）。
        dueDate:
          type: string
          format: date
          description: 整改期限（本地日期，不早于抽查日）。
        status:
          type: string
          description: 整改状态：OPEN=未闭环、CLOSED=已闭环。
          enum:
            - OPEN
            - CLOSED
        reviewerName:
          type: string
          nullable: true
          description: 复核人显示名。
        reviewedAt:
          type: string
          format: date-time
          nullable: true
          description: 复核时间。
        closedAt:
          type: string
          format: date-time
          nullable: true
          description: 闭环时间。
        createdAt:
          type: string
          format: date-time
          description: 提交时间。
        reviewStatus:
          type: string
          description: 关联抽查当前状态。
          enum:
            - OPEN
            - RECTIFYING
            - CLOSED
    CreateRectificationRequest:
      type: object
      description: 提交整改请求（针对抽查缺陷项）。
      required:
        - correctiveAction
        - responsibleName
        - dueDate
      properties:
        correctiveAction:
          type: string
          maxLength: 500
          description: 整改措施（≤500 字）。
        responsibleName:
          type: string
          maxLength: 64
          description: 整改责任人显示名（≤64 字）。
        dueDate:
          type: string
          format: date
          description: 整改期限（本地日期，不早于抽查日）。
    CloseRectificationRequest:
      type: object
      description: 整改闭环请求（需独立复核人）。
      required:
        - reviewerName
        - conclusion
      properties:
        reviewerName:
          type: string
          maxLength: 64
          description: 复核人显示名（不得为整改责任人）。
        conclusion:
          type: string
          maxLength: 300
          description: 闭环结论（≤300 字；导出不输出）。
    ErrorDetail:
      type: object
      description: 字段级或范围级错误明细；不含用户输入原文与患者标识。
      required:
        - field
        - reason
      properties:
        field:
          type: string
          description: 出错字段名（查询参数名或固定语义字段）。
        reason:
          type: string
          description: 固定安全中文说明。
    Error:
      type: object
      description: 统一错误响应；不暴露堆栈、SQL 实参与患者标识。
      required:
        - code
        - message
        - traceId
        - details
      properties:
        code:
          type: string
          description: 稳定错误码，供前端分支与告警规则使用。
        message:
          type: string
          description: 面向用户的中文提示，可安全展示。
        traceId:
          type: string
          description: 链路追踪标识，与日志、审计记录关联。
        details:
          type: array
          description: 字段级或范围级错误明细；无明细时为空数组。
          items:
            $ref: '#/components/schemas/ErrorDetail'
