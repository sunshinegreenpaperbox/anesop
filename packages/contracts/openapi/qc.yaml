  /v1/qc/rectify/{id}/close:
    post:
      operationId: closeChartRectification
      tags:
        - 病历质量抽查
      summary: 整改闭环（需复核人，抽查 → CLOSED）
      description: |
        权限 `m4:qc:review`。整改复核通过后整改 → `CLOSED`，抽查 → `CLOSED`。

        - 仅整改 `OPEN` 且抽查 `RECTIFYING` 可闭环；已闭环/状态不符 → **409**；
        - `reviewerName` 不得为整改责任人（独立复核）→ 否则 **422**；
        - 闭环写审计 `RECTIFICATION_CLOSE` 与 `CHART_REVIEW_STATUS`（detail 仅抽查号/整改标识/
          状态，不含结论原文）。
      parameters:
        - name: id
