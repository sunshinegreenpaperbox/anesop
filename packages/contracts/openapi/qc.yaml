  /v1/qc/rca/{id}/close:
    post:
      operationId: closeAdverseRca
      tags:
        - 不良事件
      summary: RCA 复核 / 整改闭环（分阶段，需复核人，事件逐级前进）
      description: |
        权限 `m4:qc:review`。本端点是**分阶段闭环**：同一 RCA 调用两次，每次推进一级状态，
        保证 `REPORTED→RCA→RECTIFYING→CLOSED` 全程留痕、不可越级。

        - 阶段 1（事件 `RCA`、RCA 未复核）：记录复核人/复核结论，事件 → `RECTIFYING`，
          RCA 仍为 `OPEN`（整改执行期）；请求 `rectificationCompleted` 必须缺省或 `false`；
        - 阶段 2（事件 `RECTIFYING`、RCA 已复核未闭环）：确认整改完成（`rectificationCompleted=true`），
          记录闭环时间，事件 → `CLOSED`，RCA → `CLOSED`；
        - 越级/重复（事件 `REPORTED` 直接闭环、已 `CLOSED` 再次闭环、阶段 2 未确认整改完成
          或阶段 1 提前声明完成）→ **409**（`details.field=rectificationCompleted` 或
          `details.field=status`）；`reviewerName` 与上报人/责任人相同 → **422**（独立复核）；
        - 复核/闭环均写审计 `RCA_REVIEW`/`RCA_CLOSE` 与 `ADVERSE_EVENT_STATUS`
          （detail 仅事件号/阶段/状态，不含结论原文）。
      parameters:
        - name: id
          in: path
          required: true
          description: RCA 标识（UUID）。
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseAdverseRcaRequest'
            example:
              reviewerName: 演示复核人（合成）
              conclusion: 根因与整改措施认可，进入整改执行（合成结论）
              rectificationCompleted: false
      responses:
        '200':
          description: 复核/闭环后的 RCA（含事件当前状态）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdverseRca'
              example:
                id: '7e000000-0000-4000-8000-000000000001'
                eventId: '7d000000-0000-4000-8000-000000000001'
                eventNo: AE-20310302-1a2b3c4d
                timeline:
                  - occurredAt: '2031-03-02T10:30:00+08:00'
                    description: 诱导后 3 分钟血压下降（合成）
                rootCause: 诱导期容量评估不足（合成根因）
                correctiveAction: 修订诱导期容量评估清单并纳入科内培训（合成整改）
                responsibleName: 演示责任人（合成）
                dueDate: '2031-04-15'
                status: OPEN
                reviewerName: 演示复核人（合成）
                reviewedAt: '2031-03-05T03:00:00Z'
                closedAt: null
                createdAt: '2031-03-03T02:00:00Z'
                eventStatus: RECTIFYING
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/qc/chart-reviews:
    post:
      operationId: createChartReview
      tags:
        - 病历质量抽查
      summary: 创建病历质量抽查（评分表 + 缺陷项，服务端算总分与合格）
      description: |
        权限 `m4:qc:write`。评分项白名单 `COMPLETENESS`（完整性）/`TIMELINESS`（时效性）/
        `SIGNATURE`（签名）/`CONSISTENCY`（逻辑一致性），1–12 项且同一 `itemCode` 不得重复
        （400）；每项 `0 ≤ score ≤ maxScore ≤ 100`，`maxScore ≥ 1`（400）。

        - `totalScore = Σ score`、`maxScore = Σ maxScore` 由服务端计算，**不接受**客户端传总分；
          `totalScore / maxScore ≥ 90%` 为合格（`grade`：A ≥95%、B ≥90%、C ≥80%、D <80%，
          合格线【待确认】）；
        - `defects[]` 由服务端按 `score < maxScore` 派生，`defectNote` 为脱敏缺陷描述；
          存在缺陷项时后续整改必须逐项覆盖（整改端点校验）；
        - `scheduleId`/`recordId` 可选，逻辑关联台次与记录单（跨模块不建外键）：
          目标不存在/已删除 → 422，目标属他科 → 403；不校验患者归属；
          `reviewNo` 由服务端生成（`CR-<yyyyMMdd>-<8 位十六进制>`）；
        - 写审计 `CHART_REVIEW_CREATE`（detail 仅抽查号/总分的整数部分/缺陷数/科室，
          不含缺陷描述原文）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChartReviewRequest'
            example:
              scheduleId: null
              recordId: null
              deptId: 'f1000000-0000-4000-8000-000000000002'
              reviewedAt: '2031-03-06T09:00:00+08:00'
              items:
                - itemCode: COMPLETENESS
                  itemName: 完整性
                  score: 28
                  maxScore: 30
                  defectNote: 缺术后随访记录（合成）
                - itemCode: TIMELINESS
                  itemName: 时效性
                  score: 25
                  maxScore: 25
                - itemCode: SIGNATURE
                  itemName: 签名
                  score: 20
                  maxScore: 20
                - itemCode: CONSISTENCY
                  itemName: 逻辑一致性
                  score: 15
                  maxScore: 25
                  defectNote: 出入量与麻醉记录不一致（合成）
      responses:
        '201':
          description: 已创建的抽查记录（含总分、等级、缺陷项与状态 OPEN）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartReview'
              example:
                id: '7f000000-0000-4000-8000-000000000001'
                reviewNo: CR-20310306-5e6f7a8b
                scheduleId: null
                recordId: null
                deptId: 'f1000000-0000-4000-8000-000000000002'
                deptName: 麻醉科（合成）
                reviewerName: 演示质控专员（合成）
                reviewedAt: '2031-03-06T09:00:00+08:00'
                items:
                  - itemCode: COMPLETENESS
                    itemName: 完整性
                    score: 28
                    maxScore: 30
                    defectNote: 缺术后随访记录（合成）
                  - itemCode: TIMELINESS
                    itemName: 时效性
                    score: 25
                    maxScore: 25
                    defectNote: null
                  - itemCode: SIGNATURE
                    itemName: 签名
                    score: 20
                    maxScore: 20
                    defectNote: null
                  - itemCode: CONSISTENCY
                    itemName: 逻辑一致性
                    score: 15
                    maxScore: 25
                    defectNote: 出入量与麻醉记录不一致（合成）
                totalScore: 88
                maxScore: 100
                grade: C
                defectCount: 2
                status: OPEN
                createdAt: '2031-03-06T01:10:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
