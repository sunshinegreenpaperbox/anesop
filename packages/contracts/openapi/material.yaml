openapi: 3.1.0
info:
  title: ANESOP 耗材主数据、出入库、UDI 追溯与 SPD 适配器契约（material）
  summary: 耗材主数据、批次库存、出入库、UDI 一物一码追溯、SPD 适配器状态与模拟同步
  description: |
    ANESOP 耗材域契约，对应方案书 §2.5（药品与耗材管理）、§3.4（领域模型）、
    §3.9.2（RBAC 与数据权限）、§3.9.3（脱敏）与 E-M14。契约版本 0.1.0 为首个版本（additive）。
    硬规则：
    1) 耗材目录为全院可读主数据（`m4:material:read`）；维护（创建/更新/启停）需要
       `m4:material:write`。编码、名称按 trim + 忽略大小写院内唯一；UDI-DI 非空时也唯一
       （同一 DI 只能对应一个院内耗材，否则一物一码无法定位主数据）——冲突 409。
       编码创建后不可改；更新必须回传 version，过期 409（乐观锁）。启用/停用走
       `PATCH /v1/materials/{materialId}/status`（ACTIVE/INACTIVE）；存在 UDI 实例或库存 > 0
       时修改/清空 UDI-DI → 409。
    2) 出入库需要 `m4:material:write`，按科室数据范围（ALL/SITE/DEPT）隔离；SELF/ROOM
       不适用于仓库管理（fail-closed 403）。`stock_movement` 为 **append-only** 流水，
       更正只能通过反向 ADJUST 并填写原因，历史不得改写。
       数量不足（OUT/RETURN/负向 ADJUST 超过批次库存）→ 409，`details[]` 给出可用量与
       请求量；批次不符（同一 material + 批次 + 科室的效期与已登记批次不一致）→ 409；
       过期批次 OUT → 422；效期已过或必填效期缺失 → 422；ADJUST 缺少原因 → 400。
       RETURN 语义为**退回供应商或中心库**（库存减少、UDI 标记 RETURNED，单向终态）；
       RETURN 携带 udi 时以 UDI 实例的批次/效期扣减，请求批次/效期与实例不一致 → 422。
       院内退库（退回二级库后不再使用/复库再用）登记口径【待确认】，见 ADR-0020 Q-6。
    3) 高值耗材（highValue=true）**一物一码**：入库只能逐件 `POST /udi-instances` 登记
       （创建 UDI 实例 + 批次库存 +1 + IN 流水，三者同事务）；使用只能
       `POST /udi-instances/{udi}/use`（绑定 recordId 与台次，状态 IN_STOCK→USED，
       库存 −1 并写出库流水）。禁止对高值耗材使用裸数量的 IN/OUT/ADJUST（422），
       避免绕过追溯链。重复登记同一 UDI-DI + UDI-PI → 409；重复使用非 IN_STOCK 实例 → 409。
       UDI 实例绑定记录时校验记录存在且对调用者可见（不存在/不可见 422，不泄露存在性），
       `scheduleId` 与记录所属台次不一致 → 422。
    4) UDI 编码口径：本契约内部规范编码 `udi = udiDi + "^" + udiPi`（路径参数需 URL 编码，
       `^` → `%5E`）。GS1/HIBCC 的 DI/PI 解析、分隔符与校验位规则 **【待确认】**（见
       ADR-0020），本期只做字符串唯一与长度校验，不解析 DI 内部结构、不校验证书与 GUDID。
    5) SPD 适配器属 EXT-03（外部适配器，当前 **SIMULATED**）：不直连 SPD/SPD 供应链系统，
       同步为模拟操作；失败时降级为“本地耗材库存继续可用 + 状态可见 + 日志留痕”，
       不阻塞临床记录与本地出入库。状态查询与库存同为科室数据范围（SELF/ROOM 403）。
    6) 脱敏：出入库只保存 **操作人标识与姓名摘要**（≤64）、来源/去向文本（≤100）与原因
       （≤200），不保存患者姓名/院内患者号/身份证号/手机号；UDI 追溯只回传 recordId 与
       scheduleId，不回传患者信息与临床自由文本。审计与日志不含 UDI 原文全串（只记 UDI-DI
       与状态摘要）。
    7) **0.2.0 新增（M8-M4-02，additive）库存预警**：`material.low_stock_threshold`
       numeric(12,2) 可空（**可空 = 不按阈值预警**；零库存与临期预警仍然生效）；
       `GET /v1/materials/stock-alerts` 返回 材料 × 科室 粒度的预警（低于阈值 / 零库存 /
       临期 90 天，含建议补货量）；阈值维护走 `PUT /v1/materials/{materialId}/low-stock-threshold`
       （乐观锁 version，审计 `MATERIAL_THRESHOLD_UPDATE`）。阈值来源、按科室粒度与临期
       天数均为 **【待确认】**（本期不内置默认阈值、不开放临期天数配置）。
       预警只按科室数据范围（ALL/SITE/DEPT）生效，SELF/ROOM fail-closed 403。
    所有示例均为 SYNTHETIC 合成数据。
  version: 0.2.0
  contact:
    name: ANESOP 项目组
  license:
    name: 内部交付（非开源）
servers:
  - url: https://anesop.local/api
    description: 院内单院部署统一入口（生产网无互联网出口）
security:
  - bearerAuth: []
tags:
  - name: 耗材目录
    description: 耗材主数据（编码/名称/规格/单位/UDI-DI/高值/效期管理）维护与检索。
  - name: 出入库
    description: 批次库存、出入库流水（IN/OUT/RETURN/ADJUST）与数量/效期/批次校验。
  - name: UDI 追溯
    description: UDI 实例一物一码登记、使用绑定记录/台次、material→UDI→record 追溯链。
  - name: SPD 适配器
    description: SPD 供应链适配器（EXT-03）状态与模拟同步，失败降级并留痕。
  - name: 库存预警
    description: 耗材库存预警（低阈值/零库存/临期 90 天）与阈值维护，按科室数据范围隔离。
paths:
  /v1/materials:
    get:
      operationId: listMaterials
      tags:
        - 耗材目录
      summary: 查询耗材目录
      description: |
        按关键字（编码/名称/UDI-DI）与状态、高值标志过滤，分页返回；全院可读。
        目录不按科室数据范围过滤（主数据全院共享），库存与追溯查询才按科室隔离。
      parameters:
        - name: keyword
          in: query
          required: false
          description: 关键字（编码/名称/UDI-DI，模糊匹配，忽略大小写）。
          schema:
            type: string
            maxLength: 64
        - name: status
          in: query
          required: false
          description: 状态过滤；缺省返回全部状态。
          schema:
            type: string
            enum:
              - ACTIVE
              - INACTIVE
        - name: highValue
          in: query
          required: false
          description: 是否只看高值耗材；缺省返回全部。
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          description: 页码，从 1 开始。
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          description: 每页条数（1–200）。
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        '200':
          description: 耗材目录分页结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialList'
              example:
                items:
                  - materialId: '4a000000-0000-4000-8000-000000000001'
                    code: MAT-CVC-001
                    name: 中心静脉导管（演示）
                    specification: 7F 三腔
                    unit: 套
                    category: CATHETER
                    udiDi: '06937000000001'
                    highValue: true
                    expiryManaged: true
                    status: ACTIVE
                    remark: SYNTHETIC 演示耗材
                    createdAt: '2026-11-14T08:00:00+08:00'
                    createdBy: '10000000-0000-4000-8000-000000000001'
                    updatedAt: '2026-11-14T08:00:00+08:00'
                    updatedBy: '10000000-0000-4000-8000-000000000001'
                    version: 1
                page: 1
                size: 20
                total: 1
                totalPages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createMaterial
      tags:
        - 耗材目录
      summary: 创建耗材
      description: |
        创建耗材主数据。编码/名称按 trim + 忽略大小写唯一；UDI-DI 非空时唯一（冲突 409）。
        高值标志与效期管理标志影响出入库校验：高值耗材必须逐件 UDI 登记，效期管理耗材
        出入库必须带批次与效期。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMaterialRequest'
            example:
              code: MAT-CVC-001
              name: 中心静脉导管（演示）
              specification: 7F 三腔
              unit: 套
              category: CATHETER
              udiDi: '06937000000001'
              highValue: true
              expiryManaged: true
              remark: SYNTHETIC 演示耗材
      responses:
        '201':
          description: 创建成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
              example:
                materialId: '4a000000-0000-4000-8000-000000000001'
                code: MAT-CVC-001
                name: 中心静脉导管（演示）
                specification: 7F 三腔
                unit: 套
                category: CATHETER
                udiDi: '06937000000001'
                highValue: true
                expiryManaged: true
                status: ACTIVE
                remark: SYNTHETIC 演示耗材
                createdAt: '2026-11-14T08:00:00+08:00'
                createdBy: '10000000-0000-4000-8000-000000000001'
                updatedAt: '2026-11-14T08:00:00+08:00'
                updatedBy: '10000000-0000-4000-8000-000000000001'
                version: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/materials/search:
    get:
      operationId: searchMaterials
      tags:
        - 耗材目录
      summary: 按名称/编码/UDI-DI 检索耗材（扫码与录入联想）
      description: |
        检索启用（ACTIVE）耗材的编码、名称与 UDI-DI，供耗材录入与扫码联想；
        q 为空或全空白时返回空列表（不报错），避免输入框清空时刷错误提示。
      parameters:
        - name: q
          in: query
          required: true
          description: 检索词（编码/名称/UDI-DI，忽略大小写，最长 64）。
          schema:
            type: string
            maxLength: 64
        - name: limit
          in: query
          required: false
          description: 返回条数（1–50）。
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: 检索结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialList'
              example:
                items:
                  - materialId: '4a000000-0000-4000-8000-000000000001'
                    code: MAT-CVC-001
                    name: 中心静脉导管（演示）
                    specification: 7F 三腔
                    unit: 套
                    category: CATHETER
                    udiDi: '06937000000001'
                    highValue: true
                    expiryManaged: true
                    status: ACTIVE
                    createdAt: '2026-11-14T08:00:00+08:00'
                    createdBy: '10000000-0000-4000-8000-000000000001'
                    updatedAt: '2026-11-14T08:00:00+08:00'
                    updatedBy: '10000000-0000-4000-8000-000000000001'
                    version: 1
                page: 1
                size: 20
                total: 1
                totalPages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/materials/departments:
    get:
      operationId: listMaterialDepartments
      tags:
        - 出入库
      summary: 查询调用者可访问的科室（库存/UDI 归属）
      description: |
        返回调用者数据范围内（ALL/SITE/DEPT）的启用科室，供出入库与 UDI 登记显式选择；
        不返回患者或人员信息，也不返回超出数据范围的科室。SELF/ROOM 范围 fail-closed 403。
      responses:
        '200':
          description: 调用者可访问的科室列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentList'
              example:
                items:
                  - departmentId: 'f1000000-0000-4000-8000-000000000002'
                    code: DEPT-ANES
                    name: 麻醉科（演示）
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/materials/stock:
    get:
      operationId: listMaterialStock
      tags:
        - 出入库
      summary: 查询批次库存（按材料 + 批次 + 科室）
      description: |
        返回调用者数据范围内（ALL/SITE/DEPT）的批次库存，按材料 + 批次 + 科室唯一；
        数量为 append-only 出入库流水的余额快照。SELF/ROOM 范围 fail-closed 403。
      parameters:
        - name: materialId
          in: query
          required: false
          description: 耗材标识过滤。
          schema:
            type: string
        - name: departmentId
          in: query
          required: false
          description: 科室标识过滤（必须在调用者数据范围内）。
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 返回条数（1–200）。
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        '200':
          description: 批次库存列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialStockLevelList'
              example:
                items:
                  - stockId: '4b000000-0000-4000-8000-000000000001'
                    materialId: '4a000000-0000-4000-8000-000000000001'
                    materialCode: MAT-CVC-001
                    materialName: 中心静脉导管（演示）
                    batchNo: BATCH-DEMO-001
                    departmentId: 'f1000000-0000-4000-8000-000000000002'
                    quantity: 3
                    unit: 套
                    expiryDate: '2027-12-31'
                    updatedAt: '2026-11-14T08:00:00+08:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/materials/stock-alerts:
    get:
      operationId: listMaterialStockAlerts
      tags:
        - 库存预警
      summary: 查询耗材库存预警（低阈值/零库存/临期）
      description: |
        按 **材料 × 科室** 聚合批次库存并返回预警行（0.2.0 新增）：
        - `LOW_STOCK`：已配置 `lowStockThreshold` 且可用量 **严格低于** 阈值
          （可用量 = 阈值时不预警，边界按“低于”判定）；
        - `ZERO_STOCK`：该科室可用量合计 = 0（仅统计已发生过出入库、存在库存行的材料，
          不返回“全目录 × 全科室”的空行【待确认】）；
        - `NEAR_EXPIRY`：存在数量 > 0 且效期 ≤ 今天 + 90 天（含已过期，`daysToExpiry` < 0）
          的批次。临期天数固定 90 天，**不开放配置【待确认】**。
        `suggestedQuantity` = max(0, threshold − 可用量)；阈值缺失时为 null（不臆造补货量），
        临期不产生补货量。停用耗材不参与预警。
        数据范围：ALL/SITE/DEPT；SELF/ROOM/无科室维度 fail-closed 403。
      parameters:
        - name: departmentId
          in: query
          required: false
          description: 科室标识过滤（必须在调用者数据范围内，否则 403）。
          schema:
            type: string
        - name: alertType
          in: query
          required: false
          description: 预警类型过滤；缺省返回命中任意类型的行。
          schema:
            type: string
            enum:
              - LOW_STOCK
              - ZERO_STOCK
              - NEAR_EXPIRY
        - name: limit
          in: query
          required: false
          description: 返回条数（1–200）。
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        '200':
          description: 库存预警列表（按零库存优先、材料名称、科室排序）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialStockAlertList'
              example:
                items:
                  - materialId: '4a000000-0000-4000-8000-000000000001'
                    materialCode: MAT-CVC-001
                    materialName: 中心静脉导管（演示）
                    unit: 套
                    departmentId: 'f1000000-0000-4000-8000-000000000002'
                    departmentName: 麻醉科（合成）
                    availableQuantity: 2
                    lowStockThreshold: 10
                    suggestedQuantity: 8
                    alertTypes:
                      - LOW_STOCK
                    batchCount: 1
                    nearestExpiryDate: '2027-01-31'
                    daysToExpiry: 77
                    nearExpiryBatchCount: 0
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/materials/{materialId}:
    get:
      operationId: getMaterial
      tags:
        - 耗材目录
      summary: 查询耗材详情
      description: 返回耗材主数据；不存在 404。目录全院可读，不按科室数据范围过滤。
      parameters:
        - $ref: '#/components/parameters/MaterialId'
      responses:
        '200':
          description: 耗材详情。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
              example:
                materialId: '4a000000-0000-4000-8000-000000000001'
                code: MAT-CVC-001
                name: 中心静脉导管（演示）
                specification: 7F 三腔
                unit: 套
                category: CATHETER
                udiDi: '06937000000001'
                highValue: true
                expiryManaged: true
                status: ACTIVE
                remark: SYNTHETIC 演示耗材
                createdAt: '2026-11-14T08:00:00+08:00'
                createdBy: '10000000-0000-4000-8000-000000000001'
                updatedAt: '2026-11-14T08:00:00+08:00'
                updatedBy: '10000000-0000-4000-8000-000000000001'
                version: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateMaterial
      tags:
        - 耗材目录
      summary: 更新耗材（乐观锁）
      description: |
        更新耗材主数据；编码不可改，必须回传 version，过期 409。名称/UDI-DI 冲突 409。
        把 highValue 从 false 改为 true 时，若该耗材已有未按 UDI 登记的库存批次，返回 409
        （需先清零或改用逐件登记，避免出现无法追溯的高值库存）。
      parameters:
        - $ref: '#/components/parameters/MaterialId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMaterialRequest'
            example:
              name: 中心静脉导管（演示）
              specification: 7F 三腔
              unit: 套
              category: CATHETER
              udiDi: '06937000000001'
              highValue: true
              expiryManaged: true
              remark: SYNTHETIC 演示耗材（更新）
              version: 1
      responses:
        '200':
          description: 更新成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
              example:
                materialId: '4a000000-0000-4000-8000-000000000001'
                code: MAT-CVC-001
                name: 中心静脉导管（演示）
                specification: 7F 三腔
                unit: 套
                category: CATHETER
                udiDi: '06937000000001'
                highValue: true
                expiryManaged: true
                status: ACTIVE
                remark: SYNTHETIC 演示耗材（更新）
                createdAt: '2026-11-14T08:00:00+08:00'
                createdBy: '10000000-0000-4000-8000-000000000001'
                updatedAt: '2026-11-14T09:00:00+08:00'
                updatedBy: '10000000-0000-4000-8000-000000000001'
                version: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/materials/{materialId}/status:
    patch:
      operationId: updateMaterialStatus
      tags:
        - 耗材目录
      summary: 启用/停用耗材（PATCH 状态）
      description: |
        将耗材置为启用（ACTIVE）或停用（INACTIVE），需要 `m4:material:write`。
        停用后不再允许新的出入库与 UDI 登记，历史库存/流水/追溯只读保留；状态未变化时
        幂等返回当前主数据且不递增 version，真正变更时 version +1。状态值只允许
        ACTIVE/INACTIVE（400）；耗材不存在 404；并发状态被其他请求修改 409。
      parameters:
        - $ref: '#/components/parameters/MaterialId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialStatusRequest'
            example:
              status: INACTIVE
      responses:
        '200':
          description: 更新后的耗材（状态未变化时原样返回）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
              example:
                materialId: '4a000000-0000-4000-8000-000000000001'
                code: MAT-CVC-001
                name: 中心静脉导管（演示）
                specification: 7F 三腔
                unit: 套
                category: CATHETER
                udiDi: '06937000000001'
                highValue: true
                expiryManaged: true
                status: INACTIVE
                remark: SYNTHETIC 演示耗材
                createdAt: '2026-11-14T08:00:00+08:00'
                createdBy: '10000000-0000-4000-8000-000000000001'
                updatedAt: '2026-11-14T10:00:00+08:00'
                updatedBy: '10000000-0000-4000-8000-000000000001'
                version: 3
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/materials/{materialId}/low-stock-threshold:
    put:
      operationId: updateMaterialLowStockThreshold
      tags:
        - 库存预警
      summary: 维护耗材库存预警阈值（乐观锁）
      description: |
        单独维护 `lowStockThreshold`（0.2.0 新增），避免与耗材主数据更新互相覆盖：
        必须回传 `version`（过期 409）；`threshold` 为 null 或省略表示清除阈值
        （不按阈值预警，零库存/临期预警仍生效）；负数或超过 2 位小数 400。
        权限 `m4:material:write` + 科室数据范围（ALL/SITE/DEPT）；SELF/ROOM 403。
        审计 `MATERIAL_THRESHOLD_UPDATE`（detail: materialId/code/previousThreshold/threshold/version）。
        阈值来源（日均消耗 × 采购周期 + 安全库存）与是否需要按科室分别配置 **【待确认】**。
      parameters:
        - $ref: '#/components/parameters/MaterialId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LowStockThresholdRequest'
            example:
              threshold: 10
              version: 1
      responses:
        '200':
          description: 阈值已更新（返回更新后的耗材主数据）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
              example:
                materialId: '4a000000-0000-4000-8000-000000000001'
                code: MAT-CVC-001
                name: 中心静脉导管（演示）
                specification: 7F 三腔
                unit: 套
                category: CATHETER
                udiDi: '06937000000001'
                highValue: true
                expiryManaged: true
                status: ACTIVE
                remark: SYNTHETIC 演示耗材
                lowStockThreshold: 10
                createdAt: '2026-11-14T08:00:00+08:00'
                createdBy: '10000000-0000-4000-8000-000000000001'
                updatedAt: '2026-11-14T10:00:00+08:00'
                updatedBy: '10000000-0000-4000-8000-000000000001'
                version: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/materials/stock-movements:
    get:
      operationId: listStockMovements
      tags:
        - 出入库
      summary: 查询出入库流水
      description: |
        按耗材、科室与时间区间查询 append-only 出入库流水（倒序），只返回调用者数据范围内
        的科室；SELF/ROOM 范围 fail-closed 403。
      parameters:
        - name: materialId
          in: query
          required: false
          description: 耗材标识过滤。
          schema:
            type: string
        - name: departmentId
          in: query
          required: false
          description: 科室标识过滤（必须在调用者数据范围内）。
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: 发生时间下限（含），ISO-8601。
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: 发生时间上限（含），ISO-8601。
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: 返回条数（1–200）。
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        '200':
          description: 出入库流水列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementList'
              example:
                items:
                  - movementId: '4c000000-0000-4000-8000-000000000001'
                    movementType: IN
                    materialId: '4a000000-0000-4000-8000-000000000001'
                    materialCode: MAT-CVC-001
                    materialName: 中心静脉导管（演示）
                    batchNo: BATCH-DEMO-001
                    expiryDate: '2027-12-31'
                    udi: '06937000000001^SN-DEMO-001'
                    quantity: 1
                    unit: 套
                    departmentId: 'f1000000-0000-4000-8000-000000000002'
                    counterparty: 中心库房（合成）
                    balanceAfter: 1
                    operatorId: '10000000-0000-4000-8000-000000000004'
                    operatorName: 演示护士（合成）
                    occurredAt: '2026-11-14T08:00:00+08:00'
                    createdAt: '2026-11-14T08:00:00+08:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createStockMovement
      tags:
        - 出入库
      summary: 登记出入库流水
      description: |
        登记 IN/OUT/RETURN/ADJUST 流水并原子更新批次库存（IN 加、OUT/RETURN 减、ADJUST 加带符号
        调整量）。校验：批次库存不足 409（details 给出 available/requested）；同批次效期不一致
        409；效期已过/必填效期缺失 422；ADJUST 缺原因 400；科室须在数据范围（403）。
        高值耗材禁止裸数量 IN/OUT/ADJUST（422），入库用 UDI 登记、使用用 UDI 使用接口。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStockMovementRequest'
            example:
              movementType: IN
              materialId: '4a000000-0000-4000-8000-000000000002'
              batchNo: BATCH-DEMO-002
              expiryDate: '2027-06-30'
              quantity: 20
              departmentId: 'f1000000-0000-4000-8000-000000000002'
              counterparty: 中心库房（合成）
              reason: 月度补货（演示）
      responses:
        '201':
          description: 流水登记成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovement'
              example:
                movementId: '4c000000-0000-4000-8000-000000000002'
                movementType: IN
                materialId: '4a000000-0000-4000-8000-000000000002'
                materialCode: MAT-GLOVE-001
                materialName: 无菌手套（演示）
                batchNo: BATCH-DEMO-002
                expiryDate: '2027-06-30'
                quantity: 20
                unit: 副
                departmentId: 'f1000000-0000-4000-8000-000000000002'
                counterparty: 中心库房（合成）
                reason: 月度补货（演示）
                balanceAfter: 20
                operatorId: '10000000-0000-4000-8000-000000000004'
                operatorName: 演示护士（合成）
                occurredAt: '2026-11-14T08:00:00+08:00'
                createdAt: '2026-11-14T08:00:00+08:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/materials/udi-instances:
    post:
      operationId: registerUdiInstance
      tags:
        - UDI 追溯
      summary: 登记 UDI 实例（高值耗材逐件入库）
      description: |
        登记一个 UDI 实例并完成该件入库：创建 `udi_instance`（IN_STOCK）+ 批次库存 +1 +
        IN 流水，三者同事务。UDI-DI + UDI-PI 组合唯一（重复 409）；效期管理耗材必填效期且
        不得早于今天（422）；批次已存在但效期不一致 409；科室须在数据范围（403）。
        高值耗材**必须**通过本接口入库（禁止裸数量 IN）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUdiInstanceRequest'
            example:
              materialId: '4a000000-0000-4000-8000-000000000001'
              udiDi: '06937000000001'
              udiPi: SN-DEMO-001
              serialNumber: SN-DEMO-001
              batchNo: BATCH-DEMO-001
              expiryDate: '2027-12-31'
              departmentId: 'f1000000-0000-4000-8000-000000000002'
              counterparty: 中心库房（合成）
      responses:
        '201':
          description: UDI 实例登记成功（含入库流水）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UdiInstance'
              example:
                udi: '06937000000001^SN-DEMO-001'
                udiDi: '06937000000001'
                udiPi: SN-DEMO-001
                serialNumber: SN-DEMO-001
                materialId: '4a000000-0000-4000-8000-000000000001'
                materialCode: MAT-CVC-001
                materialName: 中心静脉导管（演示）
                batchNo: BATCH-DEMO-001
                expiryDate: '2027-12-31'
                departmentId: 'f1000000-0000-4000-8000-000000000002'
                status: IN_STOCK
                createdAt: '2026-11-14T08:00:00+08:00'
                createdBy: '10000000-0000-4000-8000-000000000004'
                version: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
