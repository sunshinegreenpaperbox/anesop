        serialNumber:
          type: string
          maxLength: 96
          description: 序列号（PI 中的序列号部分；【待确认】解析规则）。
        materialId:
          type: string
          description: 耗材标识。
        materialCode:
          type: string
          maxLength: 64
          description: 耗材编码快照。
        materialName:
          type: string
          maxLength: 200
          description: 耗材名称快照。
        batchNo:
          type: string
          maxLength: 64
          description: 批次号。
        expiryDate:
          type: string
          format: date
          description: 效期。
        departmentId:
          type: string
          description: 归属科室（数据范围过滤依据）。
        status:
          type: string
          description: 状态：IN_STOCK=在库，USED=已使用，RETURNED=已退回。
          enum:
