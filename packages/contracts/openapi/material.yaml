  /v1/materials/spd-adapter/status:
    get:
      operationId: getSpdAdapterStatus
      tags:
        - SPD 适配器
      summary: 查询 SPD 适配器状态（EXT-03）
      description: |
        返回 SPD 供应链适配器（EXT-03，SIMULATED）最近一次同步结果与降级标记；
        不返回外部系统地址、凭据与供应商明细。SELF/ROOM 范围 fail-closed 403。
      responses:
        '200':
          description: 适配器状态。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpdAdapterStatus'
              example:
                adapterCode: EXT-03
                name: SPD 供应链适配器（模拟）
                mode: SIMULATED
                available: true
                degraded: false
                lastSyncedAt: '2026-11-14T08:00:00+08:00'
                pendingSyncCount: 0
                message: 未接入真实 SPD 系统（EXT-03），当前为模拟同步
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/materials/spd-adapter/sync:
    post:
      operationId: syncSpdAdapter
      tags:
        - SPD 适配器
      summary: 触发 SPD 模拟同步（EXT-03）
      description: |
        触发一次无外部 I/O 的 SPD 模拟同步并留痕：成功返回 success=true、degraded=false；
        模拟不可用时返回 success=false、degraded=true（HTTP 200，本地库存继续可用），
        并把失败写入 `spd_sync_log` 与审计 SPD_SYNC。不阻塞临床记录与本地出入库。
      responses:
        '200':
          description: 模拟同步结果（success=false 表示降级）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpdSyncResult'
              example:
                adapterCode: EXT-03
                success: true
                degraded: false
                syncedAt: '2026-11-14T08:00:00+08:00'
                pulledCount: 0
                pushedCount: 0
                message: 未接入真实 SPD 系统（EXT-03），当前为模拟同步
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 统一 OAuth2/JWT 访问令牌，放在 Authorization 请求头中（Bearer 方案）。
  parameters:
    MaterialId:
      name: materialId
      in: path
      required: true
      description: 耗材标识（UUID 字符串）。
      schema:
        type: string
    Udi:
      name: udi
      in: path
      required: true
      description: UDI 内部规范编码 `UDI-DI^UDI-PI`（URL 编码，`^` → `%5E`）。
      schema:
        type: string
        maxLength: 160
  responses:
    BadRequest:
      description: 请求参数校验失败（字段缺失/越界/ADJUST 缺原因/科室标识格式非法）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: PARAM_INVALID
            message: 请求参数校验失败
            traceId: SYNTH-TRACE-0301
            details:
              - field: reason
                reason: 盘点调整必须填写原因
    Unauthorized:
      description: 未认证或令牌已失效（fail-closed）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: AUTH_UNAUTHORIZED
            message: 未认证或令牌已失效
            traceId: SYNTH-TRACE-0302
            details: []
    Forbidden:
      description: 已认证但缺权限（m4:material:read|write、m4:udi:manage）或科室数据范围不足。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: AUTH_FORBIDDEN
            message: 无权访问该资源或数据范围不足
            traceId: SYNTH-TRACE-0303
            details:
              - field: permission
                reason: 需要 m4:material:write 权限与对应科室数据范围
    NotFound:
      description: 耗材/UDI 实例不存在或不可见（不泄露其他科室数据的存在性）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RESOURCE_NOT_FOUND
            message: 资源不存在或不可见
            traceId: SYNTH-TRACE-0304
            details: []
    Conflict:
      description: 编码/名称/UDI-DI 重复、批次效期冲突、数量不足、重复使用或乐观锁过期。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: STATE_CONFLICT
            message: 状态或版本冲突，操作未生效
            traceId: SYNTH-TRACE-0305
            details:
              - field: quantity
                reason: '批次库存不足：可用 1，请求 2'
    UnprocessableEntity:
      description: 业务规则拒绝：效期已过、高值耗材禁止裸数量出入库、记录不存在/不可见。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: BUSINESS_RULE_VIOLATION
            message: 耗材业务规则拒绝
            traceId: SYNTH-TRACE-0306
            details:
              - field: expiryDate
                reason: 耗材已过效期，不得入库
  schemas:
    ErrorDetail:
      type: object
      description: 错误明细项，用于字段级校验失败或数据范围说明。
      required:
        - field
        - reason
      properties:
        field:
          type: string
          description: 相关字段名或资源标识。
        reason:
          type: string
          description: 可读的失败原因，不包含堆栈、SQL 实参与患者标识。
    Error:
      type: object
      description: 统一错误响应；不暴露堆栈、SQL 实参、令牌与患者标识。
      required:
        - code
        - message
        - traceId
        - details
      properties:
        code:
          type: string
          description: 稳定错误码，供前端分支与告警规则使用。
        message:
          type: string
          description: 面向用户的中文提示，可安全展示。
        traceId:
          type: string
          description: 链路追踪标识，与日志、审计记录关联。
        details:
          type: array
          description: 字段级或范围级错误明细；无明细时为空数组。
          items:
            $ref: '#/components/schemas/ErrorDetail'
    Material:
      type: object
      description: 耗材主数据（SYNTHETIC 示例）。
      required:
        - materialId
        - code
        - name
        - specification
        - unit
        - category
        - highValue
        - expiryManaged
        - status
        - createdAt
        - createdBy
        - updatedAt
        - updatedBy
        - version
      properties:
        materialId:
          type: string
          description: 耗材标识。
        code:
          type: string
          maxLength: 64
          description: 院内耗材编码（唯一，创建后不可改）。
        name:
          type: string
          maxLength: 200
          description: 耗材名称（唯一）。
        specification:
          type: string
          maxLength: 100
          description: 规格（如 7F 三腔）。
        unit:
          type: string
          maxLength: 16
          description: 单位（套/个/副/包等）。
        category:
          type: string
          maxLength: 32
          description: 耗材分类编码（院内字典；具体取值【待确认】）。
        udiDi:
          type: string
          maxLength: 64
          description: UDI-DI（器械标识）；非空时院内唯一，用于扫码反查耗材。
        highValue:
          type: boolean
          description: 是否高值耗材；true 时出入库必须一物一码（UDI 逐件登记/使用）。
        expiryManaged:
          type: boolean
          description: 是否效期管理；true 时出入库必须带批次与效期，过期拒绝。
        status:
          type: string
          description: 状态：ACTIVE=启用（可入库），INACTIVE=停用（只读历史）。
          enum:
            - ACTIVE
            - INACTIVE
        remark:
          type: string
          maxLength: 500
          description: 备注（可选，不含患者信息）。
        lowStockThreshold:
          type:
            - number
            - 'null'
          minimum: 0
          multipleOf: 0.01
          description: |
            库存预警阈值 numeric(12,2)（0.2.0 新增）；**可空 = 不按阈值预警**
            （零库存/临期预警仍生效）。来源与按科室粒度【待确认】，本期不内置默认值。
        createdAt:
          type: string
          format: date-time
          description: 创建时间。
        createdBy:
          type: string
          description: 创建人用户标识。
        updatedAt:
          type: string
          format: date-time
          description: 最后更新时间。
        updatedBy:
          type: string
          description: 最后修改人用户标识。
        version:
          type: integer
          description: 乐观锁版本号（从 1 起）。
          minimum: 1
    LowStockThresholdRequest:
      type: object
      description: 库存预警阈值维护请求（0.2.0 新增）；threshold 为 null/省略表示清除阈值。
      required:
        - version
      properties:
        threshold:
          type:
            - number
            - 'null'
          minimum: 0
          multipleOf: 0.01
          description: 新阈值（最多 2 位小数，不得为负）；null/省略 = 清除阈值（不按阈值预警）。
        version:
          type: integer
          description: 乐观锁版本号（必须等于耗材当前版本，过期 409）。
          minimum: 1
    StockAlertType:
      type: string
      description: |
        库存预警类型：LOW_STOCK=可用量低于已配置阈值；ZERO_STOCK=可用量合计为 0；
        NEAR_EXPIRY=存在效期 ≤ 今天 + 90 天且数量 > 0 的批次（含已过期）。
      enum:
        - LOW_STOCK
        - ZERO_STOCK
        - NEAR_EXPIRY
    MaterialStockAlert:
      type: object
      description: |
        材料 × 科室 粒度的库存预警行（0.2.0）；只含标识、聚合数量与预警摘要，
        不含患者信息、供应商与批次明细原文。
      required:
        - materialId
        - materialCode
        - materialName
        - unit
        - departmentId
        - departmentName
        - availableQuantity
        - alertTypes
        - batchCount
        - nearExpiryBatchCount
      properties:
        materialId:
          type: string
          description: 耗材标识。
        materialCode:
          type: string
          maxLength: 64
          description: 院内耗材编码。
        materialName:
          type: string
          maxLength: 200
          description: 耗材名称。
        unit:
          type: string
          maxLength: 16
          description: 单位。
        departmentId:
          type: string
          description: 科室标识（预警归属科室）。
        departmentName:
          type: string
          description: 科室名称（取启用科室；科室停用/不可见时回退为科室标识）。
        availableQuantity:
          type: number
          description: 该科室批次库存合计（numeric(12,2)）。
        lowStockThreshold:
          type:
            - number
            - 'null'
          minimum: 0
          multipleOf: 0.01
          description: 生效阈值；null 表示未配置（此时不产生 LOW_STOCK 预警）。
        suggestedQuantity:
          type:
            - number
            - 'null'
          minimum: 0
          multipleOf: 0.01
          description: |
            建议补货量 = max(0, 阈值 − 可用量)；阈值缺失时为 null（不臆造补货量），
            临期预警不产生补货量。
        alertTypes:
          type: array
          description: 命中的预警类型（去重；至少 1 项）。
          items:
            $ref: '#/components/schemas/StockAlertType'
        batchCount:
          type: integer
          description: 该 材料 + 科室 的批次行数。
          minimum: 0
        nearestExpiryDate:
          type:
            - string
            - 'null'
          format: date
          description: 数量 > 0 的批次中最近效期；无效期管理批次时为 null。
        daysToExpiry:
          type:
            - integer
            - 'null'
          description: 距最近效期的天数（含已过期时 < 0）；无有效效期时为 null。
        nearExpiryBatchCount:
          type: integer
          description: 命中临期（≤ 今天 + 90 天且数量 > 0）的批次数。
          minimum: 0
    MaterialStockAlertList:
      type: object
      description: 库存预警列表（按零库存优先、材料名称、科室排序）。
      required:
        - items
        - total
      properties:
        items:
          type: array
          description: 预警行。
          items:
            $ref: '#/components/schemas/MaterialStockAlert'
        total:
          type: integer
          description: 本次返回的预警行数（不跨页累计）。
          minimum: 0
    MaterialList:
      type: object
      description: 耗材分页结果。
      required:
        - items
        - page
        - size
        - total
        - totalPages
      properties:
        items:
          type: array
          description: 耗材列表。
          items:
            $ref: '#/components/schemas/Material'
        page:
          type: integer
          description: 当前页码，从 1 开始。
          minimum: 1
        size:
          type: integer
          description: 每页条数。
          minimum: 1
          maximum: 200
        total:
          type: integer
          description: 符合条件的总数。
          minimum: 0
        totalPages:
          type: integer
          description: 总页数；total 为 0 时为 0。
          minimum: 0
    CreateMaterialRequest:
      type: object
      description: 创建耗材请求；code/name/udiDi 归一化唯一。
      required:
        - code
        - name
        - specification
        - unit
        - category
        - highValue
        - expiryManaged
      properties:
        code:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z0-9._-]{1,64}$'
          description: 院内耗材编码（唯一）。
        name:
          type: string
          maxLength: 200
          description: 耗材名称（唯一）。
        specification:
          type: string
          maxLength: 100
          description: 规格。
        unit:
          type: string
          maxLength: 16
          description: 单位。
        category:
          type: string
          maxLength: 32
          description: 耗材分类编码。
        udiDi:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z0-9._-]{1,64}$'
          description: UDI-DI（可选；非空时唯一）。
        highValue:
          type: boolean
          description: 是否高值耗材（逐件 UDI 管理）。
        expiryManaged:
          type: boolean
          description: 是否效期管理（出入库校验批次与效期）。
        remark:
          type: string
          maxLength: 500
          description: 备注（可选）。
    UpdateMaterialRequest:
      type: object
      description: 更新耗材请求（编码不可改；必须回传 version）。
      required:
        - name
        - specification
        - unit
        - category
        - highValue
        - expiryManaged
        - version
      properties:
        name:
          type: string
          maxLength: 200
          description: 耗材名称（唯一）。
        specification:
          type: string
          maxLength: 100
          description: 规格。
        unit:
          type: string
          maxLength: 16
          description: 单位。
        category:
          type: string
          maxLength: 32
          description: 耗材分类编码。
        udiDi:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z0-9._-]{1,64}$'
          description: |
            UDI-DI（可选；非空时唯一；省略表示该耗材不做 UDI 反查）。
            存在 UDI 实例或数量 > 0 的批次库存时，修改或清空 UDI-DI 返回 409
            （避免已登记/在库的耗材失去扫码反查能力）。
        highValue:
          type: boolean
          description: 是否高值耗材（变更记审计）。
        expiryManaged:
          type: boolean
          description: 是否效期管理。
        remark:
          type: string
          maxLength: 500
          description: 备注（可选）。
        version:
          type: integer
          description: 乐观锁版本号（必须等于当前版本）。
          minimum: 1
    MaterialStatusRequest:
      type: object
      description: 耗材启停请求（只允许 ACTIVE/INACTIVE，其他值 400）。
      required:
        - status
      properties:
        status:
          type: string
          description: 目标状态；ACTIVE=启用（可入库），INACTIVE=停用（只读历史、禁止新出入库）。
          enum:
            - ACTIVE
            - INACTIVE
    StockMovement:
      type: object
      description: 出入库流水（append-only，金额/患者信息不在此域）。
      required:
        - movementId
        - movementType
        - materialId
        - materialCode
        - materialName
        - batchNo
        - quantity
        - unit
        - departmentId
        - counterparty
        - balanceAfter
        - operatorId
        - operatorName
        - occurredAt
        - createdAt
      properties:
        movementId:
          type: string
          description: 流水标识。
        movementType:
          type: string
          description: 类型：IN=入库，OUT=出库，RETURN=退回，ADJUST=盘点调整（带符号）。
          enum:
            - IN
            - OUT
            - RETURN
            - ADJUST
        materialId:
          type: string
          description: 耗材标识。
        materialCode:
          type: string
          maxLength: 64
          description: 耗材编码快照。
        materialName:
          type: string
          maxLength: 200
          description: 耗材名称快照。
        batchNo:
          type: string
          maxLength: 64
          description: 批次号。
        expiryDate:
          type: string
          format: date
          description: 效期（效期管理耗材必填）；可为空。
        udi:
          type: string
          maxLength: 160
          description: 关联 UDI 编码（高值/UDI 管理耗材的逐件流水）。
        quantity:
          type: number
          description: 数量；IN/OUT/RETURN 为正数，ADJUST 为带符号调整量（不得为 0）。
        unit:
          type: string
          maxLength: 16
          description: 单位快照。
        departmentId:
          type: string
          description: 科室标识（库存归属与数据范围过滤依据）。
        counterparty:
          type: string
          maxLength: 100
          description: 来源/去向（供应商、库房、科室等；不含患者信息）。
        reason:
          type: string
          maxLength: 200
          description: 原因/备注（ADJUST 必填）。
        balanceAfter:
          type: number
          description: 本次流水后该批次在本科室的库存余额（≥ 0）。
          minimum: 0
        recordId:
          type: string
          description: 使用绑定记录标识（仅 UDI 使用产生的 OUT 流水）。
        scheduleId:
          type: string
          description: 使用绑定台次标识（仅 UDI 使用产生的 OUT 流水）。
        operatorId:
          type: string
          description: 操作人用户标识（服务端按调用者固化，不允许客户端声明）。
        operatorName:
          type: string
          maxLength: 64
          description: 操作人姓名摘要。
        occurredAt:
          type: string
          format: date-time
          description: 发生时间（服务端时间）。
        createdAt:
          type: string
          format: date-time
          description: 落库时间。
    StockMovementList:
      type: object
      description: 出入库流水列表（按发生时间倒序）。
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StockMovement'
    CreateStockMovementRequest:
      type: object
      description: |
        出入库请求；高值耗材禁止裸数量 IN/OUT/ADJUST（422）。
        OUT/RETURN/负向 ADJUST 扣减前按 材料 + 批次 + 科室 定位库存行，请求效期与库存行
        不一致返回 409；过期批次的 OUT 返回 422；RETURN 携带 udi 时以 UDI 实例的批次/效期
        为准，请求与实例不一致返回 422（避免扣错批次）。
      required:
        - movementType
        - materialId
        - batchNo
        - quantity
        - departmentId
        - counterparty
      properties:
        movementType:
          type: string
          description: 类型：IN（入库）/OUT（出库）/RETURN（退回供应商或中心库）/ADJUST（盘点调整）。
          enum:
            - IN
            - OUT
            - RETURN
            - ADJUST
        materialId:
          type: string
          description: 耗材标识（必须存在且启用）。
        batchNo:
          type: string
          maxLength: 64
          description: 批次号；RETURN 带 udi 时必须与 UDI 实例批次一致（不一致 422），实际扣减以实例批次为准。
        expiryDate:
          type: string
          format: date
          description: |
            效期（效期管理耗材必填；与既有批次不一致 409）。RETURN 带 udi 时若提供则必须与
            UDI 实例效期一致（不一致 422），实际扣减与流水以实例效期为准。
        quantity:
          type: number
          multipleOf: 0.01
          description: |
            数量；IN/OUT/RETURN 必须 > 0，ADJUST 为带符号调整量（不得为 0）。
            最多 2 位小数，超过返回 400。
        departmentId:
          type: string
          description: 科室标识（必须在调用者数据范围内）。
        counterparty:
          type: string
          maxLength: 100
          description: 来源/去向（不含患者信息）。
        reason:
          type: string
          maxLength: 200
          description: 原因/备注（ADJUST 必填）。
        udi:
          type: string
          maxLength: 160
          description: 关联 UDI（仅 RETURN；把该实例标记为 RETURNED，并按实例批次/效期扣减）。
    DepartmentOption:
      type: object
      description: 科室选项（启用、org_type=DEPT）；用于出入库与 UDI 登记显式选择科室。
      required:
        - departmentId
        - code
        - name
      properties:
        departmentId:
          type: string
          description: 科室组织标识。
        code:
          type: string
          maxLength: 64
          description: 科室编码（院内唯一）。
        name:
          type: string
          maxLength: 100
          description: 科室名称。
    DepartmentList:
      type: object
      description: 调用者可访问的科室列表。
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DepartmentOption'
    MaterialStockLevel:
      type: object
      description: 批次库存（材料 + 批次 + 科室唯一）。
      required:
        - stockId
        - materialId
        - materialCode
        - materialName
        - batchNo
        - departmentId
        - quantity
        - unit
        - updatedAt
      properties:
        stockId:
          type: string
          description: 库存记录标识。
        materialId:
          type: string
          description: 耗材标识。
        materialCode:
          type: string
          maxLength: 64
          description: 耗材编码快照。
        materialName:
          type: string
          maxLength: 200
          description: 耗材名称快照。
        batchNo:
          type: string
          maxLength: 64
          description: 批次号。
        departmentId:
          type: string
          description: 科室标识。
        quantity:
          type: number
          description: 当前数量（≥ 0）。
          minimum: 0
        unit:
          type: string
          maxLength: 16
          description: 单位快照。
        expiryDate:
          type: string
          format: date
          description: 效期；效期管理耗材必填。
        updatedAt:
          type: string
          format: date-time
          description: 最后更新时间。
    MaterialStockLevelList:
      type: object
      description: 批次库存列表。
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MaterialStockLevel'
    UdiInstance:
