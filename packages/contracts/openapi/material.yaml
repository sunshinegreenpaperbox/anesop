            - USED
            - RETURNED
        recordId:
          type: string
          description: 使用绑定的麻醉记录标识（逻辑关联，跨模块不建外键）。
        scheduleId:
          type: string
          description: 使用绑定的台次标识。
        usedAt:
          type: string
          format: date-time
          description: 使用时间。
        usedBy:
          type: string
          description: 使用人用户标识。
        createdAt:
          type: string
          format: date-time
          description: 登记时间。
        createdBy:
          type: string
          description: 登记人用户标识。
        version:
          type: integer
          description: 乐观锁版本号。
          minimum: 1
    RegisterUdiInstanceRequest:
      type: object
      description: UDI 实例登记（逐件入库）请求。
      required:
        - materialId
        - udiDi
        - udiPi
        - batchNo
        - departmentId
        - counterparty
      properties:
        materialId:
          type: string
          description: 耗材标识（必须存在且启用）。
        udiDi:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z0-9._-]{1,64}$'
          description: UDI-DI（与耗材登记的 udiDi 一致，否则 422）。
        udiPi:
          type: string
          maxLength: 96
          pattern: '^[A-Za-z0-9._-]{1,96}$'
          description: |
            UDI-PI（生产标识；本期不做 GS1/HIBCC 解析【待确认】）。
            UDI-DI + '^' + UDI-PI 总长不得超过 160（越界 400）。
        serialNumber:
          type: string
          maxLength: 96
          description: 序列号（可选，冗余展示）。
        batchNo:
          type: string
          maxLength: 64
          description: 批次号。
        expiryDate:
          type: string
          format: date
          description: 效期（效期管理耗材必填，且不得早于今天）。
        departmentId:
          type: string
          description: 入库科室（必须在调用者数据范围内）。
        counterparty:
          type: string
          maxLength: 100
          description: 来源（供应商/中心库房等；不含患者信息）。
    UseUdiInstanceRequest:
      type: object
      description: UDI 使用请求（绑定记录/台次）。
      required:
        - recordId
      properties:
        recordId:
          type: string
          description: 麻醉记录标识（必须存在且对调用者可见）。
        scheduleId:
          type: string
          description: 台次标识（可选；提供时必须与记录所属台次一致）。
    UdiTrace:
      type: object
      description: material → UDI → record 追溯链；不含患者信息。
      required:
        - instance
        - material
        - movements
      properties:
        instance:
          $ref: '#/components/schemas/UdiInstance'
        material:
          $ref: '#/components/schemas/MaterialTraceSummary'
        movements:
          type: array
          description: 该 UDI 实例关联的出入库流水（按发生时间倒序）。
          items:
            $ref: '#/components/schemas/StockMovement'
        record:
          $ref: '#/components/schemas/RecordLink'
    MaterialTraceSummary:
      type: object
      description: 追溯链中的耗材摘要。
      required:
        - materialId
        - code
        - name
        - specification
        - unit
        - highValue
        - expiryManaged
        - status
      properties:
        materialId:
          type: string
          description: 耗材标识。
        code:
          type: string
          maxLength: 64
          description: 耗材编码。
        name:
          type: string
          maxLength: 200
          description: 耗材名称。
        specification:
          type: string
          maxLength: 100
          description: 规格。
        unit:
          type: string
          maxLength: 16
          description: 单位。
        highValue:
          type: boolean
          description: 是否高值耗材。
        expiryManaged:
          type: boolean
          description: 是否效期管理。
        status:
          type: string
          description: 耗材状态。
          enum:
            - ACTIVE
            - INACTIVE
    RecordLink:
      type: object
      description: 使用绑定的记录/台次（仅标识，不含患者信息）。
      required:
        - recordId
        - scheduleId
      properties:
        recordId:
          type: string
          description: 麻醉记录标识。
        scheduleId:
          type: string
          description: 台次标识。
    SpdAdapterStatus:
      type: object
      description: SPD 适配器（EXT-03）状态；SIMULATED 表示未接入真实 SPD 系统。
      required:
        - adapterCode
        - name
        - mode
        - available
        - degraded
        - pendingSyncCount
        - message
      properties:
        adapterCode:
          type: string
          description: 适配器编号（EXT-03）。
        name:
          type: string
          description: 适配器名称。
        mode:
          type: string
          description: 运行模式：SIMULATED=模拟（未接入真实系统），LIVE=真实对接（本期未启用）。
          enum:
            - SIMULATED
            - LIVE
        available:
          type: boolean
          description: 最近一次同步是否成功（false 表示适配器不可用）。
        degraded:
          type: boolean
          description: 是否降级（true 表示本地耗材库存继续可用，仅外部同步失败）。
        lastSyncedAt:
          type: string
          format: date-time
          description: 最近一次同步时间；从未同步时为 null。
        pendingSyncCount:
          type: integer
          description: 待同步条数（模拟）。
          minimum: 0
        message:
          type: string
          description: 状态说明（固定文案，不含外部系统凭据）。
    SpdSyncResult:
      type: object
      description: SPD 模拟同步结果；success=false 时 degraded=true，本地库存继续可用。
      required:
        - adapterCode
        - success
        - degraded
        - syncedAt
        - pulledCount
        - pushedCount
        - message
      properties:
        adapterCode:
          type: string
          description: 适配器编号（EXT-03）。
        success:
          type: boolean
          description: 本次模拟同步是否成功。
        degraded:
          type: boolean
          description: 是否降级（success 的反面；降级不阻塞本地出入库）。
        syncedAt:
          type: string
          format: date-time
          description: 本次同步时间。
        pulledCount:
          type: integer
          description: 拉取的供应商/目录条数（模拟值）。
          minimum: 0
        pushedCount:
          type: integer
          description: 推送的消耗/库存条数（模拟值）。
          minimum: 0
        message:
          type: string
          description: 结果说明（固定文案，不含外部凭据与患者信息）。
