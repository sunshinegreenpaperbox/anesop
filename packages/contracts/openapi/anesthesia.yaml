openapi: 3.1.0
info:
  title: ANESOP 麻醉记录契约（anesthesia）
  summary: 术前访视、麻醉记录单读写、锁单与术后随访
  description: |
    ANESOP 麻醉记录域契约，对应方案书 §2.4.3（M2 麻醉信息管理）与 §3.4.2（麻醉记录单/事件实体）。
    硬规则：记录以事件时间为准、补录标注录入时间与原因、锁单后只能生成修订版本、三方核查
    （ThreeWayCheck 的 timeOutAt/signOutAt 均须记录）未完成不允许锁单。
    0.4.0 新增知情同意（模板版本不可变、可停用、签署状态机、同一申请最多一条有效
    SIGNED、CA 占位 EXT-05）与手术申请维度的三方核查（append-only 版本化、跨版本
    Time-out 继承/变更确认，供 M3 锁单前置校验）；记录单维度的 ThreeWayCheck 定义
    保持不变，其实现留在 M3。
    所有示例均为 SYNTHETIC 合成数据。
  version: 0.4.0
  contact:
    name: ANESOP 项目组
  license:
    name: 内部交付（非开源）
servers:
  - url: https://anesop.local/api
    description: 院内单院部署统一入口（生产网无互联网出口）
security:
  - bearerAuth: []
tags:
  - name: 麻醉记录
    description: 术前访视、麻醉记录单、锁单与修订、术后随访。
paths:
  /v1/anesthesia/preop-visits/{visitId}:
    get:
      operationId: getPreopVisit
      deprecated: true
      tags:
        - 麻醉记录
      summary: 查询术前访视
      description: 返回病史、气道 Mallampati 分级、ASA 分级、RCRI/Apfel/STOP-BANG/DASI 评分与麻醉计划。
      parameters:
        - name: visitId
          in: path
          description: 术前访视标识（UUID 字符串）。
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 术前访视详情。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreopVisit'
              example:
                visitId: '11000000-0000-4000-8000-000000000001'
                recordId: '12000000-0000-4000-8000-000000000001'
                scheduleId: '80000000-0000-4000-8000-000000000001'
                patientId: '50000000-0000-4000-8000-000000000001'
                patientNo: SYNTH-P-0001
                patientName: 演示患者
                history: 演示病史（高血压，规律服药；合成数据）
                mallampati: II
                asaClass: II
                rcriScore: 1
                apfelScore: 2
                stopBangScore: 3
                dasiScore: 0.8
                anesthesiaPlan: 演示麻醉计划（全身麻醉 + 气管插管）
                consentSigned: true
                status: SIGNED
                createdAt: '2026-11-20T09:00:00+08:00'
                createdBy: '10000000-0000-4000-8000-000000000001'
                updatedAt: '2026-11-25T14:00:00+08:00'
                updatedBy: '10000000-0000-4000-8000-000000000001'
                version: 2
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updatePreopVisit
      deprecated: true
      tags:
        - 麻醉记录
      summary: 保存术前访视
      description: 更新访视内容与评分；使用 version 做乐观锁，冲突返回 409，不静默覆盖他人修改。
      parameters:
        - name: visitId
          in: path
          description: 术前访视标识（UUID 字符串）。
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreopVisitUpdateRequest'
            example:
              history: 演示病史（高血压，规律服药；合成数据）
              mallampati: II
              asaClass: II
              rcriScore: 1
              apfelScore: 2
              stopBangScore: 3
              dasiScore: 0.8
              anesthesiaPlan: 演示麻醉计划（全身麻醉 + 气管插管）
              consentSigned: true
              version: 2
      responses:
        '200':
          description: 保存成功，返回更新后的访视。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreopVisit'
              example:
                visitId: '11000000-0000-4000-8000-000000000001'
                recordId: '12000000-0000-4000-8000-000000000001'
                scheduleId: '80000000-0000-4000-8000-000000000001'
                patientId: '50000000-0000-4000-8000-000000000001'
                patientNo: SYNTH-P-0001
                patientName: 演示患者
                history: 演示病史（高血压，规律服药；合成数据）
                mallampati: II
                asaClass: II
                rcriScore: 1
                apfelScore: 2
                stopBangScore: 3
                dasiScore: 0.8
                anesthesiaPlan: 演示麻醉计划（全身麻醉 + 气管插管）
                consentSigned: true
                status: SIGNED
                createdAt: '2026-11-20T09:00:00+08:00'
                createdBy: '10000000-0000-4000-8000-000000000001'
                updatedAt: '2026-11-25T15:10:00+08:00'
                updatedBy: '10000000-0000-4000-8000-000000000001'
                version: 3
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/anesthesia/preop-assessments:
    get:
      operationId: listPreopAssessments
      tags:
        - 麻醉记录
      summary: 按手术申请查询术前访视与评估
      description: |
        返回指定手术申请下的术前访视与评估单（按创建时间倒序；同一申请可有多份，
        最终化后只能新建版本）以及申请上下文（患者快照/术式/申请状态）。评分结果由
        服务端计算，响应 scores 为只读字段。
        数据范围沿用 M1 申请可见性：申请不存在或超出数据范围时按“集合查询越权”返回 403，
        不返回空列表、不泄露存在性。
      parameters:
        - name: applicationId
          in: query
          description: 手术申请标识（UUID 字符串）。
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 申请上下文与访视单列表；无访视单时 items 为空数组。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreopAssessmentList'
              example:
                application:
                  applicationId: '60000000-0000-4000-8000-000000000001'
                  patientId: '50000000-0000-4000-8000-000000000001'
                  patientSnapshot:
                    patientId: '50000000-0000-4000-8000-000000000001'
                    hisPatientNo: SYNTH-HIS-P-0001
                    patientName: 演示患者
                    gender: FEMALE
                    birthDate: '1972-05-18'
                    age: 54
                    departmentName: 演示手术科室（合成）
                    ward: 演示病区（合成）
                    bedNo: '01'
                  surgeryName: 演示腹腔镜胆囊切除术（合成）
                  departmentName: 演示手术科室（合成）
                  status: SCHEDULED
