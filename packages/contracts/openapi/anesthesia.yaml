                    applicationId: '60000000-0000-4000-8000-000000000001'
                    timeOutAt: '2026-12-01T08:50:00+08:00'
                    timeOutBy: '10000000-0000-4000-8000-000000000002'
                    signOutAt: null
                    signOutBy: null
                    specimenChecked: true
                    implantChecked: true
                    issues: []
                    createdAt: '2026-12-01T08:52:00+08:00'
                    createdBy: '10000000-0000-4000-8000-000000000002'
                    updatedAt: '2026-12-01T08:52:00+08:00'
                    updatedBy: '10000000-0000-4000-8000-000000000002'
                    version: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: recordApplicationThreeWayCheck
      tags:
        - 麻醉记录
      summary: 录入三方核查（新增版本）
      description: |
        为手术申请新增一条三方核查版本（append-only，不可修改/删除）。Time-out 先录，
        Sign-out 可在出室后以新版本补录（signOutAt 不得早于 timeOutAt）；最新版本同时含
        timeOutAt 与 signOutAt 即视为完成，供 M3 锁单前置校验（isThreeWayCheckCompleted）。
        跨版本时序：新增版本可省略 timeOutAt，服务端继承上一版本 Time-out 时间；若显式
        传入的 timeOutAt 与上一版本不一致，必须同时传 confirmTimeOutChange=true，否则 409
        （防止误改已完成的 Time-out）。首版必须显式 timeOutAt（缺失 400）。
        申请不可见/不存在 404，状态不允许、Time-out 变更未确认或并发版本冲突 409。
        需要权限 m2:threeway:write。示例为 SYNTHETIC。
      parameters:
        - name: applicationId
          in: path
          description: 手术申请标识（UUID 字符串）。
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordApplicationThreeWayCheckRequest'
            example:
              timeOutAt: '2026-12-01T08:50:00+08:00'
              specimenChecked: true
              implantChecked: true
              issues: []
      responses:
        '201':
          description: 已新增核查版本（checkVersion = 申请内递增）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationThreeWayCheck'
              example:
                checkId: '18000000-0000-4000-8000-000000000001'
                applicationId: '60000000-0000-4000-8000-000000000001'
                timeOutAt: '2026-12-01T08:50:00+08:00'
                timeOutBy: '10000000-0000-4000-8000-000000000002'
                signOutAt: null
                signOutBy: null
                specimenChecked: true
                implantChecked: true
                issues: []
                createdAt: '2026-12-01T08:52:00+08:00'
                createdBy: '10000000-0000-4000-8000-000000000002'
                updatedAt: '2026-12-01T08:52:00+08:00'
                updatedBy: '10000000-0000-4000-8000-000000000002'
                version: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 统一 OAuth2/JWT 访问令牌，放在 Authorization 头中。
  responses:
    BadRequest:
      description: 请求参数校验失败：字段缺失、格式非法或取值越界；details 为字段级错误数组。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: PARAM_INVALID
            message: 请求参数校验失败
            traceId: SYNTH-TRACE-0005
            details:
              - field: timeOutAt
                reason: Time-out 完成时间不能晚于 Sign-out 完成时间
    Unauthorized:
      description: 未认证：未携带令牌、令牌过期或签名无效。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: AUTH_UNAUTHORIZED
            message: 未认证或令牌已失效
            traceId: SYNTH-TRACE-0001
            details: []
    Forbidden:
      description: 已认证但无权限，或请求超出当前用户数据范围。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: AUTH_FORBIDDEN
            message: 无权访问该资源或数据范围不足
            traceId: SYNTH-TRACE-0002
            details:
              - field: dataScope
                reason: 当前角色不包含该科室数据范围
    NotFound:
      description: 资源不存在，或存在但不在当前用户数据权限内（不泄露存在性）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RESOURCE_NOT_FOUND
            message: 资源不存在或不可见
            traceId: SYNTH-TRACE-0003
            details: []
    Conflict:
      description: 记录状态冲突：三方核查未完成、锁单后修改或乐观锁版本冲突。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RECORD_STATE_CONFLICT
            message: 记录已锁定或提交版本已过期
            traceId: SYNTH-TRACE-0004
            details:
              - field: version
                reason: 提交版本落后于服务端当前版本
    UnprocessableEntity:
      description: 请求语义不合法：字段格式正确但业务规则拒绝，details 说明原因。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: BUSINESS_RULE_VIOLATION
            message: 锁单前置条件未满足
            traceId: SYNTH-TRACE-0006
            details:
              - field: threeWayCheck
                reason: 三方核查未完成
  schemas:
    ErrorDetail:
      type: object
      description: 错误明细项，用于字段级校验失败或状态说明。
      required:
        - field
        - reason
      properties:
        field:
          type: string
          description: 相关字段名或资源标识。
        reason:
          type: string
          description: 可读的失败原因，不包含堆栈、SQL 实参与内部路径。
    Error:
      type: object
      description: 统一错误响应；错误信息不暴露堆栈、SQL 实参与患者标识。
      required:
        - code
        - message
        - traceId
        - details
      properties:
        code:
          type: string
          description: 稳定错误码，供前端分支与告警规则使用。
        message:
          type: string
          description: 面向用户的中文提示，可安全展示。
        traceId:
          type: string
          description: 链路追踪标识，与日志、审计记录关联。
        details:
          type: array
          description: 字段级或范围级错误明细；无明细时为空数组。
          items:
            $ref: '#/components/schemas/ErrorDetail'
    PageMeta:
      type: object
      description: 分页元数据；页码从 1 开始，size 上限由服务端限制。
      required:
        - page
        - size
        - total
        - totalPages
      properties:
        page:
          type: integer
          description: 当前页码，从 1 开始。
          minimum: 1
        size:
          type: integer
          description: 每页条数。
          minimum: 1
          maximum: 200
        total:
          type: integer
          description: 符合条件的总条数。
          minimum: 0
        totalPages:
          type: integer
          description: 总页数；total 为 0 时为 0。
          minimum: 0
    AuditFields:
      type: object
      description: 审计与乐观锁公共字段；锁单后修订保留原值、修改人、时间与原因。
      required:
        - createdAt
        - createdBy
        - updatedAt
        - updatedBy
        - version
      properties:
        createdAt:
          type: string
          format: date-time
          description: 创建时间（服务端时间）。
        createdBy:
          type: string
          description: 创建人用户标识。
        updatedAt:
          type: string
          format: date-time
          description: 最后更新时间（服务端时间）。
        updatedBy:
          type: string
          description: 最后修改人用户标识。
        version:
          type: integer
          description: 乐观锁版本号，从 1 开始；更新必须回传。
          minimum: 1
    IdResponse:
      type: object
      description: 仅返回资源标识的通用响应。
      required:
        - id
      properties:
        id:
          type: string
          description: UUID 字符串；示例统一使用 8-4-4-4-12 形式。
    PreopVisit:
      type: object
      description: 术前访视；评分项与阈值可按院方口径配置。
      allOf:
        - $ref: '#/components/schemas/AuditFields'
        - type: object
          required:
            - visitId
            - recordId
            - scheduleId
            - patientId
            - patientNo
            - patientName
            - history
            - mallampati
            - asaClass
            - rcriScore
            - apfelScore
            - stopBangScore
            - dasiScore
            - anesthesiaPlan
            - consentSigned
            - status
          properties:
            visitId:
              type: string
              description: 访视标识。
            recordId:
              type: string
              description: 关联麻醉记录单标识。
            scheduleId:
              type: string
              description: 关联排程标识。
            patientId:
              type: string
              description: 患者标识。
            patientNo:
              type: string
              description: 院内患者编号；示例统一使用 SYNTH-P-0001。
            patientName:
              type: string
              description: 患者姓名；示例统一使用“演示患者”。
            history:
              type: string
              description: 病史摘要（演示文本）；不写入日志。
            mallampati:
              type: string
              description: 气道 Mallampati 分级。
              enum:
                - I
                - II
                - III
                - IV
            asaClass:
              type: string
              description: ASA 分级 I–VI。
              enum:
                - I
                - II
                - III
                - IV
                - V
                - VI
            rcriScore:
              type: integer
              description: 修订版心脏风险指数 RCRI 得分。
              minimum: 0
              maximum: 6
            apfelScore:
              type: integer
              description: Apfel PONV 风险评分。
              minimum: 0
              maximum: 4
            stopBangScore:
              type: integer
              description: STOP-BANG OSA 筛查得分。
              minimum: 0
              maximum: 8
            dasiScore:
              type: number
              description: 杜克活动状态指数 DASI；按院方口径配置（通行 DASI 0–58.2，待临床确认）。
              minimum: 0
            anesthesiaPlan:
              type: string
              description: 麻醉计划（演示文本）。
            consentSigned:
              type: boolean
              description: 知情同意是否已签署并留档。
            status:
              type: string
              description: 访视状态。
              enum:
                - DRAFT
                - COMPLETED
                - SIGNED
    PreopVisitUpdateRequest:
      type: object
      description: 术前访视保存请求；version 必填用于乐观锁。
      required:
        - version
      properties:
        history:
          type: string
          description: 病史摘要。
        mallampati:
          type: string
          description: 气道 Mallampati 分级。
          enum:
            - I
            - II
            - III
            - IV
        asaClass:
          type: string
          description: ASA 分级。
          enum:
            - I
            - II
            - III
            - IV
            - V
            - VI
        rcriScore:
          type: integer
          description: RCRI 得分。
          minimum: 0
          maximum: 6
        apfelScore:
          type: integer
          description: Apfel 评分。
          minimum: 0
          maximum: 4
        stopBangScore:
          type: integer
          description: STOP-BANG 得分。
          minimum: 0
          maximum: 8
        dasiScore:
          type: number
          description: DASI 指数；按院方口径配置（通行 DASI 0–58.2，待临床确认）。
          minimum: 0
        anesthesiaPlan:
          type: string
          description: 麻醉计划。
        consentSigned:
          type: boolean
          description: 知情同意是否已签署。
        version:
          type: integer
          description: 当前版本号。
          minimum: 1
    PreopPatientSnapshot:
      type: object
      description: |
        术前访视内的患者快照（SYNTHETIC 示例）。created 时由服务端按手术申请（M1 患者快照）
        强制回填，客户端提交的姓名/性别/年龄等字段不落库；仅 patientId/hisPatientNo 用于
        一致性校验，与申请不一致返回 400。只含姓名、性别、出生日期/年龄、院内患者号、
        住院号脱敏值与科室/病区/床号；不含证件号、手机号与住院号明文。
      required:
        - patientId
        - hisPatientNo
        - patientName
        - gender
        - age
        - departmentName
      properties:
        patientId:
          type: string
          description: 患者标识（UUID 字符串）；必须与手术申请的患者一致。
        hisPatientNo:
          type: string
          description: HIS 患者号；必须与手术申请的患者号一致，否则 400。
        inpatientNoMasked:
          type: [string, 'null']
          description: 住院号脱敏值（服务端由 M1 患者快照回填）；不返回住院号明文。
        patientName:
          type: string
          description: 患者姓名；示例统一使用“演示患者”。
        gender:
          type: string
          description: 性别。
          enum:
            - MALE
            - FEMALE
            - UNKNOWN
        birthDate:
          type: [string, 'null']
          format: date
          description: 出生日期；按最小必要返回，缺失时为 null。
        age:
          type: integer
          description: 年龄（岁）。
          minimum: 0
          maximum: 150
        departmentName:
          type: string
          description: 患者所属科室名称。
        ward:
          type: [string, 'null']
          description: 病区；缺失时为 null。
        bedNo:
          type: [string, 'null']
          description: 床号；缺失时为 null。
    PreopAirwayAssessment:
      type: object
      description: |
        气道评估。Mallampati 分级按 Samsoon & Young 改良分级（I–IV）；张口度与颈椎活动度
        为描述性字段，仅记录不参与评分；张口度切点与困难气道综合判断【待确认】。
      required:
        - mallampati
        - mouthOpeningCm
        - cervicalSpineMobility
      properties:
        mallampati:
          type: string
          description: Mallampati 分级（I–IV）。
          enum:
            - I
            - II
            - III
            - IV
        mouthOpeningCm:
          type: number
          description: 张口度（厘米，门齿间距）；只记录测量值，困难气道切点【待确认】。
          minimum: 0
          maximum: 10
        cervicalSpineMobility:
          type: string
          description: 颈椎活动度（描述性；不参与评分）。
          enum:
            - NORMAL
            - LIMITED
            - FIXED
            - UNASSESSED
        notes:
          type: [string, 'null']
          maxLength: 500
          description: 气道评估备注（演示文本，不入日志）；服务端上限 500 字符。
    PreopRcriInput:
      type: object
      description: |
        修订版心脏风险指数（RCRI，Lee 1999）6 个预测因子，每项 1 分。
        计分与切点：0=低危、1=中危、≥2=高危（公开量表口径；院方口径【待确认】）。
      required:
        - highRiskSurgery
        - ischemicHeartDisease
        - congestiveHeartFailure
        - cerebrovascularDisease
        - insulinDependentDiabetes
        - renalImpairment
      properties:
        highRiskSurgery:
          type: boolean
          description: 高危手术（腹腔内、胸腔内或腹股沟以上血管手术）。
        ischemicHeartDisease:
          type: boolean
          description: 缺血性心脏病史。
        congestiveHeartFailure:
          type: boolean
          description: 充血性心力衰竭史。
        cerebrovascularDisease:
          type: boolean
          description: 脑血管病史。
        insulinDependentDiabetes:
          type: boolean
          description: 胰岛素依赖型糖尿病。
        renalImpairment:
          type: boolean
          description: 肾功能不全（血清肌酐 > 2.0 mg/dL 或 177 µmol/L）。
    PreopApfelInput:
      type: object
      description: |
        Apfel 简化 PONV 风险评分 4 个预测因子，每项 1 分（Apfel 1999）。
        计分与切点：0–1=低危、2=中危、≥3=高危（对应公开研究 10%/21%/39%/61%/79% 口径；
        院方口径【待确认】）。
      required:
        - female
        - ponvOrMotionSicknessHistory
        - nonSmoker
        - postoperativeOpioid
      properties:
        female:
          type: boolean
          description: 女性。
        ponvOrMotionSicknessHistory:
          type: boolean
          description: 既往 PONV 或晕动症史。
        nonSmoker:
          type: boolean
          description: 不吸烟。
        postoperativeOpioid:
          type: boolean
          description: 术后使用阿片类药物。
    PreopStopBangInput:
      type: object
      description: |
        STOP-BANG OSA 筛查 8 个条目，每项 1 分（Chung 2008）。
        计分与切点：0–2=低危、3–4=中危、5–8=高危（公开量表口径；院方口径【待确认】）。
      required:
        - snoring
        - tiredness
        - observedApnea
        - hypertension
        - bmiOver35
        - ageOver50
        - neckCircumferenceOver40
        - male
      properties:
        snoring:
          type: boolean
          description: 打鼾（Snoring）。
        tiredness:
          type: boolean
          description: 白天嗜睡/疲乏（Tiredness）。
        observedApnea:
          type: boolean
          description: 目击呼吸暂停（Observed apnea）。
        hypertension:
          type: boolean
          description: 高血压（Pressure）。
        bmiOver35:
          type: boolean
          description: BMI > 35 kg/m²。
        ageOver50:
          type: boolean
          description: 年龄 > 50 岁。
        neckCircumferenceOver40:
          type: boolean
          description: 颈围 > 40 cm。
        male:
          type: boolean
          description: 男性（Gender）。
    PreopScoreInput:
      type: object
      description: |
        评分输入（只含量表条目，不含分数）。RCRI/Apfel/STOP-BANG/DASI 分数与风险等级由
        服务端计算，客户端提交的任何分数均被忽略或拒绝。
      required:
        - rcri
        - apfel
        - stopBang
        - dasiActivities
      properties:
        rcri:
          $ref: '#/components/schemas/PreopRcriInput'
        apfel:
          $ref: '#/components/schemas/PreopApfelInput'
        stopBang:
          $ref: '#/components/schemas/PreopStopBangInput'
        dasiActivities:
          type: array
          description: |
            杜克活动状态指数（DASI，Hlatky 1989）中患者**能够完成**的活动项；服务端按量表
            权重求和（0–58.2）。空数组表示均不能完成（0 分）。重复项不做静默去重，
            服务端显式返回 400。
          items:
            type: string
            description: DASI 活动项编码（12 项，权重见服务端量表实现）。
            enum:
              - SELF_CARE
              - WALK_INDOORS
              - WALK_BLOCK
              - CLIMB_STAIRS
              - RUN_SHORT_DISTANCE
              - LIGHT_HOUSEHOLD_WORK
              - MODERATE_HOUSEHOLD_WORK
              - HEAVY_HOUSEHOLD_WORK
              - YARD_WORK
              - SEXUAL_RELATIONS
              - MODERATE_RECREATION
              - STRENUOUS_SPORTS
    PreopScores:
      type: object
      description: |
        服务端计算的评分结果（只读）。calculatorVersion 标识量表口径版本，用于复算与审计追溯。
        dasiRisk 不单列：functionalCapacityLow 由 DASI 估算 <4 METs 得出，切点【待确认】，
        且不参与 riskLevel 合成（合成规则为“取各量表分级的最高级”，属展示约定，临床确认前
        不得替代医师判断）。
      required:
        - rcriScore
        - rcriRisk
        - apfelScore
        - apfelRisk
        - stopBangScore
        - stopBangRisk
        - dasiScore
        - functionalCapacityLow
        - riskLevel
        - calculatedAt
        - calculatorVersion
      properties:
        rcriScore:
          type: integer
          description: RCRI 得分（0–6）。
          minimum: 0
          maximum: 6
        rcriRisk:
          type: string
          description: RCRI 风险分级。
          enum:
            - LOW
            - MODERATE
            - HIGH
        apfelScore:
          type: integer
          description: Apfel PONV 得分（0–4）。
          minimum: 0
          maximum: 4
        apfelRisk:
          type: string
          description: Apfel 风险分级。
          enum:
            - LOW
            - MODERATE
            - HIGH
        stopBangScore:
          type: integer
          description: STOP-BANG 得分（0–8）。
          minimum: 0
          maximum: 8
        stopBangRisk:
          type: string
          description: STOP-BANG 风险分级。
          enum:
            - LOW
            - MODERATE
            - HIGH
        dasiScore:
          type: number
          description: DASI 指数（0–58.2，通行量表口径；院方口径【待确认】）。
          minimum: 0
          maximum: 58.2
        functionalCapacityLow:
          type: boolean
          description: 功能容量偏低（DASI 估算 <4 METs）；切点【待确认】，不参与 riskLevel。
        riskLevel:
          type: string
          description: |
            综合风险等级（展示用）：取 RCRI/Apfel/STOP-BANG 三者分级的最高级（保守取高）。
            合成规则未经临床验证，标【待确认】；医师判断优先。
          enum:
            - LOW
            - MODERATE
            - HIGH
        calculatedAt:
          type: string
          format: date-time
          description: 计算时间（服务端时间）。
        calculatorVersion:
          type: string
          description: 量表实现版本（复算依据），如 1.0.0。
    PreopPlan:
      type: object
      description: 麻醉计划（方式、气道方案与备注）。
      required:
        - planType
      properties:
        planType:
          type: string
          description: 麻醉计划类型。
          enum:
            - GENERAL
            - REGIONAL
            - COMBINED
            - MONITORED_ANESTHESIA_CARE
            - SEDATION
        airwayPlan:
          type: [string, 'null']
          maxLength: 500
          description: 气道方案（描述性文本，如气管插管/喉罩/区域阻滞）；服务端上限 500 字符。
        notes:
          type: [string, 'null']
          maxLength: 2000
          description: 计划备注（演示文本，不入日志）；服务端上限 2000 字符。
    PreopAssessment:
      type: object
      description: |
        术前访视与评估单。评分结果由服务端计算并冻结在 scores 中；最终化后不可修改，
        只能为同一申请新建版本，原单保留用于审计与复算。
      allOf:
        - $ref: '#/components/schemas/AuditFields'
        - type: object
          required:
            - assessmentId
            - applicationId
            - patientId
            - patientSnapshot
            - historySummary
            - asaClass
            - airwayAssessment
            - scoreInput
            - scores
            - plan
            - status
            - finalizedAt
            - finalizedBy
          properties:
            assessmentId:
              type: string
              description: 术前访视与评估标识（UUID 字符串）。
            applicationId:
              type: string
              description: 关联手术申请标识。
            patientId:
              type: string
              description: 患者标识（与申请患者一致）。
            patientSnapshot:
              $ref: '#/components/schemas/PreopPatientSnapshot'
            historySummary:
              type: string
              description: 病史要点（合成演示文本；不写入日志与审计）。
            asaClass:
              type: string
              description: ASA 分级 I–VI（ASA Physical Status Classification）。
              enum:
                - I
                - II
                - III
                - IV
                - V
                - VI
            airwayAssessment:
              $ref: '#/components/schemas/PreopAirwayAssessment'
            scoreInput:
              $ref: '#/components/schemas/PreopScoreInput'
            scores:
              $ref: '#/components/schemas/PreopScores'
              readOnly: true
            plan:
              $ref: '#/components/schemas/PreopPlan'
            status:
              type: string
              description: 访视单状态；FINALIZED 后不可修改。
              enum:
                - DRAFT
                - FINALIZED
            finalizeNote:
              type: [string, 'null']
              maxLength: 500
              description: 最终化说明（可选；落库 finalize_note，不写入日志/审计）。
            finalizedAt:
              type: [string, 'null']
              format: date-time
              description: 最终化时间；草稿为 null。
            finalizedBy:
              type: [string, 'null']
              description: 最终化操作人用户标识；草稿为 null。
    PreopAssessmentCreateRequest:
      type: object
      description: |
        创建术前访视与评估草稿。只提交评分输入，分数由服务端计算；同一申请同时只允许
        一份草稿（重复创建 409）。
      required:
        - applicationId
        - patientSnapshot
        - historySummary
        - asaClass
        - airwayAssessment
        - scoreInput
        - plan
      properties:
        applicationId:
          type: string
          description: 手术申请标识（UUID 字符串）。
        patientSnapshot:
          $ref: '#/components/schemas/PreopPatientSnapshot'
        historySummary:
          type: string
          description: 病史要点（合成演示文本；不写入日志与审计）。
          minLength: 1
          maxLength: 4000
        asaClass:
          type: string
          description: ASA 分级 I–VI。
          enum:
            - I
            - II
            - III
            - IV
            - V
            - VI
        airwayAssessment:
          $ref: '#/components/schemas/PreopAirwayAssessment'
        scoreInput:
          $ref: '#/components/schemas/PreopScoreInput'
        plan:
          $ref: '#/components/schemas/PreopPlan'
    PreopAssessmentUpdateRequest:
      type: object
      description: |
        全量保存草稿：病史、气道、ASA、评分输入与麻醉计划重新提交，服务端重新计算评分。
        version 必填；已最终化或版本过期 409。患者身份字段不可修改。
      required:
        - version
        - historySummary
        - asaClass
        - airwayAssessment
        - scoreInput
        - plan
      properties:
        version:
          type: integer
          description: 当前版本号，必须与库内一致。
          minimum: 1
        historySummary:
          type: string
          description: 病史要点（合成演示文本；不写入日志与审计）。
          minLength: 1
          maxLength: 4000
        asaClass:
          type: string
          description: ASA 分级 I–VI。
          enum:
            - I
            - II
            - III
            - IV
            - V
            - VI
        airwayAssessment:
          $ref: '#/components/schemas/PreopAirwayAssessment'
        scoreInput:
          $ref: '#/components/schemas/PreopScoreInput'
        plan:
          $ref: '#/components/schemas/PreopPlan'
    FinalizePreopAssessmentRequest:
      type: object
      description: 最终化请求；必须回传 version，已最终化/版本过期 409。
      required:
        - version
      properties:
        version:
          type: integer
          description: 当前版本号，必须与库内一致。
          minimum: 1
        note:
          type: [string, 'null']
          description: 最终化说明（可选，合成演示文本）；落库 finalize_note，不写入日志与审计。
          maxLength: 500
    PreopApplicationSummary:
      type: object
      description: 术前访视页所需的申请上下文（由 M1 申请服务按数据范围解析，不含 PHI 之外字段）。
      required:
        - applicationId
        - patientId
        - patientSnapshot
        - surgeryName
        - departmentName
        - status
      properties:
        applicationId:
          type: string
          description: 手术申请标识。
        patientId:
          type: string
          description: 患者标识。
        patientSnapshot:
          $ref: '#/components/schemas/PreopPatientSnapshot'
        surgeryName:
          type: string
          description: 拟施术式。
        departmentName:
          type: string
          description: 申请科室名称。
        status:
          type: string
          description: 申请状态（沿用 scheduling 契约枚举）。
          enum:
            - SUBMITTED
            - ACCEPTED
            - SCHEDULED
            - CANCELLED
            - REJECTED
    PreopAssessmentList:
      type: object
      description: 申请上下文与访视单列表（按创建时间倒序）；无访视单时 items 为空数组。
      required:
        - application
        - items
      properties:
        application:
          $ref: '#/components/schemas/PreopApplicationSummary'
        items:
          type: array
          description: 该申请下的访视单（草稿与历史最终化版本）。
          items:
            $ref: '#/components/schemas/PreopAssessment'
    AnesthesiaEvent:
      type: object
      description: 麻醉事件；事件时间与录入时间分离，补录须说明原因。
      required:
        - eventId
        - eventType
        - occurredAt
        - source
        - recordedAt
        - recordedBy
      properties:
        eventId:
          type: string
          description: 事件标识。
        eventType:
          type: string
          description: 事件类型。
          enum:
            - INDUCTION
            - INTUBATION
            - INCISION
            - EXTUBATION
            - OUT_OF_ROOM
            - RESCUE
            - OTHER
        occurredAt:
          type: string
          format: date-time
          description: 事件实际发生时间（服务端校准）。
        source:
          type: string
          description: 数据来源；设备采集与手工补录区分。
          enum:
            - DEVICE
            - MANUAL
        note:
          type: [string, 'null']
          description: 事件备注；可为 null。
        entryReason:
          type: [string, 'null']
          description: 补录原因；手工补录时必填，正常录入为 null。
        recordedAt:
          type: string
          format: date-time
          description: 录入时间，与 occurredAt 分离。
        recordedBy:
          type: string
          description: 录入人用户标识。
    AnesthesiaRecord:
      type: object
      description: 麻醉记录单；锁单后不可直接修改。
      allOf:
        - $ref: '#/components/schemas/AuditFields'
        - type: object
          required:
            - recordId
            - scheduleId
            - patientId
            - patientNo
            - patientName
            - status
            - anesthesiaType
            - events
          properties:
            recordId:
              type: string
              description: 记录单标识。
            scheduleId:
              type: string
              description: 关联排程标识。
            patientId:
              type: string
              description: 患者标识。
            patientNo:
              type: string
              description: 院内患者编号；示例统一使用 SYNTH-P-0001。
            patientName:
              type: string
              description: 患者姓名；示例统一使用“演示患者”。
            status:
              type: string
              description: 记录单状态；LOCKED 后只能生成修订版本。
              enum:
                - DRAFT
                - IN_PROGRESS
                - LOCKED
                - REVISED
            anesthesiaType:
              type: string
              description: 麻醉方式。
              enum:
                - GENERAL
                - REGIONAL
                - COMBINED
                - LOCAL
                - SEDATION
            startedAt:
              type:
                - string
                - 'null'
              format: date-time
              description: 记录开始时间；未开始为 null。
            endedAt:
              type:
                - string
                - 'null'
              format: date-time
              description: 记录结束时间；未结束为 null。
            events:
              type: array
              description: 时间轴事件列表。
              items:
                $ref: '#/components/schemas/AnesthesiaEvent'
            threeWayCheckCompleted:
              type: boolean
              readOnly: true
              description: 三方核查（Time-out 与 Sign-out）是否均已完成；只读摘要，锁单前置条件。
            threeWayCheckTimeOutAt:
              type:
                - string
                - 'null'
              format: date-time
              readOnly: true
              description: Time-out 完成时间摘要；未完成为 null。
            threeWayCheckSignOutAt:
              type:
                - string
                - 'null'
              format: date-time
              readOnly: true
              description: Sign-out 完成时间摘要；未完成为 null。
    ThreeWayCheck:
      type: object
      description: 三方核查记录（Time-out / Sign-out）；同一记录单 1:1，是锁单前置条件。
      allOf:
        - $ref: '#/components/schemas/AuditFields'
        - type: object
          required:
            - checkId
            - recordId
            - timeOutAt
            - timeOutBy
            - signOutAt
            - signOutBy
            - specimenChecked
            - implantChecked
          properties:
            checkId:
              type: string
              description: 三方核查记录标识。
            recordId:
              type: string
              description: 关联麻醉记录单标识。
            timeOutAt:
              type: string
              format: date-time
              description: 切皮前 Time-out 完成时间。
            timeOutBy:
              type: string
              description: Time-out 执行人用户标识。
            signOutAt:
              type: string
              format: date-time
              description: 出室前 Sign-out 完成时间。
            signOutBy:
              type: string
              description: Sign-out 执行人用户标识。
            specimenChecked:
              type: boolean
              description: 标本核对是否一致。
            implantChecked:
              type: boolean
              description: 植入物与耗材核对是否一致。
    UpsertThreeWayCheckRequest:
      type: object
      description: 创建或更新三方核查的请求；六个核查字段均必填，更新时回传 version。
      required:
        - timeOutAt
        - timeOutBy
        - signOutAt
        - signOutBy
        - specimenChecked
        - implantChecked
      properties:
        timeOutAt:
          type: string
          format: date-time
          description: 切皮前 Time-out 完成时间。
        timeOutBy:
          type: string
          description: Time-out 执行人用户标识。
        signOutAt:
          type: string
          format: date-time
          description: 出室前 Sign-out 完成时间，不得早于 timeOutAt。
        signOutBy:
          type: string
          description: Sign-out 执行人用户标识。
        specimenChecked:
          type: boolean
          description: 标本核对是否一致。
        implantChecked:
          type: boolean
          description: 植入物与耗材核对是否一致。
        version:
          type: integer
          description: 当前版本号；更新已存在的核查记录时必填。
          minimum: 1
    ConsentTemplate:
      type: object
      description: |
        知情同意模板与版本。内容不可变：新版本以新的 (templateCode, version) 另建；
        患者签署时记录冻结的 templateVersion。本期内容为 SYNTHETIC 演示文本。
      required:
        - templateId
        - templateCode
        - version
        - title
        - contentText
        - effectiveAt
        - status
        - createdAt
        - createdBy
      properties:
        templateId:
          type: string
          description: 模板标识（UUID 字符串）。
        templateCode:
          type: string
          description: 模板编码（如 ANES_GENERAL）。
          maxLength: 64
        version:
          type: integer
          description: 模板版本号（从 1 起；不是乐观锁）。
          minimum: 1
        title:
          type: string
          description: 模板标题（中文）。
          maxLength: 200
        contentText:
          type: string
          description: 模板正文（患者签署的告知文本；不可修改）。
          maxLength: 20000
        effectiveAt:
          type: string
          format: date-time
          description: 生效时间；早于该时间的版本不用于新签署。
        status:
          type: string
          description: 模板状态；RETIRED 版本不可用于新签署，历史记录仍引用旧版本。
          enum:
            - ACTIVE
            - RETIRED
        retiredAt:
          type: [string, 'null']
          format: date-time
          description: 停用时间；仅 RETIRED 有值，ACTIVE 为 null。
        createdAt:
          type: string
          format: date-time
          description: 创建时间。
        createdBy:
          type: [string, 'null']
          description: 创建人用户标识；系统种子模板为 null。
    ConsentTemplateList:
      type: object
      description: 知情同意模板列表；无匹配时为 items 空数组。
      required:
        - items
      properties:
        items:
          type: array
          description: 模板版本（按 templateCode、version 倒序）。
          items:
            $ref: '#/components/schemas/ConsentTemplate'
    AnesthesiaApplicationSummary:
      type: object
      description: 知情同意/三方核查页所需的申请上下文（由 M1 申请服务按数据范围解析）。
      required:
        - applicationId
        - patientId
        - patientSnapshot
        - surgeryName
        - departmentName
        - status
      properties:
        applicationId:
          type: string
          description: 手术申请标识。
        patientId:
          type: string
          description: 患者标识。
        patientSnapshot:
          $ref: '#/components/schemas/PreopPatientSnapshot'
        surgeryName:
          type: string
          description: 拟施术式。
        departmentName:
          type: string
          description: 申请科室名称。
        status:
          type: string
          description: 申请状态（沿用 scheduling 契约枚举）。
          enum:
            - SUBMITTED
            - ACCEPTED
            - SCHEDULED
            - CANCELLED
            - REJECTED
    ConsentRecord:
      type: object
      description: |
        知情同意记录。签署状态机：WAITING_SIGN → SIGNED | DECLINED；SIGNED → REVOKED。
        “当前有效同意”指同一申请下 status=SIGNED 的最新记录（同时最多一条，部分唯一索引
        强制；DECLINED/REVOKED 不占位），下游 M3 锁定/术前核对只取该记录。
        CA 不可用（EXT-05）：caStatus=SIMULATED 表示占位签名，signatureRef/signatureHash
        为服务端生成的留痕，不保存签名原文/图片/证书链；签署人姓名/关系/方式与签名字段
        在已签署后均不可改写。
      allOf:
        - $ref: '#/components/schemas/AuditFields'
        - type: object
          required:
            - consentId
            - applicationId
            - patientId
            - templateId
            - templateCode
            - templateVersion
            - templateTitle
            - status
            - signerName
            - signerRelation
            - signMethod
            - signedAt
            - signedBy
            - signatureRef
            - signatureHash
            - caStatus
            - declineReason
            - declinedAt
            - revokedAt
            - revokedBy
            - revokeReason
          properties:
            consentId:
              type: string
              description: 知情同意记录标识（UUID 字符串）。
            applicationId:
              type: string
              description: 关联手术申请标识。
            patientId:
              type: string
              description: 患者标识（取申请快照）。
            templateId:
              type: string
              description: 同意模板标识。
            templateCode:
              type: string
              description: 模板编码（冗余便于展示）。
            templateVersion:
              type: integer
              description: 签署时冻结的模板版本号。
              minimum: 1
            templateTitle:
              type: string
              description: 签署时冻结的模板标题。
            status:
              type: string
              description: 状态；SIGNED 后只能 REVOKED，DECLINED/REVOKED 为终态。
              enum:
                - DRAFT
                - WAITING_SIGN
                - SIGNED
                - DECLINED
                - REVOKED
            signerName:
              type: string
              description: 签署人姓名（患者本人或法定代理人；只落库，不写入日志/审计）。
              maxLength: 64
            signerRelation:
              type: string
              description: 签署人关系。
              enum:
                - SELF
                - SPOUSE
                - PARENT
                - CHILD
                - LEGAL_GUARDIAN
                - OTHER
            signMethod:
              type: string
              description: 签署方式；ELECTRONIC 当前为 CA 占位（SIMULATED）。
              enum:
                - PAPER
                - ELECTRONIC
            signedAt:
              type: [string, 'null']
              format: date-time
              description: 签署完成时间；未签署为 null。
            signedBy:
              type: [string, 'null']
              description: 签署操作人用户标识；未签署为 null。
            signatureRef:
              type: [string, 'null']
              description: 签名占位标识（EXT-05：SIM-CA-<uuid>）；不保存签名原文。
              maxLength: 128
            signatureHash:
              type: [string, 'null']
              description: 签名摘要（SHA-256 十六进制，64 字符）；输入不含姓名等 PHI。
              maxLength: 64
              pattern: '^[0-9a-f]{64}$'
            caStatus:
              type: string
              description: CA 状态；SIMULATED 为占位签名（EXT-05 解除前唯一取值）。
              enum:
                - PENDING
                - SIMULATED
                - VERIFIED
                - FAILED
            declineReason:
              type: [string, 'null']
              description: 拒绝原因（≤500 字符；只落库，不写入日志/审计）。
              maxLength: 500
            declinedAt:
              type: [string, 'null']
              format: date-time
              description: 拒绝时间；仅 DECLINED 有值。
            revokedAt:
              type: [string, 'null']
              format: date-time
              description: 撤销时间；仅 REVOKED 有值。
            revokedBy:
              type: [string, 'null']
              description: 撤销操作人用户标识；仅 REVOKED 有值。
            revokeReason:
              type: [string, 'null']
              description: 撤销原因（仅 REVOKED 有值；只落库，不写入日志/审计）。
              maxLength: 500
    ConsentRecordList:
      type: object
      description: 申请上下文与同意记录列表（创建时间倒序）；无记录时 items 为空数组。
      required:
        - application
        - items
      properties:
        application:
          $ref: '#/components/schemas/AnesthesiaApplicationSummary'
        items:
          type: array
          description: 该申请下的同意记录（含已拒绝/已撤销的历史记录）。
          items:
            $ref: '#/components/schemas/ConsentRecord'
    CreateConsentRequest:
      type: object
      description: |
        创建知情同意记录（WAITING_SIGN）。templateVersion 必须与 templateId 对应、模板已生效
        且未停用；同一申请 + 同一模板版本同时只允许一条有效记录（重复创建 409）。
        模板已停用（RETIRED）返回 422。
      required:
        - applicationId
        - templateId
        - templateVersion
        - signerName
        - signerRelation
        - signMethod
      properties:
        applicationId:
          type: string
          description: 手术申请标识（UUID 字符串）。
        templateId:
          type: string
          description: 同意模板标识（UUID 字符串）。
        templateVersion:
          type: integer
          description: 模板版本号；必须与 templateId 对应。
          minimum: 1
        signerName:
          type: string
          description: 签署人姓名（患者本人或法定代理人；只落库，不写入日志/审计）。
          minLength: 1
          maxLength: 64
        signerRelation:
          type: string
          description: 签署人关系。
          enum:
            - SELF
            - SPOUSE
            - PARENT
            - CHILD
            - LEGAL_GUARDIAN
            - OTHER
        signMethod:
          type: string
          description: 签署方式；ELECTRONIC 当前为 CA 占位。
          enum:
            - PAPER
            - ELECTRONIC
    SignConsentRequest:
      type: object
      description: 签署请求；必须回传 version，重复签署/版本过期/终态返回 409。
      required:
        - version
      properties:
        version:
          type: integer
          description: 当前版本号，必须与库内一致。
          minimum: 1
    DeclineConsentRequest:
      type: object
      description: 拒绝请求；必须回传 version 与原因。
      required:
        - version
        - reason
      properties:
        version:
          type: integer
          description: 当前版本号，必须与库内一致。
          minimum: 1
        reason:
          type: string
          description: 拒绝原因（只落库，不写入日志/审计）。
          minLength: 1
          maxLength: 500
    RevokeConsentRequest:
      type: object
      description: 撤销请求；仅 SIGNED 状态可撤销，必须回传 version 与原因。
      required:
        - version
        - reason
      properties:
        version:
          type: integer
          description: 当前版本号，必须与库内一致。
          minimum: 1
        reason:
          type: string
          description: 撤销原因（只落库，不写入日志/审计）。
          minLength: 1
          maxLength: 500
    ApplicationThreeWayCheck:
      type: object
      description: |
        手术申请维度三方核查（Time-out / Sign-out）版本。append-only：不可修改/删除，
        修正必须新增版本；latest 同时含 timeOutAt 与 signOutAt 视为完成（M3 锁单前置）。
        记录单(record)维度的 ThreeWayCheck 定义保持不变，其实现留在 M3。
      allOf:
        - $ref: '#/components/schemas/AuditFields'
        - type: object
          required:
            - checkId
            - applicationId
            - timeOutAt
            - timeOutBy
            - signOutAt
            - signOutBy
            - specimenChecked
            - implantChecked
            - issues
          properties:
            checkId:
              type: string
              description: 三方核查记录标识（UUID 字符串）。
            applicationId:
              type: string
              description: 关联手术申请标识。
            timeOutAt:
              type: string
              format: date-time
              description: 切皮前 Time-out 完成时间。
            timeOutBy:
              type: string
              description: Time-out 执行人用户标识。
            signOutAt:
              type: [string, 'null']
              format: date-time
              description: 出室前 Sign-out 完成时间；未完成为 null。
            signOutBy:
              type: [string, 'null']
              description: Sign-out 执行人用户标识；未完成为 null。
            specimenChecked:
              type: boolean
              description: 标本核对是否一致。
            implantChecked:
              type: boolean
              description: 植入物与耗材核对是否一致。
            issues:
              type: array
              description: 问题项（最多 20 项，每项 ≤200 字符；审计只记数量不记原文）。
              maxItems: 20
              items:
                type: string
                maxLength: 200
    ApplicationThreeWayCheckList:
      type: object
      description: 申请上下文、核查版本列表（版本号倒序）与完成标记。
      required:
        - application
        - items
        - completed
      properties:
        application:
          $ref: '#/components/schemas/AnesthesiaApplicationSummary'
        completed:
          type: boolean
          description: 最新版本是否同时记录 Time-out 与 Sign-out（M3 锁单前置条件）。
        items:
          type: array
          description: 该申请的核查版本（append-only，最新在前）。
          items:
            $ref: '#/components/schemas/ApplicationThreeWayCheck'
    RecordApplicationThreeWayCheckRequest:
      type: object
      description: |
        新增三方核查版本。Time-out 先录，Sign-out 可在出室后以新版本补录；signOutAt 不得早于
        timeOutAt。signOutAt 与 signOutBy 必须成对出现；timeOutBy 缺省为当前操作人。
        新增版本省略 timeOutAt 时继承上一版本；显式修改上一版本 Time-out 必须同时传
        confirmTimeOutChange=true，否则 409。
      required:
        - specimenChecked
        - implantChecked
      properties:
        timeOutAt:
          type: string
          format: date-time
          description: |
            切皮前 Time-out 完成时间（不得晚于当前时间 5 分钟以上）。首版必填；
            新增版本可省略（继承上一版本）。与上一版本不一致时须 confirmTimeOutChange=true。
        confirmTimeOutChange:
          type: boolean
          description: |
            显式确认修改上一版本的 Time-out 时间。仅当 timeOutAt 与上一版本不一致时生效；
            缺省 false（不一致返回 409）。
        timeOutBy:
          type: [string, 'null']
          description: Time-out 执行人用户标识；缺省为当前操作人。
        signOutAt:
          type: [string, 'null']
          format: date-time
          description: 出室前 Sign-out 完成时间；未完成可留空，稍后以新版本补录。
        signOutBy:
          type: [string, 'null']
          description: Sign-out 执行人用户标识；signOutAt 非空时必填，缺省为当前操作人。
        specimenChecked:
          type: boolean
          description: 标本核对是否一致。
        implantChecked:
          type: boolean
          description: 植入物与耗材核对是否一致。
        issues:
          type: array
          description: 问题项（最多 20 项，每项 ≤200 字符）。
          maxItems: 20
          items:
            type: string
            maxLength: 200
    UpdateAnesthesiaRecordRequest:
      type: object
      description: 麻醉记录单保存请求；锁单后调用返回 409。
      required:
        - version
      properties:
        anesthesiaType:
          type: string
          description: 麻醉方式。
          enum:
            - GENERAL
            - REGIONAL
            - COMBINED
            - LOCAL
            - SEDATION
        events:
          type: array
          description: 本次提交的事件列表。
          items:
            $ref: '#/components/schemas/AnesthesiaEvent'
        version:
          type: integer
          description: 当前版本号。
          minimum: 1
    LockRecordRequest:
      type: object
      description: 锁单请求。
      required:
        - version
        - signatureRequested
      properties:
        version:
          type: integer
          description: 当前版本号。
          minimum: 1
        signatureRequested:
          type: boolean
          description: 是否同时发起 CA 签名与可信时间戳。
    LockRecordResult:
      type: object
      description: 锁单结果；id 为记录单标识。
      allOf:
        - $ref: '#/components/schemas/IdResponse'
        - type: object
          required:
            - status
            - lockedAt
            - lockedBy
            - signatureStatus
          properties:
            status:
              type: string
              description: 锁单后的状态。
              enum:
                - LOCKED
            lockedAt:
              type: string
              format: date-time
              description: 锁单时间（服务端时间）。
            lockedBy:
              type: string
              description: 锁单操作人用户标识。
            signatureStatus:
              type: string
              description: CA 签名状态；失败不阻断锁单。
              enum:
                - SIGNED
                - PENDING
                - FAILED
    FollowUp:
      type: object
      description: 术后随访记录；24/48 小时。
      allOf:
        - $ref: '#/components/schemas/AuditFields'
        - type: object
          required:
            - followUpId
            - recordId
            - patientId
            - patientNo
            - patientName
            - followUpHours
            - painScore
            - ponv
            - cognition
            - satisfaction
            - completedAt
          properties:
            followUpId:
              type: string
              description: 随访标识。
            recordId:
              type: string
              description: 关联记录单标识。
            patientId:
              type: string
              description: 患者标识。
            patientNo:
              type: string
              description: 院内患者编号；示例统一使用 SYNTH-P-0001。
            patientName:
              type: string
              description: 患者姓名；示例统一使用“演示患者”。
            followUpHours:
              type: integer
              description: 随访时点（小时）。
              enum:
                - 24
                - 48
            painScore:
              type: integer
              description: 静息疼痛评分 NRS 0–10。
              minimum: 0
              maximum: 10
            ponv:
              type: boolean
              description: 是否发生术后恶心呕吐 PONV。
            cognition:
              type: string
              description: 认知状态描述（演示文本）。
            satisfaction:
              type: integer
              description: 满意度评分 1–5。
              minimum: 1
              maximum: 5
            completedAt:
              type: string
              format: date-time
              description: 随访完成时间。
    CreateFollowUpRequest:
      type: object
      description: 创建术后随访请求。
      required:
        - recordId
        - followUpHours
        - painScore
        - ponv
        - cognition
        - satisfaction
        - completedAt
      properties:
        recordId:
          type: string
          description: 关联记录单标识。
        followUpHours:
          type: integer
          description: 随访时点（小时）。
          enum:
            - 24
            - 48
        painScore:
          type: integer
          description: 静息疼痛评分 NRS 0–10。
          minimum: 0
          maximum: 10
        ponv:
          type: boolean
          description: 是否发生 PONV。
        cognition:
          type: string
          description: 认知状态描述。
        satisfaction:
          type: integer
          description: 满意度评分 1–5。
          minimum: 1
          maximum: 5
        completedAt:
          type: string
          format: date-time
          description: 随访完成时间。
    FollowUpPage:
      type: object
      description: 术后随访分页结果。
      required:
        - items
        - meta
      properties:
        items:
          type: array
          description: 当前页随访列表。
          items:
            $ref: '#/components/schemas/FollowUp'
        meta:
          $ref: '#/components/schemas/PageMeta'
