                  endedAt: '2026-12-01T10:50:00+08:00'
                effective:
                  anesthesiaType: COMBINED
                  startedAt: '2026-12-01T08:40:00+08:00'
                  endedAt: '2026-12-01T10:50:00+08:00'
                corrections:
                  - field: anesthesiaType
                    originalValue: GENERAL
