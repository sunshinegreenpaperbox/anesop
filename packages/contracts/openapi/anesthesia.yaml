  /v1/anesthesia/records/{recordId}/lock:
    post:
      operationId: lockAnesthesiaRecord
      tags:
        - 麻醉记录
      summary: 锁单
      description: |
        锁单后记录不可直接修改，修改只能生成修订版本并保留原值、修改人、时间、原因。
        三方核查未完成（缺少 ThreeWayCheck 的 timeOutAt 或 signOutAt）或版本冲突时返回 409；
        CA 签名失败不阻断锁单，签名状态置为 PENDING。
      parameters:
        - name: recordId
          in: path
          description: 麻醉记录单标识（UUID 字符串）。
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LockRecordRequest'
            example:
              version: 6
              signatureRequested: true
      responses:
        '200':
          description: 锁单结果；签名失败时 signatureStatus 为 PENDING 或 FAILED，不回滚锁单。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LockRecordResult'
              example:
                id: '12000000-0000-4000-8000-000000000001'
                status: LOCKED
                lockedAt: '2026-12-01T11:30:00+08:00'
                lockedBy: '10000000-0000-4000-8000-000000000001'
                signatureStatus: PENDING
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
