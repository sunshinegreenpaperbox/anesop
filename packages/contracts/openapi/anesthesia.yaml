    get:
      operationId: listApplicationThreeWayChecks
      tags:
        - 麻醉记录
      summary: 按手术申请查询三方核查（Time-out / Sign-out）
      description: |
        返回指定申请的核查版本列表（checkVersion 倒序）与是否完成（completed）。三方核查
        为 append-only：修正必须新增版本，历史版本保留。数据范围沿申请可见性，越界/不存在
        返回 404。需要权限 m2:threeway:read。记录单(record)维度核查实现留 M3。
      parameters:
        - name: applicationId
          in: path
          description: 手术申请标识（UUID 字符串）。
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 申请上下文、核查版本列表与完成标记；无记录时 items 为空数组且 completed=false。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationThreeWayCheckList'
              example:
                application:
                  applicationId: '60000000-0000-4000-8000-000000000001'
                  patientId: '50000000-0000-4000-8000-000000000001'
                  patientSnapshot:
                    patientId: '50000000-0000-4000-8000-000000000001'
                    hisPatientNo: SYNTH-HIS-P-0001
                    patientName: 演示患者
