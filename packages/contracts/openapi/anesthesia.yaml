                signatureRef: SIM-CA-12000000-0000-4000-8000-000000000001
                signatureHash: 9f2c4c0f0b7a5f1e8d3a6b4c2d1e0f9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e
