                    - MODERATE_HOUSEHOLD_WORK
                scores:
                  rcriScore: 1
                  rcriRisk: MODERATE
                  apfelScore: 4
                  apfelRisk: HIGH
                  stopBangScore: 4
                  stopBangRisk: MODERATE
                  dasiScore: 18.95
                  functionalCapacityLow: false
                  riskLevel: HIGH
