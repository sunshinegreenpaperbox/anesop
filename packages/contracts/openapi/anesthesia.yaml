  /v1/anesthesia/alert-rules/{ruleId}:
    put:
      operationId: updateAlertRule
      tags:
        - 麻醉记录
      summary: 配置预警规则（生成新版本，旧版本停用）
      description: |
        规则不可原地修改：保存时以同一 code 生成 version+1 的新行并停用旧版本（历史版本保留，
        供审计与“告警触发时版本”追溯），返回新版本。必须回传当前 version，过期 409。

        阈值口径（【待确认】）：
        - operator=LT：低于 thresholdLow 触发，必须提供 thresholdLow；
        - operator=GT：高于 thresholdHigh 触发，必须提供 thresholdHigh；
        - operator=OUT_OF_RANGE：低于 thresholdLow 或高于 thresholdHigh 触发，两者都必须提供；
        - 等于阈值不触发（严格不等）；durationSeconds 为“持续越界秒数”，0 表示首个越界采样即触发。

        权限：`m2:alert:configure`（仅 SYS_ADMIN；临床阈值须经临床顾问确认后录入）。
      parameters:
        - name: ruleId
          in: path
          description: 规则当前版本标识（UUID 字符串）；非当前版本 409。
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAlertRuleRequest'
            example:
              thresholdLow: 88
              thresholdHigh: null
              durationSeconds: 15
              severity: CRITICAL
              enabled: true
              version: 1
      responses:
        '200':
          description: 规则新版本。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
              example:
                ruleId: '1b000000-0000-4000-8000-000000000011'
                code: SPO2_LOW
                name: 血氧饱和度过低（演示阈值【待确认】）
                metric: SPO2
                operator: LT
                thresholdLow: 88
                thresholdHigh: null
                durationSeconds: 15
                severity: CRITICAL
                version: 2
                enabled: true
                pendingConfirmation: true
                createdAt: '2026-12-02T09:00:00+08:00'
                createdBy: '10000000-0000-4000-8000-000000000001'
                updatedAt: '2026-12-02T09:00:00+08:00'
                updatedBy: '10000000-0000-4000-8000-000000000001'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
