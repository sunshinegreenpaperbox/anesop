openapi: 3.1.0
info:
  title: ANESOP 认证与令牌契约（auth）
  summary: 统一认证、令牌刷新、登出与当前用户权限
  description: |
    ANESOP 平台 M0 公共支撑的认证域契约。覆盖本地/AD/LDAP/SSO 登录、JWT 刷新、登出、
    “当前用户 + 角色 + 权限点 + 数据范围”查询，以及 M2-M0-02 的用户管理与手机号脱敏返回，
    对应方案书 §2.4.1（M0 公共支撑）、§3.9.2（RBAC 与数据权限）、§3.9.3（字段加密与脱敏）。
    所有示例均为 SYNTHETIC 合成数据，不含真实患者或账号信息；用户管理接口只返回
    `phoneMasked`，永不返回手机号明文、密文或哈希。
  version: 0.5.0
  contact:
    name: ANESOP 项目组
  license:
    name: 内部交付（非开源）
servers:
  - url: https://anesop.local/api
    description: 院内单院部署统一入口（生产网无互联网出口）
security:
  - bearerAuth: []
tags:
  - name: 认证与令牌
    description: 登录、刷新、登出与当前用户权限查询；除登录/刷新外均需 Bearer Token。
paths:
  /v1/auth/login:
    post:
      operationId: login
      tags:
        - 认证与令牌
      summary: 账号登录
      description: |
        使用本地账号、AD/LDAP 或 SSO 凭据换取 JWT。登录失败不区分“账号不存在”与“密码错误”的
        对外提示（统一 401），但审计日志记录真实原因；连续失败锁定策略见 §3.9.1。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: demo.anesthesiologist
              password: SYNTHETIC-PASSWORD
              authType: LOCAL
      responses:
        '200':
          description: 登录成功，返回访问令牌、刷新令牌与当前用户权限快照。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                accessToken: SYNTH-ACCESS-TOKEN
                refreshToken: SYNTH-REFRESH-TOKEN
                tokenType: Bearer
                expiresIn: 900
                user:
                  userId: '1000000000000000001'
                  username: demo.anesthesiologist
                  displayName: 演示医师
                  roles:
                    - SYS_ANESTHESIOLOGIST
                  permissions:
                    - anesthesia:record:read
                    - anesthesia:record:write
                  dataScopes:
                    - type: DEPARTMENT
                      scopeIds:
                        - '2000000000000000001'
                  siteIds:
                    - '3000000000000000001'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/refresh:
    post:
      operationId: refreshToken
      tags:
        - 认证与令牌
      summary: 刷新访问令牌
      description: 使用未过期的刷新令牌换取新的访问令牌；刷新令牌轮换后旧令牌立即失效。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: SYNTH-REFRESH-TOKEN
      responses:
        '200':
          description: 刷新成功，返回轮换后的访问令牌与刷新令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                accessToken: SYNTH-ACCESS-TOKEN-2
                refreshToken: SYNTH-REFRESH-TOKEN-2
                tokenType: Bearer
                expiresIn: 900
                user:
                  userId: '1000000000000000001'
                  username: demo.anesthesiologist
                  displayName: 演示医师
                  roles:
                    - SYS_ANESTHESIOLOGIST
                  permissions:
                    - anesthesia:record:read
                  dataScopes:
                    - type: DEPARTMENT
                      scopeIds:
                        - '2000000000000000001'
                  siteIds:
                    - '3000000000000000001'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/logout:
    post:
      operationId: logout
      tags:
        - 认证与令牌
      summary: 登出当前会话
      description: 吊销当前访问令牌与刷新令牌，并结束服务端会话；重复登出按幂等处理。
      responses:
        '204':
          description: 登出成功；令牌已吊销，无响应体。
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/me:
    get:
      operationId: getCurrentUser
      tags:
        - 认证与令牌
      summary: 查询当前用户与权限
      description: 返回当前登录用户的角色、权限点与数据范围，供前端菜单与按钮级鉴权使用。
      responses:
        '200':
          description: 当前用户信息与权限快照。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
              example:
                userId: '1000000000000000001'
                username: demo.anesthesiologist
                displayName: 演示医师
                roles:
                  - SYS_ANESTHESIOLOGIST
                permissions:
                  - anesthesia:record:read
                  - anesthesia:record:write
                  - anesthesia:record:lock
                dataScopes:
                  - type: DEPARTMENT
                    scopeIds:
                      - '2000000000000000001'
                siteIds:
                  - '3000000000000000001'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/auth/password:
    post:
      operationId: changePassword
      tags:
        - 认证与令牌
      summary: 修改当前用户口令
      description: |
        校验旧口令并设置新口令；成功后 `must_change_password` 置 false。
        首次登录（`must_change_password=true`）时服务端只允许调用 `/v1/auth/me`、
        `/v1/auth/logout` 与本接口，调用其他接口返回 403；改密后需重新登录取得新令牌。
        新口令强度：12–128 字符，至少包含大写、小写、数字、符号四类中的三类。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              oldPassword: SYNTHETIC-OLD-PASSWORD
              newPassword: SYNTHETIC-NEW-PASSWORD-2026
      responses:
        '204':
          description: 口令修改成功，无响应体；客户端应重新登录。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/auth/sessions:
    get:
      operationId: listSessions
      tags:
        - 认证与令牌
      summary: 查询当前用户会话
      description: 返回当前用户的有效与历史登录会话，用于在线设备查看与强制下线；按数据权限过滤。
      parameters:
        - name: page
          in: query
          description: 页码，从 1 开始。
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          description: 每页条数。
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        '200':
          description: 会话分页列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
              example:
                items:
                  - sessionId: '4000000000000000001'
                    userId: '1000000000000000001'
                    clientIp: 10.0.0.10
                    userAgent: SYNTHETIC-BROWSER/1.0
                    loginAt: '2026-11-12T08:00:00+08:00'
                    expiresAt: '2026-11-19T08:00:00+08:00'
                    status: ACTIVE
                    createdAt: '2026-11-12T08:00:00+08:00'
                    createdBy: '1000000000000000001'
                    updatedAt: '2026-11-12T08:00:00+08:00'
                    updatedBy: '1000000000000000001'
                    version: 1
                meta:
                  page: 1
                  size: 20
                  total: 1
                  totalPages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/auth/data-scope/users:
    get:
      operationId: listUsersInDataScope
      tags:
        - 认证与令牌
      summary: 按数据范围查询可见用户（示例接口）
      description: |
        M2-M0-01 数据范围绑定的受保护示例接口：除认证外还要求功能权限点 `m0:org:read`
        （Spring Security 授权表达式 `PERM_m0:org:read`），缺失时返回 403——数据范围只决定可见对象，
        不替代功能权限。按调用者生效的数据范围（ALL/SITE/DEPT/ROOM/SELF）过滤可见用户标识：
        SITE 覆盖 `sys_org.path` 整棵子树（院区自身 + 下属科室），DEPT 精确匹配本科室，ROOM 仅授权术间，
        SELF 仅本人。数据范围为空（未绑定，fail-closed 为 NONE）或请求对象超出范围时返回 403，
        并由服务端写入 ACCESS_DENIED 审计；只返回用户标识，不含姓名、工号、手机号等敏感字段。
        多院区/术间主数据分别由 M0 组织表与 M2-M2-01 术间主数据提供，本接口只做范围过滤示例。
      parameters:
        - name: orgId
          in: query
          description: 组织标识（院区/科室 UUID）；提供时只返回该组织成员（院区按子树展开），超出数据范围返回 403。
          required: false
          schema:
            type: string
            format: uuid
        - name: roomId
          in: query
          description: 术间标识（UUID，逻辑外键，主数据见 M2-M2-01）；提供时只返回该术间授权成员，超出数据范围返回 403。
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 可见用户标识列表（UUID 字符串，去重升序）；无可见数据时为空数组。
          content:
            application/json:
              schema:
                type: array
                description: 可见用户标识列表。
                items:
                  type: string
              example:
                - '10000000-0000-4000-8000-000000000001'
                - '10000000-0000-4000-8000-000000000002'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/auth/users:
    get:
      operationId: listUsers
      tags:
        - 认证与令牌
      summary: 查询用户列表（管理员）
      description: |
        用户管理只读接口（M2-M0-02）：除认证外还要求功能权限点 `m0:user:read`
        （Spring Security 授权表达式 `PERM_m0:user:read`），缺失时返回 403。
        按 `keyword` 检索登录账号/显示名（模糊），关键字为 11 位手机号时改用 HMAC-SHA-256 哈希
        精确匹配（与 `sys_user.phone_hash` 等值），不参与明文比较。
        返回 `UserSummary`：手机号只以 `phoneMasked`（如 `138****5678`）返回，
        永不返回手机号明文、`phone_enc` 密文、`phone_hash` 哈希或口令哈希。
      parameters:
        - name: page
          in: query
          description: 页码，从 1 开始。
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          description: 每页条数，服务端上限 200。
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
        - name: keyword
          in: query
          description: |
            检索关键字：登录账号或显示名（模糊），或完整 11 位手机号（按 HMAC 哈希精确匹配）。
            不得传入患者姓名、身份证、住院号等患者标识。
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: 用户分页列表（仅脱敏字段）；无匹配时 items 为空数组。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummaryPage'
              example:
                items:
                  - userId: '10000000-0000-4000-8000-000000000001'
                    username: demo.newuser
                    displayName: 演示新用户（合成）
                    status: ACTIVE
                    phoneMasked: 138****5678
                    roles:
                      - SYS_ANESTHESIOLOGIST
                    mustChangePassword: true
                    createdAt: '2026-11-13T09:00:00+08:00'
                meta:
                  page: 1
                  size: 20
                  total: 1
                  totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createUser
      tags:
        - 认证与令牌
      summary: 创建用户（管理员）
      description: |
        创建本地账号（M2-M0-02）：需要功能权限点 `m0:user:write`（`PERM_m0:user:write`）。
        登录账号大小写不敏感全局唯一（`uk_sys_user_username` 为 `lower(username)` 唯一索引），
        重复返回 409。手机号可选：提供时在同一事务内写入
        `phone_enc`（AES-256-GCM，随机 IV）、`phone_hash`（HMAC-SHA-256）、
        `phone_key_id`（字段密钥版本）与 `phone_updated_at`，库层一致性约束保证四列同生同灭。
        口令使用 BCrypt 存储，创建后强制首次登录改密（`mustChangePassword=true`）。
        响应只返回脱敏手机号，不回显初始口令、密文或哈希；操作写 USER_CREATE 审计（不含手机号明文）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
            example:
              username: demo.newuser
              displayName: 演示新用户（合成）
              employeeNo: SYN-DEMO-0004
              phone: '13800005678'
              initialPassword: Synth-Init-2026#A
              roles:
                - SYS_ANESTHESIOLOGIST
      responses:
        '201':
          description: 创建成功，返回脱敏用户摘要（不含初始口令、密文与哈希）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
              example:
                userId: '10000000-0000-4000-8000-000000000001'
                username: demo.newuser
                displayName: 演示新用户（合成）
                status: ACTIVE
                phoneMasked: 138****5678
                roles:
                  - SYS_ANESTHESIOLOGIST
                mustChangePassword: true
                createdAt: '2026-11-13T09:00:00+08:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/auth/users/{userId}:
    get:
      operationId: getUser
      tags:
        - 认证与令牌
      summary: 查询用户详情（管理员）
      description: |
        按标识查询单个用户（M2-M0-02）：需要 `m0:user:read`。返回 `UserSummary`，
        手机号只给 `phoneMasked`；账号不存在或已软删除返回 404，不泄露内部字段。
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 用户详情（仅脱敏字段）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
              example:
                userId: '10000000-0000-4000-8000-000000000001'
                username: demo.newuser
                displayName: 演示新用户（合成）
                status: ACTIVE
                phoneMasked: 138****5678
                roles:
                  - SYS_ANESTHESIOLOGIST
                mustChangePassword: false
                createdAt: '2026-11-13T09:00:00+08:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateUser
      tags:
        - 认证与令牌
      summary: 更新用户（管理员）
      description: |
        更新显示名、工号、手机号、账号状态与角色（M2-M0-02）：需要 `m0:user:write`。
        字段缺省表示不变更；`phone` 传空字符串表示清除手机号（同时清空
        `phone_enc`/`phone_hash`/`phone_key_id`/`phone_updated_at`），传新号码时四列同事务重写。
        登录账号不可修改（避免审计指向歧义）。不允许停用当前登录账号；不允许修改当前登录账号
        自身的角色；只能授予操作人自身权限点集合内的角色（超集 403）。改工号撞院内唯一
        （`uk_sys_user_employee_no`）返回 409。操作写 USER_UPDATE 审计（不含手机号明文）。
        响应只返回脱敏手机号。
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
            example:
              displayName: 演示新用户（合成，已改名）
              phone: '13900001234'
              status: ACTIVE
              roles:
                - SYS_ANESTHESIOLOGIST
                - SYS_OR_MANAGER
      responses:
        '200':
          description: 更新成功，返回脱敏用户摘要。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
              example:
                userId: '10000000-0000-4000-8000-000000000001'
                username: demo.newuser
                displayName: 演示新用户（合成，已改名）
                status: ACTIVE
                phoneMasked: 139****1234
                roles:
                  - SYS_ANESTHESIOLOGIST
                  - SYS_OR_MANAGER
                mustChangePassword: false
                createdAt: '2026-11-13T09:00:00+08:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/auth/users/{userId}/password-reset:
    post:
      operationId: resetUserPassword
      tags:
        - 认证与令牌
      summary: 重置用户口令（管理员）
      description: |
        管理员重置指定账号口令（M2-M0-02）：需要 `m0:user:write`。
        服务端生成一次性初始口令，仅在本响应中返回一次（不写库明文、不入日志/审计）；库内只存
        BCrypt 哈希，并把 `must_change_password` 置 true、失败计数与锁定清零。
        重置后旧口令立即失效，同一事务内撤销目标用户的全部刷新令牌（既有会话立即失效，
        旧刷新令牌返回 401）。操作写 PASSWORD_RESET 审计（不含口令与手机号明文）。
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 重置成功；一次性初始口令仅本次响应返回，客户端不得缓存或记录。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetResponse'
              example:
                userId: '10000000-0000-4000-8000-000000000001'
                initialPassword: Synth-Reset-2026#B
                mustChangePassword: true
                passwordResetAt: '2026-11-13T09:30:00+08:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 统一 OAuth2/JWT 访问令牌，放在 Authorization 请求头中（Bearer 方案）。
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: 用户标识（UUID 字符串）。
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: 请求参数校验失败：字段缺失、格式非法或取值越界；details 为字段级错误数组。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: PARAM_INVALID
            message: 请求参数校验失败
            traceId: SYNTH-TRACE-0005
            details:
              - field: username
                reason: 登录账号不能为空
    Unauthorized:
      description: 未认证：未携带令牌、令牌过期或签名无效。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: AUTH_UNAUTHORIZED
            message: 未认证或令牌已失效
            traceId: SYNTH-TRACE-0001
            details: []
    Forbidden:
      description: 已认证但无权限，或请求超出当前用户数据范围。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: AUTH_FORBIDDEN
            message: 无权访问该资源或数据范围不足
            traceId: SYNTH-TRACE-0002
            details:
              - field: dataScope
                reason: 当前角色不包含该科室数据范围
    NotFound:
      description: 资源不存在，或存在但不在当前用户可见范围内（不泄露存在性）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RESOURCE_NOT_FOUND
            message: 资源不存在或不可见
            traceId: SYNTH-TRACE-0003
            details: []
    Conflict:
      description: 业务状态冲突：登录账号已存在（大小写不敏感）或并发写入冲突。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: STATE_CONFLICT
            message: 登录账号已存在或数据已被修改
            traceId: SYNTH-TRACE-0004
            details:
              - field: username
                reason: 登录账号大小写不敏感唯一，已存在同名账号
    TooManyRequests:
      description: 同一来源 IP 的登录/刷新请求超过限流阈值，稍后重试。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RATE_LIMITED
            message: 请求过于频繁，请稍后重试
            traceId: SYNTH-TRACE-0007
            details: []
    UnprocessableEntity:
      description: 请求语义不合法：字段格式正确但业务规则拒绝，message 使用统一模糊文案，不暴露账号状态。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: BUSINESS_RULE_VIOLATION
            message: 账号状态或认证方式不允许登录
            traceId: SYNTH-TRACE-0006
            details: []
  schemas:
    ErrorDetail:
      type: object
      description: 错误明细项，用于字段级校验失败或权限范围说明。
      required:
        - field
        - reason
      properties:
        field:
          type: string
          description: 相关字段名或资源标识。
        reason:
          type: string
          description: 可读的失败原因，不包含堆栈、SQL 实参与内部路径。
    Error:
      type: object
      description: 统一错误响应；错误信息不暴露堆栈、SQL 实参与患者标识。
      required:
        - code
        - message
        - traceId
        - details
      properties:
        code:
          type: string
          description: 稳定错误码，供前端分支与告警规则使用，如 AUTH_UNAUTHORIZED。
        message:
          type: string
          description: 面向用户的中文提示，可安全展示。
        traceId:
          type: string
          description: 链路追踪标识，与日志、审计记录关联，便于排障。
        details:
          type: array
          description: 字段级或范围级错误明细；无明细时为空数组。
          items:
            $ref: '#/components/schemas/ErrorDetail'
    PageMeta:
      type: object
      description: 分页元数据；页码从 1 开始，size 上限由服务端限制。
      required:
        - page
        - size
        - total
        - totalPages
      properties:
        page:
          type: integer
          description: 当前页码，从 1 开始。
          minimum: 1
        size:
          type: integer
          description: 每页条数。
          minimum: 1
          maximum: 200
        total:
          type: integer
          description: 符合条件的总条数。
          minimum: 0
        totalPages:
          type: integer
          description: 总页数；total 为 0 时为 0。
          minimum: 0
    AuditFields:
      type: object
      description: 审计与乐观锁公共字段；临床数据不物理删除，删除以 deletedAt 另行扩展。
      required:
        - createdAt
        - createdBy
        - updatedAt
        - updatedBy
        - version
      properties:
        createdAt:
          type: string
          format: date-time
          description: 创建时间（服务端时间，Asia/Shanghai 展示）。
        createdBy:
          type: string
          description: 创建人用户标识。
        updatedAt:
          type: string
          format: date-time
          description: 最后更新时间（服务端时间）。
        updatedBy:
          type: string
          description: 最后修改人用户标识。
        version:
          type: integer
          description: 乐观锁版本号，从 1 开始；更新必须回传。
          minimum: 1
    LoginRequest:
      type: object
      description: 登录请求；authType 决定走本地口令、AD/LDAP 还是 SSO。
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: 登录账号（工号或域账号），非患者标识。
          minLength: 1
          maxLength: 64
        password:
          type: string
          description: 口令；仅通过 TLS 传输，日志与审计不得记录明文。
          minLength: 1
          maxLength: 128
        authType:
          type: string
          description: 认证方式，默认 LOCAL。
          enum:
            - LOCAL
            - LDAP
            - SSO
          default: LOCAL
    ChangePasswordRequest:
      type: object
      description: 修改口令请求；旧口令用于二次确认，新口令需满足强度规则。
      required:
        - oldPassword
        - newPassword
      properties:
        oldPassword:
          type: string
          description: 当前口令；仅通过 TLS 传输，日志与审计不得记录明文。
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          description: 新口令；12–128 字符，至少包含大写、小写、数字、符号四类中的三类。
          minLength: 12
          maxLength: 128
    RefreshRequest:
      type: object
      description: 刷新令牌请求。
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: 未过期的刷新令牌；轮换后旧值立即失效。
          minLength: 1
    TokenResponse:
      type: object
      description: 令牌响应；expiresIn 单位为秒。
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
        - user
      properties:
        accessToken:
          type: string
          description: JWT 访问令牌，放入 Authorization 请求头（Bearer 方案）。
        refreshToken:
          type: string
          description: 刷新令牌，仅用于 /auth/refresh。
        tokenType:
          type: string
          description: 令牌类型，固定 Bearer。
          enum:
            - Bearer
        expiresIn:
          type: integer
          description: 访问令牌有效期（秒）。
          minimum: 1
        user:
          $ref: '#/components/schemas/CurrentUser'
    DataScope:
      type: object
      description: |
        数据权限范围，对应 §3.9.2 的全院/院区/科室/术间/本人患者五类。
        与 sys_role.data_scope 一一映射：ALL→ALL、SITE→SITE、DEPT→DEPARTMENT、
        ROOM→ROOM、SELF→OWN_PATIENTS；M2-M0-01 起 scopeIds 由绑定表填充
        （SITE/DEPT 取 sys_user_org、ROOM 取 sys_user_room；未绑定或查询失败时 dataScopes 为空数组，
        表示无任何数据权限，即 fail-closed）。
      required:
        - type
        - scopeIds
      properties:
        type:
          type: string
          description: 数据范围类型（SITE=院区，对应 sys_role.data_scope 的 SITE）。
          enum:
            - ALL
            - SITE
            - DEPARTMENT
            - ROOM
            - OWN_PATIENTS
        scopeIds:
          type: array
          description: 范围对象标识；ALL 时为空数组。
          items:
            type: string
    CurrentUser:
      type: object
      description: 当前用户、角色、权限点与数据范围快照。
      required:
        - userId
        - username
        - displayName
        - roles
        - permissions
        - dataScopes
        - siteIds
      properties:
        userId:
          type: string
          description: 用户标识（UUID 字符串）。
        username:
          type: string
          description: 登录账号。
        displayName:
          type: string
          description: 展示名；示例统一使用“演示医师”等合成称谓。
        staffId:
          type: [string, 'null']
          description: 关联人员档案标识；纯系统账号可为 null。
        mustChangePassword:
          type: boolean
          description: |
            是否必须先修改初始口令。为 true 时服务端仅允许 /v1/auth/me、
            /v1/auth/logout 与 /v1/auth/password，其余接口返回 403。
        roles:
          type: array
          description: |
            角色编码列表。预置角色码：SYS_ADMIN（R9 信息科管理员）、
            SYS_ANESTHESIOLOGIST（R2 麻醉医师）、SYS_NURSE_ANESTHETIST（R3 麻醉护士）、
            SYS_SURGEON（R10 手术科室医师）、SYS_OR_MANAGER（R4 手术室护士/管理员）、
            SYS_QC_MANAGER（R8 质控专员）。R1/R5/R6/R7/R11 由院方岗位矩阵在 M1 按同一
            编码规范（SYS_ 前缀 + 上划线大写）落库，映射表见 docs/modules/m0/README.md。
          items:
            type: string
        permissions:
          type: array
          description: |
            权限点列表，粒度到“菜单 + 操作”，编码为冒号分隔的 `<模块>:<资源>:<动作>`
            （如 m0:auth:read、anesthesia:record:read；V2 历史权限点为
            `<模块>:<动作>` 形式，如 auth:login，M1 起新增权限点统一三段式）。
            服务端 Spring Security 授权表达式使用加前缀形式
            `PERM_<code>`（如 PERM_m0:auth:read）；角色授权使用 `ROLE_<code>`。
          items:
            type: string
        dataScopes:
          type: array
          description: 数据权限范围列表。
          items:
            $ref: '#/components/schemas/DataScope'
        siteIds:
          type: array
          description: 可访问院区标识列表。
          items:
            type: string
    Session:
      type: object
      description: 登录会话；用于在线设备查看与强制下线。
      allOf:
        - $ref: '#/components/schemas/AuditFields'
        - type: object
          required:
            - sessionId
            - userId
            - clientIp
            - userAgent
            - loginAt
            - expiresAt
            - status
          properties:
            sessionId:
              type: string
              description: 会话标识。
            userId:
              type: string
              description: 所属用户标识。
            clientIp:
              type: string
              description: 登录客户端 IP（审计用，不记录患者信息）。
            userAgent:
              type: string
              description: 客户端标识摘要；示例为合成值。
            loginAt:
              type: string
              format: date-time
              description: 登录时间。
            expiresAt:
              type: string
              format: date-time
              description: |
                会话（刷新令牌）过期时间：登录后 7 天（anesop.security.jwt.refresh-ttl）。
                当前无空闲超时；若 M1 启用空闲超时，在此补充口径。
            status:
              type: string
              description: 会话状态。
              enum:
                - ACTIVE
                - EXPIRED
                - REVOKED
    SessionPage:
      type: object
      description: 会话分页结果。
      required:
        - items
        - meta
      properties:
        items:
          type: array
          description: 当前页会话列表。
          items:
            $ref: '#/components/schemas/Session'
        meta:
          $ref: '#/components/schemas/PageMeta'
    UserStatus:
      type: string
      description: 账号状态：ACTIVE=启用（sys_user.status=1），DISABLED=停用（0，等保离职停用）。
      enum:
        - ACTIVE
        - DISABLED
    UserSummary:
      type: object
      description: |
        用户摘要（用户管理列表/详情/创建/更新返回）。只含脱敏手机号 `phoneMasked`；
        永不返回手机号明文、`phone_enc` 密文、`phone_hash` 哈希或口令哈希。
      required:
        - userId
        - username
        - displayName
        - status
        - roles
        - mustChangePassword
        - createdAt
      properties:
        userId:
          type: string
          description: 用户标识（UUID 字符串）。
        username:
          type: string
          description: 登录账号（创建后不可修改）。
          maxLength: 64
        displayName:
          type: string
          description: 显示名；示例统一使用“演示新用户（合成）”等合成称谓。
          maxLength: 100
        status:
          $ref: '#/components/schemas/UserStatus'
        phoneMasked:
          type: [string, 'null']
          description: |
            脱敏手机号（保留前 3 位与后 4 位，如 `138****5678`）；未登记手机号为 null。
            该字段由服务端解密后在内存中脱敏生成，密文与哈希不出服务端。
          maxLength: 11
        roles:
          type: array
          description: 角色编码列表（如 SYS_ADMIN）；用户管理写入时按编码解析。
          items:
            type: string
        mustChangePassword:
          type: boolean
          description: 是否必须先修改初始口令；创建与管理员重置后强制为 true。
        createdAt:
          type: string
          format: date-time
          description: 创建时间（服务端时间，Asia/Shanghai 展示）。
    UserSummaryPage:
      type: object
      description: 用户分页结果；items 只含脱敏字段。
      required:
        - items
        - meta
      properties:
        items:
          type: array
          description: 当前页用户摘要列表。
          items:
            $ref: '#/components/schemas/UserSummary'
        meta:
          $ref: '#/components/schemas/PageMeta'
    UserCreateRequest:
      type: object
      description: |
        创建用户请求。登录账号大小写不敏感唯一；手机号可选，提供时同时写入密文/哈希/密钥版本
        与更新时间；口令使用 BCrypt 存储，创建后强制首次登录改密。
      required:
        - username
        - displayName
        - initialPassword
      properties:
        username:
          type: string
          description: 登录账号（工号或域账号），大小写不敏感全局唯一；非患者标识。
          minLength: 1
          maxLength: 64
        displayName:
          type: string
          description: 显示名（中文姓名或合成称谓）；不得写入患者标识。
          minLength: 1
          maxLength: 100
        employeeNo:
          type: string
          description: 员工工号（可选，非空时院内唯一）；与 M3 人员档案按工号对齐。
          maxLength: 64
        phone:
          type: string
          description: |
            手机号（可选）：中国内地 11 位（`1[3-9]` 开头），允许 `+86`/空格/短横线书写，
            服务端规范化后加密与哈希。仅用于院内通讯，不返回明文。
          maxLength: 20
        initialPassword:
          type: string
          description: 初始口令；12–128 字符，至少包含大写、小写、数字、符号四类中的三类；不得包含登录账号。
          minLength: 12
          maxLength: 128
        roles:
          type: array
          description: 初始角色编码列表（可空）；未知编码返回 400。
          items:
            type: string
    UserUpdateRequest:
      type: object
      description: |
        更新用户请求；字段缺省表示不变更。登录账号不可修改。`phone` 传空字符串表示清除手机号，
        传新号码时同时重写密文/哈希/密钥版本/更新时间。不允许停用当前登录账号。
      properties:
        displayName:
          type: string
          description: 显示名。
          minLength: 1
          maxLength: 100
        employeeNo:
          type: string
          description: 员工工号；传空字符串表示清除。
          maxLength: 64
        phone:
          type: string
          description: 手机号；缺省不变、空字符串清除、非空则规范化后重写密文与哈希。
          maxLength: 20
        status:
          $ref: '#/components/schemas/UserStatus'
        roles:
          type: array
          description: 角色编码列表；缺省不变，传空数组表示清空全部角色。
          items:
            type: string
    PasswordResetResponse:
      type: object
      description: |
        管理员重置口令结果。初始口令为一次性明文，仅本次响应返回；服务端只存 BCrypt 哈希，
        并把 mustChangePassword 强制置 true。客户端不得缓存、打印或写入日志。
      required:
        - userId
        - initialPassword
        - mustChangePassword
        - passwordResetAt
      properties:
        userId:
          type: string
          description: 被重置的用户标识。
        initialPassword:
          type: string
          description: 一次性初始口令（12–128 字符，满足口令强度规则）；仅本次响应返回。
          minLength: 12
          maxLength: 128
        mustChangePassword:
          type: boolean
          description: 恒为 true：重置后首次登录必须先改密。
        passwordResetAt:
          type: string
          format: date-time
          description: 重置时间（服务端时间）。
