  /v1/scheduling/emergency-cases:
    post:
      operationId: addEmergencyCase
      tags:
        - 手术排程
      summary: 急诊加台
      description: |
        急诊手术绿色通道加台（M2-M2-02，方案书 §2.4.2、§2.3.2）：急诊优先于择期。
        调用方必须持 `m1:schedule:approve`（SYS_ADMIN/SYS_OR_MANAGER），缺失 403；
        事务内校验目标术间/时段冲突并写审批记录。

        冲突处理（MVP）：未指定 `preemptScheduleId` 时返回 409 `SCHEDULE_CONFLICT`，
        `Error.conflicts[]` 列出冲突台次（`conflictingScheduleId`），前端据此提示可抢占的
        择期台次；指定 `preemptScheduleId` 且该台次确为冲突中的择期台次（PLANNED/PUBLISHED）
        时，先将其置 `CANCELLED`（reasonCode=EMERGENCY_PREEMPT）并写 STOP 变更记录/通知，
        再插入 priority=EMERGENCY 的急诊台次。单纯人员/患者冲突不可通过抢占消除，仍 409。

        成功返回 201：台次落库、`schedule_change_request` 写 EMERGENCY 审批记录
        （approvalStatus=APPROVED，approvedBy=调用人）、写 `SCHEDULE_EMERGENCY_CREATE` 审计、
        写通知 outbox（`EMERGENCY_SCHEDULED`，抢占时另写 `SCHEDULE_PREEMPTED`），
        payload 只含标识/原因码，无 PHI。

        并发正确性：抢占目标在事务内以 `SELECT ... FOR UPDATE` 锁定后**复检**状态
        （PLANNED/PUBLISHED）、优先级（ELECTIVE）、术间（必须仍为目标术间）与时段（仍与本次
        候选冲突）；任一不再满足返回 409 `PREEMPT_CONFLICT`，不会误停已被改台移走的台次。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmergencyAddRequest'
            example:
              applicationId: '6000000000000000002'
              roomId: '7000000000000000002'
              reasonCode: EMERGENCY_GREEN_CHANNEL
              reason: 演示急诊加台（合成数据）
              expectedStart: '2026-12-01T13:00:00+08:00'
              expectedEnd: '2026-12-01T15:00:00+08:00'
              sequenceNo: 3
              preemptScheduleId: null
      responses:
        '200':
          description: |
            保留响应声明（兼容 0.4.0 调用方；当前 0.5.0 MVP 实现恒返回 201）。
            该字段用于避免 0.x 阶段的破坏性删除（ADR-0011），1.0.0 时若确认不可达再走 major 清理。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyAddResult'
              example:
                accepted: true
                scheduleId: '8000000000000000002'
                approvalRequired: true
                conflicts: []
        '201':
          description: 急诊加台成功，返回急诊台次与审批记录。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyAddResult'
              example:
                accepted: true
                scheduleId: '8000000000000000002'
                approvalRequired: true
                conflicts: []
                approval:
                  changeId: '9000000000000000002'
                  changeType: EMERGENCY
                  status: APPROVED
                  requestedBy: '1000000000000000001'
                  requestedAt: '2026-12-01T12:55:00+08:00'
                  approvedBy: '1000000000000000001'
                  approvedAt: '2026-12-01T12:55:00+08:00'
                  preemptScheduleId: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
