  /v1/scheduling/analytics/utilization:
    get:
      operationId: getSchedulingUtilization
      tags:
        - 排程分析
      summary: 术间利用率（按术间与汇总）
      description: |
        只读聚合，权限 `m1:analytics:read`；数据范围与排程工作台一致（DEPT 本科室 / ROOM 绑定术间，
        未绑定或无可见术间 403）。

        口径（口径版本 analytics-1.0.0，时区 **Asia/Shanghai**）：
        `术间利用率 = 总手术时长 / 可用时长`。
        - `from`/`to` 为本地日期闭区间，跨度（含首尾）**默认 92 天**，可配置
          `anesop.m1.analytics.max-range-days` 但**上限夹紧为 92 天**（配置 >92 时按 92 生效并 WARN），
          超过当前上限返回 400；
        - 分子 `totalSurgeryMinutes`：状态非 `CANCELLED` 的台次与查询区间重叠部分的**计划时长**
          （非实际占用/麻醉时长，口径【待确认】），跨日/跨区间按重叠分钟裁剪；
          台次按 `start_at` 归属，跨日不重复计入次日；
        - 分母 `availableMinutes`：可见术间数 × 区间天数 × `availableMinutesPerRoomPerDay`
          （默认 600 分钟/间/日，可配置 `anesop.m1.analytics.room-daily-available-minutes`）。
          分母按区间内**全部自然日**计算，当前**未排除未来日期、停诊日或节假日**，
          院方实际开放时长与开诊日历均标【待确认】；
        - 无可见术间或无台次时各项为 0，`utilizationRate` 返回 0，不做除零；
        - 利用率可大于 1（超排/跨区间），客户端按实际值展示。
      parameters:
        - name: from
          in: query
          required: true
          description: 起始本地日期（含），格式 YYYY-MM-DD，按 Asia/Shanghai 解释。
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: 结束本地日期（含），格式 YYYY-MM-DD；与 from 跨度默认 ≤ 92 天（上限 92）。
          schema:
            type: string
            format: date
        - name: deptId
          in: query
          required: false
          description: 科室标识（UUID）；仅统计该科室术间，且必须在当前用户数据范围内（越界 403）。
          schema:
            type: string
      responses:
        '200':
          description: 术间利用率汇总与明细（仅聚合值，不含患者标识）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UtilizationReport'
              example:
                from: '2026-12-01'
                to: '2026-12-01'
                timezone: Asia/Shanghai
                formula: 总手术时长 / 可用时长
                availableMinutesPerRoomPerDay: 600
                days: 1
                roomCount: 2
                summary:
                  totalSurgeryMinutes: 180
                  availableMinutes: 1200
                  utilizationRate: 0.15
                  caseCount: 2
                  roomCount: 2
                  days: 1
                rooms:
                  - roomId: 'f2000000-0000-4000-8000-0000000000c1'
                    roomNo: OR-01
                    deptId: 'f1000000-0000-4000-8000-000000000002'
                    deptName: 麻醉科（合成）
                    totalSurgeryMinutes: 120
                    availableMinutes: 600
                    utilizationRate: 0.2
                    caseCount: 1
                  - roomId: 'f2000000-0000-4000-8000-0000000000c2'
                    roomNo: OR-02
                    deptId: 'f1000000-0000-4000-8000-000000000002'
                    deptName: 麻醉科（合成）
                    totalSurgeryMinutes: 60
                    availableMinutes: 600
                    utilizationRate: 0.1
                    caseCount: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/scheduling/analytics/on-time:
    get:
      operationId: getSchedulingOnTimeRate
      tags:
        - 排程分析
      summary: 首台准点开台率（按术间与汇总）
      description: |
        只读聚合，权限 `m1:analytics:read`；数据范围同排程工作台。

        口径（口径版本 analytics-1.0.0，时区 **Asia/Shanghai**）：
        `首台准点率 = 准点首台台次 / 已评估首台台次`。
        - 首台：同一术间、同一本地日期内**计划开始最早**的台次（不论状态，按 `start_at` 排序，
          相同时按 `sequence`、`id` 稳定排序）；
        - 若该计划首台为 `CANCELLED` 或未开始（`PLANNED`/`PUBLISHED`/`DELAYED`），或缺少实际开始
          时间，则该术间-日**不纳入准点评估**（分母排除），计入 `excludedDays`，
          **不以下一台次替代**；`firstCaseCount = evaluatedCaseCount + excludedDays`；
        - 实际开始：**MVP 以台次最近更新时间 `updated_at` 近似**（V8 无独立 actualStart 列，
          HIS 尚未回写实际开台时间与真实状态；【待确认】）。正式口径须由 HIS/M3 回写真实切皮/开台
          时间后替换；系统内该数据当前不足；
        - 准点判定：`abs(实际开始 - 计划开始) ≤ thresholdMinutes`（默认 15 分钟，可配置
          `anesop.m1.analytics.on-time-threshold-minutes`）；早于计划同样按绝对值计入；
        - 分母为 0 时 `onTimeRate=0`、计数为 0，不做除零；前端在 `evaluatedCaseCount=0` 时展示
          “暂无数据”而非 0.0%；
        - 响应 `actualStartSource=SCHEDULE_UPDATED_AT` 明示代理口径，便于前端提示。
      parameters:
        - name: from
          in: query
          required: true
          description: 起始本地日期（含），格式 YYYY-MM-DD，按 Asia/Shanghai 解释。
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: 结束本地日期（含），格式 YYYY-MM-DD；与 from 跨度默认 ≤ 92 天（上限 92）。
          schema:
            type: string
            format: date
        - name: deptId
          in: query
          required: false
          description: 科室标识（UUID）；仅统计该科室术间，且必须在当前用户数据范围内（越界 403）。
          schema:
            type: string
      responses:
        '200':
          description: 首台准点率汇总与明细（仅聚合值，不含患者标识）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnTimeReport'
              example:
                from: '2026-12-01'
                to: '2026-12-01'
                timezone: Asia/Shanghai
                thresholdMinutes: 15
                actualStartSource: SCHEDULE_UPDATED_AT
                summary:
                  firstCaseCount: 2
                  evaluatedCaseCount: 2
                  excludedDays: 0
                  onTimeCount: 1
                  delayedCount: 1
                  onTimeRate: 0.5
                rooms:
                  - roomId: 'f2000000-0000-4000-8000-0000000000c1'
                    roomNo: OR-01
                    deptId: 'f1000000-0000-4000-8000-000000000002'
                    deptName: 麻醉科（合成）
                    firstCaseCount: 1
                    evaluatedCaseCount: 1
                    excludedDays: 0
                    onTimeCount: 1
                    delayedCount: 0
                    onTimeRate: 1.0
                  - roomId: 'f2000000-0000-4000-8000-0000000000c2'
                    roomNo: OR-02
                    deptId: 'f1000000-0000-4000-8000-000000000002'
                    deptName: 麻醉科（合成）
                    firstCaseCount: 1
                    evaluatedCaseCount: 1
                    excludedDays: 0
                    onTimeCount: 0
                    delayedCount: 1
                    onTimeRate: 0.0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/scheduling/analytics/cancellations:
    get:
      operationId: getSchedulingCancellationRate
      tags:
        - 排程分析
      summary: 取消率（按原因码与术间分组）
      description: |
        只读聚合，权限 `m1:analytics:read`；数据范围同排程工作台。

        口径（口径版本 analytics-1.0.0，时区 **Asia/Shanghai**）：
        `取消率 = 取消台次 / 总台次`。
        - 统计区间内（按台次计划开始日期归属）全部未删除台次，已取消台次也进入分母；
        - `from`/`to` 跨度（含首尾）默认 92 天，可配置但上限夹紧为 92 天，超过当前上限返回 400；
        - 取消台次为 `status=CANCELLED`（含急诊抢占择期台次，原因码 `EMERGENCY_PREEMPT`）；
        - 原因码取该台次最近一条 `STOP` 变更记录；无变更记录（历史数据）归 `UNSPECIFIED`，
          不臆造具体原因；
        - 分母为 0 时 `cancellationRate=0`，不做除零；原因占比 `shareOfCancelled` 在取消数为 0 时为 0。
      parameters:
        - name: from
          in: query
          required: true
          description: 起始本地日期（含），格式 YYYY-MM-DD，按 Asia/Shanghai 解释。
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: 结束本地日期（含），格式 YYYY-MM-DD；与 from 跨度默认 ≤ 92 天（上限 92）。
          schema:
            type: string
            format: date
        - name: deptId
          in: query
          required: false
          description: 科室标识（UUID）；仅统计该科室术间，且必须在当前用户数据范围内（越界 403）。
          schema:
            type: string
      responses:
        '200':
          description: 取消率汇总、原因码分组与术间明细（仅聚合值，不含患者标识）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationReport'
              example:
                from: '2026-12-01'
                to: '2026-12-01'
                timezone: Asia/Shanghai
                summary:
                  totalCases: 4
                  cancelledCases: 1
                  cancellationRate: 0.25
                byReason:
                  - reasonCode: PATIENT_CONDITION
                    cancelledCases: 1
                    shareOfCancelled: 1.0
                byRoom:
                  - roomId: 'f2000000-0000-4000-8000-0000000000c1'
                    roomNo: OR-01
                    deptId: 'f1000000-0000-4000-8000-000000000002'
                    deptName: 麻醉科（合成）
                    totalCases: 3
                    cancelledCases: 1
                    cancellationRate: 0.3333
                  - roomId: 'f2000000-0000-4000-8000-0000000000c2'
                    roomNo: OR-02
                    deptId: 'f1000000-0000-4000-8000-000000000002'
                    deptName: 麻醉科（合成）
                    totalCases: 1
                    cancelledCases: 0
                    cancellationRate: 0.0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/scheduling/analytics/export:
    get:
      operationId: exportSchedulingAnalytics
      tags:
        - 排程分析
      summary: 导出排程分析 CSV（脱敏）
      description: |
        只读导出，权限 `m1:analytics:read`；数据范围与对应分析接口一致。

        脱敏要求（AGENTS 患者数据红线）：
        - 仅输出指标名、日期区间、术间编号/科室、聚合计数与比率；
        - **不含**患者姓名、住院号、证件号、手机号、诊断、手术申请号或任何患者标识；
        - UTF-8 编码并带 BOM（Excel 中文兼容）；`Content-Type: text/csv;charset=UTF-8`；
        - **公式注入防护**：以 `=`、`+`、`-`、`@`、制表符或回车开头的单元格先前置单引号 `'`，
          再按 CSV 规则处理逗号/引号/换行，防止 Excel/Sheets 将科室名、术间号或原因码当公式执行；
        - 流式输出，行数随术间/原因码数量变化；空数据集仍输出表头与汇总 0 行。

        `metric` 取值与列口径：
        - `utilization`：利用率汇总 + 每术间；
        - `on-time`：准点率汇总 + 每术间；
        - `cancellations`：取消率汇总 + 每术间 + 每原因码。
        参数校验：`metric`/`format` 非法、缺 `from`/`to`、跨度超过 92 天上限、`deptId` 非法 → 400。
      parameters:
        - name: metric
          in: query
          required: true
          description: 指标：utilization=利用率，on-time=准点率，cancellations=取消率。
          schema:
            type: string
            enum:
              - utilization
              - on-time
              - cancellations
        - name: from
          in: query
          required: true
          description: 起始本地日期（含），格式 YYYY-MM-DD，按 Asia/Shanghai 解释。
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: 结束本地日期（含），格式 YYYY-MM-DD；与 from 跨度默认 ≤ 92 天（上限 92）。
          schema:
            type: string
            format: date
        - name: format
          in: query
          required: true
          description: 导出格式；当前仅支持 csv（UTF-8 BOM）。
          schema:
            type: string
            enum:
              - csv
        - name: deptId
          in: query
          required: false
          description: 科室标识（UUID）；仅导出该科室术间，且必须在当前用户数据范围内（越界 403）。
          schema:
            type: string
      responses:
        '200':
          description: 脱敏 CSV 文件（UTF-8 BOM），仅聚合值与术间/日期。
          headers:
            Content-Disposition:
              description: 附件文件名，形如 attachment; filename="scheduling-utilization-2026-12-01-2026-12-31.csv"。
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
              example: |
                metric,from,to,scope,roomNo,deptName,reasonCode,totalSurgeryMinutes,availableMinutes,utilizationRate,caseCount,firstCaseCount,evaluatedCaseCount,onTimeCount,onTimeRate,totalCases,cancelledCases,cancellationRate,shareOfCancelled
                utilization,2026-12-01,2026-12-01,SUMMARY,ALL,ALL,,180,1200,0.15,2,,,,,,,,
                utilization,2026-12-01,2026-12-01,ROOM,OR-01,麻醉科（合成）,,120,600,0.2,1,,,,,,,,
                utilization,2026-12-01,2026-12-01,ROOM,OR-02,麻醉科（合成）,,60,600,0.1,1,,,,,,,,
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 统一 OAuth2/JWT 访问令牌，放在 Authorization 头中。
  responses:
    BadRequest:
      description: 请求参数校验失败：字段缺失、格式非法或取值越界；details 为字段级错误数组。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: PARAM_INVALID
            message: 请求参数校验失败
            traceId: SYNTH-TRACE-0005
            details:
              - field: plannedEnd
                reason: 计划结束时间必须晚于计划开始时间
    Unauthorized:
      description: 未认证：未携带令牌、令牌过期或签名无效。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: AUTH_UNAUTHORIZED
            message: 未认证或令牌已失效
            traceId: SYNTH-TRACE-0001
            details: []
    Forbidden:
      description: 已认证但无权限，或请求超出当前用户数据范围。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: AUTH_FORBIDDEN
            message: 无权访问该资源或数据范围不足
            traceId: SYNTH-TRACE-0002
            details:
              - field: dataScope
                reason: 当前角色不包含该科室数据范围
    NotFound:
      description: 资源不存在，或存在但不在当前用户数据权限内（不泄露存在性）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RESOURCE_NOT_FOUND
            message: 资源不存在或不可见
            traceId: SYNTH-TRACE-0003
            details: []
    Conflict:
      description: 排程冲突、状态冲突或乐观锁版本冲突。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: SCHEDULE_CONFLICT
            message: 目标时段与已有排程冲突或版本已过期
            traceId: SYNTH-TRACE-0004
            details:
              - field: plannedStart
                reason: 与已发布台次时段重叠
            conflicts:
              - conflictType: ROOM_OVERLAP
                severity: BLOCKING
                message: 与术间 OR-01 第 1 台时段重叠
                conflictingScheduleId: '8000000000000000001'
    UnprocessableEntity:
      description: 请求语义不合法：字段格式正确但业务规则拒绝，details 说明原因。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: BUSINESS_RULE_VIOLATION
            message: 排程语义校验未通过
            traceId: SYNTH-TRACE-0006
            details:
              - field: roomId
                reason: 该术间不满足申请要求的隔离条件
  schemas:
    ErrorDetail:
      type: object
      description: 错误明细项，用于字段级校验失败或冲突说明。
      required:
        - field
        - reason
      properties:
        field:
          type: string
          description: 相关字段名或资源标识。
        reason:
          type: string
          description: 可读的失败原因，不包含堆栈、SQL 实参与内部路径。
    Error:
      type: object
      description: 统一错误响应；错误信息不暴露堆栈、SQL 实参与患者标识。
      required:
        - code
        - message
        - traceId
        - details
      properties:
        code:
          type: string
          description: 稳定错误码，供前端分支与告警规则使用。
        message:
          type: string
          description: 面向用户的中文提示，可安全展示。
        traceId:
          type: string
          description: 链路追踪标识，与日志、审计记录关联。
        details:
          type: array
          description: 字段级或范围级错误明细；无明细时为空数组。
          items:
            $ref: '#/components/schemas/ErrorDetail'
        conflicts:
          type: array
          description: 排程冲突明细（仅 409 `SCHEDULE_CONFLICT` 返回；其他错误省略）。
          items:
            $ref: '#/components/schemas/Conflict'
    PageMeta:
      type: object
      description: 分页元数据；页码从 1 开始，size 上限由服务端限制。
      required:
        - page
        - size
        - total
        - totalPages
      properties:
        page:
          type: integer
          description: 当前页码，从 1 开始。
          minimum: 1
        size:
          type: integer
          description: 每页条数。
          minimum: 1
          maximum: 200
        total:
          type: integer
          description: 符合条件的总条数。
          minimum: 0
        totalPages:
          type: integer
          description: 总页数；total 为 0 时为 0。
          minimum: 0
    AuditFields:
      type: object
      description: 审计与乐观锁公共字段；排程变更留版本与原因。
      required:
        - createdAt
        - createdBy
        - updatedAt
        - updatedBy
        - version
      properties:
        createdAt:
          type: string
          format: date-time
          description: 创建时间（服务端时间）。
        createdBy:
          type: string
          description: 创建人用户标识。
        updatedAt:
          type: string
          format: date-time
          description: 最后更新时间（服务端时间）。
        updatedBy:
          type: string
          description: 最后修改人用户标识。
        version:
          type: integer
          description: 乐观锁版本号，从 1 开始；更新必须回传。
          minimum: 1
    IdResponse:
      type: object
      description: 仅返回资源标识的通用响应。
      required:
        - id
      properties:
        id:
          type: string
          description: 雪花 ID 序列化后的字符串，避免前端精度丢失。
    OperatingRoom:
      type: object
      description: 术间静态配置与实时状态。
      allOf:
        - $ref: '#/components/schemas/AuditFields'
        - type: object
          required:
            - roomId
            - roomNo
            - roomName
            - siteId
            - status
            - isolationRequired
            - equipmentTags
          properties:
            roomId:
              type: string
              description: 术间标识。
            roomNo:
              type: string
              description: 术间编号，院内唯一。
              examples:
                - OR-01
            roomName:
              type: string
              description: 术间名称。
            roomType:
              type: string
              description: 术间类型；排程规则按申请要求的术间类型匹配。
              enum:
                - GENERAL
                - HYBRID
                - INTERVENTION
            siteId:
              type: string
              description: 院区标识。
            deptId:
              type:
                - string
                - 'null'
              description: 术间所属科室标识（UUID）；排程分析按此过滤，未配置为 null。
            deptName:
              type:
                - string
                - 'null'
              description: 术间所属科室名称（演示合成文本）；用于排程分析筛选展示。
            status:
              type: string
              description: 术间当前状态。
              enum:
                - IDLE
                - PREPARING
                - ANESTHESIA
                - SURGERY
                - PACU
                - CLEANING
            isolationRequired:
              type: boolean
              description: 是否要求隔离（感染等）。
            equipmentTags:
              type: array
              description: 设备依赖标签，用于排程设备冲突校验。
              items:
                type: string
    OperatingRoomList:
      type: object
      description: 术间列表。
      required:
        - items
      properties:
        items:
          type: array
          description: 术间列表。
          items:
            $ref: '#/components/schemas/OperatingRoom'
    Schedule:
      type: object
      description: 排程/台次；同术间时段不得重叠。
      allOf:
        - $ref: '#/components/schemas/AuditFields'
        - type: object
          required:
            - scheduleId
            - applicationId
            - patientId
            - patientNo
            - patientName
            - roomId
            - roomNo
            - sequenceNo
            - plannedStart
            - plannedEnd
            - status
            - priority
          properties:
            scheduleId:
              type: string
              description: 排程标识。
            applicationId:
              type: string
              description: 手术申请标识。
            patientId:
              type: string
              description: 患者标识。
            patientNo:
              type: string
              deprecated: true
              description: |
                已弃用：编号口径统一为 hisPatientNo；本字段仅为兼容 0.2.0 保留，计划 1.0.0 major 删除。
            patientName:
              type: string
              description: 患者姓名；示例统一使用“演示患者”。
            roomId:
              type: string
              description: 术间标识。
            roomNo:
              type: string
              description: 术间编号。
            sequenceNo:
              type: integer
              description: 台次序号，从 1 开始。
              minimum: 1
            plannedStart:
              type: string
              format: date-time
              description: 计划开始时间（含时区偏移）。
            plannedEnd:
              type: string
              format: date-time
              description: 计划结束时间（含时区偏移）。
            actualStart:
              type:
                - string
                - 'null'
              format: date-time
              description: 实际开始时间；未开始为 null。
            actualEnd:
              type:
                - string
                - 'null'
              format: date-time
              description: 实际结束时间；未结束为 null。
            status:
              type: string
              description: 排程状态。
              enum:
                - PLANNED
                - PUBLISHED
                - IN_PROGRESS
                - COMPLETED
                - CANCELLED
                - DELAYED
            priority:
              type: string
              description: 优先级；急诊优先于择期。
              enum:
                - ELECTIVE
                - URGENT
                - EMERGENCY
            changeReason:
              type:
                - string
                - 'null'
              description: 最近一次改台/停台原因；无变更为 null。
    SchedulePage:
      type: object
      description: 排程分页结果。
      required:
        - items
        - meta
      properties:
        items:
          type: array
          description: 当前页排程列表。
          items:
            $ref: '#/components/schemas/Schedule'
        meta:
          $ref: '#/components/schemas/PageMeta'
    CreateScheduleRequest:
      type: object
      description: 创建排程请求；服务端在事务内复核冲突。
      required:
        - applicationId
        - roomId
        - plannedStart
        - plannedEnd
        - sequenceNo
        - priority
      properties:
        applicationId:
          type: string
          description: 手术申请标识。
        roomId:
          type: string
          description: 术间标识。
        plannedStart:
          type: string
          format: date-time
          description: 计划开始时间。
        plannedEnd:
          type: string
          format: date-time
          description: 计划结束时间，必须晚于开始时间。
        sequenceNo:
          type: integer
          description: 台次序号。
          minimum: 1
        priority:
          type: string
          description: 优先级；持久化到 `schedule.priority` 并在响应回显（0=ELECTIVE/1=URGENT/2=EMERGENCY）。
          enum:
            - ELECTIVE
            - URGENT
            - EMERGENCY
    UpdateScheduleRequest:
      type: object
      description: |
        调整排程（改台）请求；服务端锁定术间并在事务内复检冲突。0.5.0 起**服务端强制要求**
        `reasonCode`（方案书 §2.4.2「停台改台必选原因码」），缺失或非法返回 400
        `PARAM_INVALID`；契约字段保持 optional 以维持 0.x 的 additive 兼容（ADR-0011），
        1.0.0 major 时再将其声明为 required。
      required:
        - plannedStart
        - plannedEnd
        - sequenceNo
        - version
      properties:
        reasonCode:
          type: string
          description: |
            改台原因码（服务端必填，缺失 400；字段在 1.0.0 前保持 optional）。白名单：SCHEDULE_ADJUST、SURGEON_UNAVAILABLE、
            ROOM_EQUIPMENT_FAILURE、PATIENT_CONDITION、ANESTHESIA_RISK、OTHER；
            缺失/非法返回 400 `PARAM_INVALID`（`details[].field=reasonCode`）。
          maxLength: 32
        roomId:
          type: [string, 'null']
          description: 目标术间标识；为 null 时保持原术间不变。
        plannedStart:
          type: string
          format: date-time
          description: 调整后的计划开始时间。
        plannedEnd:
          type: string
          format: date-time
          description: 调整后的计划结束时间，必须晚于开始时间。
        sequenceNo:
          type: integer
          description: 调整后的台次序号。
          minimum: 1
        version:
          type: integer
          description: 排程当前版本号，用于乐观锁；过期返回 409。
          minimum: 1
        reason:
          type: [string, 'null']
          description: 调整原因（演示文本，≤500 字符），写入台次 changeReason 与审计。
          maxLength: 500
    ConflictCheckRequest:
      type: object
      description: 排程冲突检测请求；只读预检，不落库。
      required:
        - roomId
        - plannedStart
        - plannedEnd
      properties:
        roomId:
          type: string
          description: 候选术间标识。
        applicationId:
          type: [string, 'null']
          description: 候选手术申请标识；传入后按申请的术者/患者/术间类型要求做冲突检测。
        plannedStart:
          type: string
          format: date-time
          description: 候选开始时间。
        plannedEnd:
          type: string
          format: date-time
          description: 候选结束时间。
        excludeScheduleId:
          type: [string, 'null']
          description: 调整既有排程时排除自身，避免误报。
        staffIds:
          type: array
          x-deferred: true
          description: |
            候选人员标识，用于排班与资质冲突校验。**延后实现**：M2-M2-02/M3 人员资质模块
            （`x-deferred: true`）；当前服务端忽略该字段，不影响其他规则的判定。
          items:
            type: string
        equipmentTags:
          type: array
          x-deferred: true
          description: |
            候选设备标签。**延后实现**：M2-M2-02/M3 设备与资质模块（`x-deferred: true`）；
            当前服务端忽略该字段。
          items:
            type: string
    Conflict:
      type: object
      description: 单条冲突明细。
      required:
        - conflictType
        - severity
        - message
      properties:
        conflictType:
          type: string
          x-extensible-enum:
            - ROOM_OVERLAP
            - STAFF_CONFLICT
            - PATIENT_CONFLICT
            - EQUIPMENT_CONFLICT
            - ISOLATION_CONFLICT
            - QUALIFICATION_MISMATCH
            - ROOM_TYPE_MISMATCH
            - TIME_WINDOW_INVALID
            - APPLICATION_ALREADY_SCHEDULED
            - VERSION_CONFLICT
            - STATE_CONFLICT
            - PREEMPT_CONFLICT
          description: |
            冲突类型。开放枚举（`x-extensible-enum`）：已登记值见列表，服务端可新增规则类型，
            客户端必须容忍未知值并按字符串分支。当前规则：ROOM_OVERLAP=术间时段重叠、
            STAFF_CONFLICT=术者冲突、PATIENT_CONFLICT=患者台次冲突、ROOM_TYPE_MISMATCH=术间类型不匹配、
            APPLICATION_ALREADY_SCHEDULED=申请已有生效台次、VERSION_CONFLICT=乐观锁版本过期、
            STATE_CONFLICT=台次状态不允许该操作、PREEMPT_CONFLICT=急诊抢占目标在锁定后复检已变化
            （状态/优先级/术间/时段不再满足抢占条件，请刷新后重试）；
            TIME_WINDOW_INVALID 保留给内部规则防御
            （API 边界的时间窗非法统一 400，不再以 409 返回）。EQUIPMENT_CONFLICT/
            ISOLATION_CONFLICT/QUALIFICATION_MISMATCH 为后续设备、隔离与资质规则预留。
        severity:
          type: string
          description: 阻断或告警；BLOCKING 不得保存。
          enum:
            - BLOCKING
            - WARNING
        message:
          type: string
          description: 冲突说明。
        conflictingScheduleId:
          type: [string, 'null']
          description: 冲突的既有排程标识；无对应排程为 null。
    ConflictCheckResult:
      type: object
      description: 冲突检测结果。
      required:
        - hasConflict
        - conflicts
      properties:
        hasConflict:
          type: boolean
          description: 是否存在冲突（含 WARNING）。
        conflicts:
          type: array
          description: 冲突明细；无冲突为空数组。
          items:
            $ref: '#/components/schemas/Conflict'
    EmergencyAddRequest:
      type: object
      description: |
        急诊加台请求（M2-M2-02）。`roomId` 与 `expectedStart` 在 MVP 必填（缺失 400）；
        `expectedEnd` 缺省时按申请 `plannedDurationMin` 推算；`preemptScheduleId` 用于显式
        抢占冲突中的择期台次（需 `m1:schedule:approve`）。
      required:
        - applicationId
        - reasonCode
        - reason
      properties:
        applicationId:
          type: string
          description: 急诊手术申请标识。
        roomId:
          type: [string, 'null']
          description: 指定术间；MVP 必填（为 null 返回 400），为规则推荐空档预留。
        reasonCode:
          type: string
          description: |
            加台原因码白名单：EMERGENCY_GREEN_CHANNEL、EMERGENCY_PREEMPT、OTHER；
            非法值返回 400 `PARAM_INVALID`。
        reason:
          type: string
          description: 原因说明（演示文本，≤500 字符，不含患者标识）。
        expectedStart:
          type: [string, 'null']
          format: date-time
          description: 期望开始时间；MVP 必填。
        expectedEnd:
          type: [string, 'null']
          format: date-time
          description: 期望结束时间；为 null 时按申请预计时长推算，必须晚于开始时间。
        sequenceNo:
          type: integer
          description: 台次序号（可选）；缺省按同日同时段已有台次顺延。
          minimum: 1
        preemptScheduleId:
          type: [string, 'null']
          description: |
            拟抢占的择期台次标识（可选）。必须命中本次冲突台次且状态为 PLANNED/PUBLISHED，
            否则 409；抢占成功后被抢占台次置 CANCELLED（reasonCode=EMERGENCY_PREEMPT）。
    EmergencyAddResult:
      type: object
      description: 急诊加台受理结果；201 时携带 approval 审批记录。
      required:
        - accepted
        - approvalRequired
        - conflicts
      properties:
        accepted:
          type: boolean
          description: 是否已受理；false 时须走人工协调。
        scheduleId:
          type: [string, 'null']
          description: 生成的排程标识；未落排程为 null。
        approvalRequired:
          type: boolean
          description: 是否触发加台审批；M2-M2-02 起急诊加台必经审批，固定 true。
        conflicts:
          type: array
          description: 挤占或冲突提示。
          items:
            $ref: '#/components/schemas/Conflict'
        approval:
          $ref: '#/components/schemas/EmergencyApproval'
          description: 急诊加台审批记录（0.5.0 新增，201 响应必带，status=APPROVED）。
    EmergencyApproval:
      type: object
      description: 急诊加台审批记录（schedule_change_request 的对外投影，无 PHI）。
      required:
        - changeId
        - changeType
        - status
        - requestedAt
      properties:
        changeId:
          type: string
          description: 变更记录标识。
        changeType:
          type: string
          description: 变更类型；急诊加台固定 EMERGENCY。
          enum:
            - EMERGENCY
        status:
          type: string
          description: 审批状态；MVP 由持 approve 权限者直接批准，固定 APPROVED。
          enum:
            - PENDING
            - APPROVED
            - REJECTED
        requestedBy:
          type: string
          description: 申请人用户标识。
        requestedAt:
          type: string
          format: date-time
          description: 申请时间（服务端时间）。
        approvedBy:
          type: [string, 'null']
          description: 审批人用户标识；未审批为 null。
        approvedAt:
          type: [string, 'null']
          format: date-time
          description: 审批时间（服务端时间）；未审批为 null。
        preemptScheduleId:
          type: [string, 'null']
          description: 被抢占的择期台次标识；未抢占为 null。
    StopScheduleRequest:
      type: object
      description: |
        停台请求（M2-M2-02）。`reasonCode` 必填且必须在服务端白名单内；`reason` 可选。
        白名单（按变更类型）：停台 PATIENT_CONDITION、SURGEON_UNAVAILABLE、
        ROOM_EQUIPMENT_FAILURE、ANESTHESIA_RISK、SCHEDULE_CHANGE、OTHER；改台
        SCHEDULE_ADJUST、PATIENT_CONDITION、SURGEON_UNAVAILABLE、ROOM_EQUIPMENT_FAILURE、
        ANESTHESIA_RISK、OTHER；急诊 EMERGENCY_GREEN_CHANNEL、EMERGENCY_PREEMPT、OTHER。
      required:
        - reasonCode
        - version
      properties:
        reasonCode:
          type: string
          description: 停台原因码；白名单见 schema 描述，非法值 400 `PARAM_INVALID`。
          maxLength: 32
        reason:
          type: [string, 'null']
          description: 停台原因说明（可选，≤500 字符，不含患者标识）。
          maxLength: 500
        version:
          type: integer
          description: 台次当前版本号；过期返回 409 `VERSION_CONFLICT`。
          minimum: 1
    ScheduleChange:
      type: object
      description: 台次变更记录（停台/改台/急诊审批历史，append-only）。
      required:
        - changeId
        - scheduleId
        - applicationId
        - changeType
        - reasonCode
        - status
        - requestedAt
        - version
      properties:
        changeId:
          type: string
          description: 变更记录标识。
        scheduleId:
          type: string
          description: 台次标识。
        applicationId:
          type: string
          description: 手术申请标识。
        changeType:
          type: string
          description: 变更类型：STOP=停台，MODIFY=改台，EMERGENCY=急诊加台/抢占。
          enum:
            - STOP
            - MODIFY
            - EMERGENCY
        reasonCode:
          type: string
          description: 原因码（白名单值）。
        reason:
          type: [string, 'null']
          description: 原因说明（演示文本，无患者标识）；未填为 null。
        status:
          type: string
          description: |
            审批状态。MVP：持 write 的停台/改台、持 approve 的急诊加台均直接生效记
            APPROVED；PENDING/REJECTED 保留给后续双人审批（EXT，见 docs/modules/m1）。
          enum:
            - PENDING
            - APPROVED
            - REJECTED
        preemptScheduleId:
          type: [string, 'null']
          description: 抢占关系中的另一台次标识；无抢占为 null。
        requestedBy:
          type: string
          description: 申请人/执行人用户标识。
        requestedAt:
          type: string
          format: date-time
          description: 申请/执行时间（服务端时间）。
        approvedBy:
          type: [string, 'null']
          description: 审批人用户标识；PENDING/REJECTED 场景可缺省，未审批为 null。
        approvedAt:
          type: [string, 'null']
          format: date-time
          description: 审批时间（服务端时间）；未审批为 null。
        version:
          type: integer
          description: 变更记录版本号（append-only，创建为 1）。
          minimum: 1
    ScheduleChangeList:
      type: object
      description: 台次变更记录分页列表；按 requestedAt 倒序。
      required:
        - items
      properties:
        items:
          type: array
          description: 变更记录；无记录为空数组。
          items:
            $ref: '#/components/schemas/ScheduleChange'
        meta:
          $ref: '#/components/schemas/PageMeta'
          description: 分页元数据（0.5.0 additive）；缺省 page=1、size=50。
    CancelScheduleRequest:
      type: object
      description: 停台/取消排程请求；原因码必填并进入统计。
      required:
        - reasonCode
        - reason
        - version
      properties:
        reasonCode:
          type: string
          description: |
            停台原因码，来自字典；服务端按 `^[A-Z_]{2,32}$`（大写字母/下划线，2–32 位）校验，
            非法格式返回 400 `PARAM_INVALID`（`details[].field=reasonCode`）。契约不加
            `pattern` 以免对既有调用方构成破坏性收紧（ADR-0011）。区分计划停台与非计划停台。
        reason:
          type: string
          description: 原因说明。
        version:
          type: integer
          description: 排程当前版本号，用于乐观锁。
          minimum: 1
    PatientSnapshot:
      type: object
      description: |
        申请单内嵌的患者摘要（SYNTHETIC 示例）。只含姓名、性别、出生日期/年龄、脱敏住院号与
        科室/病区/床号；**不含证件号与手机号**，住院号明文与哈希均不出接口。
      required:
        - patientId
        - patientNo
        - hisPatientNo
        - name
        - gender
        - age
        - inpatientNoMasked
        - departmentId
        - departmentName
        - siteId
      properties:
        patientId:
          type: string
          description: 患者标识（UUID 字符串）。
        patientNo:
          type: string
          deprecated: true
          description: |
            已弃用：编号口径统一为 hisPatientNo，本字段仅作 0.3.0 兼容回填（值等于 hisPatientNo）；
            计划 1.0.0 major 删除。
        hisPatientNo:
          type: string
          description: HIS 患者号；患者编号统一口径，patientNo 仅作为历史兼容字段在 patient 契约保留。
        name:
          type: string
          description: 患者姓名；示例统一使用“演示患者”。
        gender:
          type: string
          description: 性别。
          enum:
            - MALE
            - FEMALE
            - UNKNOWN
        birthDate:
          type: string
          format: date
          description: 出生日期；与年龄/科室组合可能重识别，按最小必要返回。HIS 缺失时拒绝创建/导入（400），不得用 now() 伪造。
        age:
          type: integer
          description: 年龄（岁）。
          minimum: 0
          maximum: 150
        inpatientNoMasked:
          type: string
          description: 脱敏住院号（前 4 + 4 个 * + 后 4）。
          examples:
            - SYNT****0001
        departmentId:
          type: string
          description: 患者所属科室标识。
        departmentName:
          type: string
          description: 患者所属科室名称。
        ward:
          type: string
          description: 病区名称。
        bedNo:
          type: string
          description: 床号；未分配时为空字符串。
        siteId:
          type: string
          description: 院区标识。
    StatusHistoryEntry:
      type: object
      description: 申请状态变更历史（append-only）。
      required:
        - toStatus
        - occurredAt
      properties:
        fromStatus:
          type:
            - string
            - 'null'
          description: 变更前状态；首次创建为 null。
          enum:
            - SUBMITTED
            - ACCEPTED
            - SCHEDULED
            - CANCELLED
            - REJECTED
            - null
        toStatus:
          type: string
          description: 变更后状态。
          enum:
            - SUBMITTED
            - ACCEPTED
            - SCHEDULED
            - CANCELLED
            - REJECTED
        reasonCode:
          type: string
          description: 变更原因码（字典值，≤64 字符）；取消时必填，创建/导入为空。
          maxLength: 64
        reason:
          type: string
          description: 变更原因说明（演示文本，≤500 字符），不含患者标识。
          maxLength: 500
        operatorId:
          type: string
          description: 操作人用户标识。
        occurredAt:
          type: string
          format: date-time
          description: 变更时间（服务端时间）。
    SurgeryApplication:
      type: object
      description: 手术申请单（HIS 导入或手工创建）；hisApplicationNo 为幂等键。
      allOf:
        - $ref: '#/components/schemas/AuditFields'
        - type: object
          required:
            - applicationId
            - hisApplicationNo
            - patient
            - surgeryName
            - urgency
            - plannedDurationMin
            - departmentName
            - status
            - submittedAt
            - source
            - statusHistory
          properties:
            applicationId:
              type: string
              description: 手术申请标识（雪花 ID 字符串）。
            hisApplicationNo:
              type: string
              description: HIS 申请号，入站幂等键；重复提交不重复建单。
            patient:
              $ref: '#/components/schemas/PatientSnapshot'
            surgeryName:
              type: string
              description: 拟施术式。
            requiredRoomType:
              type: [string, 'null']
              description: |
                申请要求的术间类型（可选）：GENERAL/HYBRID/INTERVENTION；为 null 表示不限。
                排程规则在候选术间类型不匹配时返回 ROOM_TYPE_MISMATCH（BLOCKING）。
              enum:
                - GENERAL
                - HYBRID
                - INTERVENTION
                - null
            surgeryCode:
              type: string
              description: 术式编码（字典/院内编码）。
            urgency:
              type: string
              description: 紧急度；急诊优先于择期（§2.4.2）。
              enum:
                - ELECTIVE
                - URGENT
                - EMERGENCY
            plannedDurationMin:
              type: integer
              description: 预计手术时长（分钟），必须大于 0。
              minimum: 1
            departmentName:
              type: string
              description: 申请科室名称（取自患者快照）。
            surgeonName:
              type: string
              description: 申请/主刀医师姓名（演示文本）。
            preopDiagnosis:
              type: string
              description: 术前诊断（演示文本，不含患者标识）。
            status:
              type: string
              description: 申请状态。
              enum:
                - SUBMITTED
                - ACCEPTED
                - SCHEDULED
                - CANCELLED
                - REJECTED
            submittedAt:
              type: string
              format: date-time
              description: 提交时间（服务端时间）。
            source:
              type: string
              description: 来源：HIS=接口导入，MANUAL=手工/测试创建。
              enum:
                - HIS
                - MANUAL
            remark:
              type: string
              description: 备注（演示文本）。
            statusHistory:
              type: array
              description: 状态历史；列表接口为空数组，详情接口返回完整历史。
              items:
                $ref: '#/components/schemas/StatusHistoryEntry'
    SurgeryApplicationPage:
      type: object
      description: 手术申请分页结果。
      required:
        - items
        - meta
      properties:
        items:
          type: array
          description: 当前页手术申请列表。
          items:
            $ref: '#/components/schemas/SurgeryApplication'
        meta:
          $ref: '#/components/schemas/PageMeta'
    SurgeryApplicationCreateRequest:
      type: object
      description: 手工/测试创建手术申请；hisApplicationNo 为幂等键，重复返回 409。
      required:
        - hisApplicationNo
        - patientId
        - surgeryName
        - urgency
        - plannedDurationMin
      properties:
        hisApplicationNo:
          type: string
          description: HIS 申请号（幂等键）。
          minLength: 1
          maxLength: 64
        patientId:
          type: string
          description: 患者标识；必须已存在于患者快照。
        surgeryName:
          type: string
          description: 拟施术式。
          minLength: 1
          maxLength: 200
        requiredRoomType:
          type: [string, 'null']
          description: 申请要求的术间类型（可选）；为 null 表示不限。
          enum:
            - GENERAL
            - HYBRID
            - INTERVENTION
            - null
        surgeryCode:
          type: string
          description: 术式编码。
          maxLength: 64
        urgency:
          type: string
          description: 紧急度。
          enum:
            - ELECTIVE
            - URGENT
            - EMERGENCY
        plannedDurationMin:
          type: integer
          description: 预计手术时长（分钟），必须大于 0。
          minimum: 1
          maximum: 1440
        surgeonName:
          type: string
          description: 申请/主刀医师姓名（演示文本）。
          maxLength: 100
        preopDiagnosis:
          type: string
          description: 术前诊断（演示文本）。
          maxLength: 500
        remark:
          type: string
          description: 备注。
          maxLength: 500
    ImportSurgeryApplicationsRequest:
      type: object
      description: 模拟 HIS 拉取请求；count 严格 1–5（请求多少返回多少），seed 用于可复现的 SYNTHETIC 生成。
      required:
        - count
      properties:
        count:
          type: integer
          description: 拉取条数，严格 1–5：请求 N 条即返回 N 条（不足时返回可用数量并在 message 说明），越界返回 400。
          minimum: 1
          maximum: 5
        seed:
          type: integer
          description: 随机种子；相同种子生成相同申请号，保证重复导入幂等。
    ImportSurgeryApplicationsResult:
      type: object
      description: 模拟 HIS 导入结果；simulated=true 与 adapter=MOCK_HIS 明确标识为模拟。
      required:
        - simulated
        - adapter
        - requestedCount
        - importedCount
        - skippedCount
        - applications
        - message
      properties:
        simulated:
          type: boolean
          description: 是否模拟导入；当前固定 true（EXT-01）。
        adapter:
          type: string
          description: 适配器标识；当前固定 MOCK_HIS。
          enum:
            - MOCK_HIS
        requestedCount:
          type: integer
          description: 请求拉取条数。
          minimum: 0
        importedCount:
          type: integer
          description: 本次新增入库条数。
          minimum: 0
        skippedCount:
          type: integer
          description: 因幂等键已存在而跳过的条数。
          minimum: 0
        applications:
          type: array
          description: 本次新增的申请；重复导入时为空数组。
          items:
            $ref: '#/components/schemas/SurgeryApplication'
        message:
          type: string
          description: 结果说明（明确模拟来源）。
    CancelSurgeryApplicationRequest:
      type: object
      description: 取消手术申请请求；原因码必填并进入统计。
      required:
        - reasonCode
        - reason
        - version
      properties:
        reasonCode:
          type: string
          description: 取消原因码，来自字典。
        reason:
          type: string
          description: 原因说明（演示文本）。
          maxLength: 500
        version:
          type: integer
          description: 申请当前版本号，用于乐观锁。
          minimum: 1
    UtilizationRoom:
      type: object
      description: 单术间利用率明细（仅聚合值）。
      required:
        - roomId
        - roomNo
        - totalSurgeryMinutes
        - availableMinutes
        - utilizationRate
        - caseCount
      properties:
        roomId:
          type: string
          description: 术间标识。
        roomNo:
          type: string
          description: 术间编号（院内唯一，可安全展示）。
        deptId:
          type:
            - string
            - 'null'
          description: 术间所属科室标识；未配置为 null。
        deptName:
          type:
            - string
            - 'null'
          description: 术间所属科室名称（演示合成文本）；未配置为 null。
        totalSurgeryMinutes:
          type: integer
          description: 区间内非 CANCELLED 台次与查询区间重叠的计划分钟数（跨日按重叠裁剪）。
          minimum: 0
        availableMinutes:
          type: integer
          description: 该术间区间可用分钟数 = 区间天数 × 每间每日可用分钟配置。
          minimum: 0
        utilizationRate:
          type: number
          format: double
          description: 利用率 = totalSurgeryMinutes / availableMinutes；分母为 0 时为 0，可大于 1。
          minimum: 0
        caseCount:
          type: integer
          description: 区间内非 CANCELLED 台次数。
          minimum: 0
    UtilizationSummary:
      type: object
      description: 利用率汇总（所有可见术间）。
      required:
        - totalSurgeryMinutes
        - availableMinutes
        - utilizationRate
        - caseCount
        - roomCount
        - days
      properties:
        totalSurgeryMinutes:
          type: integer
          description: 汇总总手术分钟数。
          minimum: 0
        availableMinutes:
          type: integer
          description: 汇总可用分钟数 = 可见术间数 × 区间天数 × 每间每日可用分钟配置。
          minimum: 0
        utilizationRate:
          type: number
          format: double
          description: 汇总利用率 = totalSurgeryMinutes / availableMinutes；分母为 0 时为 0。
          minimum: 0
        caseCount:
          type: integer
          description: 汇总台次数。
          minimum: 0
        roomCount:
          type: integer
          description: 纳入统计的可见术间数。
          minimum: 0
        days:
          type: integer
          description: 区间天数（含首尾）。
          minimum: 0
    UtilizationReport:
      type: object
      description: 术间利用率报告（口径版本 analytics-1.0.0，Asia/Shanghai）。
      required:
        - from
        - to
        - timezone
        - formula
        - availableMinutesPerRoomPerDay
        - days
        - roomCount
        - summary
        - rooms
      properties:
        from:
          type: string
          format: date
          description: 起始本地日期（含）。
        to:
          type: string
          format: date
          description: 结束本地日期（含）。
        timezone:
          type: string
          description: 统计时区；固定 Asia/Shanghai（DST 不受影响）。
          examples:
            - Asia/Shanghai
        formula:
          type: string
          description: 口径公式说明（展示用，不参与计算）。
          examples:
            - 总手术时长 / 可用时长
        availableMinutesPerRoomPerDay:
          type: integer
          description: 每术间每日可用分钟配置（默认 600，院方口径【待确认】）。
          minimum: 1
        days:
          type: integer
          description: 区间天数（含首尾）。
          minimum: 0
        roomCount:
          type: integer
          description: 纳入统计的可见术间数。
          minimum: 0
        summary:
          $ref: '#/components/schemas/UtilizationSummary'
        rooms:
          type: array
          description: 按术间编号排序的利用率明细；无可见术间时为空数组。
          items:
            $ref: '#/components/schemas/UtilizationRoom'
    OnTimeRoom:
      type: object
      description: 单术间首台准点明细（仅聚合值）。
      required:
        - roomId
        - roomNo
        - firstCaseCount
        - evaluatedCaseCount
        - excludedDays
        - onTimeCount
        - delayedCount
        - onTimeRate
      properties:
        roomId:
          type: string
          description: 术间标识。
        roomNo:
          type: string
          description: 术间编号。
        deptId:
          type:
            - string
            - 'null'
          description: 术间所属科室标识；未配置为 null。
        deptName:
          type:
            - string
            - 'null'
          description: 术间所属科室名称（演示合成文本）；未配置为 null。
        firstCaseCount:
          type: integer
          description: 计划首台术间-日数（同日同术间计划开始最早的台次，不论状态）。
          minimum: 0
        evaluatedCaseCount:
          type: integer
          description: 已评估首台数（计划首台已开始且实际开始时间可用）。
          minimum: 0
        excludedDays:
          type: integer
          description: 未纳入评估的术间-日数（计划首台取消/未开始/缺实际开始时间；从分母排除）。
          minimum: 0
        onTimeCount:
          type: integer
          description: 准点首台数（|实际开始 - 计划开始| ≤ 阈值）。
          minimum: 0
        delayedCount:
          type: integer
          description: 延误首台数 = evaluatedCaseCount - onTimeCount。
          minimum: 0
        onTimeRate:
          type: number
          format: double
          description: 准点率 = onTimeCount / evaluatedCaseCount；分母为 0 时为 0。
          minimum: 0
          maximum: 1
    OnTimeSummary:
      type: object
      description: 首台准点率汇总。
      required:
        - firstCaseCount
        - evaluatedCaseCount
        - excludedDays
        - onTimeCount
        - delayedCount
        - onTimeRate
      properties:
        firstCaseCount:
          type: integer
          description: 汇总计划首台术间-日数（= evaluatedCaseCount + excludedDays）。
          minimum: 0
        evaluatedCaseCount:
          type: integer
          description: 汇总已评估首台数（准点率分母）。
          minimum: 0
        excludedDays:
          type: integer
          description: 汇总未纳入评估的术间-日数（计划首台取消/未开始/缺实际开始时间）。
          minimum: 0
        onTimeCount:
          type: integer
          description: 汇总准点首台数。
          minimum: 0
        delayedCount:
          type: integer
          description: 汇总延误首台数。
          minimum: 0
        onTimeRate:
          type: number
          format: double
          description: 汇总准点率；分母为 0 时为 0。
          minimum: 0
          maximum: 1
    OnTimeReport:
      type: object
      description: 首台准点开台率报告（口径版本 analytics-1.0.0，Asia/Shanghai）。
      required:
        - from
        - to
        - timezone
        - thresholdMinutes
        - actualStartSource
        - summary
        - rooms
      properties:
        from:
          type: string
          format: date
          description: 起始本地日期（含）。
        to:
          type: string
          format: date
          description: 结束本地日期（含）。
        timezone:
          type: string
          description: 统计时区；固定 Asia/Shanghai。
          examples:
            - Asia/Shanghai
        thresholdMinutes:
          type: integer
          description: 准点阈值（分钟，默认 15，可配置 anesop.m1.analytics.on-time-threshold-minutes）。
          minimum: 0
          maximum: 1440
        actualStartSource:
          type: string
          description: 实际开始数据来源；MVP 固定 SCHEDULE_UPDATED_AT（HIS 回写前【待确认】）。
          enum:
            - SCHEDULE_UPDATED_AT
        summary:
          $ref: '#/components/schemas/OnTimeSummary'
        rooms:
          type: array
          description: 按术间编号排序的准点明细；无可见术间时为空数组。
          items:
            $ref: '#/components/schemas/OnTimeRoom'
    CancellationReason:
      type: object
      description: 取消原因码分组（仅聚合计数）。
      required:
        - reasonCode
        - cancelledCases
        - shareOfCancelled
      properties:
        reasonCode:
          type: string
          description: 原因码；取最近一条 STOP 变更记录，无记录为 UNSPECIFIED（不臆造原因）。
          x-extensible-enum:
            - PATIENT_CONDITION
            - SURGEON_UNAVAILABLE
            - ROOM_EQUIPMENT_FAILURE
            - ANESTHESIA_RISK
            - SCHEDULE_CHANGE
            - OTHER
            - EMERGENCY_PREEMPT
            - UNSPECIFIED
        cancelledCases:
          type: integer
          description: 该原因码取消台次数。
          minimum: 0
        shareOfCancelled:
          type: number
          format: double
          description: 占全部取消台次比例；取消数为 0 时为 0。
          minimum: 0
          maximum: 1
    CancellationRoom:
      type: object
      description: 单术间取消率明细（仅聚合值）。
      required:
        - roomId
        - roomNo
        - totalCases
        - cancelledCases
        - cancellationRate
      properties:
        roomId:
          type: string
          description: 术间标识。
        roomNo:
          type: string
          description: 术间编号。
        deptId:
          type:
            - string
            - 'null'
          description: 术间所属科室标识；未配置为 null。
        deptName:
          type:
            - string
            - 'null'
          description: 术间所属科室名称（演示合成文本）；未配置为 null。
        totalCases:
          type: integer
          description: 区间内总台次（含已取消）。
          minimum: 0
        cancelledCases:
          type: integer
          description: 取消台次数。
          minimum: 0
        cancellationRate:
          type: number
          format: double
          description: 取消率 = cancelledCases / totalCases；分母为 0 时为 0。
          minimum: 0
          maximum: 1
    CancellationSummary:
      type: object
      description: 取消率汇总。
      required:
        - totalCases
        - cancelledCases
        - cancellationRate
      properties:
        totalCases:
          type: integer
          description: 区间内总台次（含已取消）。
          minimum: 0
        cancelledCases:
          type: integer
          description: 取消台次数。
          minimum: 0
        cancellationRate:
          type: number
          format: double
          description: 取消率；分母为 0 时为 0。
          minimum: 0
          maximum: 1
    CancellationReport:
      type: object
      description: 取消率报告（口径版本 analytics-1.0.0，Asia/Shanghai）。
      required:
        - from
        - to
        - timezone
        - summary
        - byReason
        - byRoom
      properties:
        from:
          type: string
          format: date
          description: 起始本地日期（含）。
        to:
          type: string
          format: date
          description: 结束本地日期（含）。
        timezone:
          type: string
          description: 统计时区；固定 Asia/Shanghai。
          examples:
            - Asia/Shanghai
        summary:
          $ref: '#/components/schemas/CancellationSummary'
        byReason:
          type: array
          description: 按原因码分组，取消台次数倒序；无取消时为空数组。
          items:
            $ref: '#/components/schemas/CancellationReason'
        byRoom:
          type: array
          description: 按术间编号排序的取消率明细；无可见术间时为空数组。
          items:
            $ref: '#/components/schemas/CancellationRoom'
