openapi: 3.1.0
info:
  title: ANESOP 手术排程契约（scheduling）
  summary: 术间资源、排程查询与创建、冲突检测、急诊加台与停台
  description: |
    ANESOP 手术排程域契约，对应方案书 §2.4.2（M1 手术排程管理）与 §3.4.2（排程/台次实体）。
    硬规则：同术间时段不重叠、冲突不得强行保存、急诊加台优先于择期、停台改台必选原因码。
    所有示例均为 SYNTHETIC 合成数据。
  version: 0.3.0
  contact:
    name: ANESOP 项目组
  license:
    name: 内部交付（非开源）
servers:
  - url: https://anesop.local/api
    description: 院内单院部署统一入口（生产网无互联网出口）
security:
  - bearerAuth: []
tags:
  - name: 手术排程
    description: 术间资源、日排程、冲突检测、急诊加台与停台操作。
paths:
  /v1/scheduling/rooms:
    get:
      operationId: listOperatingRooms
      tags:
        - 手术排程
      summary: 查询术间列表
      description: 返回术间静态配置与当前状态，供排程工作台与驾驶舱使用；术间编号院内唯一。
      parameters:
        - name: siteId
          in: query
          description: 院区标识；不传时按当前用户数据范围过滤。
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: 术间当前状态。
          required: false
          schema:
            type: string
            enum:
              - IDLE
              - PREPARING
              - ANESTHESIA
              - SURGERY
              - PACU
              - CLEANING
      responses:
        '200':
          description: 术间列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatingRoomList'
              example:
                items:
                  - roomId: '7000000000000000001'
                    roomNo: OR-01
                    roomName: 演示 1 号手术间
                    siteId: '3000000000000000001'
                    status: IDLE
                    isolationRequired: false
                    equipmentTags:
                      - ANESTHESIA_MACHINE
                      - MONITOR
                    createdAt: '2026-01-05T08:00:00+08:00'
                    createdBy: '1000000000000000001'
                    updatedAt: '2026-11-12T08:00:00+08:00'
                    updatedBy: '1000000000000000001'
                    version: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/scheduling/schedules:
    get:
      operationId: listSchedules
      tags:
        - 手术排程
      summary: 查询排程
      description: 按日期、术间与状态查询日排程，返回台次顺序、计划与实际起止时间。
      parameters:
        - name: date
          in: query
          description: 排程日期（YYYY-MM-DD），按院区时区解释。
          required: true
          schema:
            type: string
            format: date
        - name: roomId
          in: query
          description: 术间标识。
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: 排程状态。
          required: false
          schema:
            type: string
            enum:
              - PLANNED
              - PUBLISHED
              - IN_PROGRESS
              - COMPLETED
              - CANCELLED
              - DELAYED
        - name: page
          in: query
          description: 页码，从 1 开始。
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          description: 每页条数。
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: 排程分页列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulePage'
              example:
                items:
                  - scheduleId: '8000000000000000001'
                    applicationId: '6000000000000000001'
                    patientId: '50000000-0000-4000-8000-000000000001'
                    patientNo: SYNTH-P-0001
                    patientName: 演示患者
                    roomId: '7000000000000000001'
                    roomNo: OR-01
                    sequenceNo: 1
                    plannedStart: '2026-12-01T08:30:00+08:00'
                    plannedEnd: '2026-12-01T11:00:00+08:00'
                    actualStart: '2026-12-01T08:35:00+08:00'
                    actualEnd: null
                    status: IN_PROGRESS
                    priority: ELECTIVE
                    changeReason: null
                    createdAt: '2026-11-09T11:20:00+08:00'
                    createdBy: '1000000000000000001'
                    updatedAt: '2026-12-01T08:35:00+08:00'
                    updatedBy: '1000000000000000001'
                    version: 4
                meta:
                  page: 1
                  size: 50
                  total: 1
                  totalPages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createSchedule
      tags:
        - 手术排程
      summary: 创建排程
      description: |
        为手术申请分配术间、台次与计划时段。服务端在事务内再次执行冲突检测，冲突时返回 409，
        不得强行保存；急诊加台走专用接口。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleRequest'
            example:
              applicationId: '6000000000000000001'
              roomId: '7000000000000000001'
              plannedStart: '2026-12-01T08:30:00+08:00'
              plannedEnd: '2026-12-01T11:00:00+08:00'
              sequenceNo: 1
              priority: ELECTIVE
      responses:
        '201':
          description: 排程创建成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
              example:
                scheduleId: '8000000000000000001'
                applicationId: '6000000000000000001'
                patientId: '50000000-0000-4000-8000-000000000001'
                patientNo: SYNTH-P-0001
                patientName: 演示患者
                roomId: '7000000000000000001'
                roomNo: OR-01
                sequenceNo: 1
                plannedStart: '2026-12-01T08:30:00+08:00'
                plannedEnd: '2026-12-01T11:00:00+08:00'
                actualStart: null
                actualEnd: null
                status: PLANNED
                priority: ELECTIVE
                changeReason: null
                createdAt: '2026-11-09T11:20:00+08:00'
                createdBy: '1000000000000000001'
                updatedAt: '2026-11-09T11:20:00+08:00'
                updatedBy: '1000000000000000001'
                version: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/scheduling/schedules/{scheduleId}:
    get:
      operationId: getSchedule
      tags:
        - 手术排程
      summary: 查询排程详情
      description: 按排程标识返回台次详情，供麻醉记录单起单与术前准备联动。
      parameters:
        - name: scheduleId
          in: path
          description: 排程标识（雪花 ID 字符串）。
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 排程详情。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
              example:
                scheduleId: '8000000000000000001'
                applicationId: '6000000000000000001'
                patientId: '50000000-0000-4000-8000-000000000001'
                patientNo: SYNTH-P-0001
                patientName: 演示患者
                roomId: '7000000000000000001'
                roomNo: OR-01
                sequenceNo: 1
                plannedStart: '2026-12-01T08:30:00+08:00'
                plannedEnd: '2026-12-01T11:00:00+08:00'
                actualStart: null
                actualEnd: null
                status: PUBLISHED
                priority: ELECTIVE
                changeReason: null
                createdAt: '2026-11-09T11:20:00+08:00'
                createdBy: '1000000000000000001'
                updatedAt: '2026-11-10T09:10:00+08:00'
                updatedBy: '1000000000000000001'
                version: 2
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/scheduling/conflicts/check:
    post:
      operationId: checkScheduleConflict
      tags:
        - 手术排程
      summary: 检测排程冲突
      description: |
        对候选术间与时段执行冲突检测，覆盖术间时段重叠、人员排班、设备依赖与隔离要求。
        仅返回检测结果，不落库；创建/调整排程时服务端仍会复核。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConflictCheckRequest'
            example:
              roomId: '7000000000000000001'
              plannedStart: '2026-12-01T10:30:00+08:00'
              plannedEnd: '2026-12-01T12:30:00+08:00'
              excludeScheduleId: '8000000000000000001'
              staffIds:
                - '9000000000000000001'
              equipmentTags:
                - ANESTHESIA_MACHINE
      responses:
        '200':
          description: 冲突检测结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictCheckResult'
              example:
                hasConflict: true
                conflicts:
                  - conflictType: ROOM_OVERLAP
                    severity: BLOCKING
                    message: 与已发布台次 OR-01 第 1 台时段重叠
                    conflictingScheduleId: '8000000000000000001'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/scheduling/emergency-cases:
    post:
      operationId: addEmergencyCase
      tags:
        - 手术排程
      summary: 急诊加台
      description: |
        急诊手术绿色通道加台：优先占用空档，必要时提示挤占并触发加台审批；急诊优先于择期，
        术后补记原因（§2.3.2）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmergencyAddRequest'
            example:
              applicationId: '6000000000000000002'
              roomId: '7000000000000000002'
              reasonCode: EMERGENCY_GREEN_CHANNEL
              reason: 演示急诊加台（合成数据）
              expectedStart: '2026-12-01T13:00:00+08:00'
      responses:
        '200':
          description: 急诊加台受理结果；需审批时 approvalRequired 为 true。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyAddResult'
              example:
                accepted: true
                scheduleId: '8000000000000000002'
                approvalRequired: true
                conflicts: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/scheduling/schedules/{scheduleId}/cancel:
    post:
      operationId: cancelSchedule
      tags:
        - 手术排程
      summary: 停台/取消排程
      description: 停台或取消排程必须选择原因码并写变更记录；已开始台次不允许直接取消（409）。
      parameters:
        - name: scheduleId
          in: path
          description: 排程标识（雪花 ID 字符串）。
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelScheduleRequest'
            example:
              reasonCode: PATIENT_CONDITION
              reason: 演示停台原因（合成数据）
              version: 4
      responses:
        '200':
          description: 取消成功，返回排程标识。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
              example:
                id: '8000000000000000001'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/scheduling/applications:
    get:
      operationId: listSurgeryApplications
      tags:
        - 手术排程
      summary: 分页查询手术申请
      description: |
        按状态、紧急度与申请科室分页查询手术申请（M2-M1-01）。返回结果受当前用户数据范围约束：
        集合查询越权返回 403；申请只返回脱敏患者摘要，不含证件号与手机号。
      parameters:
        - name: status
          in: query
          description: 申请状态过滤。
          required: false
          schema:
            type: string
            enum:
              - SUBMITTED
              - ACCEPTED
              - SCHEDULED
              - CANCELLED
              - REJECTED
        - name: urgency
          in: query
          description: 紧急度过滤。
          required: false
          schema:
            type: string
            enum:
              - ELECTIVE
              - URGENT
              - EMERGENCY
        - name: departmentName
          in: query
          description: 申请科室名称过滤（精确匹配）；同时受数据范围约束。
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: 页码，从 1 开始。
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          description: 每页条数。
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        '200':
          description: 手术申请分页列表；statusHistory 在列表中为空数组，详情接口返回完整历史。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurgeryApplicationPage'
              example:
                items:
                  - applicationId: '6000000000000000001'
                    hisApplicationNo: SYNTH-HIS-APP-0001
                    patient:
                      patientId: '50000000-0000-4000-8000-000000000001'
                      patientNo: SYNTH-P-0001
                      hisPatientNo: SYNTH-HIS-P-0001
                      name: 演示患者
                      gender: FEMALE
                      birthDate: '1978-03-15'
                      age: 47
                      inpatientNoMasked: SYNT****0001
                      departmentId: '2000000000000000001'
                      departmentName: 演示外科
                      ward: 演示外科病区
                      bedNo: '12'
                      siteId: '3000000000000000001'
                    surgeryName: 演示术式（全膝关节置换术）
                    surgeryCode: SYNTH-OP-0001
                    urgency: ELECTIVE
                    plannedDurationMin: 150
                    departmentName: 演示外科
                    surgeonName: 演示术者
                    preopDiagnosis: 演示诊断（膝关节退行性病变）
                    status: SUBMITTED
                    submittedAt: '2026-11-08T10:00:00+08:00'
                    source: HIS
                    remark: 演示备注（合成数据）
                    statusHistory: []
                    createdAt: '2026-11-08T10:00:00+08:00'
                    createdBy: '1000000000000000001'
                    updatedAt: '2026-11-08T10:00:00+08:00'
                    updatedBy: '1000000000000000001'
                    version: 1
                meta:
                  page: 1
                  size: 20
                  total: 1
                  totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: submitSurgeryApplication
      tags:
        - 手术排程
      summary: 创建手术申请（手工/测试）
      description: |
        手工或测试创建手术申请，以 hisApplicationNo 为幂等键；重复申请返回 409，不静默覆盖。
        患者必须已存在于患者快照；未知患者返回 422。申请科室取自患者快照，来源固定 MANUAL，
        初始状态 SUBMITTED，并写 SUBMITTED 状态历史。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SurgeryApplicationCreateRequest'
            example:
              hisApplicationNo: SYNTH-MANUAL-APP-0001
              patientId: '50000000-0000-4000-8000-000000000001'
              surgeryName: 演示术式（腹腔镜胆囊切除术）
              surgeryCode: SYNTH-OP-0002
              urgency: URGENT
              plannedDurationMin: 90
              surgeonName: 演示术者
              preopDiagnosis: 演示诊断（胆囊结石）
              remark: 演示备注（合成数据）
      responses:
        '201':
          description: 创建成功；返回状态为 SUBMITTED 的申请。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurgeryApplication'
              example:
                applicationId: '6000000000000000002'
                hisApplicationNo: SYNTH-MANUAL-APP-0001
                patient:
                  patientId: '50000000-0000-4000-8000-000000000001'
                  patientNo: SYNTH-P-0001
                  hisPatientNo: SYNTH-HIS-P-0001
                  name: 演示患者
                  gender: FEMALE
                  birthDate: '1978-03-15'
                  age: 47
                  inpatientNoMasked: SYNT****0001
                  departmentId: '2000000000000000001'
                  departmentName: 演示外科
                  ward: 演示外科病区
                  bedNo: '12'
                  siteId: '3000000000000000001'
                surgeryName: 演示术式（腹腔镜胆囊切除术）
                surgeryCode: SYNTH-OP-0002
                urgency: URGENT
                plannedDurationMin: 90
                departmentName: 演示外科
                surgeonName: 演示术者
                preopDiagnosis: 演示诊断（胆囊结石）
                status: SUBMITTED
                submittedAt: '2026-11-08T10:00:00+08:00'
                source: MANUAL
                remark: 演示备注（合成数据）
                statusHistory:
                  - fromStatus: null
                    toStatus: SUBMITTED
                    reason: 手工创建
                    operatorId: '1000000000000000001'
                    occurredAt: '2026-11-08T10:00:00+08:00'
                createdAt: '2026-11-08T10:00:00+08:00'
                createdBy: '1000000000000000001'
                updatedAt: '2026-11-08T10:00:00+08:00'
                updatedBy: '1000000000000000001'
                version: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/scheduling/applications/import:
    post:
      operationId: importSurgeryApplications
      tags:
        - 手术排程
      summary: 从 HIS 拉取并导入手术申请（模拟）
      description: |
        **模拟适配器（EXT-01）**：从内置 Mock HIS 适配器拉取 SYNTHETIC 手术申请并入库，
        响应固定标记 simulated=true、adapter=MOCK_HIS。生成器使用固定种子，重复导入按
        hisApplicationNo 幂等（ON CONFLICT DO NOTHING），不会新增重复申请。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportSurgeryApplicationsRequest'
            example:
              count: 4
              seed: 20260101
      responses:
        '200':
          description: 导入结果；importedCount 为本次新增行数，skippedCount 为幂等跳过行数。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportSurgeryApplicationsResult'
              example:
                simulated: true
                adapter: MOCK_HIS
                requestedCount: 4
                importedCount: 4
                skippedCount: 0
                applications: []
                message: 本次为模拟 HIS 导入（SYNTHETIC 合成数据）
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/scheduling/applications/{applicationId}:
    get:
      operationId: getSchedulingApplication
      tags:
        - 手术排程
      summary: 查询手术申请详情
      description: 按申请标识返回申请详情、脱敏患者摘要与完整状态历史；不存在或超出数据范围返回 404。
      parameters:
        - name: applicationId
          in: path
          description: 手术申请标识（雪花 ID 字符串）。
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 手术申请详情。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurgeryApplication'
              example:
                applicationId: '6000000000000000001'
                hisApplicationNo: SYNTH-HIS-APP-0001
                patient:
                  patientId: '50000000-0000-4000-8000-000000000001'
                  patientNo: SYNTH-P-0001
                  hisPatientNo: SYNTH-HIS-P-0001
                  name: 演示患者
                  gender: FEMALE
                  birthDate: '1978-03-15'
                  age: 47
                  inpatientNoMasked: SYNT****0001
                  departmentId: '2000000000000000001'
                  departmentName: 演示外科
                  ward: 演示外科病区
                  bedNo: '12'
                  siteId: '3000000000000000001'
                surgeryName: 演示术式（全膝关节置换术）
                surgeryCode: SYNTH-OP-0001
                urgency: ELECTIVE
                plannedDurationMin: 150
                departmentName: 演示外科
                surgeonName: 演示术者
                preopDiagnosis: 演示诊断（膝关节退行性病变）
                status: CANCELLED
                submittedAt: '2026-11-08T10:00:00+08:00'
                source: HIS
                remark: 演示备注（合成数据）
                statusHistory:
                  - fromStatus: null
                    toStatus: SUBMITTED
                    reason: HIS 导入
                    operatorId: '1000000000000000001'
                    occurredAt: '2026-11-08T10:00:00+08:00'
                  - fromStatus: SUBMITTED
                    toStatus: CANCELLED
                    reason: 演示取消原因（合成数据）
                    operatorId: '1000000000000000001'
                    occurredAt: '2026-11-09T11:20:00+08:00'
                createdAt: '2026-11-08T10:00:00+08:00'
                createdBy: '1000000000000000001'
                updatedAt: '2026-11-09T11:20:00+08:00'
                updatedBy: '1000000000000000001'
                version: 2
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/scheduling/applications/{applicationId}/cancel:
    post:
      operationId: cancelSchedulingApplication
      tags:
        - 手术排程
      summary: 取消手术申请
      description: |
        取消 SUBMITTED/ACCEPTED/SCHEDULED 状态的申请；CANCELLED/REJECTED 为终态，
        再次取消返回 409。取消必须填写原因码与原因，写状态历史与审计，并做乐观锁版本校验。
      parameters:
        - name: applicationId
          in: path
          description: 手术申请标识（雪花 ID 字符串）。
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelSurgeryApplicationRequest'
            example:
              reasonCode: PATIENT_CONDITION
              reason: 演示取消原因（合成数据）
              version: 1
      responses:
        '200':
          description: 取消成功，返回手术申请标识。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
              example:
                id: '6000000000000000001'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 统一 OAuth2/JWT 访问令牌，放在 Authorization 头中。
  responses:
    BadRequest:
      description: 请求参数校验失败：字段缺失、格式非法或取值越界；details 为字段级错误数组。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: PARAM_INVALID
            message: 请求参数校验失败
            traceId: SYNTH-TRACE-0005
            details:
              - field: plannedEnd
                reason: 计划结束时间必须晚于计划开始时间
    Unauthorized:
      description: 未认证：未携带令牌、令牌过期或签名无效。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: AUTH_UNAUTHORIZED
            message: 未认证或令牌已失效
            traceId: SYNTH-TRACE-0001
            details: []
    Forbidden:
      description: 已认证但无权限，或请求超出当前用户数据范围。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: AUTH_FORBIDDEN
            message: 无权访问该资源或数据范围不足
            traceId: SYNTH-TRACE-0002
            details:
              - field: dataScope
                reason: 当前角色不包含该科室数据范围
    NotFound:
      description: 资源不存在，或存在但不在当前用户数据权限内（不泄露存在性）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RESOURCE_NOT_FOUND
            message: 资源不存在或不可见
            traceId: SYNTH-TRACE-0003
            details: []
    Conflict:
      description: 排程冲突、状态冲突或乐观锁版本冲突。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: SCHEDULE_CONFLICT
            message: 目标时段与已有排程冲突或版本已过期
            traceId: SYNTH-TRACE-0004
            details:
              - field: plannedStart
                reason: 与已发布台次时段重叠
    UnprocessableEntity:
      description: 请求语义不合法：字段格式正确但业务规则拒绝，details 说明原因。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: BUSINESS_RULE_VIOLATION
            message: 排程语义校验未通过
            traceId: SYNTH-TRACE-0006
            details:
              - field: roomId
                reason: 该术间不满足申请要求的隔离条件
  schemas:
    ErrorDetail:
      type: object
      description: 错误明细项，用于字段级校验失败或冲突说明。
      required:
        - field
        - reason
      properties:
        field:
          type: string
          description: 相关字段名或资源标识。
        reason:
          type: string
          description: 可读的失败原因，不包含堆栈、SQL 实参与内部路径。
    Error:
      type: object
      description: 统一错误响应；错误信息不暴露堆栈、SQL 实参与患者标识。
      required:
        - code
        - message
        - traceId
        - details
      properties:
        code:
          type: string
          description: 稳定错误码，供前端分支与告警规则使用。
        message:
          type: string
          description: 面向用户的中文提示，可安全展示。
        traceId:
          type: string
          description: 链路追踪标识，与日志、审计记录关联。
        details:
          type: array
          description: 字段级或范围级错误明细；无明细时为空数组。
          items:
            $ref: '#/components/schemas/ErrorDetail'
    PageMeta:
      type: object
      description: 分页元数据；页码从 1 开始，size 上限由服务端限制。
      required:
        - page
        - size
        - total
        - totalPages
      properties:
        page:
          type: integer
          description: 当前页码，从 1 开始。
          minimum: 1
        size:
          type: integer
          description: 每页条数。
          minimum: 1
          maximum: 200
        total:
          type: integer
          description: 符合条件的总条数。
          minimum: 0
        totalPages:
          type: integer
          description: 总页数；total 为 0 时为 0。
          minimum: 0
    AuditFields:
      type: object
      description: 审计与乐观锁公共字段；排程变更留版本与原因。
      required:
        - createdAt
        - createdBy
        - updatedAt
        - updatedBy
        - version
      properties:
        createdAt:
          type: string
          format: date-time
          description: 创建时间（服务端时间）。
        createdBy:
          type: string
          description: 创建人用户标识。
        updatedAt:
          type: string
          format: date-time
          description: 最后更新时间（服务端时间）。
        updatedBy:
          type: string
          description: 最后修改人用户标识。
        version:
          type: integer
          description: 乐观锁版本号，从 1 开始；更新必须回传。
          minimum: 1
    IdResponse:
      type: object
      description: 仅返回资源标识的通用响应。
      required:
        - id
      properties:
        id:
          type: string
          description: 雪花 ID 序列化后的字符串，避免前端精度丢失。
    OperatingRoom:
      type: object
      description: 术间静态配置与实时状态。
      allOf:
        - $ref: '#/components/schemas/AuditFields'
        - type: object
          required:
            - roomId
            - roomNo
            - roomName
            - siteId
            - status
            - isolationRequired
            - equipmentTags
          properties:
            roomId:
              type: string
              description: 术间标识。
            roomNo:
              type: string
              description: 术间编号，院内唯一。
              examples:
                - OR-01
            roomName:
              type: string
              description: 术间名称。
            siteId:
              type: string
              description: 院区标识。
            status:
              type: string
              description: 术间当前状态。
              enum:
                - IDLE
                - PREPARING
                - ANESTHESIA
                - SURGERY
                - PACU
                - CLEANING
            isolationRequired:
              type: boolean
              description: 是否要求隔离（感染等）。
            equipmentTags:
              type: array
              description: 设备依赖标签，用于排程设备冲突校验。
              items:
                type: string
    OperatingRoomList:
      type: object
      description: 术间列表。
      required:
        - items
      properties:
        items:
          type: array
          description: 术间列表。
          items:
            $ref: '#/components/schemas/OperatingRoom'
    Schedule:
      type: object
      description: 排程/台次；同术间时段不得重叠。
      allOf:
        - $ref: '#/components/schemas/AuditFields'
        - type: object
          required:
            - scheduleId
            - applicationId
            - patientId
            - patientNo
            - patientName
            - roomId
            - roomNo
            - sequenceNo
            - plannedStart
            - plannedEnd
            - status
            - priority
          properties:
            scheduleId:
              type: string
              description: 排程标识。
            applicationId:
              type: string
              description: 手术申请标识。
            patientId:
              type: string
              description: 患者标识。
            patientNo:
              type: string
              deprecated: true
              description: |
                已弃用：编号口径统一为 hisPatientNo；本字段仅为兼容 0.2.0 保留，计划 1.0.0 major 删除。
            patientName:
              type: string
              description: 患者姓名；示例统一使用“演示患者”。
            roomId:
              type: string
              description: 术间标识。
            roomNo:
              type: string
              description: 术间编号。
            sequenceNo:
              type: integer
              description: 台次序号，从 1 开始。
              minimum: 1
            plannedStart:
              type: string
              format: date-time
              description: 计划开始时间（含时区偏移）。
            plannedEnd:
              type: string
              format: date-time
              description: 计划结束时间（含时区偏移）。
            actualStart:
              type:
                - string
                - 'null'
              format: date-time
              description: 实际开始时间；未开始为 null。
            actualEnd:
              type:
                - string
                - 'null'
              format: date-time
              description: 实际结束时间；未结束为 null。
            status:
              type: string
              description: 排程状态。
              enum:
                - PLANNED
                - PUBLISHED
                - IN_PROGRESS
                - COMPLETED
                - CANCELLED
                - DELAYED
            priority:
              type: string
              description: 优先级；急诊优先于择期。
              enum:
                - ELECTIVE
                - URGENT
                - EMERGENCY
            changeReason:
              type:
                - string
                - 'null'
              description: 最近一次改台/停台原因；无变更为 null。
    SchedulePage:
      type: object
      description: 排程分页结果。
      required:
        - items
        - meta
      properties:
        items:
          type: array
          description: 当前页排程列表。
          items:
            $ref: '#/components/schemas/Schedule'
        meta:
          $ref: '#/components/schemas/PageMeta'
    CreateScheduleRequest:
      type: object
      description: 创建排程请求；服务端在事务内复核冲突。
      required:
        - applicationId
        - roomId
        - plannedStart
        - plannedEnd
        - sequenceNo
        - priority
      properties:
        applicationId:
          type: string
          description: 手术申请标识。
        roomId:
          type: string
          description: 术间标识。
        plannedStart:
          type: string
          format: date-time
          description: 计划开始时间。
        plannedEnd:
          type: string
          format: date-time
          description: 计划结束时间，必须晚于开始时间。
        sequenceNo:
          type: integer
          description: 台次序号。
          minimum: 1
        priority:
          type: string
          description: 优先级。
          enum:
            - ELECTIVE
            - URGENT
            - EMERGENCY
    ConflictCheckRequest:
      type: object
      description: 排程冲突检测请求；只读预检，不落库。
      required:
        - roomId
        - plannedStart
        - plannedEnd
      properties:
        roomId:
          type: string
          description: 候选术间标识。
        plannedStart:
          type: string
          format: date-time
          description: 候选开始时间。
        plannedEnd:
          type: string
          format: date-time
          description: 候选结束时间。
        excludeScheduleId:
          type: [string, 'null']
          description: 调整既有排程时排除自身，避免误报。
        staffIds:
          type: array
          description: 候选人员标识，用于排班与资质冲突校验。
          items:
            type: string
        equipmentTags:
          type: array
          description: 候选设备标签。
          items:
            type: string
    Conflict:
      type: object
      description: 单条冲突明细。
      required:
        - conflictType
        - severity
        - message
      properties:
        conflictType:
          type: string
          description: 冲突类型。
          enum:
            - ROOM_OVERLAP
            - STAFF_CONFLICT
            - EQUIPMENT_CONFLICT
            - ISOLATION_CONFLICT
            - QUALIFICATION_MISMATCH
        severity:
          type: string
          description: 阻断或告警；BLOCKING 不得保存。
          enum:
            - BLOCKING
            - WARNING
        message:
          type: string
          description: 冲突说明。
        conflictingScheduleId:
          type: [string, 'null']
          description: 冲突的既有排程标识；无对应排程为 null。
    ConflictCheckResult:
      type: object
      description: 冲突检测结果。
      required:
        - hasConflict
        - conflicts
      properties:
        hasConflict:
          type: boolean
          description: 是否存在冲突（含 WARNING）。
        conflicts:
          type: array
          description: 冲突明细；无冲突为空数组。
          items:
            $ref: '#/components/schemas/Conflict'
    EmergencyAddRequest:
      type: object
      description: 急诊加台请求。
      required:
        - applicationId
        - reasonCode
        - reason
      properties:
        applicationId:
          type: string
          description: 急诊手术申请标识。
        roomId:
          type: [string, 'null']
          description: 指定术间；为 null 时由规则引擎推荐空档。
        reasonCode:
          type: string
          description: 加台原因码，来自字典。
        reason:
          type: string
          description: 原因说明（演示文本）。
        expectedStart:
          type: [string, 'null']
          format: date-time
          description: 期望开始时间；为 null 时尽快安排。
    EmergencyAddResult:
      type: object
      description: 急诊加台受理结果。
      required:
        - accepted
        - approvalRequired
        - conflicts
      properties:
        accepted:
          type: boolean
          description: 是否已受理；false 时须走人工协调。
        scheduleId:
          type: [string, 'null']
          description: 生成的排程标识；未落排程为 null。
        approvalRequired:
          type: boolean
          description: 是否触发加台审批。
        conflicts:
          type: array
          description: 挤占或冲突提示。
          items:
            $ref: '#/components/schemas/Conflict'
    CancelScheduleRequest:
      type: object
      description: 停台/取消排程请求；原因码必填并进入统计。
      required:
        - reasonCode
        - reason
        - version
      properties:
        reasonCode:
          type: string
          description: 停台原因码，来自字典；区分计划停台与非计划停台。
        reason:
          type: string
          description: 原因说明。
        version:
          type: integer
          description: 排程当前版本号，用于乐观锁。
          minimum: 1
    PatientSnapshot:
      type: object
      description: |
        申请单内嵌的患者摘要（SYNTHETIC 示例）。只含姓名、性别、出生日期/年龄、脱敏住院号与
        科室/病区/床号；**不含证件号与手机号**，住院号明文与哈希均不出接口。
      required:
        - patientId
        - patientNo
        - hisPatientNo
        - name
        - gender
        - age
        - inpatientNoMasked
        - departmentId
        - departmentName
        - siteId
      properties:
        patientId:
          type: string
          description: 患者标识（UUID 字符串）。
        patientNo:
          type: string
          deprecated: true
          description: |
            已弃用：编号口径统一为 hisPatientNo，本字段仅作 0.3.0 兼容回填（值等于 hisPatientNo）；
            计划 1.0.0 major 删除。
        hisPatientNo:
          type: string
          description: HIS 患者号；患者编号统一口径，patientNo 仅作为历史兼容字段在 patient 契约保留。
        name:
          type: string
          description: 患者姓名；示例统一使用“演示患者”。
        gender:
          type: string
          description: 性别。
          enum:
            - MALE
            - FEMALE
            - UNKNOWN
        birthDate:
          type: string
          format: date
          description: 出生日期；与年龄/科室组合可能重识别，按最小必要返回。HIS 缺失时拒绝创建/导入（400），不得用 now() 伪造。
        age:
          type: integer
          description: 年龄（岁）。
          minimum: 0
          maximum: 150
        inpatientNoMasked:
          type: string
          description: 脱敏住院号（前 4 + 4 个 * + 后 4）。
          examples:
            - SYNT****0001
        departmentId:
          type: string
          description: 患者所属科室标识。
        departmentName:
          type: string
          description: 患者所属科室名称。
        ward:
          type: string
          description: 病区名称。
        bedNo:
          type: string
          description: 床号；未分配时为空字符串。
        siteId:
          type: string
          description: 院区标识。
    StatusHistoryEntry:
      type: object
      description: 申请状态变更历史（append-only）。
      required:
        - toStatus
        - occurredAt
      properties:
        fromStatus:
          type:
            - string
            - 'null'
          description: 变更前状态；首次创建为 null。
          enum:
            - SUBMITTED
            - ACCEPTED
            - SCHEDULED
            - CANCELLED
            - REJECTED
            - null
        toStatus:
          type: string
          description: 变更后状态。
          enum:
            - SUBMITTED
            - ACCEPTED
            - SCHEDULED
            - CANCELLED
            - REJECTED
        reasonCode:
          type: string
          description: 变更原因码（字典值，≤64 字符）；取消时必填，创建/导入为空。
          maxLength: 64
        reason:
          type: string
          description: 变更原因说明（演示文本，≤500 字符），不含患者标识。
          maxLength: 500
        operatorId:
          type: string
          description: 操作人用户标识。
        occurredAt:
          type: string
          format: date-time
          description: 变更时间（服务端时间）。
    SurgeryApplication:
      type: object
      description: 手术申请单（HIS 导入或手工创建）；hisApplicationNo 为幂等键。
      allOf:
        - $ref: '#/components/schemas/AuditFields'
        - type: object
          required:
            - applicationId
            - hisApplicationNo
            - patient
            - surgeryName
            - urgency
            - plannedDurationMin
            - departmentName
            - status
            - submittedAt
            - source
            - statusHistory
          properties:
            applicationId:
              type: string
              description: 手术申请标识（雪花 ID 字符串）。
            hisApplicationNo:
              type: string
              description: HIS 申请号，入站幂等键；重复提交不重复建单。
            patient:
              $ref: '#/components/schemas/PatientSnapshot'
            surgeryName:
              type: string
              description: 拟施术式。
            surgeryCode:
              type: string
              description: 术式编码（字典/院内编码）。
            urgency:
              type: string
              description: 紧急度；急诊优先于择期（§2.4.2）。
              enum:
                - ELECTIVE
                - URGENT
                - EMERGENCY
            plannedDurationMin:
              type: integer
              description: 预计手术时长（分钟），必须大于 0。
              minimum: 1
            departmentName:
              type: string
              description: 申请科室名称（取自患者快照）。
            surgeonName:
              type: string
              description: 申请/主刀医师姓名（演示文本）。
            preopDiagnosis:
              type: string
              description: 术前诊断（演示文本，不含患者标识）。
            status:
              type: string
              description: 申请状态。
              enum:
                - SUBMITTED
                - ACCEPTED
                - SCHEDULED
                - CANCELLED
                - REJECTED
            submittedAt:
              type: string
              format: date-time
              description: 提交时间（服务端时间）。
            source:
              type: string
              description: 来源：HIS=接口导入，MANUAL=手工/测试创建。
              enum:
                - HIS
                - MANUAL
            remark:
              type: string
              description: 备注（演示文本）。
            statusHistory:
              type: array
              description: 状态历史；列表接口为空数组，详情接口返回完整历史。
              items:
                $ref: '#/components/schemas/StatusHistoryEntry'
    SurgeryApplicationPage:
      type: object
      description: 手术申请分页结果。
      required:
        - items
        - meta
      properties:
        items:
          type: array
          description: 当前页手术申请列表。
          items:
            $ref: '#/components/schemas/SurgeryApplication'
        meta:
          $ref: '#/components/schemas/PageMeta'
    SurgeryApplicationCreateRequest:
      type: object
      description: 手工/测试创建手术申请；hisApplicationNo 为幂等键，重复返回 409。
      required:
        - hisApplicationNo
        - patientId
        - surgeryName
        - urgency
        - plannedDurationMin
      properties:
        hisApplicationNo:
          type: string
          description: HIS 申请号（幂等键）。
          minLength: 1
          maxLength: 64
        patientId:
          type: string
          description: 患者标识；必须已存在于患者快照。
        surgeryName:
          type: string
          description: 拟施术式。
          minLength: 1
          maxLength: 200
        surgeryCode:
          type: string
          description: 术式编码。
          maxLength: 64
        urgency:
          type: string
          description: 紧急度。
          enum:
            - ELECTIVE
            - URGENT
            - EMERGENCY
        plannedDurationMin:
          type: integer
          description: 预计手术时长（分钟），必须大于 0。
          minimum: 1
          maximum: 1440
        surgeonName:
          type: string
          description: 申请/主刀医师姓名（演示文本）。
          maxLength: 100
        preopDiagnosis:
          type: string
          description: 术前诊断（演示文本）。
          maxLength: 500
        remark:
          type: string
          description: 备注。
          maxLength: 500
    ImportSurgeryApplicationsRequest:
      type: object
      description: 模拟 HIS 拉取请求；count 严格 1–5（请求多少返回多少），seed 用于可复现的 SYNTHETIC 生成。
      required:
        - count
      properties:
        count:
          type: integer
          description: 拉取条数，严格 1–5：请求 N 条即返回 N 条（不足时返回可用数量并在 message 说明），越界返回 400。
          minimum: 1
          maximum: 5
        seed:
          type: integer
          description: 随机种子；相同种子生成相同申请号，保证重复导入幂等。
    ImportSurgeryApplicationsResult:
      type: object
      description: 模拟 HIS 导入结果；simulated=true 与 adapter=MOCK_HIS 明确标识为模拟。
      required:
        - simulated
        - adapter
        - requestedCount
        - importedCount
        - skippedCount
        - applications
        - message
      properties:
        simulated:
          type: boolean
          description: 是否模拟导入；当前固定 true（EXT-01）。
        adapter:
          type: string
          description: 适配器标识；当前固定 MOCK_HIS。
          enum:
            - MOCK_HIS
        requestedCount:
          type: integer
          description: 请求拉取条数。
          minimum: 0
        importedCount:
          type: integer
          description: 本次新增入库条数。
          minimum: 0
        skippedCount:
          type: integer
          description: 因幂等键已存在而跳过的条数。
          minimum: 0
        applications:
          type: array
          description: 本次新增的申请；重复导入时为空数组。
          items:
            $ref: '#/components/schemas/SurgeryApplication'
        message:
          type: string
          description: 结果说明（明确模拟来源）。
    CancelSurgeryApplicationRequest:
      type: object
      description: 取消手术申请请求；原因码必填并进入统计。
      required:
        - reasonCode
        - reason
        - version
      properties:
        reasonCode:
          type: string
          description: 取消原因码，来自字典。
        reason:
          type: string
          description: 原因说明（演示文本）。
          maxLength: 500
        version:
          type: integer
          description: 申请当前版本号，用于乐观锁。
          minimum: 1
