openapi: 3.1.0
info:
  title: ANESOP 手术排程契约（scheduling）
  summary: 术间资源、排程查询与创建、冲突检测、急诊加台、停台与排程分析
  description: |
    ANESOP 手术排程域契约，对应方案书 §2.4.2（M1 手术排程管理）与 §3.4.2（排程/台次实体）。
    硬规则：同术间时段不重叠、冲突不得强行保存、急诊加台优先于择期、停台改台必选原因码。
    所有示例均为 SYNTHETIC 合成数据。
    兼容性说明（ADR-0011 增补）：0.4.0 将 `Conflict.conflictType` 由 `enum` 放宽为
    `x-extensible-enum`，属**非严格 additive**（类型放宽，TS 侧由字面量联合变为 `string`），
    不破坏 JSON 结构；客户端须按字符串分支并容忍未知值。

    0.5.0（M2-M2-02，additive）新增停台 `POST /v1/scheduling/schedules/{scheduleId}/stop`
    （原因码白名单 + 状态机 + 变更记录 + 通知 outbox）、变更历史
    `GET /v1/scheduling/schedules/{scheduleId}/changes`（支持 page/size 分页）；急诊加台新增
    201 响应与 `approval` 记录、`preemptScheduleId` 抢占语义；改台 `PUT` 的 `reasonCode`
    改为**必填**（与方案书 §2.4.2「停台改台必选原因码」对齐）。
    旧 `POST .../cancel` 保留为 0.4.0 兼容（不删除，计划 1.0.0 收敛），但同样写入变更记录与
    通知 outbox，不再绕过变更历史。

    0.6.0（M2-M6-01，additive）新增排程分析只读接口：
    `GET /v1/scheduling/analytics/utilization`（术间利用率）、
    `GET /v1/scheduling/analytics/on-time`（首台准点开台率）、
    `GET /v1/scheduling/analytics/cancellations`（取消率，按原因码分组）与
    `GET /v1/scheduling/analytics/export`（脱敏 CSV，UTF-8 BOM）。准点率以“计划首台”为口径，
    取消/未开始的计划首台按术间-日计入 `excludedDays`（不进入分母），并新增可选字段；
    导出对以 `= + - @`/制表/回车开头的单元格前置单引号防公式注入。
    权限点 `m1:analytics:read`（V12 授 SYS_ADMIN/SYS_OR_MANAGER/SYS_QC_MANAGER）；
    时间范围必填、按 Asia/Shanghai 本地日期解释、跨度 ≤ 92 天；数据范围 DEPT/ROOM 与现有排程一致。
    口径由院方最终确定（D-21：系统出数、绩效规则院方另定），未确认项在 description 标注【待确认】。
  version: 0.6.0
  contact:
    name: ANESOP 项目组
  license:
    name: 内部交付（非开源）
servers:
  - url: https://anesop.local/api
    description: 院内单院部署统一入口（生产网无互联网出口）
security:
  - bearerAuth: []
tags:
  - name: 手术排程
    description: 术间资源、日排程、冲突检测、急诊加台与停台操作。
  - name: 排程分析
    description: 术间利用率、首台准点开台率、取消率与脱敏 CSV 导出（只读聚合，口径见字段说明）。
paths:
  /v1/scheduling/rooms:
    get:
      operationId: listOperatingRooms
      tags:
        - 手术排程
      summary: 查询术间列表
      description: |
        返回术间静态配置与当前状态，供排程工作台与驾驶舱使用；术间编号院内唯一。
        术间类型 `roomType` 用于排程规则匹配：GENERAL=普通手术间、HYBRID=杂交手术间、
        INTERVENTION=介入手术间。结果受当前用户数据范围约束（DEPT 本科室 / ROOM 绑定术间）。
      parameters:
        - name: siteId
          in: query
          description: 院区标识；不传时按当前用户数据范围过滤。
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: 术间当前状态。
          required: false
          schema:
            type: string
            enum:
              - IDLE
              - PREPARING
              - ANESTHESIA
              - SURGERY
              - PACU
              - CLEANING
      responses:
        '200':
          description: 术间列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatingRoomList'
              example:
                items:
                  - roomId: '7000000000000000001'
                    roomNo: OR-01
                    roomName: 演示 1 号手术间
                    roomType: GENERAL
                    siteId: '3000000000000000001'
                    status: IDLE
                    isolationRequired: false
                    equipmentTags:
                      - ANESTHESIA_MACHINE
                      - MONITOR
                    createdAt: '2026-01-05T08:00:00+08:00'
                    createdBy: '1000000000000000001'
                    updatedAt: '2026-11-12T08:00:00+08:00'
                    updatedBy: '1000000000000000001'
                    version: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/scheduling/schedules:
    get:
      operationId: listSchedules
      tags:
        - 手术排程
      summary: 查询排程
      description: 按日期、术间与状态查询日排程，返回台次顺序、计划与实际起止时间。
      parameters:
        - name: date
          in: query
          description: 排程日期（YYYY-MM-DD），按院区时区解释。
          required: true
          schema:
            type: string
            format: date
        - name: roomId
          in: query
          description: 术间标识。
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: 排程状态。
          required: false
          schema:
            type: string
            enum:
              - PLANNED
              - PUBLISHED
              - IN_PROGRESS
              - COMPLETED
              - CANCELLED
              - DELAYED
        - name: page
          in: query
          description: 页码，从 1 开始。
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          description: 每页条数。
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: 排程分页列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulePage'
              example:
                items:
                  - scheduleId: '8000000000000000001'
                    applicationId: '6000000000000000001'
                    patientId: '50000000-0000-4000-8000-000000000001'
                    patientNo: SYNTH-P-0001
                    patientName: 演示患者
                    roomId: '7000000000000000001'
                    roomNo: OR-01
                    sequenceNo: 1
                    plannedStart: '2026-12-01T08:30:00+08:00'
                    plannedEnd: '2026-12-01T11:00:00+08:00'
                    actualStart: '2026-12-01T08:35:00+08:00'
                    actualEnd: null
                    status: IN_PROGRESS
                    priority: ELECTIVE
                    changeReason: null
                    createdAt: '2026-11-09T11:20:00+08:00'
                    createdBy: '1000000000000000001'
                    updatedAt: '2026-12-01T08:35:00+08:00'
                    updatedBy: '1000000000000000001'
                    version: 4
                meta:
                  page: 1
                  size: 50
                  total: 1
                  totalPages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createSchedule
      tags:
        - 手术排程
      summary: 创建排程
      description: |
        为手术申请分配术间、台次与计划时段。服务端在事务内再次执行冲突检测，冲突时返回 409，
        不得强行保存；急诊加台走专用接口。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleRequest'
            example:
              applicationId: '6000000000000000001'
              roomId: '7000000000000000001'
              plannedStart: '2026-12-01T08:30:00+08:00'
              plannedEnd: '2026-12-01T11:00:00+08:00'
              sequenceNo: 1
              priority: ELECTIVE
      responses:
        '201':
          description: 排程创建成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
              example:
                scheduleId: '8000000000000000001'
                applicationId: '6000000000000000001'
                patientId: '50000000-0000-4000-8000-000000000001'
                patientNo: SYNTH-P-0001
                patientName: 演示患者
                roomId: '7000000000000000001'
                roomNo: OR-01
                sequenceNo: 1
                plannedStart: '2026-12-01T08:30:00+08:00'
                plannedEnd: '2026-12-01T11:00:00+08:00'
                actualStart: null
                actualEnd: null
                status: PLANNED
                priority: ELECTIVE
                changeReason: null
                createdAt: '2026-11-09T11:20:00+08:00'
                createdBy: '1000000000000000001'
                updatedAt: '2026-11-09T11:20:00+08:00'
                updatedBy: '1000000000000000001'
                version: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/scheduling/schedules/conflicts:
    post:
      operationId: detectScheduleConflicts
      tags:
        - 手术排程
      summary: 排程冲突即时检测（工作台预检）
      description: |
        对候选术间/时段/申请执行规则引擎检测，返回结构化冲突（类型、说明、冲突台次），
        仅返回结果不落库；供排程工作台在提交前即时提示。创建/调整排程时服务端仍在事务内复核，
        冲突返回 409（`Error.conflicts` 携带同一结构）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConflictCheckRequest'
            example:
              roomId: '7000000000000000001'
              applicationId: '6000000000000000001'
              plannedStart: '2026-12-01T10:30:00+08:00'
              plannedEnd: '2026-12-01T12:30:00+08:00'
              excludeScheduleId: '8000000000000000001'
      responses:
        '200':
          description: 冲突检测结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictCheckResult'
              example:
                hasConflict: true
                conflicts:
                  - conflictType: ROOM_OVERLAP
                    severity: BLOCKING
                    message: 与术间 OR-01 第 1 台（SYNTH-P-0001）时段重叠
                    conflictingScheduleId: '8000000000000000001'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/scheduling/schedules/{scheduleId}:
    get:
      operationId: getSchedule
      tags:
        - 手术排程
      summary: 查询排程详情
      description: 按排程标识返回台次详情，供麻醉记录单起单与术前准备联动。
      parameters:
        - name: scheduleId
          in: path
          description: 排程标识（雪花 ID 字符串）。
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 排程详情。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
              example:
                scheduleId: '8000000000000000001'
                applicationId: '6000000000000000001'
                patientId: '50000000-0000-4000-8000-000000000001'
                patientNo: SYNTH-P-0001
                patientName: 演示患者
                roomId: '7000000000000000001'
                roomNo: OR-01
                sequenceNo: 1
                plannedStart: '2026-12-01T08:30:00+08:00'
                plannedEnd: '2026-12-01T11:00:00+08:00'
                actualStart: null
                actualEnd: null
                status: PUBLISHED
                priority: ELECTIVE
                changeReason: null
                createdAt: '2026-11-09T11:20:00+08:00'
                createdBy: '1000000000000000001'
                updatedAt: '2026-11-10T09:10:00+08:00'
                updatedBy: '1000000000000000001'
                version: 2
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: rescheduleSchedule
      tags:
        - 手术排程
      summary: 调整排程（改时间/改术间）
      description: |
        调整既有台次的术间与计划时段（改台）。服务端先锁定目标术间行（`SELECT ... FOR UPDATE`），
        再在事务内复检冲突；冲突返回 409，`Error.conflicts` 列出冲突类型与冲突台次。
        必须回传 `version`，版本过期返回 409，不静默覆盖。

        改台留痕（M2-M2-02）：`reasonCode` 必填（0.5.0，方案书 §2.4.2「停台改台必选原因码」），
        必须命中白名单（缺失/非法 400 `PARAM_INVALID`，`details[].field=reasonCode`）；成功后写
        `schedule_change_request`（changeType=MODIFY，approvalStatus=APPROVED）、
        `SCHEDULE_UPDATE` 审计与 `SCHEDULE_MODIFIED` 通知（payload 无 PHI）。
      parameters:
        - name: scheduleId
          in: path
          description: 排程标识（雪花 ID 字符串）。
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScheduleRequest'
            example:
              roomId: '7000000000000000002'
              plannedStart: '2026-12-01T13:00:00+08:00'
              plannedEnd: '2026-12-01T15:30:00+08:00'
              sequenceNo: 2
              version: 1
              reasonCode: SCHEDULE_ADJUST
              reason: 演示改台原因（合成数据）
      responses:
        '200':
          description: 调整成功，返回更新后的台次。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
              example:
                scheduleId: '8000000000000000001'
                applicationId: '6000000000000000001'
                patientId: '50000000-0000-4000-8000-000000000001'
                patientNo: SYNTH-P-0001
                patientName: 演示患者
                roomId: '7000000000000000002'
                roomNo: OR-02
                sequenceNo: 2
                plannedStart: '2026-12-01T13:00:00+08:00'
                plannedEnd: '2026-12-01T15:30:00+08:00'
                actualStart: null
                actualEnd: null
                status: PLANNED
                priority: ELECTIVE
                changeReason: 术间调整（演示）
                createdAt: '2026-11-09T11:20:00+08:00'
                createdBy: '1000000000000000001'
                updatedAt: '2026-11-12T16:00:00+08:00'
                updatedBy: '1000000000000000001'
                version: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/scheduling/schedules/{scheduleId}/stop:
    post:
      operationId: stopSchedule
      tags:
        - 手术排程
      summary: 停台（状态机 + 原因码 + 变更留痕）
      description: |
        停台状态机（M2-M2-02，方案书 §2.4.2）：`PLANNED`/`PUBLISHED`/`DELAYED` 由持
        `m1:schedule:write` 的排程管理员直接停台；`IN_PROGRESS`（术中停台）必须同时持
        `m1:schedule:approve`（SYS_ADMIN/SYS_OR_MANAGER），否则 403。`COMPLETED`/`CANCELLED`
        为终态，再次停台返回 409 `STATE_CONFLICT`；版本过期返回 409 `VERSION_CONFLICT`。

        原因码必填且必须在白名单内（缺省/非法 400 `PARAM_INVALID`，`details[].field=reasonCode`）；
        `reason` 可选。成功时：台次置 `CANCELLED`、释放台次占用、写 `schedule_change_request`
        （changeType=STOP，approvalStatus=APPROVED）、写 `SCHEDULE_STOP` 审计、写入
        `notification_outbox`（事件 `SCHEDULE_STOPPED`，payload 只含标识与原因码，无 PHI）。
        与 0.4.0 的 `POST .../cancel` 相比，本端点额外落变更记录与通知，旧端点保留兼容。
      parameters:
        - name: scheduleId
          in: path
          description: 排程标识（UUID 字符串）。
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopScheduleRequest'
            example:
              reasonCode: PATIENT_CONDITION
              reason: 演示停台原因（合成数据）
              version: 4
      responses:
        '200':
          description: 停台成功，返回状态为 CANCELLED 的台次。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
              example:
                scheduleId: '8000000000000000001'
                applicationId: '6000000000000000001'
                patientId: '50000000-0000-4000-8000-000000000001'
                patientNo: SYNTH-P-0001
                patientName: 演示患者
                roomId: '7000000000000000001'
                roomNo: OR-01
                sequenceNo: 1
                plannedStart: '2026-12-01T08:30:00+08:00'
                plannedEnd: '2026-12-01T11:00:00+08:00'
                actualStart: '2026-12-01T08:35:00+08:00'
                actualEnd: null
                status: CANCELLED
                priority: ELECTIVE
                changeReason: 演示停台原因（合成数据）
                createdAt: '2026-11-09T11:20:00+08:00'
                createdBy: '1000000000000000001'
                updatedAt: '2026-12-01T09:10:00+08:00'
                updatedBy: '1000000000000000001'
                version: 5
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/scheduling/schedules/{scheduleId}/changes:
    get:
      operationId: listScheduleChanges
      tags:
        - 手术排程
      summary: 查询台次变更记录（停台/改台/急诊审批历史）
      description: |
        返回该台次的变更留痕（M2-M2-02）：停台（STOP）、改台（MODIFY）、急诊加台与抢占
        （EMERGENCY）的申请/审批记录，按 `requestedAt` 倒序。查询受当前用户数据范围约束：
        台次不存在或超出范围返回 404（不泄露存在性）；需 `m1:schedule:read`。
        `page`/`size` 为 additive 分页参数（缺省 page=1、size=50，size 上限 200）；
        `meta` 回显分页信息，便于后续留痕量增长时前端翻页。
      parameters:
        - name: scheduleId
          in: path
          description: 排程标识（UUID 字符串）。
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: 页码，从 1 开始；缺省 1。
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          description: 每页条数；缺省 50，上限 200。
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: 变更记录列表；无记录时 items 为空数组。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleChangeList'
              example:
                items:
                  - changeId: '9000000000000000001'
                    scheduleId: '8000000000000000001'
                    applicationId: '6000000000000000001'
                    changeType: STOP
                    reasonCode: PATIENT_CONDITION
                    reason: 演示停台原因（合成数据）
                    status: APPROVED
                    preemptScheduleId: null
                    requestedBy: '1000000000000000001'
                    requestedAt: '2026-12-01T09:10:00+08:00'
                    approvedBy: '1000000000000000001'
                    approvedAt: '2026-12-01T09:10:00+08:00'
                    version: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/scheduling/conflicts/check:
    post:
      operationId: checkScheduleConflict
      deprecated: true
      tags:
        - 手术排程
      summary: 检测排程冲突（已弃用，改用 POST /v1/scheduling/schedules/conflicts）
      description: |
        已弃用：由 `POST /v1/scheduling/schedules/conflicts`（operationId=detectScheduleConflicts）
        取代，计划 1.0.0 删除。保留路径仅为兼容 0.3.0 调用方，语义与响应结构不变。
        对候选术间与时段执行冲突检测，覆盖术间时段重叠、人员排班、设备依赖与隔离要求。
        仅返回检测结果，不落库；创建/调整排程时服务端仍会复核。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConflictCheckRequest'
            example:
              roomId: '7000000000000000001'
              plannedStart: '2026-12-01T10:30:00+08:00'
