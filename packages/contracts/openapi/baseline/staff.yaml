                  validFrom: '2026-11-01'
                  validTo: '2027-10-31'
                  status: ACTIVE
                  approvedBy: '10000000-0000-4000-8000-000000000001'
                  approvedAt: '2026-11-14T08:00:00+08:00'
                  changeReason: 年度授权复评（SYNTHETIC）
                  createdAt: '2026-11-14T08:00:00+08:00'
                  createdBy: '10000000-0000-4000-8000-000000000001'
                history:
                  - authorizationId: '5a000000-0000-4000-8000-000000000001'
                    staffId: '3a000000-0000-4000-8000-000000000001'
                    version: 1
                    level: R3
                    surgeryScopes:
                      - '*'
                    ageMin: 18
                    ageMax: 90
                    asaMax: ASA3
                    validFrom: '2026-11-01'
                    validTo: '2027-10-31'
                    status: ACTIVE
                    approvedBy: '10000000-0000-4000-8000-000000000001'
                    approvedAt: '2026-11-14T08:00:00+08:00'
                    changeReason: 年度授权复评（SYNTHETIC）
                    createdAt: '2026-11-14T08:00:00+08:00'
                    createdBy: '10000000-0000-4000-8000-000000000001'
