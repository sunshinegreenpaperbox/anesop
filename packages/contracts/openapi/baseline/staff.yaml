components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 统一 OAuth2/JWT 访问令牌，放在 Authorization 请求头中（Bearer 方案）。
  parameters:
    StaffId:
      name: staffId
      in: path
      required: true
      description: 人员档案标识（UUID 字符串）。
      schema:
        type: string
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      description: 排班标识（UUID 字符串）。
      schema:
        type: string
  responses:
    BadRequest:
      description: 请求参数校验失败（字段缺失/越界/日期区间非法/授权动作缺少必填范围）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: PARAM_INVALID
            message: 请求参数校验失败
            traceId: SYNTH-TRACE-0301
            details:
              - field: ageMax
                reason: 年龄上限不得小于年龄下限
    Unauthorized:
      description: 未认证或令牌已失效（fail-closed）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: AUTH_UNAUTHORIZED
            message: 未认证或令牌已失效
            traceId: SYNTH-TRACE-0302
            details: []
    Forbidden:
      description: 已认证但缺权限（m4:staff:read|write、m4:schedule:manage、m4:training:manage）或数据范围不足。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: AUTH_FORBIDDEN
            message: 无权访问该资源或数据范围不足
            traceId: SYNTH-TRACE-0303
            details:
              - field: permission
                reason: 需要 m4:staff:write 权限与对应科室数据范围
    NotFound:
      description: 人员/排班/培训记录不存在或不可见（不泄露其他科室数据的存在性）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RESOURCE_NOT_FOUND
            message: 资源不存在或不可见
            traceId: SYNTH-TRACE-0304
            details: []
    Conflict:
      description: 工号/userId/课程重复、授权版本过期、排班冲突（人员同日同班次或术间同日同班次）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: STATE_CONFLICT
            message: 状态或版本冲突，操作未生效
            traceId: SYNTH-TRACE-0305
            details:
              - field: staffId
                reason: 该人员 2026-11-20 白班已有排班（排班标识 6a000000-0000-4000-8000-000000000009）
              - field: roomId
                reason: 该术间 2026-11-20 白班已有排班（排班标识 6a000000-0000-4000-8000-000000000010）
    UnprocessableEntity:
      description: 业务规则拒绝：科室不存在/停用/非科室、人员已离职不得授予、级别策略超限等。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: BUSINESS_RULE_VIOLATION
            message: 人员或科室不在可用范围内
            traceId: SYNTH-TRACE-0306
            details:
              - field: departmentId
                reason: 科室不存在、已停用或不是科室组织
  schemas:
    ErrorDetail:
      type: object
      description: 错误明细项，用于字段级校验失败、数据范围说明或排班冲突明细。
      required:
        - field
        - reason
      properties:
        field:
          type: string
          description: 相关字段名或资源标识。
        reason:
          type: string
          description: 可读的失败原因，不包含堆栈、SQL 实参与患者标识。
    Error:
      type: object
      description: 统一错误响应；不暴露堆栈、SQL 实参、令牌与患者标识。
      required:
        - code
        - message
        - traceId
        - details
      properties:
        code:
          type: string
          description: 稳定错误码，供前端分支与告警规则使用。
        message:
          type: string
          description: 面向用户的中文提示，可安全展示。
        traceId:
          type: string
          description: 链路追踪标识，与日志、审计记录关联。
        details:
          type: array
          description: 字段级或范围级错误明细；无明细时为空数组。
          items:
            $ref: '#/components/schemas/ErrorDetail'
    StaffQualification:
      type: object
      description: 执业资质（SYNTHETIC 示例）；`expired` 由服务端按有效期计算。
      required:
        - qualificationId
        - qualificationType
        - certificateNo
        - issuingAuthority
        - validFrom
        - status
        - expired
      properties:
        qualificationId:
          type: string
          description: 资质标识（UUID 字符串）。
        qualificationType:
          type: string
          description: 资质类型：PRACTICE_LICENSE=执业资格，SPECIALTY_CERT=专业资质，NURSE_LICENSE=护士执业证，OTHER=其他。
          enum:
            - PRACTICE_LICENSE
            - SPECIALTY_CERT
            - NURSE_LICENSE
            - OTHER
        certificateNo:
          type: string
          maxLength: 64
          description: 证书编号（仅在本域存储与展示，不写入审计与日志）。
        issuingAuthority:
          type: string
          maxLength: 200
          description: 签发机构。
        validFrom:
          type: string
          format: date
          description: 有效期起（含）。
        validTo:
          type: string
          format: date
          description: 有效期止（含）；缺省表示长期有效。
        status:
          type: string
          description: 状态：ACTIVE=有效，REVOKED=已撤销（吊销后不可再用于执业判断）。
          enum:
            - ACTIVE
            - REVOKED
        expired:
          type: boolean
          description: 是否已过有效期（服务端按 validTo 与当天计算）。
    Staff:
      type: object
      description: 人员档案（SYNTHETIC 示例）；关联 m0 用户与科室，工号唯一且不可改。
      required:
        - staffId
        - staffNo
        - name
        - departmentId
        - title
        - employmentStatus
        - specialties
        - qualifications
        - createdAt
        - createdBy
        - updatedAt
        - updatedBy
        - version
      properties:
        staffId:
          type: string
          description: 人员档案标识（UUID 字符串）。
        userId:
          type: string
          description: 关联的 m0 用户标识（可空；非空时一人只能一条档案）。
        staffNo:
          type: string
          description: 院内工号（唯一，创建后不可改）。
          maxLength: 32
        name:
          type: string
          description: 姓名（本域业务展示用；审计与日志不写姓名）。
          maxLength: 64
        departmentId:
          type: string
          description: 所属科室组织标识。
        departmentName:
          type: string
          description: 科室名称（展示用，由服务端按组织查询填充）。
          maxLength: 100
        siteId:
          type: string
          description: 院区标识（可空）。
        title:
          type: string
          description: 职称（院内职称字典；取值【待确认】）。
          maxLength: 32
        jobGrade:
          type: string
          description: 职级（可空；院内职级字典【待确认】）。
          maxLength: 32
        employmentStatus:
          type: string
          description: 在职状态：ACTIVE=在职，INACTIVE=离职/停用（不得执业，档案只读历史）。
          enum:
            - ACTIVE
            - INACTIVE
        specialties:
          type: array
          description: 专长（自由文本标签，用于排班与授权参考，不替代授权校验）。
          maxItems: 20
          items:
            type: string
            maxLength: 32
        qualifications:
          type: array
          description: 执业资质列表（替换式维护：PUT 提交的列表即最新快照）。
          maxItems: 20
          items:
            $ref: '#/components/schemas/StaffQualification'
        createdAt:
          type: string
          format: date-time
          description: 创建时间。
        createdBy:
          type: string
          description: 创建人用户标识。
        updatedAt:
          type: string
          format: date-time
          description: 最后更新时间。
        updatedBy:
          type: string
          description: 最后修改人用户标识。
        version:
          type: integer
          description: 乐观锁版本号（从 1 起）。
          minimum: 1
    StaffList:
      type: object
      description: 人员档案分页结果。
      required:
        - items
        - page
        - size
        - total
        - totalPages
      properties:
        items:
          type: array
          description: 人员档案列表。
          items:
            $ref: '#/components/schemas/Staff'
        page:
          type: integer
          description: 当前页码，从 1 开始。
          minimum: 1
        size:
          type: integer
          description: 每页条数。
          minimum: 1
          maximum: 200
        total:
          type: integer
          description: 符合条件的总数。
          minimum: 0
        totalPages:
          type: integer
          description: 总页数；total 为 0 时为 0。
          minimum: 0
    CreateStaffRequest:
      type: object
      description: 新建人员档案请求；staffNo 唯一，userId 非空时唯一。
      required:
        - staffNo
        - name
        - departmentId
        - title
      properties:
        userId:
          type: string
          description: 关联的 m0 用户标识（可空）。
        staffNo:
          type: string
          description: 院内工号（唯一，创建后不可改）。
          maxLength: 32
          pattern: '^[A-Za-z0-9._-]{1,32}$'
        name:
          type: string
          description: 姓名。
          maxLength: 64
        departmentId:
          type: string
          description: 所属科室组织标识（必须为启用科室且在数据范围内）。
        siteId:
          type: string
          description: 院区标识（可空）。
        title:
          type: string
          description: 职称（院内职称字典；取值【待确认】）。
          maxLength: 32
        jobGrade:
          type: string
          description: 职级（可空）。
          maxLength: 32
        employmentStatus:
          type: string
          description: 在职状态；缺省 ACTIVE。
          enum:
            - ACTIVE
            - INACTIVE
        specialties:
          type: array
          description: 专长标签。
          maxItems: 20
          items:
            type: string
            maxLength: 32
        qualifications:
          type: array
          description: 执业资质。
          maxItems: 20
          items:
            $ref: '#/components/schemas/StaffQualificationInput'
    UpdateStaffRequest:
      type: object
      description: 更新人员档案请求（工号与 userId 不可改；必须回传 version）。
      required:
        - name
        - departmentId
        - title
        - employmentStatus
        - version
      properties:
        name:
          type: string
          description: 姓名。
          maxLength: 64
        departmentId:
          type: string
          description: 所属科室组织标识（变更需原科室与新科室均在数据范围内）。
        siteId:
          type: string
          description: 院区标识（可空）。
        title:
          type: string
          description: 职称。
          maxLength: 32
        jobGrade:
          type: string
          description: 职级（可空）。
          maxLength: 32
        employmentStatus:
          type: string
          description: 在职状态；置为 INACTIVE 后不得执业（授权校验返回 STAFF_INACTIVE）。
          enum:
            - ACTIVE
            - INACTIVE
        specialties:
          type: array
          description: 专长标签（提交列表即最新快照）。
          maxItems: 20
          items:
            type: string
            maxLength: 32
        qualifications:
          type: array
          description: 执业资质（替换式维护；提交列表即最新快照）。
          maxItems: 20
          items:
            $ref: '#/components/schemas/StaffQualificationInput'
        version:
          type: integer
          description: 乐观锁版本号（必须等于当前版本，否则 409）。
          minimum: 1
    StaffQualificationInput:
      type: object
      description: 执业资质入参（无 qualificationId；由服务端生成）。
      required:
        - qualificationType
        - certificateNo
        - issuingAuthority
        - validFrom
      properties:
        qualificationType:
          type: string
          description: 资质类型。
          enum:
            - PRACTICE_LICENSE
            - SPECIALTY_CERT
            - NURSE_LICENSE
            - OTHER
        certificateNo:
          type: string
          description: 证书编号（≤64）。
          maxLength: 64
        issuingAuthority:
          type: string
          description: 签发机构（≤200）。
          maxLength: 200
        validFrom:
          type: string
          format: date
          description: 有效期起（含）。
        validTo:
          type: string
          format: date
          description: 有效期止（含）；缺省表示长期有效。
        status:
          type: string
          description: 状态；缺省 ACTIVE。REVOKED 表示吊销（保留记录）。
          enum:
            - ACTIVE
            - REVOKED
    StaffAuthorization:
      type: object
      description: |
        分级授权版本（append-only）。`surgeryScopes` 中的 `*` 表示全部术式；`level` 为
        R1–R5 级别标签，级别默认映射【待确认】，范围以显式字段为权威。
      required:
        - authorizationId
        - staffId
        - version
        - level
        - surgeryScopes
        - ageMin
        - ageMax
        - asaMax
        - validFrom
        - validTo
        - status
        - approvedBy
        - approvedAt
        - createdAt
        - createdBy
      properties:
        authorizationId:
          type: string
          description: 授权版本标识（UUID 字符串）。
        staffId:
          type: string
          description: 人员档案标识。
        version:
          type: integer
          description: 授权版本号（从 1 起，只增）。
          minimum: 1
        level:
          type: string
          description: 授权级别 R1–R5（级别含义与默认映射【待确认】）。
          enum:
            - R1
            - R2
            - R3
            - R4
            - R5
        surgeryScopes:
          type: array
          description: 术式范围（术式类别/术式编码；`*` 表示全部）。
          minItems: 1
          maxItems: 100
          items:
            type: string
            pattern: '^(\*|[A-Za-z0-9._-]{1,64})$'
        ageMin:
          type: integer
          description: 可实施年龄段下限（岁，含）。
          minimum: 0
          maximum: 120
        ageMax:
          type: integer
          description: 可实施年龄段上限（岁，含）。
          minimum: 1
          maximum: 120
        asaMax:
          type: string
          description: ASA 分级上限（含）；ASA1–ASA5（ASA VI 不纳入本域）。
          enum:
            - ASA1
            - ASA2
            - ASA3
            - ASA4
            - ASA5
        validFrom:
          type: string
          format: date
          description: 授权生效日期（含）。
        validTo:
          type: string
          format: date
          description: 授权失效日期（含）。
        status:
          type: string
          description: 状态：ACTIVE=生效版本，REVOKED=已撤销版本（保留历史）。
          enum:
            - ACTIVE
            - REVOKED
        approvedBy:
          type: string
          description: 审批人用户标识（必填；授权属临床资质决策，须可追溯）。
        approvedAt:
          type: string
          format: date-time
          description: 审批时间（服务端时间）。
        changeReason:
          type: string
          maxLength: 200
          description: 变更/撤销原因（不含患者信息）。
        createdAt:
          type: string
          format: date-time
          description: 写入时间。
        createdBy:
          type: string
          description: 写入人用户标识。
    StaffAuthorizationHistory:
      type: object
      description: 当前授权与全部历史版本（倒序）；无授权时 current 为 null、history 为空数组。
      required:
        - staffId
        - history
      properties:
        staffId:
          type: string
          description: 人员档案标识。
        current:
          description: 当前版本授权（无授权时为 null）。
          oneOf:
            - $ref: '#/components/schemas/StaffAuthorization'
            - type: 'null'
        history:
          type: array
          description: 历史版本（按版本倒序，append-only）。
          items:
            $ref: '#/components/schemas/StaffAuthorization'
    UpdateStaffAuthorizationRequest:
      type: object
      description: |
        授予/撤销授权请求。`action=GRANT` 时必须提供 level/surgeryScopes/ageMin/ageMax/
        asaMax/validFrom/validTo；`action=REVOKE` 时只需 version/approvedBy 与原因
        （其余字段忽略，服务端保留上一版本范围快照）。version 必须等于当前版本（无授权传 0）。
      required:
        - action
        - version
        - approvedBy
      properties:
        action:
          type: string
          description: 动作：GRANT=授予/复评，REVOKE=撤销。
          enum:
            - GRANT
            - REVOKE
        version:
          type: integer
          description: 当前授权版本（无授权时传 0）；与库中不一致则 409。
          minimum: 0
        level:
          type: string
          description: 授权级别（GRANT 必填）。
          enum:
            - R1
            - R2
            - R3
            - R4
            - R5
        surgeryScopes:
          type: array
          description: 术式范围（GRANT 必填；`*` 表示全部）。
          maxItems: 100
          items:
            type: string
            pattern: '^(\*|[A-Za-z0-9._-]{1,64})$'
        ageMin:
          type: integer
          description: 年龄段下限（GRANT 必填）。
          minimum: 0
          maximum: 120
        ageMax:
          type: integer
          description: 年龄段上限（GRANT 必填）。
          minimum: 1
          maximum: 120
        asaMax:
          type: string
          description: ASA 上限（GRANT 必填）。
          enum:
            - ASA1
            - ASA2
            - ASA3
            - ASA4
            - ASA5
        validFrom:
          type: string
          format: date
          description: 生效日期（GRANT 必填）。
        validTo:
          type: string
          format: date
          description: 失效日期（GRANT 必填）。
        approvedBy:
          type: string
          description: 审批人用户标识（必填）。
        changeReason:
          type: string
          maxLength: 200
          description: 变更/撤销原因；REVOKE 时必填。
    AuthorizationCheckRequest:
      type: object
      description: 授权校验入参；仅 staffId 必填，其余字段缺省时跳过对应维度。
      required:
        - staffId
      properties:
        staffId:
          type: string
          description: 人员档案标识。
        surgeryTypeId:
          type: string
          maxLength: 64
          description: 术式标识/术式类别编码（缺省不校验术式范围）。
        age:
          type: integer
          minimum: 0
          maximum: 120
          description: 患者年龄（岁；缺省不校验年龄段）。
        asa:
          type: string
          description: ASA 分级（缺省不校验 ASA 上限）。
          enum:
            - ASA1
            - ASA2
            - ASA3
            - ASA4
            - ASA5
        at:
          type: string
          format: date-time
          description: 判定时点（缺省为服务端当前时间；用于补录/回溯校验）。
    AuthorizationCheckReason:
      type: object
      description: 授权校验未通过原因（多原因同时返回）。
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: 稳定原因码。
          enum:
            - STAFF_INACTIVE
            - NO_AUTHORIZATION
            - AUTHORIZATION_REVOKED
            - NOT_YET_VALID
            - EXPIRED
            - SURGERY_SCOPE_MISSING
            - AGE_OUT_OF_RANGE
            - ASA_EXCEEDS_LIMIT
            - LEVEL_POLICY_EXCEEDED
        message:
          type: string
          description: 可读原因（不含患者标识）。
    AuthorizationCheckResult:
      type: object
      description: 授权校验结果；allowed=false 时 reasons 至少一条，allowed=true 时为空数组。
      required:
        - allowed
        - reasons
        - checkedAt
      properties:
        allowed:
          type: boolean
          description: 是否允许（规则判定，不替代临床决策）。
        reasons:
          type: array
          description: 未通过原因（全部返回，便于一次纠正）。
          items:
            $ref: '#/components/schemas/AuthorizationCheckReason'
        level:
          type: string
          description: 命中的授权级别（无授权时缺省）。
          enum:
            - R1
            - R2
            - R3
            - R4
            - R5
        authorizationId:
          type: string
          description: 命中的授权版本标识（无授权时缺省）。
        validUntil:
          type: string
          format: date
          description: 命中授权的失效日期（无授权时缺省）。
        checkedAt:
          type: string
          format: date-time
          description: 判定时间（服务端时间）。
    StaffSchedule:
      type: object
      description: 排班记录；同人员同日同班次、同术间同日同班次唯一（已取消的记录不占用）。
      required:
        - scheduleId
        - staffId
        - scheduleDate
        - shift
        - departmentId
        - status
        - createdAt
        - createdBy
        - updatedAt
        - updatedBy
        - version
      properties:
        scheduleId:
          type: string
          description: 排班标识（UUID 字符串）。
        staffId:
          type: string
          description: 人员档案标识。
        staffNo:
          type: string
          description: 人员工号（展示用）。
        scheduleDate:
          type: string
          format: date
          description: 排班日期（Asia/Shanghai 自然日）。
        shift:
          type: string
          description: 班次：DAY=白班，NIGHT=夜班，ON_CALL=备班（班次口径【待确认】）。
          enum:
            - DAY
            - NIGHT
            - ON_CALL
        roomId:
          type: string
          description: 术间标识（可空；术间主数据归属 M1，本域只做冲突检测）。
        departmentId:
          type: string
          description: 科室组织标识。
        status:
          type: string
          description: 状态：PLANNED=已排班，CANCELLED=已取消（保留记录）。
          enum:
            - PLANNED
            - CANCELLED
        note:
          type: string
          maxLength: 200
          description: 备注（不含患者信息）。
        cancelledAt:
          type: string
          format: date-time
          description: 取消时间。
        cancelledBy:
          type: string
          description: 取消人用户标识。
        cancelReason:
          type: string
          maxLength: 200
          description: 取消原因（不含患者信息）。
        createdAt:
          type: string
          format: date-time
          description: 创建时间。
        createdBy:
          type: string
          description: 创建人用户标识。
        updatedAt:
          type: string
          format: date-time
          description: 最后更新时间。
        updatedBy:
          type: string
          description: 最后修改人用户标识。
        version:
          type: integer
          description: 乐观锁版本号（从 1 起）。
          minimum: 1
    StaffScheduleList:
      type: object
      description: 排班列表。
      required:
        - items
      properties:
        items:
          type: array
          description: 排班记录（按日期、班次、人员排序）。
          items:
            $ref: '#/components/schemas/StaffSchedule'
    CreateStaffScheduleRequest:
      type: object
      description: 新建排班请求；冲突返回 409 并给出 details。
      required:
        - staffId
        - scheduleDate
        - shift
        - departmentId
      properties:
        staffId:
          type: string
          description: 人员档案标识（必须存在且在数据范围内）。
        scheduleDate:
          type: string
          format: date
          description: 排班日期。
        shift:
          type: string
          description: 班次。
          enum:
            - DAY
            - NIGHT
            - ON_CALL
        roomId:
          type: string
          description: 术间标识（可空）。
        departmentId:
          type: string
          description: 科室组织标识（必须为启用科室且在数据范围内）。
        note:
          type: string
          maxLength: 200
          description: 备注（不含患者信息）。
    UpdateStaffScheduleRequest:
      type: object
      description: 更新排班请求（必须回传 version；冲突规则同新建，排除自身）。
      required:
        - scheduleDate
        - shift
        - departmentId
        - version
      properties:
        staffId:
          type: string
          description: 人员档案标识（缺省保持原人员）。
        scheduleDate:
          type: string
          format: date
          description: 排班日期。
        shift:
          type: string
          description: 班次。
          enum:
            - DAY
            - NIGHT
            - ON_CALL
        roomId:
          type: string
          description: 术间标识（可空；缺省或空值表示不指定术间，即清空原术间）。
        departmentId:
          type: string
          description: 科室组织标识。
        note:
          type: string
          maxLength: 200
          description: 备注（不含患者信息）。
        version:
          type: integer
          description: 乐观锁版本号（必须等于当前版本，否则 409）。
          minimum: 1
    CancelStaffScheduleRequest:
      type: object
      description: 取消排班请求（保留记录，释放班次名额）。
      required:
        - version
      properties:
        reason:
          type: string
          maxLength: 200
          description: 取消原因（不含患者信息）。
        version:
          type: integer
          description: 乐观锁版本号（必须等于当前版本，否则 409）。
          minimum: 1
    StaffTraining:
      type: object
      description: 培训记录；`status` 与 `daysUntilExpiry` 由服务端按到期时间计算。
      required:
        - trainingId
        - staffId
        - courseCode
        - courseName
        - completedOn
        - status
        - createdAt
        - createdBy
      properties:
        trainingId:
          type: string
          description: 培训记录标识（UUID 字符串）。
        staffId:
          type: string
          description: 人员档案标识。
        staffNo:
          type: string
          description: 人员工号（展示用）。
        courseCode:
          type: string
          description: 课程编码（院内唯一；同一人员同一课程编码只能登记一次）。
          maxLength: 64
        courseName:
          type: string
          description: 课程名称。
          maxLength: 200
        completedOn:
          type: string
          format: date
          description: 完成日期（不得晚于今天）。
        expiresOn:
          type: string
          format: date
          description: 到期日期（可空表示长期有效；不得早于完成日期）。
        certificateNo:
          type: string
          maxLength: 64
          description: 证书编号（不写入审计与日志）。
        status:
          type: string
          description: 计算状态：VALID=有效，EXPIRING=进入提醒窗口，EXPIRED=已过期，NO_EXPIRY=长期有效。
          enum:
            - VALID
            - EXPIRING
            - EXPIRED
            - NO_EXPIRY
        daysUntilExpiry:
          type: integer
          description: 距到期天数（负值表示已过期；无到期日时缺省）。
        createdAt:
          type: string
          format: date-time
          description: 登记时间。
        createdBy:
          type: string
          description: 登记人用户标识。
    StaffTrainingList:
      type: object
      description: 培训记录列表。
      required:
        - items
      properties:
        items:
          type: array
          description: 培训记录（按完成时间倒序）。
          items:
            $ref: '#/components/schemas/StaffTraining'
    ExpiringTrainingList:
      type: object
      description: 培训到期提醒列表（含已过期记录）。
      required:
        - items
        - days
        - asOf
      properties:
        items:
          type: array
          description: 即将到期/已到期的培训记录（按到期时间升序）。
          items:
            $ref: '#/components/schemas/StaffTraining'
        days:
          type: integer
          description: 提醒窗口天数（本次查询生效值）。
          minimum: 1
          maximum: 365
        asOf:
          type: string
          format: date
          description: 计算基准日（Asia/Shanghai）。
    CreateStaffTrainingRequest:
      type: object
      description: 登记培训记录请求。
      required:
        - staffId
        - courseCode
        - courseName
        - completedOn
      properties:
        staffId:
          type: string
          description: 人员档案标识（必须存在且在数据范围内）。
        courseCode:
          type: string
          description: 课程编码。
          maxLength: 64
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        courseName:
          type: string
          description: 课程名称。
          maxLength: 200
        completedOn:
          type: string
          format: date
          description: 完成日期（不得晚于今天）。
        expiresOn:
          type: string
          format: date
          description: 到期日期（可空；不得早于完成日期）。
        certificateNo:
          type: string
          maxLength: 64
          description: 证书编号。
    DepartmentOption:
      type: object
      description: 科室选项（仅标识/编码/名称，不含人员与联系方式）。
      required:
        - departmentId
        - code
        - name
      properties:
        departmentId:
          type: string
          description: 科室组织标识。
        code:
          type: string
          description: 科室编码（院内唯一）。
        name:
          type: string
          description: 科室名称。
    DepartmentList:
      type: object
      description: 科室选项列表。
      required:
        - items
      properties:
        items:
          type: array
          description: 科室选项。
          items:
            $ref: '#/components/schemas/DepartmentOption'
