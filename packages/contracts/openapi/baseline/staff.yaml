openapi: 3.1.0
info:
  title: ANESOP 人员档案与分级授权契约（staff）
  summary: 人员档案、分级授权（R1–R5）、排班冲突检测、培训与到期提醒
  description: |
    ANESOP 人员管理域契约，对应方案书 §2.4.4（M3 人员管理：人员档案/分级授权/排班/
    培训与继续教育）、§3.4（领域模型“人员与资质”聚合根，核心不变量“未授权不得执行对应
    麻醉方式”）、§3.9.2（RBAC 与数据权限）与 §3.9.3（脱敏）。契约版本 0.1.0 为首个版本
    （additive）。
    硬规则：
    1) 人员档案关联 m0 用户（userId，可空，一人一条档案）与科室；**工号（staffNo）院内
       唯一且创建后不可改**；档案维护需要 `m4:staff:write`，查询需要 `m4:staff:read`。
       `employmentStatus=INACTIVE`（离职/停用）的档案只读历史，且授权校验一律返回
       `allowed=false`（不得执业），不做删除（临床与质控留痕需可回看）。
    2) 分级授权采用 **R1–R5 级别 + 显式范围字段**（术式范围 `surgeryScopes`、年龄段
       `ageMin`/`ageMax`、ASA 上限 `asaMax`、有效期、审批人）。**R1–R5 的业务含义与
       级别→术式/年龄/ASA 的默认映射【待确认】**：系统不内置臆造映射，范围以审批人录入
       的显式字段为权威；如院方给出授权目录，可通过服务端配置开启“级别策略上限”叠加校验
       （超限返回 `allowed=false` + `LEVEL_POLICY_EXCEEDED`），无需改契约。
    3) 授权历史 **append-only**：`PUT /v1/staff/{staffId}/authorizations` 每次写入新版本
       （version 由 1 递增），历史只增不改；撤销（action=REVOKE）同样写入新版本而不是
       删除旧版本。更新必须回传当前 version，过期 409。
    4) 授权校验 `POST /v1/staff/authorization-checks` 是排程（M1）与术中（M5）的集成点：
       入参 staffId + 可选 surgeryTypeId/age/asa；返回 `allowed` 与**全部**未通过原因
       （多原因同时返回，便于一次纠正）。未授权 → `NO_AUTHORIZATION`；已撤销
       `AUTHORIZATION_REVOKED`；未生效 `NOT_YET_VALID`；过期 `EXPIRED`；术式不在范围
       `SURGERY_SCOPE_MISSING`；年龄超范围 `AGE_OUT_OF_RANGE`；ASA 超上限
       `ASA_EXCEEDS_LIMIT`；人员离职 `STAFF_INACTIVE`。人员不存在返回 404。
    5) 排班：班次 `DAY`/`NIGHT`/`ON_CALL`（**班次口径【待确认】**：方案书仅要求
       “日常班/值班/备班”，映射为三值枚举；三班制或“备班”细分需院方确认后升版）；
       **冲突检测**：同一人员同一日期同一班次、同一术间同一日期同一班次均视为冲突，
       服务端返回 409 `STATE_CONFLICT` 并在 `details[]` 给出 `field`（staffId/roomId）
       与冲突原因（含冲突排班标识）；已取消（CANCELLED）的排班不占用名额。
       排班变更（PUT）与取消（POST cancel）需要 `m4:schedule:manage` 并留痕审计。
    6) 培训：课程（编码/名称）、完成时间、到期时间、证书号；`GET
       /v1/staff/trainings/expiring?days=30` 返回 **已进入提醒窗口或已过期** 的培训
       （`expiresOn <= 今天 + days`，含已过期，便于清零），并给出 `status`
       （VALID/EXPIRING/EXPIRED/NO_EXPIRY）与 `daysUntilExpiry`。方案书口径为
       “证书到期前 30 天提醒”，默认 `days=30`。
    7) 数据范围（m0）：`ALL` 全院；`SITE` 院区子树；`DEPT` 授权科室；`SELF` 仅本人
       档案/排班/培训（按 `userId` 关联），写操作对 SELF 一律 403；`ROOM`/无范围 fail-closed
       403。单对象越界与不存在统一 404（不泄露存在性）。
    8) 脱敏：本域只保存**在职人员**的档案字段（姓名、工号、职称、资质、专长），不含患者
       信息；审计 detail 只含标识与枚举摘要，**不含姓名、证书号原文与联系方式**；日志与
       错误文案不回显姓名、证书号与 SQL 实参。所有示例均为 SYNTHETIC 合成数据。
    9) 权限点：`m4:staff:read`、`m4:staff:write`、`m4:schedule:manage`、
       `m4:training:manage`（V21 最小授予 SYS_ADMIN / SYS_OR_MANAGER /
       SYS_ANESTHESIOLOGIST 的子集，详见 docs/modules/m4/README.md）。
  version: 0.1.0
  contact:
    name: ANESOP 项目组
  license:
    name: 内部交付（非开源）
servers:
  - url: https://anesop.local/api
    description: 院内单院部署统一入口（生产网无互联网出口）
security:
  - bearerAuth: []
tags:
  - name: 人员档案
    description: 麻醉医师/护士档案（工号、职称、职级、执业资质、专长）与 m0 用户关联。
  - name: 分级授权
    description: R1–R5 分级授权（术式范围/年龄段/ASA 上限/有效期/审批人）、append-only 历史与授权校验。
  - name: 排班
    description: 班次（白班/夜班/备班）排班、术间与科室分配、冲突检测与取消。
  - name: 培训
    description: 培训与继续教育记录（课程/完成时间/到期时间/证书号）与到期提醒。
paths:
  /v1/staff:
    get:
      operationId: listStaff
      tags:
        - 人员档案
      summary: 查询人员档案
      description: |
        按关键字（工号/姓名/专长）、科室与在职状态分页查询。数据范围：ALL 全院；SITE 院区
        子树；DEPT 授权科室；SELF 仅本人档案。姓名只用于本域业务展示，不写入日志与审计。
      parameters:
        - name: keyword
          in: query
          required: false
          description: 关键字（工号/姓名/专长模糊匹配，忽略大小写）。
          schema:
            type: string
            maxLength: 64
        - name: departmentId
          in: query
          required: false
          description: 科室标识过滤；必须为启用科室且在调用者数据范围内（否则 403/422）。
          schema:
            type: string
        - name: employmentStatus
          in: query
          required: false
          description: 在职状态过滤；缺省返回全部状态。
          schema:
            type: string
            enum:
              - ACTIVE
              - INACTIVE
        - name: page
          in: query
          required: false
          description: 页码，从 1 开始。
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          description: 每页条数（1–200）。
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        '200':
          description: 人员档案分页结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffList'
              example:
                items:
                  - staffId: '3a000000-0000-4000-8000-000000000001'
                    userId: '10000000-0000-4000-8000-000000000012'
                    staffNo: 'STAFF-ANES-001'
                    name: 演示麻醉医师甲（合成）
                    departmentId: 'f1000000-0000-4000-8000-000000000002'
                    departmentName: 麻醉科（合成）
                    siteId: '3000000000000000001'
                    title: 主任医师
                    jobGrade: 正高
                    employmentStatus: ACTIVE
                    specialties:
                      - 心血管麻醉
                      - 老年麻醉
                    qualifications:
                      - qualificationId: '4a000000-0000-4000-8000-000000000001'
                        qualificationType: PRACTICE_LICENSE
                        certificateNo: SYNTH-CERT-0001
                        issuingAuthority: 省卫生健康委员会（合成）
                        validFrom: '2020-01-01'
                        validTo: '2030-12-31'
                        status: ACTIVE
                        expired: false
                    createdAt: '2026-11-14T08:00:00+08:00'
                    createdBy: '10000000-0000-4000-8000-000000000001'
                    updatedAt: '2026-11-14T08:00:00+08:00'
                    updatedBy: '10000000-0000-4000-8000-000000000001'
                    version: 1
                page: 1
                size: 20
                total: 1
                totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createStaff
      tags:
        - 人员档案
      summary: 新建人员档案
      description: |
        创建人员档案：工号院内唯一（重复 409），userId 可空但非空时一人只能一条档案（重复 409）；
        科室必须存在、启用且为科室组织（422）并在调用者数据范围内（403）。SELF 数据范围
        不得新建档案（403）。审计 `STAFF_CREATE`，detail 只含标识、工号、科室与状态摘要。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffRequest'
            example:
              userId: '10000000-0000-4000-8000-000000000012'
              staffNo: STAFF-ANES-001
              name: 演示麻醉医师甲（合成）
              departmentId: 'f1000000-0000-4000-8000-000000000002'
              siteId: '3000000000000000001'
              title: 主任医师
              jobGrade: 正高
              employmentStatus: ACTIVE
              specialties:
                - 心血管麻醉
              qualifications:
                - qualificationType: PRACTICE_LICENSE
                  certificateNo: SYNTH-CERT-0001
                  issuingAuthority: 省卫生健康委员会（合成）
                  validFrom: '2020-01-01'
                  validTo: '2030-12-31'
      responses:
        '201':
          description: 已创建的人员档案。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
              example:
                staffId: '3a000000-0000-4000-8000-000000000001'
                userId: '10000000-0000-4000-8000-000000000012'
                staffNo: STAFF-ANES-001
                name: 演示麻醉医师甲（合成）
                departmentId: 'f1000000-0000-4000-8000-000000000002'
                departmentName: 麻醉科（合成）
                siteId: '3000000000000000001'
                title: 主任医师
                jobGrade: 正高
                employmentStatus: ACTIVE
                specialties:
                  - 心血管麻醉
                qualifications:
                  - qualificationId: '4a000000-0000-4000-8000-000000000001'
                    qualificationType: PRACTICE_LICENSE
                    certificateNo: SYNTH-CERT-0001
                    issuingAuthority: 省卫生健康委员会（合成）
                    validFrom: '2020-01-01'
                    validTo: '2030-12-31'
                    status: ACTIVE
                    expired: false
                createdAt: '2026-11-14T08:00:00+08:00'
                createdBy: '10000000-0000-4000-8000-000000000001'
                updatedAt: '2026-11-14T08:00:00+08:00'
                updatedBy: '10000000-0000-4000-8000-000000000001'
                version: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/staff/departments:
    get:
      operationId: listStaffDepartments
      tags:
        - 人员档案
      summary: 查询调用者可见的启用科室（档案/排班选择）
      description: |
        返回调用者可见的启用科室（`org_type=DEPT`），供人员档案与排班页面显式选择科室；
        禁止用当前用户标识冒充科室。SELF 范围返回本人所属科室；无可见科室时为空列表。
      responses:
        '200':
          description: 科室选项列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentList'
              example:
                items:
                  - departmentId: 'f1000000-0000-4000-8000-000000000002'
                    code: DEPT-ANES
                    name: 麻醉科（合成）
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/staff/{staffId}:
    get:
      operationId: getStaff
      tags:
        - 人员档案
      summary: 查询人员档案详情
      description: 返回档案、资质与数据范围校验结果；不存在或超出数据范围统一 404。
      parameters:
        - $ref: '#/components/parameters/StaffId'
      responses:
        '200':
          description: 人员档案详情。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
              example:
                staffId: '3a000000-0000-4000-8000-000000000001'
                userId: '10000000-0000-4000-8000-000000000012'
                staffNo: STAFF-ANES-001
                name: 演示麻醉医师甲（合成）
                departmentId: 'f1000000-0000-4000-8000-000000000002'
                departmentName: 麻醉科（合成）
                siteId: '3000000000000000001'
                title: 主任医师
                jobGrade: 正高
                employmentStatus: ACTIVE
                specialties:
                  - 心血管麻醉
                qualifications:
                  - qualificationId: '4a000000-0000-4000-8000-000000000001'
                    qualificationType: PRACTICE_LICENSE
                    certificateNo: SYNTH-CERT-0001
                    issuingAuthority: 省卫生健康委员会（合成）
                    validFrom: '2020-01-01'
                    validTo: '2030-12-31'
                    status: ACTIVE
                    expired: false
                createdAt: '2026-11-14T08:00:00+08:00'
                createdBy: '10000000-0000-4000-8000-000000000001'
                updatedAt: '2026-11-14T08:00:00+08:00'
                updatedBy: '10000000-0000-4000-8000-000000000001'
                version: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateStaff
      tags:
        - 人员档案
      summary: 更新人员档案（乐观锁）
      description: |
        更新姓名/科室/职称/职级/在职状态/专长/资质。工号与 userId 创建后不可改（请求体
        不含该字段）；更新必须回传 version，过期 409；科室变更需同时满足原科室与新科室在
        数据范围内（403）。审计 `STAFF_UPDATE`，detail 只含标识、工号、状态与变更标记。
      parameters:
        - $ref: '#/components/parameters/StaffId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStaffRequest'
            example:
              name: 演示麻醉医师甲（合成）
              departmentId: 'f1000000-0000-4000-8000-000000000002'
              title: 副主任医师
              jobGrade: 副高
              employmentStatus: ACTIVE
              specialties:
                - 心血管麻醉
              qualifications:
                - qualificationType: PRACTICE_LICENSE
                  certificateNo: SYNTH-CERT-0001
                  issuingAuthority: 省卫生健康委员会（合成）
                  validFrom: '2020-01-01'
                  validTo: '2030-12-31'
              version: 1
      responses:
        '200':
          description: 更新后的人员档案（version 已递增）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
              example:
                staffId: '3a000000-0000-4000-8000-000000000001'
                userId: '10000000-0000-4000-8000-000000000012'
                staffNo: STAFF-ANES-001
                name: 演示麻醉医师甲（合成）
                departmentId: 'f1000000-0000-4000-8000-000000000002'
                departmentName: 麻醉科（合成）
                siteId: '3000000000000000001'
                title: 副主任医师
                jobGrade: 副高
                employmentStatus: ACTIVE
                specialties:
                  - 心血管麻醉
                qualifications:
                  - qualificationId: '4a000000-0000-4000-8000-000000000001'
                    qualificationType: PRACTICE_LICENSE
                    certificateNo: SYNTH-CERT-0001
                    issuingAuthority: 省卫生健康委员会（合成）
                    validFrom: '2020-01-01'
                    validTo: '2030-12-31'
                    status: ACTIVE
                    expired: false
                createdAt: '2026-11-14T08:00:00+08:00'
                createdBy: '10000000-0000-4000-8000-000000000001'
                updatedAt: '2026-11-14T09:00:00+08:00'
                updatedBy: '10000000-0000-4000-8000-000000000001'
                version: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/staff/{staffId}/authorizations:
    get:
      operationId: getStaffAuthorizations
      tags:
        - 分级授权
      summary: 查询人员分级授权（当前 + 历史）
      description: |
        返回当前生效的授权（`current`，无授权时为 null）与全部历史版本（`history`，按版本
        倒序）。历史为 append-only，只增不改，便于追溯“何时由谁授予/撤销了哪些范围”。
      parameters:
        - $ref: '#/components/parameters/StaffId'
      responses:
        '200':
          description: 当前授权与历史版本。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAuthorizationHistory'
              example:
                staffId: '3a000000-0000-4000-8000-000000000001'
                current:
                  authorizationId: '5a000000-0000-4000-8000-000000000002'
                  staffId: '3a000000-0000-4000-8000-000000000001'
                  version: 2
                  level: R3
                  surgeryScopes:
                    - '*'
                  ageMin: 18
                  ageMax: 90
                  asaMax: ASA3
                  validFrom: '2026-11-01'
                  validTo: '2027-10-31'
                  status: ACTIVE
                  approvedBy: '10000000-0000-4000-8000-000000000001'
                  approvedAt: '2026-11-14T08:00:00+08:00'
                  changeReason: 年度授权复评（SYNTHETIC）
                  createdAt: '2026-11-14T08:00:00+08:00'
                  createdBy: '10000000-0000-4000-8000-000000000001'
                history:
                  - authorizationId: '5a000000-0000-4000-8000-000000000002'
                    staffId: '3a000000-0000-4000-8000-000000000001'
                    version: 2
                    level: R3
                    surgeryScopes:
                      - '*'
                    ageMin: 18
                    ageMax: 90
                    asaMax: ASA3
                    validFrom: '2026-11-01'
                    validTo: '2027-10-31'
                    status: ACTIVE
                    approvedBy: '10000000-0000-4000-8000-000000000001'
                    approvedAt: '2026-11-14T08:00:00+08:00'
                    changeReason: 年度授权复评（SYNTHETIC）
                    createdAt: '2026-11-14T08:00:00+08:00'
                    createdBy: '10000000-0000-4000-8000-000000000001'
                  - authorizationId: '5a000000-0000-4000-8000-000000000001'
                    staffId: '3a000000-0000-4000-8000-000000000001'
                    version: 1
                    level: R2
                    surgeryScopes:
                      - GENERAL
                    ageMin: 18
                    ageMax: 80
                    asaMax: ASA2
                    validFrom: '2025-11-01'
                    validTo: '2026-10-31'
                    status: REVOKED
                    approvedBy: '10000000-0000-4000-8000-000000000001'
                    approvedAt: '2025-11-01T08:00:00+08:00'
                    changeReason: 首次授权（SYNTHETIC）
                    createdAt: '2025-11-01T08:00:00+08:00'
                    createdBy: '10000000-0000-4000-8000-000000000001'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateStaffAuthorizations
      tags:
        - 分级授权
      summary: 授予/撤销分级授权（append-only 新版本）
      description: |
        每次调用写入 **新版本**（version 由 1 递增；撤销也写入新版本，不删除历史）：
        - `action=GRANT`：必须提供 level/surgeryScopes/ageMin/ageMax/asaMax/validFrom/validTo；
        - `action=REVOKE`：保留原范围字段快照并把新版本标记为 REVOKED，必须给出变更原因；
        - `version` 必须等于当前版本（无授权时传 0），过期 409；
        - 服务端配置了“级别策略上限”时，范围超过级别上限返回 422（不静默截断）。
        审计 `AUTH_GRANT` / `AUTH_REVOKE`，detail 只含标识、级别、版本与范围摘要。
      parameters:
        - $ref: '#/components/parameters/StaffId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStaffAuthorizationRequest'
            example:
              action: GRANT
              version: 0
              level: R3
              surgeryScopes:
                - '*'
              ageMin: 18
              ageMax: 90
