  /v1/staff/authorization-checks:
    post:
      operationId: checkStaffAuthorization
      tags:
        - 分级授权
      summary: 授权校验（排程/术中集成点）
      description: |
        判断某人员能否实施指定术式/年龄段/ASA 的麻醉。返回 **allowed** 与全部未通过原因
        （`reasons[]`，多原因一次返回）；`allowed=true` 时 `reasons` 为空数组。人员不存在
        或不在调用者数据范围返回 422（本接口为集合型操作，不声明 404）；人员离职返回
        `allowed=false` + `STAFF_INACTIVE`。
        本接口只做规则判定，**不替代临床决策**（AGENTS H-06）：`allowed=true` 不表示该台
        麻醉在临床上是适宜的，最终由麻醉医师判断并留痕。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationCheckRequest'
            example:
              staffId: '3a000000-0000-4000-8000-000000000001'
              surgeryTypeId: GENERAL
              age: 72
              asa: ASA3
      responses:
        '200':
          description: 授权校验结果（denied 时同样返回 200 + allowed=false）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationCheckResult'
              example:
                allowed: false
                reasons:
                  - code: AGE_OUT_OF_RANGE
                    message: 患者年龄 72 超出授权年龄段 18–60
                level: R2
                authorizationId: '5a000000-0000-4000-8000-000000000003'
                validUntil: '2027-10-31'
                checkedAt: '2026-11-14T10:00:00+08:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/staff/schedules:
    get:
      operationId: listStaffSchedules
      tags:
        - 排班
      summary: 查询排班
      description: |
        按人员/科室/日期区间/班次/状态查询排班（按日期、班次、人员排序）。数据范围：
        ALL 全院；SITE 院区子树；DEPT 授权科室；SELF 仅本人排班。日期区间按
        Asia/Shanghai 的自然日闭区间。
      parameters:
        - name: staffId
          in: query
          required: false
          description: 人员标识过滤（须在数据范围内）。
          schema:
            type: string
        - name: departmentId
          in: query
          required: false
          description: 科室标识过滤（须在数据范围内）。
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: 起始日期（含），格式 YYYY-MM-DD。
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: 结束日期（含），格式 YYYY-MM-DD；与 from 同时给出时不得早于 from。
          schema:
            type: string
            format: date
        - name: shift
          in: query
          required: false
          description: 班次过滤。
          schema:
            type: string
            enum:
              - DAY
              - NIGHT
              - ON_CALL
        - name: status
          in: query
          required: false
          description: 状态过滤；缺省返回全部状态。
          schema:
            type: string
            enum:
              - PLANNED
              - CANCELLED
        - name: limit
          in: query
          required: false
          description: 返回条数（1–200，默认 100）。
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        '200':
          description: 排班列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffScheduleList'
              example:
                items:
                  - scheduleId: '6a000000-0000-4000-8000-000000000001'
                    staffId: '3a000000-0000-4000-8000-000000000001'
                    staffNo: STAFF-ANES-001
                    scheduleDate: '2026-11-20'
                    shift: DAY
                    roomId: 'f2000000-0000-4000-8000-000000000001'
                    departmentId: 'f1000000-0000-4000-8000-000000000002'
                    status: PLANNED
                    note: SYNTHETIC 演示排班
                    createdAt: '2026-11-14T08:00:00+08:00'
                    createdBy: '10000000-0000-4000-8000-000000000001'
                    updatedAt: '2026-11-14T08:00:00+08:00'
                    updatedBy: '10000000-0000-4000-8000-000000000001'
                    version: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createStaffSchedule
      tags:
        - 排班
      summary: 新建排班（冲突检测）
      description: |
        新建排班。冲突规则：**同一人员同一日期同一班次**、**同一术间同一日期同一班次**均
        视为冲突，返回 409 并在 `details[]` 给出 `field`（staffId/roomId）与冲突排班标识；
        已取消（CANCELLED）的排班不占用名额。科室必须在数据范围内（403）。审计
        `SCHEDULE_CREATE`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffScheduleRequest'
            example:
              staffId: '3a000000-0000-4000-8000-000000000001'
              scheduleDate: '2026-11-20'
              shift: DAY
              roomId: 'f2000000-0000-4000-8000-000000000001'
              departmentId: 'f1000000-0000-4000-8000-000000000002'
              note: SYNTHETIC 演示排班
      responses:
        '201':
          description: 已创建的排班。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffSchedule'
              example:
                scheduleId: '6a000000-0000-4000-8000-000000000001'
                staffId: '3a000000-0000-4000-8000-000000000001'
                staffNo: STAFF-ANES-001
                scheduleDate: '2026-11-20'
                shift: DAY
                roomId: 'f2000000-0000-4000-8000-000000000001'
                departmentId: 'f1000000-0000-4000-8000-000000000002'
                status: PLANNED
                note: SYNTHETIC 演示排班
                createdAt: '2026-11-14T08:00:00+08:00'
                createdBy: '10000000-0000-4000-8000-000000000001'
                updatedAt: '2026-11-14T08:00:00+08:00'
                updatedBy: '10000000-0000-4000-8000-000000000001'
                version: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
