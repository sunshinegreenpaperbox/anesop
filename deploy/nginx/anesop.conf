# =============================================================================
# ANESOP Nginx 站点配置（web 容器内 /etc/nginx/conf.d/default.conf）
#
# 约束（§3.7.1 / §3.8.3 / §3.9.1）：
#   - 唯一对外入口：80 仅健康检查与跳转，443 承载 SPA 与 /api 反向代理；
#   - TLS 1.2/1.3；应用接口经 /api/ 反代到 api:8080，保留 Host 与 X-Forwarded-*；
#   - 安全响应头：HSTS、nosniff、X-Frame-Options；CSP 待前端资源清单确定后启用；
#   - 证书由宿主只读挂载到 /etc/nginx/certs（仓库不含真实证书）。
# =============================================================================

# 速率限制：登录与接口按来源 IP 限流（§3.9.1 防暴破）
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=perip_conn:10m;

# B-3：API 访问日志格式——只记录方法/路径（$uri）与协议，**不记录 query/请求参数**。
# 医学检索（患者姓名/住院号等 PHI）已改为 POST，条件在请求体，不会进入 URL；
# 但旧 GET /v1/patients 仍可能带查询参数，故 /api/ 一律使用本格式，禁止回退 combined
# （combined 含 $request，会把查询串写入磁盘）。
log_format anesop_no_query '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                           '"$http_user_agent" '
                           'rt=$request_time uct="$upstream_connect_time" '
                           'uht="$upstream_header_time" urt="$upstream_response_time"';

# 后端 API（容器网络内的服务名）
upstream anesop_api {
    server api:8080;
    keepalive 32;
}

# HTTP：健康检查直出 200；其余 301 到 HTTPS（HSTS 只在 HTTPS 响应上下发）
server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;

    # 容器健康检查专用，不记录访问日志，避免刷日志
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    server_tokens off;

    # --- TLS（证书与私钥由宿主挂载，禁止入库）---
    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    # OCSP stapling 待 CA 支持后启用（§3.9.1 证书与账号到期管理）
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/nginx/certs/ca-chain.crt;

    # --- 安全响应头 ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # TODO(security,EXT-10): CSP 待前端构建产物与第三方资源清单确定后启用；
    # 当前仅占位，禁止直接照抄放宽到 'unsafe-inline' 长期运行。
    # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # --- 请求体与超时（限制请求体大小与慢速攻击）---
    client_max_body_size 50m;
    client_body_buffer_size 128k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 65s;
    limit_conn perip_conn 50;

    # --- 压缩 ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # 容器健康检查（与 80 端口同语义）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 登录接口单独收紧限流（§3.9.1：5 次失败锁定在应用侧实现，此处只做流量兜底）
    location = /api/v1/auth/login {
        access_log /var/log/nginx/access.log anesop_no_query;
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://anesop_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # API 反向代理：保留 /api 前缀（后端路径自带 /api；若改为无前缀，
    # 将 proxy_pass 改成 http://anesop_api/; 即可去掉前缀）
    location /api/ {
        # B-3：显式使用无 query 的日志格式，确保查询参数不落盘（不要删除本行）。
        access_log /var/log/nginx/access.log anesop_no_query;
        limit_req zone=api_limit burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://anesop_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        # 大文件下载/报表导出可放宽读超时（按接口再调）
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
    }

    # SPA 静态资源：带指纹的文件长缓存，index.html 不缓存
    location /assets/ {
        # expires 生成 Cache-Control，不用 add_header，避免丢失 server 级安全头
        expires 30d;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # SPA fallback（Vue Router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏文件与备份文件
    location ~ /\.(?!well-known) {
        deny all;
    }
}
