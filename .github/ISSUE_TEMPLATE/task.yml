name: 工程任务
description: 提交工程基建、脚本、配置、文档或测试基座类任务
title: "[Task] "
labels:
  - "type/task"
  - "status/triage"
body:
  - type: markdown
    attributes:
      value: |
        ## 提交前请确认
        - 任务必须有明确写域与可验证的验收标准；"做完/优化好"不算验收标准。
        - 写域外文件一律不改；需要跨域改动时拆任务或先提契约/架构任务。
        - 本模板用于非业务功能类工作；业务功能请用「功能需求」，缺陷请用「缺陷报告」。

  - type: input
    id: related-task
    attributes:
      label: 关联任务 / Issue
      description: "任务卡路径或上游 Issue；无任务卡时须在本 Issue 内补齐写域与验收标准。"
      placeholder: "docs/ai/tasks/S0-xx.md 或 #<issue>"
    validations:
      required: true

  - type: dropdown
    id: task-type
    attributes:
      label: 任务类型
      options:
        - 仓库与协作资产
        - 构建与依赖
        - 静态检查 / 提交规范
        - CI 流水线
        - 契约与类型生成
        - 数据库迁移基座
        - 测试基座
        - 部署与环境
        - 文档
        - 重构（无行为变化）
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: 目标与背景
      description: 为什么做、做完后什么会变好；引用方案书章节或决策编号。
      placeholder: "目标（一句话）/ 背景（章节、ADR、Issue）/ 关键约束"
      render: text
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 写域（允许修改的路径）
      description: 逐条列出允许修改的目录或文件；未列出的路径默认禁止修改。
      placeholder: |
        允许：根目录文件、.github/、docs/branch-protection.md
        禁止：docs/acceptance/、PROJECT_STATE.md、AGENTS.md、scripts/
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 逐条可执行、可观察；尽量附验证命令与预期输出。
      placeholder: |
        - [ ] 命令 X 输出 Y
        - [ ] 文件 Z 覆盖 A/B/C
        - [ ] 无新增依赖
    validations:
      required: true

  - type: textarea
    id: non-goals
    attributes:
      label: 非目标
      description: 明确本次不做什么，防止范围蔓延。
      placeholder: "不做远端 CI、不建 GitHub 组织、不提交 commit ……"
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: 依赖与阻塞
      description: 前置任务、外部依赖、当前阻塞项（含 EXT 编号）。
      placeholder: "依赖 S0-02；阻塞 EXT-08（Docker 不可用）"
      render: text
    validations:
      required: false

  - type: textarea
    id: test-requirements
    attributes:
      label: 测试要求
      description: 本次需要新增/更新哪些测试，或说明为何无可执行测试及替代验证方式。
      placeholder: "单测 / 集成 / 契约 / 静态校验 / 手动验证步骤"
      render: text
    validations:
      required: true

  - type: textarea
    id: risk-rollback
    attributes:
      label: 风险与回滚
      description: 可能破坏什么、如何发现、如何回滚。
      placeholder: "风险 / 监控信号 / 回滚步骤"
      render: text
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单
      options:
        - label: 任务卡或本 Issue 已写明写域与验收标准
          required: true
        - label: 变更只落在写域内，未改契约/测试断言以"让实现通过"
          required: true
        - label: 未引入白名单外依赖；如引入已附 ADR 与 allowlist 更新
          required: true
        - label: 验证命令已实际执行并附输出
          required: true
        - label: 涉及患者数据时仅使用合成数据
          required: true

  - type: textarea
    id: ai-disclosure
    attributes:
      label: AI 参与声明
      description: 工具与版本、任务号、生成范围、复核人；未使用请填"无"。
      placeholder: |
        工具与版本：
        任务号：
        范围：
        复核人：
        未使用 AI：是/否
      render: text
    validations:
      required: true
