# 测试环境（CI / 本地自动化测试）：与 dev 一样追加演示种子与开启文档，
# 数据源指向嵌入式 PostgreSQL 16（由测试基类 @DynamicPropertySource 注入）。
spring:
  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/seed/demo

anesop:
  m1:
    inpatient-pepper:
      # 自动化测试不注入真实 pepper：进程内随机生成（每个测试上下文独立）。
      allow-dev-generated: true
    notification:
      # 用例内显式调用 NotificationDispatcher.drainOnce() 断言 SENT，关闭定时竞争。
      scheduler-enabled: false
    his:
      mock:
        # 自动化测试：模拟 HIS 申请统一落入演示麻醉科（V100 SYNTHETIC 组织），
        # 用于 DEPT 数据范围断言；生产不配置时申请不带科室标识（DEPT 用户不可见）。
        department-id: f1000000-0000-4000-8000-000000000002
        site-id: f1000000-0000-4000-8000-000000000001
  security:
    demo-accounts-allowed: true
    jwt:
      allow-dev-generated: true
    crypto:
      # 自动化测试不注入真实密钥：进程内随机生成（每个测试上下文独立）。
      allow-dev-generated: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.anesop: INFO
