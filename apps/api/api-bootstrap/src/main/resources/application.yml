# ANESOP API 基础配置（安全默认 / fail-closed）
#
# 本文件是**默认即安全**的基线：不激活任何 profile 时也按生产语义收紧——
#   - springdoc 关闭、actuator 只暴露 health/info；
#   - Flyway 只加载 db/migration（不含演示种子）；
#   - demo_* 演示账号与自动生成 JWT 密钥均默认禁止（启动守卫拒绝）。
# 需要宽松能力的只有 dev/test profile：application-dev.yml / application-test.yml 显式开启。
spring:
  application:
    name: anesop-api
  jackson:
    time-zone: Asia/Shanghai

  # 数据源（S0-07）：生产由环境变量注入；dev/test 在 profile 文件中覆盖。
  datasource:
    url: ${ANESOP_DB_URL:jdbc:postgresql://127.0.0.1:5432/anesop}
    username: ${ANESOP_DB_USER:anesop}
    password: ${ANESOP_DB_PASSWORD:anesop}
    hikari:
      maximum-pool-size: ${ANESOP_DB_POOL_SIZE:10}
      connection-timeout: 5000

  # Flyway（S0-07）：迁移脚本由 api-bootstrap 的 maven-resources-plugin 从 db/migration
  # 复制到 classpath:db/migration；默认/生产 locations 只含该目录，演示种子必须显式追加。
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

# MyBatis-Plus（S0-07）：下划线转驼峰、逻辑删除；uuid/jsonb/inet TypeHandler 由
# PersistenceConfiguration 注册。
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

anesop:
  # M1 住院号匹配哈希 pepper（V7，B-2）：HMAC-SHA-256，Base64，解码后 ≥32 字节。
  # 默认 fail-closed：缺失/非法 Base64/长度不足/低熵一律拒绝启动；只有 dev/test 在
  # application-dev.yml / application-test.yml 显式置 allow-dev-generated=true 时
  # 才生成进程内随机 pepper 并 WARN（仅 SYNTHETIC 演示/自动化测试）。
  # 生成方式：openssl rand -base64 48；生产由院方密钥托管注入，禁止入库/入日志。
  m1:
    inpatient-pepper:
      value: ${ANESOP_INPATIENT_PEPPER:}
      allow-dev-generated: false
    # 急诊抢占择期台次的 STOP 留痕说明（M2-M2-02/S-2）：可配置、中性文案，禁止写入 PHI。
    schedule:
      preempt-reason: ${ANESOP_M1_PREEMPT_REASON:急诊加台抢占择期台次（系统自动）}
    # 通知 outbox 定时派发（M2-M2-02，模拟端口 SIMULATED；真实通道 EXT 待院方）。
    # 测试 profile 关闭，避免定时派发与用例内显式 drain 竞争。
    notification:
      scheduler-enabled: ${ANESOP_NOTIFICATION_SCHEDULER_ENABLED:true}
      poll-interval-ms: ${ANESOP_NOTIFICATION_POLL_INTERVAL_MS:30000}
      initial-delay-ms: ${ANESOP_NOTIFICATION_INITIAL_DELAY_MS:30000}
    # 排程分析口径（M2-M6-01，契约 scheduling.yaml 0.6.0）。
    # 口径由院方最终确定（D-21：系统出数、绩效规则院方另定）；以下默认值均为可配置项，
    # 未确认项在 docs/modules/m1/README.md §12 标【待确认】。非法配置启动即拒绝（fail-closed）。
    analytics:
      # 首台准点阈值（分钟，±）：|实际开始 - 计划开始| ≤ 该值计准点，默认 15。
      on-time-threshold-minutes: ${ANESOP_M1_ANALYTICS_ON_TIME_THRESHOLD_MINUTES:15}
      # 每术间每日可用分钟（利用率分母），默认 600 分钟（10 小时）【待确认院方开放时长】。
      room-daily-available-minutes: ${ANESOP_M1_ANALYTICS_ROOM_DAILY_AVAILABLE_MINUTES:600}
      # 查询最大跨度（含首尾），默认 92 天；配置 >92 时夹紧为 92 并 WARN（契约上限固定 92）。
      max-range-days: ${ANESOP_M1_ANALYTICS_MAX_RANGE_DAYS:92}
  # M2 术前评分口径（M2-M4-01）。默认值 = 当前实现口径（公开量表）：
  # RCRI 0/1/≥2、Apfel 0–1/2/≥3、STOP-BANG 0–2/3–4/≥5；VO2peak < 14 ≈ <4 METs。
  # 院方口径确认后只改配置并升级 calculator-version（写入 scores.calculatorVersion），
  # 不改代码分支；非法配置（越界/moderate ≥ high/未知策略）启动即拒绝（fail-closed）。
  m2:
    preop:
      calculator-version: ${ANESOP_M2_PREOP_CALCULATOR_VERSION:1.0.0}
      # 综合风险合成策略：仅支持 MAX_COMPONENT（取最高单项风险，展示约定【待确认】）。
      composite-risk-strategy: ${ANESOP_M2_PREOP_COMPOSITE_STRATEGY:MAX_COMPONENT}
      rcri-moderate-min: ${ANESOP_M2_PREOP_RCRI_MODERATE_MIN:1}
      rcri-high-min: ${ANESOP_M2_PREOP_RCRI_HIGH_MIN:2}
      apfel-moderate-min: ${ANESOP_M2_PREOP_APFEL_MODERATE_MIN:2}
      apfel-high-min: ${ANESOP_M2_PREOP_APFEL_HIGH_MIN:3}
      stopbang-moderate-min: ${ANESOP_M2_PREOP_STOPBANG_MODERATE_MIN:3}
      stopbang-high-min: ${ANESOP_M2_PREOP_STOPBANG_HIGH_MIN:5}
      # DASI → VO2peak(mL/kg/min) = slope × DASI + intercept；< threshold 判功能容量偏低。
      vo2-slope: ${ANESOP_M2_PREOP_VO2_SLOPE:0.43}
      vo2-intercept: ${ANESOP_M2_PREOP_VO2_INTERCEPT:9.6}
      four-mets-vo2-threshold: ${ANESOP_M2_PREOP_FOUR_METS_VO2_THRESHOLD:14}
    # 设备采集接入（M3-M8-01，契约 device.yaml 0.1.0；V14 表结构）。
    # gateway-token 默认空 = 未配置：ingest 一律 401（fail-closed，绝不"未配置即放行"）。
    # 生产由院方密钥托管注入 ANESOP_M2_ACQUISITION_GATEWAY_TOKEN，禁止入库/入仓/入日志。
    acquisition:
      gateway-token: ${ANESOP_M2_ACQUISITION_GATEWAY_TOKEN:}
      # 设备离线判定阈值（秒）：last_seen_at 超过该值未上报即推导为 OFFLINE。
      offline-timeout-seconds: ${ANESOP_M2_ACQUISITION_OFFLINE_TIMEOUT_SECONDS:120}
      # 体征窗口查询最大跨度（小时）：超限 422，防止一次查询扫出整月明细。
      max-query-window-hours: ${ANESOP_M2_ACQUISITION_MAX_QUERY_WINDOW_HOURS:24}
      # 采集健康摘要统计窗口（小时，1–168）：批次/质量比例使用同一窗口。
      health-window-hours: ${ANESOP_M2_ACQUISITION_HEALTH_WINDOW_HOURS:24}
      # 合成数据标记：POC/测试恒 true；真实设备接入后由部署配置改 false（V4 synthetic 语义）。
      synthetic: ${ANESOP_M2_ACQUISITION_SYNTHETIC:true}
    # 麻醉记录单（M3-M2-01）：事件时间容差（秒）。
    # 未来时间超过 now+容差 400；早于最新事件或早于 now−容差 的补录必须填 entryReason。
    record:
      time-tolerance-seconds: ${ANESOP_M2_RECORD_TIME_TOLERANCE_SECONDS:600}
  security:
    # 默认禁止演示账号；dev/test 的 profile 文件显式置 true（B-2.3）。
    demo-accounts-allowed: false
    jwt:
      # HS256 签名密钥：Base64 编码，解码后 >= 32 字节（生成方式：openssl rand -base64 48）。
      # 默认必须由 ANESOP_JWT_SECRET 注入；缺失、占位值、低熵或长度不足均拒绝启动（B-1）。
      # 密钥不得入库、不得写入仓库/日志；CA/SSO 与真实密钥托管为 EXT-05。
      secret: ${ANESOP_JWT_SECRET:}
      # 仅 dev/test 显式允许生成进程内随机密钥；默认 false。
      allow-dev-generated: false
      issuer: anesop
      # 访问令牌 15 分钟；刷新令牌 7 天（轮换 + DB 存 SHA-256，不依赖 Redis）
      access-ttl: PT15M
      refresh-ttl: P7D
    # 字段加密（M2-M0-02，方案书 §3.9.3）：手机号等敏感字段 AES-256-GCM 密钥与 HMAC pepper。
    # 均要求 Base64；field-key 解码后必须恰好 32 字节（AES-256），phone-pepper 至少 32 字节。
    # 默认必须由环境变量注入；缺失、占位值、低熵或长度不符均拒绝启动（fail-closed，不依赖 profile）。
    # 生成：ANESOP_FIELD_KEY 用 openssl rand -base64 32（解码后恰好 32 字节）；
    #       ANESOP_PHONE_PEPPER 用 openssl rand -base64 48（解码后 ≥32 字节）。
    # 两个值必须分别生成且不得相同（相同则拒绝启动），密钥不得入库/入日志。
    field-key: ${ANESOP_FIELD_KEY:}
    # 密钥版本标识（≤32 字符），写入 sys_user.phone_key_id。应用只持一把字段密钥，
    # key_id 不等即拒绝解密；轮换需 M1 离线双密钥重加密工具（见 docs/modules/m0/README.md）。
    field-key-id: ${ANESOP_FIELD_KEY_ID:v1}
    phone-pepper: ${ANESOP_PHONE_PEPPER:}
    crypto:
      # 仅 dev/test 显式允许生成进程内随机密钥；默认 false（生产语义）。
      allow-dev-generated: false
    # 登录/刷新 IP 级限流（S-6）：内存令牌桶，单实例语义。
    rate-limit:
      enabled: true
      capacity: 20
      refill-tokens: 20
      refill-period: PT1M

server:
  port: 8080
  shutdown: graceful

# 默认只暴露健康与信息端点；metrics/prometheus 必须在目标 profile 显式开启并登记白名单。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: false

# springdoc 默认关闭；仅 dev/test 显式开启（B-2）。
springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
  default-produces-media-type: application/json

info:
  app:
    name: ANESOP
    description: 麻醉信息平台（围术期全流程）
