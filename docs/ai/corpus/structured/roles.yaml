# R1–R12 角色（第 2 章表 2-1）
- id: R1
  role: 麻醉科主任/质控负责人
  duty: 排程公平性、质控指标审阅、人员资质与绩效核定
  modules: M1、M3、M6、M7、M8
- id: R2
  role: 麻醉医师
  duty: 术前访视与评估、麻醉计划、术中记录、术后随访
  modules: M2、M1、M7
- id: R3
  role: 麻醉护士
  duty: 药品耗材准备、术中配合、复苏护理、随访执行
  modules: M2、M4、M5
- id: R4
  role: 手术室护士
  duty: 排程协同、三方核查、器械与耗材清点、转运交接
  modules: M1、M2、M4
- id: R5
  role: PACU 护士
  duty: 复苏记录、出室评估、转出交接
  modules: M2、M1
- id: R6
  role: 耗材/库房管理员
  duty: 出入库、盘点、高值耗材 UDI 追溯
  modules: M4、M6
- id: R7
  role: 药剂科/麻精药品管理员
  duty: 五专管理、处方与空安瓿核查、日结班结
  modules: M5、M7
- id: R8
  role: 质控专员
  duty: 指标计算与复核、不良事件管理、报告上报
  modules: M7、M6、M8
- id: R9
  role: 信息科管理员
  duty: 账号权限、接口监控、运维与审计
  modules: M0、M7
- id: R10
  role: 手术科室医师
  duty: 手术申请、术前准备、术后查看记录
  modules: M1、M2
- id: R11
  role: 院领导/医务处
  duty: 驾驶舱查看、运营与质量态势研判
  modules: M8、M6、M7
- id: R12
  role: 患者/家属（可选）
  duty: 术前告知确认、手术进度查询
  modules: M2、M1（受限视图）
