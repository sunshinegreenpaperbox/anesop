# 非功能需求基线（第 2 章表 2-6）
- category: 并发与容量
  target: 30 间手术间同时采集；在线用户 500；峰值写入 30 床 × 1Hz
- category: 响应时间
  target: 普通页面 P95 < 2s；记录写入 < 1s；驾驶舱首屏 < 3s
- category: 可用性
  target: 核心业务 99.9%（年停机不超过 8.76 小时）；断网缓存不少于 4 小时并自动补传
- category: 数据保留
  target: 麻醉记录与病历按病历管理要求长期保存（不少于 30 年）；波形原始数据不少于 1 年，可配置
- category: 安全
  target: 等保三级；传输 TLS；存储敏感字段加密；审计日志不少于 6 个月；权限最小化
- category: 合规
  target: 电子病历应用水平分级 5 级目标；《电子签名法》；数据分类分级与脱敏
- category: 可维护性
  target: 模块化单体、契约优先、可观测（日志/指标/链路）、一键部署与回滚
- category: 兼容性
  target: Chrome/Edge 最近两个大版本；1366×768 起；A4 打印；国产化适配范围待定【待确认】
- category: 性能基线
  target: 排程页 1000 条手术记录加载 < 2s；月度工作量报表 < 10s
