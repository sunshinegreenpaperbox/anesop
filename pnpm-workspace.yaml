packages:
  - apps/*
  - packages/*
storeDir: .pnpm-store
cacheDir: .pnpm-cache
# 依赖安装脚本：pnpm 10 默认忽略、pnpm 11 起需显式批准。
# allowBuilds 为 pnpm 11 字段；onlyBuiltDependencies 为 pnpm 10 字段，二者并存以兼容 CI 工具链。
allowBuilds:
  esbuild: true
  '@scarf/scarf': false
  # vue-demi（element-plus/@vueuse 的依赖）postinstall 生成入口文件；pnpm 11 需显式允许
  vue-demi: true
onlyBuiltDependencies:
  - esbuild
  - vue-demi
# @scarf/scarf 是 @stoplight/spectral-cli 的遥测依赖，安装脚本无功能作用；pnpm 11 严格模式需显式忽略。
